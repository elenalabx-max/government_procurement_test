<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>淨零綠領人才題庫</title>
<meta name="theme-color" content="#1b6e4f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="綠領題庫">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231b6e4f'/%3E%3Ctext x='50' y='64' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E綠%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231b6e4f'/%3E%3Ctext x='50' y='64' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E綠%3C/text%3E%3C/svg%3E">
<style>
:root{
  --green:#1b6e4f;
  --green-dark:#0f4a34;
  --green-light:#e6f4ee;
  --red:#c0392b;
  --red-light:#fbeae8;
  --amber:#b9770e;
  --bg:#f5f6f4;
  --card:#ffffff;
  --text:#22282a;
  --text-mute:#6b7570;
  --border:#e0e3df;
  --radius:12px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  color:var(--text);
  padding-bottom:70px;
  -webkit-tap-highlight-color:transparent;
}
header.app-header{
  background:linear-gradient(135deg,var(--green),var(--green-dark));
  color:#fff;
  padding:16px 16px 14px;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
}
header.app-header h1{
  margin:0;
  font-size:17px;
  font-weight:700;
  letter-spacing:.5px;
}
header.app-header p{
  margin:4px 0 0;
  font-size:12px;
  opacity:.85;
}
nav.tabs{
  display:flex;
  gap:6px;
  background:#fff;
  padding:8px 10px;
  position:sticky;
  top:0;
  z-index:19;
  border-bottom:1px solid var(--border);
}
nav.tabs button{
  flex:1;
  border:none;
  background:var(--bg);
  color:var(--text-mute);
  padding:10px 4px;
  border-radius:10px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  transition:.15s;
}
nav.tabs button.active{
  background:var(--green);
  color:#fff;
}
main{
  max-width:760px;
  margin:0 auto;
  padding:14px;
}
.view{display:none;}
.view.active{display:block;}

.toolbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:12px;
  align-items:center;
}
.toolbar input[type="search"],
.toolbar select{
  border:1px solid var(--border);
  background:#fff;
  border-radius:8px;
  padding:9px 10px;
  font-size:13px;
  color:var(--text);
  flex:1;
  min-width:120px;
}
.toolbar button{
  border:1px solid var(--border);
  background:#fff;
  border-radius:8px;
  padding:9px 12px;
  font-size:13px;
  cursor:pointer;
  white-space:nowrap;
}
.toolbar button:hover{background:var(--green-light);}
.counter{
  font-size:12px;
  color:var(--text-mute);
  margin:0 0 10px;
}

.q-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:14px 16px;
  margin-bottom:12px;
}
.q-card .q-head{
  display:flex;
  justify-content:space-between;
  gap:8px;
  cursor:pointer;
}
.q-num{
  display:inline-block;
  background:var(--green-light);
  color:var(--green-dark);
  font-size:12px;
  font-weight:700;
  padding:2px 8px;
  border-radius:6px;
  margin-right:8px;
  flex-shrink:0;
}
.q-stem{
  font-size:14.5px;
  line-height:1.6;
  font-weight:600;
}
.q-toggle-icon{
  color:var(--text-mute);
  font-size:12px;
  flex-shrink:0;
  padding-top:3px;
}
.q-options{
  margin-top:10px;
  display:none;
}
.q-options.open{display:block;}
.q-opt{
  padding:8px 10px;
  border-radius:8px;
  font-size:13.5px;
  line-height:1.5;
  margin-bottom:6px;
  border:1px solid var(--border);
  background:#fafbfa;
}
.q-opt.correct{
  border-color:var(--green);
  background:var(--green-light);
  color:var(--green-dark);
  font-weight:600;
}
.q-explain{
  margin-top:8px;
  background:#f5f9f7;
  border-left:3px solid var(--green);
  padding:8px 10px;
  font-size:12.5px;
  color:var(--text-mute);
  line-height:1.6;
  border-radius:0 6px 6px 0;
}
.q-history{
  margin-top:10px;
  padding-top:8px;
  border-top:1px dashed var(--border);
  display:flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  color:var(--text-mute);
}
.history-icons{display:flex;gap:4px;}
.hi{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:20px;height:20px;
  border-radius:50%;
  font-size:11px;
  font-weight:800;
  color:#fff;
}
.hi.o{background:var(--green);}
.hi.x{background:var(--red);}
.hi.none{background:#c9cdc8;color:#666;}

/* quiz module */
.quiz-idle{
  text-align:center;
  padding:40px 16px;
  background:var(--card);
  border-radius:var(--radius);
  border:1px solid var(--border);
}
.quiz-idle h2{margin-top:0;font-size:16px;}
.quiz-idle p{color:var(--text-mute);font-size:13px;line-height:1.7;}
.btn-primary{
  background:var(--green);
  color:#fff;
  border:none;
  padding:12px 28px;
  border-radius:24px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  margin-top:10px;
}
.btn-primary:hover{background:var(--green-dark);}
.btn-secondary{
  background:#fff;
  color:var(--green-dark);
  border:1px solid var(--green);
  padding:10px 20px;
  border-radius:20px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
}
.btn-danger{
  background:#fff;
  color:var(--red);
  border:1px solid var(--red);
  padding:9px 16px;
  border-radius:20px;
  font-size:12.5px;
  font-weight:600;
  cursor:pointer;
}

.quiz-progress{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
  font-size:12.5px;
  color:var(--text-mute);
}
.progress-bar{
  height:6px;
  background:var(--border);
  border-radius:4px;
  overflow:hidden;
  margin:6px 0 12px;
}
.progress-fill{
  height:100%;
  background:var(--green);
  transition:.2s;
}
.quiz-palette{
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:5px;
  margin-bottom:14px;
}
.pal-btn{
  aspect-ratio:1;
  border-radius:6px;
  border:1px solid var(--border);
  background:#fff;
  font-size:11px;
  color:var(--text-mute);
  cursor:pointer;
}
.pal-btn.answered{background:var(--green-light);border-color:var(--green);color:var(--green-dark);font-weight:700;}
.pal-btn.current{outline:2px solid var(--green-dark);}

.quiz-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px 16px;
  margin-bottom:14px;
}
.quiz-stem{font-size:15.5px;line-height:1.7;font-weight:600;margin-bottom:14px;}
.quiz-opt{
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:11px 12px;
  border:1px solid var(--border);
  border-radius:10px;
  margin-bottom:9px;
  cursor:pointer;
  font-size:14px;
  line-height:1.55;
}
.quiz-opt:hover{background:#fafbfa;}
.quiz-opt.selected{
  border-color:var(--green);
  background:var(--green-light);
  font-weight:600;
}
.quiz-opt .opt-letter{
  flex-shrink:0;
  width:22px;height:22px;
  border-radius:50%;
  border:1px solid var(--text-mute);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:700;
}
.quiz-opt.selected .opt-letter{
  background:var(--green);
  border-color:var(--green);
  color:#fff;
}
.quiz-nav{
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin-top:14px;
}
.quiz-nav .side{display:flex;gap:8px;}

.result-summary{
  text-align:center;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:22px 16px;
  margin-bottom:16px;
}
.result-score{font-size:34px;font-weight:800;color:var(--green-dark);}
.result-score span{font-size:16px;color:var(--text-mute);font-weight:500;}
.result-actions{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap;}
.wrong-item{
  background:var(--card);
  border:1px solid var(--red);
  border-left:4px solid var(--red);
  border-radius:var(--radius);
  padding:14px 16px;
  margin-bottom:12px;
}
.your-pick{
  margin-top:8px;
  font-size:13px;
  padding:7px 10px;
  border-radius:8px;
  background:var(--red-light);
  color:var(--red);
}

.empty-state{
  text-align:center;
  color:var(--text-mute);
  font-size:13px;
  padding:30px 10px;
}
footer.app-footer{
  text-align:center;
  color:var(--text-mute);
  font-size:11px;
  padding:16px;
}
</style>
</head>
<body>

<header class="app-header">
  <h1>淨零綠領人才題庫</h1>
  <p>環境部淨零綠領人才培育課程　·　共 <span id="totalCount">0</span> 題</p>
</header>

<nav class="tabs">
  <button data-view="bank" class="active">📚 題庫瀏覽</button>
  <button data-view="quiz">📝 測驗區</button>
  <button data-view="records">📊 答題記錄</button>
</nav>

<main>

  <!-- MODULE 1: 題庫瀏覽 -->
  <section id="view-bank" class="view active">
    <div class="toolbar">
      <input type="search" id="bankSearch" placeholder="搜尋題號或關鍵字…">
      <button id="bankExpandAll">全部展開</button>
      <button id="bankCollapseAll">全部收合</button>
    </div>
    <p class="counter" id="bankCounter"></p>
    <div id="bankList"></div>
  </section>

  <!-- MODULE 2: 測驗區 -->
  <section id="view-quiz" class="view">
    <div id="quizArea"></div>
  </section>

  <!-- MODULE 3: 答題記錄 -->
  <section id="view-records" class="view">
    <div class="toolbar">
      <select id="recordSort">
        <option value="original">原始題庫順序（預設）</option>
        <option value="oldest">最後作答時間：舊 → 新（未作答視為最舊）</option>
        <option value="newest">最後作答時間：新 → 舊</option>
      </select>
      <select id="recordFilter">
        <option value="all">全部題目</option>
        <option value="o">最後一次答對（O）</option>
        <option value="x">最後一次答錯（X）</option>
        <option value="none">從未作答</option>
      </select>
    </div>
    <p class="counter" id="recordCounter"></p>
    <div id="recordList"></div>
  </section>

</main>

<footer class="app-footer">
  作答紀錄僅儲存在本裝置的瀏覽器（localStorage），換裝置或清除瀏覽器資料將會遺失紀錄。
</footer>

<script>
const QUESTIONS = [{"id": 1, "stem": "隨著全球綠色金融與氣候治理之接軌，金管會要求上市櫃公司揭露其非財務資訊與氣候風險。請問國際上與我國目前在氣候相關財務風險揭露上，最為核心、且作為後續接軌 IFRS 永續揭露準則基礎之主流揭露框架為何？", "options": {"A": "金融稽核與董事會信託保障架構", "B": "國際永續會計與資產折舊敏感度指引", "C": "歐盟企業永續報告與雙重重大性標準", "D": "氣候相關財務揭露框架 (TCFD)"}, "answer": "D", "explanation": "國際及我國金融監督管理委員會在推動永續資訊揭露時，均以國際金融穩定委員會（FSB）所發布之「TCFD（氣候相關財務揭露）」架構（包含治理、策略、風險管理、指標和目標四大支柱）作為核心基礎進行後續之對接與持續發展，【一、氣候變遷與溫室氣體管理(上冊)講義 P.113】"}, {"id": 2, "stem": "某外銷大廠受國際買家要求，必須在今年底前設定符合 1.5°C 升溫路徑之中長期科學碳減量目標。請問，目前國際上最權威且被廣泛採納、用以指引並審查企業「設定科學基礎減量路徑與目標（SBT）」之國際倡議組織為何？", "options": {"A": "政府間氣候變化專門委員會 (IPCC)", "B": "國際永續準則理事會 (ISSB)", "C": "科學基礎目標倡議 (SBTi)", "D": "國際標準化組織 (ISO)"}, "answer": "C", "explanation": "「科學基礎目標倡議（SBTi）」 主要提供企業與金融機構符合 1.5°C 溫控路徑的科學化碳管理框架，提供具備科學公信力之科學基礎減量目標（SBT）制定標準與技術量化工具，【一、氣候變遷與溫室氣體管理(上冊)講義 P.113】"}, {"id": 3, "stem": "企業在依金管會藍圖或 GRI 準則編製年度永續報告書時，必須量化並揭露其範疇一、範疇二及範疇三之溫室氣體排放量。請問在企業管理與審計實務中，此類溫室氣體排放及氣候揭露數據，標準歸類為下列哪一類別之資訊？", "options": {"A": "衡量企業無形資產折舊與重置成本之營收數據", "B": "提供投資大眾與評級機構評估其氣候風險之「非財務資訊（Non-financial Information）」", "C": "評估產品在主要出口國之市場占有率之市場指標", "D": "衡量公司無形資產折舊與重置成本之評價模型"}, "answer": "B", "explanation": "企業公開揭露溫室氣體排放數據、水資源耗用、生物多樣性、員工保障及公司治理等項目，有別於傳統財務會計報表上的營收或淨值，在管理學與國際標準上，統一屬於「非財務資訊（Non-financial Information）」 的範疇，【一、氣候變遷與溫室氣體管理(上冊)講義 P.113】"}, {"id": 4, "stem": "某高科技半導體封測廠正在編製年度永續報告書，董事會要求永續團隊應採用 SASB（永續會計準則委員會）標準進行指標揭露。依據 SASB 標準之設計宗旨，其最核心之技術特徵與揭露焦點為何？", "options": {"A": "企業高階經理人之個人財務投資組合與股權信託架構", "B": "具財務實質重大性之「行業別（Industry-specific）」ESG 風險與機會指標", "C": "範疇三之跨國投資金融資產之全生命週期碳足跡", "D": "與歐盟 CBAM 完全一致的複雜貨品排放量量化公式"}, "answer": "B", "explanation": "SASB 標準之核心價值，在於其針對全球 77 個細分「行業別（Industry-specific）」制定專屬的揭露指標，聚焦於對企業投資人最具「財務實質重大性」的 ESG 關鍵風險與機會。【一、氣候變遷與溫室氣體管理(上冊)講義 P.113】"}, {"id": 5, "stem": "某鋼鐵廠永續部門正奉命為公司編撰年度永續報告書。依據我國金融監督管理委員會（金管會）對於上市櫃公司申報永續報告書之規範，企業在揭露其氣候變遷因應策略時，在格式與架構上必須參考哪一項國際通用之資訊揭露架構，以加強揭露其治理、策略、風險管理、指標和目標？", "options": {"A": "SBTi（科學基礎減量目標倡議）", "B": "TCFD（氣候相關財務揭露）", "C": "TNFD（自然相關財務揭露）", "D": "ESRS（歐洲永續報告標準）"}, "answer": "B", "explanation": "金管會為引導上市櫃公司落實氣候資訊揭露，要求永續報告書編製應遵循「TCFD（氣候相關財務揭露）」之四大核心支柱（治理、策略、風險管理、指標和目標），以提供投資人關鍵的氣候風險資訊。【一、氣候變遷與溫室氣體管理(上冊)講義 P.113】"}, {"id": 6, "stem": "金管會正分階段引導國內上市櫃公司接軌國際財務報導準則（IFRS）永續揭露準則。在「IFRS S2（氣候相關揭露）」準則規範下，企業在對外發布氣候財務資訊時，其所必須強制揭露與量化之「最核心之氣候相關指標與數據」為下列何者？", "options": {"A": "企業年度經常性薪資平均數與員工離職率", "B": "企業所採購原物料在製造商母國已申報之關稅總額", "C": "企業近五年在證券交易所之每日成交量與股價波動趨勢", "D": "企業所產生之範疇一、範疇二及（適用時）範疇三之溫室氣體絕對排放量"}, "answer": "D", "explanation": "在「IFRS S2（氣候相關揭露）」準則規範下，企業對外發布氣候相關揭露時，必須強制量化並揭露其所產生之範疇一、範疇二及（適用時）範疇三之溫室氣體絕對排放量。【一、氣候變遷與溫室氣體管理(上冊)講義 P.113】"}, {"id": 7, "stem": "某上市鋼鐵集團規劃在台灣證券交易所發行「永續發展債券」募集資金。依據我國櫃買中心之發行規範，該債券募得之資金，其合規投資與使用之範疇「不包含」下列哪一項非永續用途？", "options": {"A": "資助廠內新設「熔窯餘熱高效汽電共生系統」之節能改造", "B": "投資於引進再生能源發電、強電網電力系統及大型儲能設備", "C": "撥配用於執行社區弱勢族群輔導、原住民主體參與等公正轉型社會專案", "D": "撥付為該集團當年度之「高階經理人年終績效獎金」與全體「股東特別股之現金股利分紅」"}, "answer": "D", "explanation": "永續發展債券（包括綠色債券、社會責任債券及可持續發展債券）其募得之資金用途受到嚴格限制，必須 100% 用於綠色改善、節能、再生能源、社會福利或社會正義調適等環境與社會效益之專案中，絕對「不可用於發放股東分紅或經理人獎金」。【一、氣候變遷與溫室氣體管理(上冊)講義 P.113】"}, {"id": 8, "stem": "某上市櫃光電廠永續工作小組正依據 IFRS 永續揭露準則編製資訊揭露大綱。當工作小組在填報「風險管理」此一核心構面（支柱）時，報告在技術與合規上，最應優先揭露下列哪一項實務程序？", "options": {"A": "企業關鍵專報技術移轉與全球專利授權期限", "B": "原物料之全球採購金額與海關進口清關傳票", "C": "企業用於辨識 (Identify)、評估 (Evaluate)、排序 (Prioritize) 與監控 (Monitor) 氣候相關風險與機會的實質程序、方法及管理機制", "D": "股票每日成交量及營收毛利率的折現估算"}, "answer": "C", "explanation": "依據 IFRS 永續資訊揭露之「風險管理」構面，企業必須詳實披露其在實務上「如何辨識、分析、評估其重要性排序、以及如何將其監控並整合納入企業既有之總體風險管理體系中」的實質程序與管理機制。【一、氣候變遷與溫室氣體管理(上冊)講義 P.113】"}, {"id": 9, "stem": "氣候相關財務揭露（TCFD）已成為全球企業在評估氣候風險時最主流的治理框架。請問，此一極具公信力的 TCFD 技術架構與原則，在早期（2015 年）是由哪一個國際組織所正式發起並成立工作小組制訂的？", "options": {"A": "聯合國環境規劃署 (UNEP)", "B": "金融穩定委員會 (Financial Stability Board, FSB)", "C": "國際標準化組織 (ISO)", "D": "政府間氣候變化專門委員會 (IPCC)"}, "answer": "B", "explanation": "TCFD 係由國際二十國集團（G20）委託「金融穩定委員會（FSB）」於 2015 年底成立，並於 2017 年正式發布建議，指引企業向投資大眾報告氣候變遷對企業財務之實質衝擊。【一、氣候變遷與溫室氣體管理(上冊)講義 P.113】"}, {"id": 10, "stem": "國際永續準則理事會（ISSB）所發布的 IFRS 永續揭露準則（IFRS S1 與 S2）在架構上高度承襲了 TCFD 的成功經驗。依據該標準，企業在進行永續與氣候相關揭露時，其揭露報告在架構上必須完整包含治理、策略、風險管理，以及哪一個核心治理構面（支柱）？", "options": {"A": "環境利益與財務毛利率折現", "B": "氣候專利與原廠技術授權", "C": "行政許可與主管機關變更登記", "D": "指標和目標（Metrics and targets）"}, "answer": "D", "explanation": "無論是 TCFD 亦或接軌國際之 IFRS S1 與 S2，在非財務永續揭露之基本技術架構上，一律強制依循四大核心構面（四大支柱）進行陳述，即：1. 治理（Governance）、2. 策略（Strategy）、3. Risk Management（風險管理）、4. 指標和目標（Metrics and Targets）。【一、氣候變遷與溫室氣體管理(上冊)講義 P.113】"}, {"id": 11, "stem": "某上市科技公司依規範公開其年度 ESG 報告書。依據國際非財務揭露趨勢，企業積極落實 ESG 資訊揭露，對於資本市場的最核心價值與重要性為何？", "options": {"A": "提供投資大眾與評級機構**「透明度與可比性」**的非財務績效資訊，建立市場信賴", "B": "確保公司在證券交易所之每日成交量與股價波動維持 100% 絕對穩定", "C": "作為向政府申請全額無償財務補助與低利率貸款之唯一法定憑證", "D": "增加企業在跨國海運貿易時之關稅減免比例"}, "answer": "A", "explanation": "ESG 資訊揭露之最上位功能在於消除市場不對稱資訊。藉由公開客觀、具公信力的非財務績效報告，可為全球投資人及評級機構（如 MSCI、S&P）提供關鍵的**「透明度與可比性（Transparency & Comparability）」**，從而將氣候與社會風險納入資本定價中，提升企業之綠色溢價與長期信賴，【一、氣候變遷與溫室氣體管理(上冊)講義 P.113】"}, {"id": 12, "stem": "隨著全球非財務與永續揭露標準的重構與接軌，將既有的 TCFD、SASB 等多套主流框架進行了跨世紀之整合，並正式發布國際財務報導準則第 S1 號「永續相關財務資訊揭露一般要求」與第 S2 號「氣候相關揭露」的國際權威機構為何？", "options": {"A": "政府間氣候變化專門委員會（IPCC）", "B": "氣候相關財務揭露工作小組（TCFD）", "C": "國際永續準則理事會（ISSB）", "D": "全球永續報告倡議組織（GRI）"}, "answer": "C", "explanation": "國際財務報導準則基金會（IFRS Foundation）於 2021 年成立了**「國際永續準則理事會（ISSB）」**，旨在整合全球分散的非財務揭露標準。ISSB 於 2023 年正式發布了 IFRS S1 與 IFRS S2，成為指導全球企業接軌財務與永續揭露之最上位、統一標準，【一、氣候變遷與溫室氣體管理(上冊)講義 P.113】"}, {"id": 13, "stem": "某金控集團之永續風控人員正在依據 TCFD 與 IFRS S2 準則進行資產組合的氣候風險評估。在氣候風險分類中，下列哪一項風險因素在性質上屬於「轉型風險（Transition Risk）」，而非實體風險（Physical Risk）？", "options": {"A": "暴雨與海平面上升造成低窪地區廠房與實體設備被淹沒之急性物理損失", "B": "長期極端高溫熱浪造成生產線散熱不佳、電力中斷及機械故障之慢性風險", "C": "嚴重旱災缺水導致工業用水與製程冷卻水供應不足，進而面臨之停工損失", "D": "國家因應去碳政策而加嚴溫室氣體減量法規，或依法對高碳排企業課徵碳費之**「政策與法律變革」**"}, "answer": "D", "explanation": "氣候風險中，「實體風險」係指由極端天氣（急性）或長期氣候趨勢（慢性）直接對實體資產與營運所造成之物理損害（如洪水、高溫、缺水）；而**「轉型風險」則是伴隨社會向低碳經濟過渡時，因「政策與法律、技術、市場需求或信譽變革」所衍生之合規成本與商業衝擊**，【一、氣候變遷與溫室氣體管理(上冊)講義 P.113】"}, {"id": 14, "stem": "國際財務報導準則基金會（IFRS Foundation）為了在全球金融市場建立一套一致、具備比較性的永續資訊揭露標準，於聯合國氣候變遷大會（COP26）上正式宣布成立「國際永續準則理事會（ISSB）」。請問此一極具歷史意義的組織是在西元哪一年成立的？", "options": {"A": "西元 2018 年", "B": "西元 2021 年", "C": "西元 2022 年", "D": "西元 2023 年"}, "answer": "B", "explanation": "IFRS 基金會於西元 2021 年 11 月在英國格拉斯哥舉辦之 COP26 期間，正式對外宣布成立「國際永續準則理事會（ISSB）」，此舉象徵全球金融與非財務永續揭露標準邁向大整併與大一統時代，【一、氣候變遷與溫室氣體管理(上冊)講義 P.113】"}, {"id": 15, "stem": "國際永續準則理事會（ISSB）在 IFRS S2「氣候相關揭露」中，為了建立具備跨國可比性之金融申報指標，訂定了七項跨行業通用氣候指標。下列哪一項指標在性質上屬於此七大跨行業（Cross-industry）通用氣候相關指標之一？", "options": {"A": "企業全體基層員工之年度經常性平均薪資與工作滿意度調查結果", "B": "產品在主要外銷市場上所取得之自願性產品碳足跡標籤（碳標籤）有效張數", "C": "該公司之品牌在全台灣零售通路中之市占率、知曉度與競爭力分析", "D": "企業在決策、研發與能效設備投資評估中，主動引入之**「內部碳價格（Internal Carbon Price）」**"}, "answer": "D", "explanation": "IFRS S2 的跨行業（Cross-industry）指標是無關行業類別、全體上市櫃企業均應申報揭露的核心指標。包含：溫室氣體排放量、過渡風險、實體風險、氣候機會、資金分配、高管薪酬連結，以及「內部碳價格（Internal Carbon Price）」，【一、氣候變遷與溫室氣體管理(上冊)講義 P.113】"}, {"id": 16, "stem": "某上市科技集團在依據 IFRS S2 準則揭露氣候資訊。若該集團之報告書中僅定性條列了氣候實體風險與轉型風險，卻「完全忽略且未科學評估此類風險對於集團中長期業務、財務規劃及實體營運商業模型（Business Model）之實質衝擊與應對韌性」。請問，此項揭露缺失會直接導致該集團無法滿足 IFRS S2 中哪一個核心治理構面（支柱）之合規要求？", "options": {"A": "治理 (Governance)", "B": "風險管理 (Risk Management)", "C": "策略 (Strategy)", "D": "指標和目標 (Metrics and targets)"}, "answer": "C", "explanation": "在 IFRS S2 與 TCFD 的四大支柱中，「策略（Strategy）」「中長期業務、策略、財務規劃、乃至於實體商業模型（Business Model）之實質影響與應對韌性」，【一、氣候變遷與溫室氣體管理(上冊)講義 P.113】"}, {"id": 17, "stem": "國際金融穩定委員會（FSB）在將 TCFD（氣候相關財務揭露工作小組）階段性任務宣告完成並功成身退後，已委託新成立之 ISSB 接手其框架內容之維護與後續接軌。請問，TCFD 原有的氣候風險揭露四大核心支柱與框架要求，已被完整移轉、整併入哪一套最新的國際財務報導準則（IFRS）永續揭露準則體系中？", "options": {"A": "IFRS S1 永續相關財務資訊揭露一般要求", "B": "IFRS S2 氣候相關揭露", "C": "全球永續報告倡議組織之 GRI 305 排放標準", "D": "國際標準化組織之 ISO 14064-1 組織盤查規範"}, "answer": "B", "explanation": "隨著國際非財務報告的大整併，TCFD 於 2023 年底將其監管與標準維護責任正式交接給 ISSB。ISSB 將 TCFD 的四大核心構面與氣候風險揭露要件，完全轉化、提煉並併入專屬氣候議題之**「IFRS S2（氣候相關揭露）」**準則內，【一、氣候變遷與溫室氣體管理(上冊)講義 P.113】"}, {"id": 18, "stem": "某金控集團擬針對其所投資之水泥、石化等高能效授信對象，執行中長期氣候實體風險與轉型風險之財務衝擊評估。依據 TCFD 與 IFRS S2 揭露要求，企業或金融機構在量化並評估氣候風險對其財務、業務及策略之潛在衝擊與應對韌性時，最應採用下列哪一種科學分析工具？", "options": {"A": "國家再生能源憑證（T-REC）核證分析", "B": "產品生命週期衝擊評估中之「分類（Classification）」程序", "C": "氣候相關之「情境分析（Scenario Analysis）」", "D": "企業內部審計與資產負債敏感度折現模型"}, "answer": "C", "explanation": "依據 TCFD 及 IFRS S2 準則之規定，企業在評估氣候風險之潛在財務影響與策略韌性時，最核心且具公信力之評估工具即為「情境分析（Scenario Analysis）」，藉由設定不同升溫情境（如 1.5°C、2°C 或高升溫情境），量化評估企業在不同未來路徑下之財務適應能力，【一、氣候變遷與溫室氣體管理(上冊)講義 P.113】"}, {"id": 19, "stem": "依據氣候相關財務揭露（TCFD）架構，企業所面臨之氣候風險細分為實體風險與轉型風險。下列哪一個情境，屬於企業在面臨低碳過渡時所遭遇之「轉型風險（Transition Risk）」中的「政策與法律風險」？", "options": {"A": "國家因應去碳目標，正式公告加嚴溫室氣體減量管制，並對排碳大戶開徵每公噸 300 元之碳費", "B": "廠區因遭受突發之致災性強烈颱風與豪雨襲擊，導致生產線實體淹水並面臨長達一週之停工損失", "C": "長期之極端高溫熱浪導致廠房空調與製冷負荷大增，進而造成電網過載及慢性機械老化", "D": "嚴重之季節性乾旱導致製程冷卻水短缺，促使工廠必須自費跨縣市載水以維持產能"}, "answer": "A", "explanation": "「實體風險」係指由極端天氣（急性）或長期氣候趨勢（慢性）直接對實體資產所造成的物理損害（如洪水、高溫、缺水）；而「轉型風險」則是伴隨社會向低碳經濟過渡時，因「政策與法律變革（如開徵碳費）、技術轉型、市場需求改變或信譽」所衍生之合規成本與商業衝擊【一、氣候變遷與溫室氣體管理(上冊)講義 P.113】"}, {"id": 20, "stem": "聯合國氣候變化綱要公約（UNFCCC）第 21 屆締約方大會（COP21）上正式通過了極具里程碑意義之《巴黎協定》。依據協定條文之溫控目標，各締約國共同承諾，應將本世紀末相較於工業化前之全球平均升溫，控制在遠低於多少溫差之內，並努力將升溫限制在多少溫差之內？", "options": {"A": "控制在遠低於 3.0°C 之內，並努力限制在 2.0°C 之內", "B": "控制在遠低於 2.0°C 之內，並努力限制在 1.5°C 之內", "C": "控制在遠低於 1.5°C 之內，並努力限制在 1.0°C 之內", "D": "控制在遠低於 2.0°C 之內，並努力限制在 1.8°C 之內"}, "answer": "B", "explanation": "2015 年通過之《巴黎協定》第二條明確訂定全球溫控長期目標：應將全球平均氣溫升幅控制在「遠低於工業化前水平的 2.0°C 之內」，並進一步「努力將氣溫升幅限制在 1.5°C 之內」，以降低氣候變遷之衝擊，【一、氣候變遷與溫室氣體管理(上冊)講義 P.113】"}, {"id": 21, "stem": "某上市科技集團規劃設定中長期科學碳減量目標，以響應國際買家之減碳要求。依據國際公認之「科學基礎目標倡議（SBTi）」規範，若企業之範疇三（其他間接排放）排放量占其全廠總溫室氣體排放量之比例「大於多少門檻以上」時，該企業在遞交目標審查時，一律「必須強制設定範疇三的減量目標」？", "options": {"A": "大於 40%", "B": "大於 10%", "C": "大於 25%", "D": "大於 50%"}, "answer": "A", "explanation": "依據科學基礎目標倡議（SBTi）之審查標準，企業申請設定科學基礎目標（SBT）時，其範疇一與範疇二必須全數納入減碳邊界；若該企業之範疇三（其他間接排放）占其全廠直接與間接排放總量之比例「大於 40% 以上」時，則必須強制為其設定具備減碳路徑之範疇三指定削減目標，【一、氣候變遷與溫室氣體管理(上冊)講義 P.113】"}, {"id": 22, "stem": "我國金融監督管理委員會（金管會）為了使國內企業的永續揭露品質與國際市場接軌，已正式發布「我國接軌 IFRS 永續揭露準則藍圖」，規劃分階段強制上市櫃公司採用 IFRS S1 及 S2 進行申報。請問，該藍圖中所規範之「首波（第一階段）適用對象之實收資本額門檻、適用之首個會計年度、以及依法必須正式對外公告申報之年度」，依序分別為何？", "options": {"A": "實收資本額 50 億元以上；自 2026 會計年度起適用；於 2027 年度首期公告申報", "B": "實收資本額 50 億元以上；自 2025 會計年度起適用；於 2027 年度首期公告申報", "C": "實收資本額 100 億元以上；自 2025 會計年度起適用；於 2027 年度首期公告申報", "D": "實收資本額 100 億元以上；自 2026 會計年度起適用；於 2027 年度首期公告申報"}, "answer": "D", "explanation": "依據金管會發布之接軌藍圖規劃，第一階段對象為「實收資本額新台幣 100 億元以上之上市櫃公司」，將自「2026 會計年度」起正式適用 IFRS 永續揭露準則，並於「2027 年度」正式對外公告申報其永續與氣候財務相關揭露資訊，【一、氣候變遷與溫室氣體管理(上冊)講義 P.113】"}, {"id": 23, "stem": "某出口歐盟之上市科技集團，依據歐盟「企業永續報告指令（CSRD）」之合規要求，必須對其海內外所有子公司之非財務 ESG 指標進行全面揭露。依據 CSRD 條文規定，受規範企業之永續揭露資訊，應依法強制登載於企業之哪一項法定報告中？", "options": {"A": "企業官方網站的自願性永續發展專區", "B": "董事會核定之年度管理報告（即年報，Management Report / Annual Report）", "C": "僅需登載於公司內部之內部控制與稽核指引紀錄", "D": "單獨公開之不確定性財務折現與毛利敏感度報告書"}, "answer": "B", "explanation": "歐盟 CSRD 指令要求，企業之 ESG 與永續揭露資訊必須與傳統財務報告進行高度整合，並強制規定登載於企業法定之「管理報告 / 年報（Management Report）」中，以提升非財務資訊之法律責任與查確信等級。（本題標準答案為 B），【一、氣候變遷與溫室氣體管理(上冊)講義 P.113】"}, {"id": 24, "stem": "聯合國氣候變遷大會（COP27）對全球「氣候正義（Climate Justice）」與因應措施進行了深度磋商。依據大會決議，COP27 在氣候治理上所宣示之四大核心實質目標中，「不包含」下列哪一項？", "options": {"A": "減緩 (Mitigation)", "B": "調適 (Adaptation)", "C": "全民參與 (Universal Participation)", "D": "融資 (Finance) 與 合作 (Collaboration)"}, "answer": "C", "explanation": "聯合國 COP27 大會之四大核心宣示目標明確為：減緩、調適、融資（資金）與合作。其中「全民參與」非屬該四大特定政策目標之一。（本題標準答案為 C），【一、氣候變遷與溫室氣體管理(上冊)講義 P.129】"}, {"id": 25, "stem": "各國政府在永續政策上積極導入「直接與間接碳定價」政策工具。依據環境經濟學與國家氣候治理實務，推動碳定價所能為國家或產業帶來之核心利益中，「不直接包含」下列哪一項？", "options": {"A": "促使產業將排碳之環境外部成本實質內部化，引導低碳決策", "B": "提升國內綠色低碳技術之轉型潛力與產品國際競爭力", "C": "直接且專款用於補助並促進核能發電基礎設施之擴建與技術開發", "D": "健全國家在國際氣候談判與跨國低碳貿易規範中之合規地位"}, "answer": "C", "explanation": "實施碳定價主要是將排放溫室氣體之外部成本內部化，引導低碳轉型。其政府專款專用之基金基金或所得，並不直接包含「補助並促進核能發電基礎建設之開發」。（本題標準答案為 C），【一、氣候變遷與溫室氣體管理(上冊)講義 P.38】"}, {"id": 26, "stem": "在多種不同的碳定價（Carbon Pricing）政策工具中，某一類機制係指「由政府主管機關由上而下（Top-down）設定特定受列管對象在指定期間內之溫室氣體排放最高限額，並將此額度分割為標準化之可交易配額，透過免費核配或拍賣發放，允許企業依其實質排放需求在二級市場上自願交易額度」。請問，此項數量控制型政策工具之標準名稱為何？", "options": {"A": "影子碳定價與自願抵換專案", "B": "總量管制與排放交易機制 (Cap and Trade / ETS)", "C": "國家碳稅費與財政特別預算制度", "D": "公正轉型補貼與再生能源躉購機制"}, "answer": "B", "explanation": "「總量管制與排放交易機制（Cap and Trade / ETS，如歐盟之 EU ETS）」是數量型直接碳定價工具。其本質特徵即是由政府設定「最高排放上限（Cap）」，再核發或拍賣可交易之「排放配額（Allowances）」，允許企業在市場上自由交易，【一、氣候變遷與溫室氣體管理(上冊)講義 P.39】"}, {"id": 27, "stem": "某金控集團之碳市場研究員在分析總量管制排放交易（ETS）系統中碳價變動的供需機制。在典型的排放交易系統中，當主管機關所核配或釋放之可交易排放額度（Allowances）總量「顯著高於受納管企業之實際排放履約總需求」時，在自由市場機制下，最直接衍生之經濟與價格效應為何？", "options": {"A": "由於受管制企業爭相在平台上競標配額，促使碳配額之成交價格急劇上升", "B": "系統平台會自動將多餘配額轉為自願減量額度，交易流動性呈三次方指數型增長", "C": "由於市場配額供給過剩且買方需求疲軟，導致交易平台上之碳配額成交價格下跌", "D": "受管制對象之全廠溫室氣體實質年排放量上限被迫調高為兩倍"}, "answer": "C", "explanation": "總量管制排放交易（Cap and Trade）本質上是由數量決定價格之市場工具。當政府核配的碳排放總上限（Cap）過度寬鬆、免費發行或拍賣出的額度量大幅超出受納管對象之實際碳排放與履約所需時（亦即供給遠大於需求），在市場機制運作下，將會造成碳配額價格（如 EUA 價格）發生**「下跌」**或崩盤之現象，【一、氣候變遷與溫室氣體管理(上冊)講義 P.41】"}, {"id": 28, "stem": "在總量管制與交易系統（Cap and Trade）的運作下，主管機關會先設定管制對象之排放上限，並將此總量分割為等單位的標準化交易許可。企業在履約期末，必須繳交等同於其實際排放量之何種額度以履行法律責任？", "options": {"A": "自願減量信用額度", "B": "增量抵換額度", "C": "核配額度 / 排放配額 (Emission Allowance)", "D": "社會碳定價信用額度"}, "answer": "C", "explanation": "總量管制與交易（ETS）屬於強制性工具，政府分配或拍賣給受列管對象之法定排放許可，稱為「核配額度」或「排放配額（Emission Allowances）」。（本題標準答案為 C），【一、氣候變遷與溫室氣體管理(上冊)講義 P.41】"}, {"id": 29, "stem": "在全球碳市場與交易機制中，區分為強制性碳市場與自願性碳市場。下列哪一個機制在性質上「不屬於」自願性碳信用交易市場，而是屬於典型的「強制性 / 非自願性」排放權交易市場？", "options": {"A": "歐盟排放交易系統 (EU-ETS)", "B": "黃金標準 (Gold Standard, GS)", "C": "碳驗證標準 (Verra / VCS)", "D": "聯合國清潔發展機制 (CDM)"}, "answer": "A", "explanation": "黃金標準（GS）、VCS 以及 CDM 皆屬於自願性或供企業自發購買抵銷之碳信用機制（自願性市場）。而歐盟排放交易系統（EU-ETS）是由歐盟法規強制列管特定高碳排企業之總量交易市場，屬於「非自願性 / 強制性」交易市場。（本題標準答案為 A），【一、氣候變遷與溫室氣體管理(上冊)講義 P.41】"}, {"id": 30, "stem": "某林業開發商計畫將其新植造林專案申請註冊於國際自願性碳權機制以核發碳信用。在目前全球各主要「自願性碳市場（Voluntary Carbon Market）」機制中，哪一個機制的發行量與市場規模（交易市場占有率）目前居於全球首位、規模最大？", "options": {"A": "碳驗證標準 (Verra / Verified Carbon Standard, VCS)", "B": "黃金標準 (Gold Standard, GS)", "C": "氣候行動準備方案 (Climate Action Reserve, CAR)", "D": "歐盟排放交易系統 (EU-ETS)"}, "answer": "A", "explanation": "在自願性碳市場中，由 Verra 所管理的「碳驗證標準（Verified Carbon Standard, VCS）」是目前全球最具代表性、且市場流通量與規模最大的自願性碳信用（Carbon Credit）核發機制。（EU ETS 則屬於強制性總量管制市場，非自願性），【一、氣候變遷與溫室氣體管理(上冊)講義 P.41】"}, {"id": 31, "stem": "依據世界銀行與氣候經濟學分類，下列哪一項政策或機制屬於典型的「由國家政府強制主導並施行之直接碳定價（Direct Carbon Pricing）」工具？", "options": {"A": "企業自行在永續報告書中對外揭露之範疇三間接排碳折現估算", "B": "金融機構發行之特定綠色轉型氣候債券", "C": "企業自願設置且未與法規強制義務掛鉤之內部碳定價", "D": "依法對列管對象或特定原燃物料開徵之「碳稅（或碳費）」"}, "answer": "D", "explanation": "國際上公認最主流由政府強制推動與主導之「直接碳定價（Direct Carbon Pricing）」，即為價格工具的「碳稅/碳費」以及數量工具的「總量管制與交易系統（EU ETS / K-ETS）」，【一、氣候變遷與溫室氣體管理(上冊)講義 P.42-43】"}, {"id": 32, "stem": "某大型跨國集團為了評估未來能效設備汰換方案之潛在財務合規風險，在其投資收益評估模型中引入了「影子價格（Shadow Pricing）」。請問，此項「影子價格」技術，主要應用於下列哪一類型的碳定價（Carbon Pricing）實務中？", "options": {"A": "歐盟總量管制排放交易機制", "B": "跨境碳關稅與歐盟 CBAM 憑證結算", "C": "國家依法開徵之特定高產能燃料環境稅", "D": "企業自發採行之「內部碳定價」決策管理"}, "answer": "D", "explanation": "「影子價格（Shadow Pricing）」 是指企業在進行新設備投資、供應鏈採購決策時，在財務模型中「虛擬、定性加入之潛在碳排放成本」，用以輔助決策。此項技術是「內部碳定價（Internal Carbon Pricing）」 中最普遍被企業採用之核心管理形式，【一、氣候變遷與溫室氣體管理(上冊)講義 P.43】"}, {"id": 33, "stem": "某上市電子集團為了加速邁向淨零目標，在各分廠自主導入「企業內部碳定價（ICP）」，並選用「影子價格（Shadow Pricing）」進行內部決策管理。請問，該集團在投資可行性評估中納入內部碳價格，其最核心、實務之管理目的為何？", "options": {"A": "作為向地方稅捐處申請地價稅與房屋稅免稅之唯一法定技術憑證", "B": "限制與控制分廠經理人之當季績效獎金一律等比例轉為外部自願性碳信用購買基金", "C": "與歐盟 ETS 當週拍賣價格進行無公差之折抵，以規避綠色通膨", "D": "將潛在的碳排放成本內化於公司的固定資產與能效設備投資決策中，以評估與優化減碳措施之經濟效益"}, "answer": "D", "explanation": "企業內部碳定價中之「影子價格（Shadow Pricing）」是將碳排成本虛擬加載於專案之財務決策中（如計算 IRR、NPV），使研發與決策人員能優先選擇低碳技術，輔助評估與優化減碳措施之投資效益。【一、氣候變遷與溫室氣體管理(上冊)講義 P.43】"}, {"id": 34, "stem": "碳定價工具可以細分為直接碳定價、間接碳定價以及自願性碳定價。依據世界銀行與經濟學理論，下列哪一項政策或工具在環境經濟學範疇中「不屬於」由國家政府所施行的「間接碳定價（Indirect Carbon Pricing）」工具？", "options": {"A": "政府依法對高碳排、高污染源加徵之空氣污染防制費或環境捐", "B": "政府對化石燃料加徵燃料稅、碳附加費，或調整、取消對化石燃料之財政補貼", "C": "主管機關依能源政策對燃油或天然氣運輸車輛加徵之能源相關附加費", "D": "企業為了輔助內部投資決策，而在財務模型中虛擬加載之**「影子價格（Shadow Pricing）」**"}, "answer": "D", "explanation": "間接碳定價是指政府非直接對每噸排碳課稅收費，而是透過對燃料徵稅、取消補貼等「間接」手段來增加碳排放之機會成本。而「影子價格（Shadow Pricing）」屬於企業內部管理、自主採行之**「企業內部碳定價（ICP）」**工具，非屬政府施行之間接碳定價，【一、氣候變遷與溫室氣體管理(上冊)講義 P.43】"}, {"id": 35, "stem": "某跨國製造企業與東南亞鄰國政府進行雙邊減碳項目合作，規劃將其在當地投資之高能效生質能發電減量效益進行跨國移轉。依據《巴黎協定》第六條之規範，此類經由雙邊或多邊協議自主推動、且涉及「國際轉移減量成效（ITMOs）」之自願性合作機制，標準歸類於下列何者？", "options": {"A": "巴黎協定第 6.4 條機制", "B": "巴黎協定第 6.2 條合作機制", "C": "聯合國清潔發展機制 (CDM)", "D": "歐盟總量管制與配額移轉機制"}, "answer": "B", "explanation": "依據《巴黎協定》第六條，國際減碳合作主要分為第 6.2 條與第 6.4 條。其中，第 6.2 條允許締約國之間透過雙邊或多邊自願性合作協議，進行「國際轉移減量成效（Internationally Transferred Mitigation Outcomes, ITMOs）」之移轉與抵銷，屬於去中心化之雙邊/多邊合作機制，【一、氣候變遷與溫室氣體管理(上冊)講義 P.44】"}, {"id": 36, "stem": "某再生能源開發集團擬參與聯合國直接監管之跨國碳減量專案。依據《巴黎協定》第 6.4 條所建立之自願性減量機制，與第 6.2 條雙邊合作機制相比，第 6.4 條機制在技術與參與權益上具備下列哪一項核心特徵？", "options": {"A": "其交易與核發之額度僅限於在歐盟成員國內部之強制性排放交易系統中流通", "B": "專案完全免予進行任何基準線情境判定與外加性分析，且計入期可無條件展延 100 年", "C": "專案必須由各國政府以中央部會名義全權出資，法規上嚴格禁止任何民間私有企業參與", "D": "屬於由聯合國（CMA）直接集中監管之機制，並「允許公有實體、私有實體及個人共同參與」，以促進永續發展與減量"}, "answer": "D", "explanation": "依據《巴黎協定》第 6.4 條，該機制是由氣候公約締約方會議直接授權、集中監管之跨國減碳與永續發展機制，其本質特徵在於不僅由政府主導，更明文允許公有實體、私有（民間）企業、甚至是個人共同參與專案開發與額度核發，【一、氣候變遷與溫室氣體管理(上冊)講義 P.44】"}, {"id": 37, "stem": "依據我國《氣候變遷因應法》及環境經濟學，國家若推動高強度溫室氣體減量管制與直接碳定價（如碳費、碳稅），可能在國際貿易上面臨一項重大挑戰，即「排碳大戶為降低合規成本，將生產線外移至氣候政策或碳管制較寬鬆之國家，再將產品輸入回受管制國，進而造成全球總排放量不減反增」。請問，此一關鍵之環境與經濟現象在法理與經濟學上稱為什麼？", "options": {"A": "碳洩漏 (Carbon Leakage)", "B": "雙重計算 (Double Counting)", "C": "碳封存 (Carbon Storage)", "D": "截斷不確定性 (Cut-off Uncertainty)"}, "answer": "A", "explanation": "依據我國氣候法與國際氣候政策理論，「碳洩漏（Carbon Leakage）」是指實施溫室氣體減量管制與碳定價作為時，可能導致本地高碳密集產業外移至其他管制較寬鬆國家，或本地產品被進口之廉價高碳產品所替代，進而削弱減排成效之現象，【一、氣候變遷與溫室氣體管理(上冊)講義 P.54】"}, {"id": 38, "stem": "許多國家相繼實施排碳收費或總量管制等強制性直接碳定價。對其境內製造業而言，此舉可能增加生產合規成本。為了防止境內大廠外移或境外高碳商品低價進口替代，各國積極研擬防護網。歐盟推行「碳邊境調整機制（CBAM）」即是為了防範下列哪一項核心環境經濟學風險？", "options": {"A": "碳洩漏 (Carbon Leakage)", "B": "雙重計算風險", "C": "截斷不確定性", "D": "實體實質性衝擊"}, "answer": "A", "explanation": "歐盟實施 CBAM 之最主要法理與政策動機，在於確保進口高碳產品承擔與歐盟境內 EU ETS 等值的碳成本，以防止本國高碳密集產業外移所造成之「碳洩漏（Carbon Leakage）」風險，確保國際公平競爭。（本題標準答案為 A），【一、氣候變遷與溫室氣體管理(上冊)講義 P.54】"}, {"id": 39, "stem": "在歐盟碳邊境調整機制（CBAM）下，進口商為申報產品內含碳排而購入的 CBAM 憑證，其價格計算基準主要取決於下列何者？", "options": {"A": "國際民生能源價格與天然氣期貨當季之平均值", "B": "世界銀行與國際自願碳權市場之年度基準交易價", "C": "歐盟排放交易系統（EU ETS）前一週配額拍賣之平均收盤價格", "D": "歐盟成員國自行課徵之平均環境稅與能源稅額度"}, "answer": "C", "explanation": "歐盟 CBAM 憑證的定價並非固定不變，亦非由進口商或出口國自訂，而是與歐盟境內之碳市場高度連動。依據歐盟 CBAM 規範，憑證的計算基準係與前一週歐盟排放交易系統（EU ETS）配額拍賣之平均收盤價格相互綁定，以確保進口產品與歐盟境內產品承擔對等的碳成本。【一、氣候變遷與溫室氣體管理(上冊)講義 P.55】"}, {"id": 40, "stem": "某螺絲進口商正研究產品銷售至歐洲時的合規責任。依據歐盟現行法規，其「碳邊境調整機制（CBAM）」在首波（第一階段過渡期與實施期）所強制課徵並列管之貨品行業別範疇為下列何者？", "options": {"A": "有機棉服飾與天然纖維編織品", "B": "家用電器、消費性電子產品與木製家具", "C": "鋼鐵、水泥、鋁、肥料、電力與氫氣等高碳密集基礎工業品", "D": "化妝品、醫療製劑與精細軟體產品"}, "answer": "C", "explanation": "歐盟 CBAM 第一階段列管之六大行業貨品為：電力、水泥、肥料、鋼鐵、鋁、氫氣。消費性電子產品與紡織、軟體並非首波 CBAM 課稅或列管之對象。【一、氣候變遷與溫室氣體管理(上冊)講義 P.55】"}, {"id": 41, "stem": "某鋼鐵製品出口大廠正積極對接歐洲市場之綠色規範。依據歐盟現行之「碳邊境調整機制（CBAM）」法規推動期程，其僅需申報產品碳含量、而免予提交與結算 CBAM 憑證之「過渡期（Transition Period）」將於何時正式結束？", "options": {"A": "西元 2024 年 12 月 31 日", "B": "西元 2025 年 12 月 31 日", "C": "西元 2026 年 12 月 31 日", "D": "西元 2027 年 12 月 31 日"}, "answer": "B", "explanation": "歐盟 CBAM 採取漸進式推動。其**「過渡期」自西元 2023 年 10 月 1 日開始，並預計於西元 2025 年 12 月 31 日正式結束**。自西元 2026 年 10 月起（正式實施階段），進口商必須實質申報進口產品內含碳排放量，並開始購買與提交對應之 CBAM 憑證，【一、氣候變遷與溫室氣體管理(上冊)講義 P.55】"}, {"id": 42, "stem": "某螺絲進口商在規劃未來出口至歐盟的 CBAM 憑證預算。依據歐盟碳邊境調整機制（CBAM）之合規結算規範，進口商必須為申報之進口產品其所內含之碳排放量購買並提交相應之 CBAM 憑證，該憑證之購買與提交數量係以何種單位進行核算與結算？", "options": {"A": "出口至歐盟之產品總體實際物理重量（如公噸鋼材）", "B": "進口產品在歐盟海運通關時所繳納之總歐元金額（EUR）", "C": "經合格第三方機構查證核實之產品內含溫室氣體排放量（以公噸二氧化碳當量 CO2e 爲計量單位）", "D": "出口產品之外包裝紙盒及木製棧板總件數"}, "answer": "C", "explanation": "歐盟 CBAM 憑證（CBAM Certificate）之價格與 EU ETS 拍賣價格直接連動 。進口商應申報並提交憑證之數量，係完全以該進口產品在製造階段所耗用能資源換算之**「每公噸內含二氧化碳當量（metric tonnes of CO2 e）」**為基本計算與提交單位，【一、氣候變遷與溫室氣體管理(上冊)講義 P.55】"}, {"id": 43, "stem": "某螺絲出口大廠之永續團隊正在協助歐洲進口商填報其季度 CBAM 申報表格。依據歐盟碳邊境調整機制（CBAM）之合規要求，申報資料必須精確對應產品系統生命週期。請問，下列哪一項資訊「不屬於」進口商向歐盟主管機關申報時法定應提交之資訊範疇？", "options": {"A": "出口至歐盟之納管產品的八碼海關稅則號列（CN Code）及實際產品進口總數量", "B": "生產該進口產品時，其在出口國（如台灣）已實際繳納之碳價（如碳費）與獲得折減之證明文件", "C": "經第三方查證核實之產品內含直接與間接溫室氣體特定內含排放量，及消耗之前驅物排放量", "D": "生產該項貨品之出口廠區，當年度在該產品線上的實際毛利率、資產折舊率及商業銷售獲利率"}, "answer": "D", "explanation": "CBAM 申報資料高度聚焦於產品系統的物理內含碳排放強度。必填與揭露資訊包含進口數量、CN 海關編碼、製程之直接/間接實質排放、消耗之前驅物排放量、以及「在出口國已實質繳納之碳價與折減證明（以進行雙重課稅抵折）」。而製造商與產品線之商業獲利與折舊等財務利潤資訊**「非屬」**其應申報與核對範圍，【一、氣候變遷與溫室氣體管理(上冊)講義 P.55】"}, {"id": 44, "stem": "在國際氣候治理框架中，世界各締約國必須定期更新並通報其自主減碳承諾，此即為「國家自定貢獻（NDC）」。請問此項對各國中長期減量計畫具有最核心規範與履約約束之「NDC 制度」，係正式確立並建立於下列哪一部關鍵國際協定之下？", "options": {"A": "京都議定書", "B": "哥本哈根協定", "C": "巴黎協定", "D": "格拉斯哥公約"}, "answer": "C", "explanation": "「國家自定貢獻（Nationally Determined Contribution, NDC）」 是依循 2015 年通過並生效的《巴黎協定》第四條規範所建立，要求各締約方定期提出、維持其具法律約束力之中長期自主減量目標，【一、氣候變遷與溫室氣體管理(上冊)講義 P.6】"}, {"id": 45, "stem": "某出口導向的緊固件大廠正依據歐盟規範計算銷往歐洲之簡單鋼鐵貨品內含碳。在歐盟碳邊境調整機制（CBAM）所規定的「簡單貨品（Simple Goods）」特定內含排放量量化計算公式SEEg中，其SEEg 在科學計量與法規申報上代表什麼本質意義？", "options": {"A": "該進口特定貨品/產品的單位特定內含溫室氣體排放量（Specific embedded emissions of goods）", "B": "出口廠區在報告期間內所消耗之全部外購電力與蒸汽的間接排放當量", "C": "生產該項貨品所消耗之前驅物（Precursors）之加權平均直接累積排放量", "D": "該生產設施在基準年內因裝設控制設備所額外減少之自願性碳信用額度"}, "answer": "A", "explanation": "依據歐盟 CBAM 產品碳含量量化規範，列管貨品分為簡單貨品與複雜貨品。針對「簡單貨品（Simple Goods，指生產過程僅需消耗直接原料及能資源，而不含有其他列管前驅物投入之產品）」，其特定內含排放量（SEEg，單位為公噸 CO2e / 噸產品）之計算，係以歸屬該貨品在製程邊界內之直接與間接排放總量（AttrEmg），除以報告期內該設施生產之貨品總產量（ALg）求得。【一、氣候變遷與溫室氣體管理(上冊)講義 P.62】"}, {"id": 46, "stem": "為減緩全球升溫之衝擊，聯合國政府間氣候變化專門委員會（IPCC）在其科學評估報告中強烈呼籲控制世紀末全球氣溫。請問 2015 年通過之《巴黎協定》，其設定的積極控制目標為將全球平均氣溫升幅限制在相較於工業化前水準之攝氏幾度以內？", "options": {"A": "1.5℃", "B": "2.0℃", "C": "2.5℃", "D": "3.0℃"}, "answer": "A", "explanation": "2015年通過的《巴黎協定》長期目標為控制全球升溫相較工業化前在 2.0℃ 以內，並致力積極控制不超過 1.5℃ 以內。IPCC 科學報告亦強烈呼籲必須將全球暖化升溫控制在 1.5℃ 內，以有效降低氣候風險。【一、氣候變遷與溫室氣體管理(上冊)講義P.1】"}, {"id": 47, "stem": "2025 年於巴西貝倫舉辦之《聯合國氣候變化綱要公約》第 30 屆締約方會議（COP30）被定位為「執行的大會」，並通過了哪一項極具歷史意義的政治協議，強調加強多邊主義、將氣候多邊主義與人民聯繫，並加快《巴黎協定》的全面實施？", "options": {"A": "貝倫政治套案 (The Belém Political Package)", "B": "格拉斯哥氣候協議 (Glasgow Climate Pact)", "C": "夏姆錫克實施計畫 (Sharm el-Sheikh Implementation Plan)", "D": "杜拜共識 (The UAE Consensus)"}, "answer": "A", "explanation": "依據2025 年於巴西貝倫召開之 COP30 通過「貝倫政治套案」（The Belém Political Package），其中包括「共作決議」(Mutirão decision)，其核心旨在加強多邊主義、連結人民，並加速《巴黎協定》的實施與落地。【一、氣候變遷與溫室氣體管理(上冊)講義P.144】"}, {"id": 48, "stem": "我國依《氣候變遷因應法》授權建置碳定價與碳費制度，其首要的環境與政策目標是促使國內大排放源朝向下列哪一個方向進行實質轉型？", "options": {"A": "擴大傳統化石燃料之基礎建設與產能開發以平穩用電成本", "B": "提高國內產品之外銷出口價格以在國際貿易中獲取最大外匯", "C": "廣泛購買國外自願性碳權以完全規避本土實質之減量義務", "D": "引導並促使事業單位進行低碳與淨零之綠色技術轉型"}, "answer": "D", "explanation": "我國碳費與自願減量等制度，其核心目標在於落實排碳者責任，引導並促使國內主要排放源朝向「低碳技術與淨零排放」之綠色方向轉型，以符合全球減碳大趨勢。【一、氣候變遷與溫室氣體管理(上冊)講義P.38】"}, {"id": 49, "stem": "歐盟自西元 2026 年起正式全面實施「碳邊境調整機制（CBAM）」。依據國際氣候治理與世界貿易政策精神，歐盟推動此項跨境機制的最核心政策目的為何？", "options": {"A": "強制要求全球所有進口歐盟之產品均達成絕對零碳排放", "B": "協助開發中國家無償推動綠能基礎建設", "C": "全面取代既有的歐盟排放交易系統（EU ETS）", "D": "避免歐盟內部因實施嚴格碳管制（EU ETS）而導致「碳洩漏」(Carbon Leakage)"}, "answer": "D", "explanation": "歐盟實施 CBAM 的核心政策動機在於防範「碳洩漏」。由於歐盟內部的 EU ETS 對本土產業課予高昂碳成本，為防止高碳排產業外流至其他未實施碳管制之國家，或防止進口高碳排產品低價競銷，因而透過 CBAM 課徵碳費以平衡國內外碳成本。【一、氣候變遷與溫室氣體管理(上冊)講義P.55】"}, {"id": 50, "stem": "英國政府亦宣布推動其本土之碳邊境調整機制（UK CBAM）。依據國際碳定價發展趨勢，關於「英國版本」與「歐盟版本」在管制範圍與機制設計上的主要差異，下列敘述何者正確？", "options": {"A": "英國 CBAM 的列管範圍不包含進口「電力」，但額外納入了進口「陶瓷」與「玻璃」產品，且實施初期不設過渡期", "B": "英國 CBAM 的列管產品完全與歐盟相同，且設有與歐盟完全對等的兩年過渡期", "C": "英國 CBAM 僅針對進口電力與氫氣課稅，其餘鋼鐵、水泥等均免予管制", "D": "英國 CBAM 全面排除鋼鐵與鋁製品之管制，改以自願申報方式辦理"}, "answer": "A", "explanation": "英國 CBAM 規劃於 2027 年上路且「無過渡期」。在管制產品上，**英國版並未納入進口「電力」，但相較歐盟版，其列管範圍額外納入了「陶瓷」與「玻璃」**製造產品。其餘鋼鐵、鋁、水泥、肥料與氫氣等則兩者皆有管制。【一、氣候變遷與溫室氣體管理(上冊)講義P.55】"}, {"id": 51, "stem": "歐盟 CBAM 建立了全球首個跨境碳成本申報與扣抵系統。在結束僅申報無須實際繳費之「過渡期」後，歐盟 CBAM 正式全面生效並開始「要求進口商必須實質購買並繳交 CBAM 憑證費用」之確切時間點為西元哪一天？", "options": {"A": "西元 2024 年 12 月 31 日", "B": "西元 2025 年 10 月 1 日", "C": "西元 2026 年 1 月 1 日", "D": "西元 2028 年 1 月 1 日"}, "answer": "C", "explanation": "歐盟 CBAM 於 西元 2026 年 1 月 1 日 正式全面生效（進入實施階段）。自此日起，進口列管產品至歐盟之進口商，必須開始為其產品之進口內含碳排放量實質購買並申報繳納 CBAM 憑證，過渡期正式結束。【一、氣候變遷與溫室氣體管理(上冊)講義P.57】"}, {"id": 52, "stem": "歐盟為給予全球進口商與第三方供應鏈充分之資料對接、系統測試與申報適應期，於正式啟動繳費課稅前設定了「過渡期（申報無須實質課稅）」。請問此過渡期之法定「起始實施時間點」為西元哪一年月？", "options": {"A": "西元 2023 年 10 月", "B": "西元 2022 年 12 月", "C": "西元 2024 年 7 月", "D": "西元 2025 年 1 月"}, "answer": "A", "explanation": "歐盟 CBAM 之過渡期自 西元 2023 年 10 月（1日）起正式開始實施。在過渡期內，歐盟進口商僅負有按季提報進口貨品中內含溫室氣體排放量之申報義務，並無須實質購買或繳交 CBAM 憑證費用。【一、氣候變遷與溫室氣體管理(上冊)講義P.57】"}, {"id": 53, "stem": "承上題，歐盟 CBAM 法案明文規定該「過渡期（僅需申報排放量、無須實際購買與繳納憑證扣抵碳成本）」之最後法定截止與結束日期為西元哪一天？", "options": {"A": "西元 2024 年 12 月 31 日", "B": "西元 2026 年 12 月 31 日", "C": "西元 2027 年 12 月 31 日", "D": "西元 2025 年 12 月 31 日"}, "answer": "D", "explanation": "歐盟 CBAM 之過渡期期程為兩年多，法規明文規定其於 西元 2025 年 12 月 31 日 正式截止結束。自次日（2026 年 1 月 1 日）起即進入正式全面實行與實質購買憑證之課稅階段。【一、氣候變遷與溫室氣體管理(上冊)講義P.57】"}, {"id": 54, "stem": "依據歐盟 CBAM 於正式實施階段之法規罰則，若進口商未能在每年 5 月 31 日前，為其申報之進口內含碳排放量繳交並「提交足額之 CBAM 憑證」，除了仍負有補交憑證之義務外，超額排放之惩罰性罰款標準為每公噸二氧化碳當量（CO2e）處以多少金額？", "options": {"A": "10 歐元", "B": "50 歐元", "C": "100 歐元", "D": "500 歐元"}, "answer": "D", "explanation": "歐盟 CBAM 正式期罰則與歐盟排放交易系統（EU ETS）之超額排放罰則一致。若進口商未能如期提交足額之憑證，將被處以每公噸 CO2e 超額排放「100 歐元」之罰款，且該處罰並不能免除其補交 missing 憑證之義務。【一、氣候變遷與溫室氣體管理(上冊)講義P.57】"}, {"id": 55, "stem": "依據歐盟碳邊境調整機制（CBAM）法規，為管理 CBAM 憑證之發行、銷售、買回及清算結算，歐盟法規明文規定應由下列哪一個主體負責建置並管理統一的憑證交易與結算平台？", "options": {"A": "各歐盟成員國自行建置獨立之民間交易市場", "B": "由歐盟執委會（European Commission）建立 Common Central Platform（中央通用平台）進行集中化管理", "C": "全權委託聯合國氣候變化綱要公約（UNFCCC）之碳登記處管理", "D": "由歐洲證券及市場管理局委任第三方私有區塊鏈節點進行結算"}, "answer": "B", "explanation": "歐盟 CBAM 憑證並非由各國分權或民間平台管理，而是由歐盟執委會（European Commission）建立統一的「Common Central Platform（中央通用平台）」，負責 CBAM 憑證之銷售、回購及集中結算，以確保歐盟單一市場管制之一致性。【一、氣候變遷與溫室氣體管理(上冊)講義P.58】"}, {"id": 56, "stem": "歐盟為了防範其境內產業碳洩漏風險並引導進口產品降低排碳，發布了「碳邊境調整機制（CBAM）」。下列進口至歐盟之各項申報貨品中，哪一項「不屬於」歐盟 CBAM 首波（包含過渡期與首批實質實施）所列管與強制申報的特定碳密集產品？", "options": {"A": "鋼鐵與鋁製品", "B": "太陽能電池與模組 (Solar cells/panels)", "C": "水泥與化學肥料", "D": "氫氣與電力輸入"}, "answer": "B", "explanation": "歐盟 CBAM 首波列管之高碳密集產品與前驅物，包含：鋼鐵、鋁、水泥、肥料、電力、氫氣等 6 大類別產品。而「太陽能電池與模組」目前並未納入首波公告申報與課稅之列管清單中。【一、氣候變遷與溫室氣體管理(上冊)講義P.59】"}, {"id": 57, "stem": "歐盟碳邊境調整機制（CBAM）首波針對鋼鐵、鋁、水泥、肥料、電力及氫氣等 6 大高碳密集產品實施管制。依據法規規劃，歐盟目前正積極進行評估，擬於下一階段（次階段）優先新增列管之高碳洩漏風險部門，並不包含下列何者？", "options": {"A": "塑膠 (Plastics)", "B": "有機化學品 (Organic Chemicals)", "C": "跨境運輸服務 (Transportation Services)", "D": "以上皆是次階段列管評估的對象"}, "answer": "C", "explanation": "依據講義說明，歐盟 CBAM 旨在針對具高碳洩漏風險之進口實體「貨品」課徵碳成本，次階段評估納入之範疇主要為**「有機化學品」與「塑膠」**等碳密集產品。而「跨境運輸服務」非屬產品貿易或邊境管制貨物，不屬於 CBAM 次階段評估列管之部門。【一、氣候變遷與溫室氣體管理(上冊)講義P.59】"}, {"id": 58, "stem": "歐盟碳邊境調整機制（CBAM）在核算進口列管貨品之特定內含排放量時，針對「複雜貨品（Complex Goods）」，其計算邏輯與「簡單貨品（Simple Goods）」最大的不同在於必須額外納入前驅物之內含排放量。請問下列哪一個計算式正確呈現了複雜貨品特定內含排放量（SEEg）的標準核算公式？", "options": {"A": "SEEg=AttrEmg/ALg", "B": "SEEg=EEInpMat/ALg", "C": "SEEg=(AttrEmg+EEInpMat)/ALg", "D": "SEEg=(DirEm+Em_el)/AttrEmg"}, "answer": "C", "explanation": "依據講義，歐盟 CBAM 針對進口貨品特定內含排放量（SEEg，單位：tCO2e/t）之量化計算，將貨品區分為簡單與複雜兩類。「複雜貨品」之計算除直接與間接排放量外，還必須額外加上生產製程中所消耗之前驅物（原料）之內含排放量（EEInpMat），因此其標準計算公式為：SEEg=(AttrEmg+EEInpMat)/ALg。【一、氣候變遷與溫室氣體管理(上冊)講義P.65】"}, {"id": 59, "stem": "自然風險財務揭露（TNFD）是近年金融市場與企業界高度關注的國際倡議。相較於 TCFD 側重於氣候相關的財務影響，TNFD 的核心揭露焦點主要著眼於下列何者？", "options": {"A": "僅限於企業製程直接排放與輸入電力間接排放之減碳績效", "B": "企業與外部供應商之間的商業合約條款及採購成本分析", "C": "企業內部的員工多元化與人力資源福利政策", "D": "企業營運與社會經濟活動所依賴並對其產生衝擊的「自然環境與生物多樣性」"}, "answer": "D", "explanation": "TNFD（Taskforce on Nature-related Financial Disclosures）的核心宗旨，旨在解決長期以來金融體系忽略企業營運對大自然衝擊與依賴之缺失。其揭露框架聚焦於企業與社會活動所仰賴的「自然環境」與「生物多樣性」相關風險和機會，以引導資金轉向自然正面（Nature Positive）之經濟活動。【一、氣候變遷與溫室氣體管理(上冊)講義P.80】"}, {"id": 60, "stem": "為落實 2050 淨零轉型，我國推動了跨部會的十二項關鍵戰略與六大部門減碳旗艦行動計畫。在十二項關鍵戰略的具體規劃中，下列哪一項「不屬於」這十二項核心戰略之一？", "options": {"A": "前瞻能源與綠電基礎系統", "B": "運具電動化及無碳化", "C": "資源循環零廢棄與綠色成長", "D": "永續航空燃料與跨國海運附加費"}, "answer": "D", "explanation": "我國 2050 淨零之十二項關鍵戰略明確包含：風電/光電、氫能、前瞻能源、電力系統與儲能、節能、碳捕捉利用及封存、運具電動化及無碳化、資源循環零廢棄、自然碳匯、淨零綠生活、綠色金融、公正轉型。而「永續航空燃料（SAF）」目前非屬單獨列立之十二項關鍵戰略範疇。（本題標準答案為 D），【一、氣候變遷與溫室氣體管理(下冊)講義 P.10】"}, {"id": 61, "stem": "某能源科技廠規劃配合國家「能源轉型」戰略，擴大投資並建置多項分散式能源。依據我國能源管理與綠電發展之技術分類，下列哪一項能源或應用「不屬於」促進再生能源（Renewable Energy）發展的範疇？", "options": {"A": "天然氣高效複循環發電", "B": "川流式小水力發電", "C": "陸域與離岸風力能", "D": "太陽光電發電系統"}, "answer": "A", "explanation": "依據我國能源政策與技術定義，風力能、太陽能、小水力發電等皆為典型的再生能源。而「天然氣」本質上仍屬於化石燃料（Fossil Fuel），不屬於再生能源範疇。（本題標準答案為 A），【一、氣候變遷與溫室氣體管理(下冊)講義 P.151】"}, {"id": 62, "stem": "某連鎖餐飲集團擬配合我國 2050 淨零轉型中「淨零綠生活」關鍵戰略，在其各門市推廣「零浪費低碳飲食」策略。依據該戰略之政策輔導內涵，下列哪一項行動或敘述「不屬於」零浪費低碳飲食之實質推動重點？", "options": {"A": "推廣計畫性採買、適量點餐及環保餐具共享", "B": "極力推廣與補助便宜的在地農食品及相關餐飲服務", "C": "推動零浪費餐飲服務、低碳綠色餐廳及在地食材之選用", "D": "引導大眾在地消費並食用採低碳栽培模式之在地農糧產品"}, "answer": "B", "explanation": "推廣「零浪費低碳飲食」之核心，在於引導大眾消費低碳栽培之在地食材（減少運輸碳足跡）、推廣零浪費餐飲、計畫性採買以減少剩食等。而「便宜的在地農食品」等非環保性、純粹價格導向之敘述，非屬綠生活低碳飲食戰略之推廣重點。（本題標準答案為 B），【一、氣候變遷與溫室氣體管理(下冊)講義 P.182】"}, {"id": 63, "stem": "我國為了跨部門、跨部會落實六大部門之階段管制目標與國家總體減碳策略。在政府行政體制中，依法由哪一個中央主管機關主政、扮演跨部門整合及政策法規推動之法定主導角色？", "options": {"A": "環境部", "B": "財政部", "C": "行政院主計總處", "D": "臺灣碳權交易所"}, "answer": "A", "explanation": "我國針對氣候治理、溫室氣體階段管制目標以及六大部門減量責任的中央最高主管機關為「環境部」（實務由環境部氣候變遷署辦理），由其依法扮演各部會跨部門整合與法規推動之主導角色，【一、氣候變遷與溫室氣體管理(下冊)講義 P.21】"}, {"id": 64, "stem": "某石化集團規劃導入碳捕捉、利用與封存（CCUS）技術。依據我國《氣候變遷因應法》相關規定，事業若欲執行溫室氣體之「二氧化碳封存作業」，在技術與行政法規上，依法應向哪一個中央主管機關申請並取得許可，方能實施？", "options": {"A": "經濟部部本部或能源署", "B": "環境部", "C": "國家科學及技術委員會", "D": "國家發展委員會"}, "answer": "B", "explanation": "依據我國《氣候變遷因應法》相關規定，二氧化碳之捕捉及封存（CCS）屬重要管制行為，其封存作業之申請、核准、變更與廢止許可之中央主管機關一律為「環境部」。（本題標準答案為 B），【一、氣候變遷與溫室氣體管理(下冊)講義 P.24】"}, {"id": 65, "stem": "氣候變遷因應法確立了我國中央與地方政府的治理權責劃分。依據該法之權責事項規定，下列哪一項業務「屬於」地方直轄市、縣（市）主管機關所應主責並落實執行之法定權責範疇？", "options": {"A": "全國性自願減量專案之審查與額度核發", "B": "跨國碳邊境調整機制之談判與雙邊免稅協議", "C": "國家首階段碳費徵收費率審議會之召集與裁決", "D": "地方層級「氣候變遷調適執行方案」之訂修與具體落實執行"}, "answer": "D", "explanation": "國家級的碳定價、碳權審查與氣候法主管權益等屬於中央環境部之主責。而地方政府之法定核心氣候職責，在於依據國家綱領，訂修並推動「氣候變遷調適執行方案」與「溫室氣體減量執行方案」。（本題標準答案為 D），【一、氣候變遷與溫室氣體管理(下冊)講義 P.24】"}, {"id": 66, "stem": "我國《氣候變遷因應法》明文定義多項氣候治理專業術語。請問，在該法中，「指將二氧化碳或其他溫室氣體自排放源或大氣中持續移除後，吸收、固定或儲存之樹木、森林、土壤、海洋、地層、特定設施或場所」在氣候法與自然碳匯計量中，其標準之法理與科學名稱為何？", "options": {"A": "碳預算 (Carbon Budget)", "B": "碳強度 (Carbon Intensity)", "C": "碳信用 (Carbon Credit)", "D": "碳匯 (Carbon Sink)"}, "answer": "D", "explanation": "依據我國《氣候變遷因應法》第 3 條之法定定義，「碳匯（Carbon Sink）」 係指將二氧化碳或其他溫室氣體自排放源或大氣中持續移除後，吸收、固定或儲存之樹木、森林、土壤、海洋、地層、特定設施或場所（如綠碳、藍碳、黃碳等自然與人為碳匯），【一、氣候變遷與溫室氣體管理(下冊)講義 P.25】"}, {"id": 67, "stem": "在推動強制性總量管制排放交易系統（ETS）時，政府必須建立標準之量化計量單位。依據氣候法與碳市場交易原理，「指國家在實施總量管制時，依法核配或拍賣給受列管排放源，允許其於特定限期內得排放溫室氣體之法定權利，其計量單位以一公噸二氧化碳當量（tCO2e）表示」。請問此一法定交易配額之名稱為何？", "options": {"A": "減量額度 (Offset Credit)", "B": "內部影子碳價格 (Shadow Price)", "C": "排放額度 / 排放配額 (Emission Allowance)", "D": "自願性減量信用 (Voluntary Carbon Credit)"}, "answer": "C", "explanation": "在總量管制（ETS）體系下，由政府依法核發、拍賣或分配之法定排放許可權，統稱為「排放額度」或「排放配額（Emission Allowance）」，其計量單位以 1 公噸 CO2e 為代表，【一、氣候變遷與溫室氣體管理(下冊)講義 P.25】"}, {"id": 68, "stem": "氣候科學家與綠領工程師在彙整組織溫室氣體清冊時，為了在同一個基準上比較與加總不同種類之溫室氣體。在計量上使用了一項關鍵指標，其定義為「單一質量單位之特定溫室氣體，在指定時間範圍內（通常設定為 100 年），相較於同等質量二氧化碳所累積之輻體驅動力之比值」。請問此項量化換算之科學指標縮寫為何？", "options": {"A": "NbS (Nature-based Solutions)", "B": "LCI (Life Cycle Inventory)", "C": "SBTi (Science Based Targets initiative)", "D": "GWP (Global Warming Potential)"}, "answer": "D", "explanation": "**「全球暖化潛勢（Global Warming Potential, GWP）」**是由聯合國 IPCC 所建立之科學計量指標。該指標旨在衡量不同溫室氣體相較於二氧化碳（GWP=1）之相對累積暖化效應，用以加總換算各類氣體為統一的「二氧化碳當量（CO2e）」，【一、氣候變遷與溫室氣體管理(下冊)講義 P.25】"}, {"id": 69, "stem": "氣候因應政策與自然碳匯領域近年積極推廣一類新型態的應對行動。該概念在國際標準上定義為：「指保護、永續管理和恢復自然或經改變之生態系統的實質行動，期以有效且具適應性的方式因應多重社會挑戰（如氣候變遷、糧食與水資源安全、自然災害等），並同時兼顧、促進人類福祉與生物多樣性之實質效益」。請問此類低碳應對路徑在國際標準與講義上統稱為何者？", "options": {"A": "基於自然的解決方案 (Nature-based Solutions, NbS)", "B": "科學基礎減量路徑與目標 (Science Based Targets, SBT)", "C": "上市櫃公司永續發展路徑圖 (Sustainable Development Roadmap)", "D": "產品生命週期評估與衝擊分類 (Life Cycle Assessment, LCA)"}, "answer": "A", "explanation": "「基於自然的解決方案（Nature-based Solutions, NbS）」 係指利用保護、復育及管理森林（綠碳）、海洋與濕地（藍碳）等自然生態系統之方式，既可增加碳移除、減緩暖化，又能兼顧生態、生物多樣性與人類福祉，【一、氣候變遷與溫室氣體管理(下冊)講義 P.25】"}, {"id": 70, "stem": "將所有溫室氣體的排放量依其全球暖化潛勢（GWP）換算成二氧化碳當量（CO2e）是為了什麼目的？", "options": {"A": "為了真實反映與量化各別製程中之二氧化碳氣體對周邊自然保護區之生物多樣性損失", "B": "提供一個共通、標準化之計量尺度，以便於在同一個基礎上比較與加總不同氣體對全球暖化之貢獻", "C": "為了向地方環保局證明該廠房之廢氣破壞處理設備（POU）已達成 100% 絕對無害之燃燒效率", "D": "便於企業直接將其範疇一之直接排放與範疇三之其他間接排放進行無公差的等值抵換"}, "answer": "B", "explanation": "「全球暖化潛勢（GWP）」是用以衡量不同溫室氣體在特定時間（通常為 100 年）內造成全球暖化效應之相對強度。將所有氣體換算為「二氧化碳當量（CO2e）」，最核心之目的即為「統一計量標準，以便於比較、加總與分析各溫室氣體之全球暖化貢獻」，【一、氣候變遷與溫室氣體管理(下冊)講義 P.3 / 二、溫室氣體盤查作業講義 P.38 / 四、產品碳足跡講義 P.21】"}, {"id": 71, "stem": "某地方政府正在擬定「地方氣候變遷調適計畫」。依據《氣候變遷因應法》及環境管理學，相較於以減少碳排放為手段之「減緩」措施，國家推動「調適（Adaptation）」政策之最核心、最上位之科學目的為何？", "options": {"A": "極大化推廣與研發諮詢各式尖端再生能源與電力系統之轉供技術", "B": "「降低氣候衝擊與極端天氣所衍生之災害風險與實體損害，並厚實與提高系統之氣候韌性」", "C": "增加產品在進行跨國海運配送時之功能單位與宣告單位的物理轉化率", "D": "提供高額之補貼，以保障高耗能大廠能享有低價之化石燃料供應"}, "answer": "B", "explanation": "氣候變遷之因應措施包含「減緩」（Mitigation）與「調適」（Adaptation）。調適政策的核心政策與科學目的，在於因應已發生或預期發生的極端氣候衝擊，「降低氣候衝擊造成的風險與損害，並厚實、提高系統與社會的韌性（Resilience）」，【一、氣候變遷與溫室氣體管理(下冊)講義 P.38】"}, {"id": 72, "stem": "我國《氣候變遷因應法》特別強調在向低碳轉型時應兼顧社會正義（公正轉型）。依據該法之法規精神，國家在落實「轉型正義（社會正義）」時之具體法定作法為何？", "options": {"A": "為了避免碳洩漏，優先無條件向高碳密集產業提供無限期之免費排放特許", "B": "優先補助資產規模與產能裝機居於全國頂尖之特大型高耗能重工業", "C": "評估各項氣候因應政策對弱勢族群、原住民族及弱勢地區之衝擊與影響，並提供必要之支持與公正轉型配套", "D": "規定所有既有老舊廠房必須在三年內無條件拆除重建，否則處以高額之行政罰鍰"}, "answer": "C", "explanation": "《氣候變遷因應法》與國家淨零「公正轉型（社會轉型）」之精神一致。在法規中，針對轉型正義之實質作法為：「應評估氣候政策對弱勢族群、原住民族與弱勢地區之影響，並提供必要之支持與公正轉型機制」，以落實「不遺落任何人」之原則，【一、氣候變遷與溫室氣體管理(下冊)講義 P.41】"}, {"id": 73, "stem": "某鋼鐵加工廠之永續部門正在規劃 115 年度的碳費申報預算。依據我國環境部最新公告之碳費徵收費率，我國碳費徵收之首期「一般費率（基本費率）」訂定為每公噸二氧化碳當量（CO2e）多少新台幣元？", "options": {"A": "新台幣 150 元", "B": "新台幣 300 元", "C": "新台幣 500 元", "D": "新台幣 100 元"}, "answer": "B", "explanation": "依據環境部氣候變遷署正式公告之碳費徵收費率，我國碳費徵收之首期「一般費率（基本費率）」訂定為每公噸 CO2e 新台幣 300 元。【一、氣候變遷與溫室氣體管理(下冊)講義 P.48 / P.60；二、溫室氣體盤查作業講義 P.163】"}, {"id": 74, "stem": "某高能耗精密金屬鑄造廠，經由綠色供應鏈合作取得了符合規範的國內自願減量專案減量額度。依據我國氣候法及配套子法，該額度在合規營運中之最主要法定實務用途為何？", "options": {"A": "作為收費對象扣抵或折抵應繳納碳費之收費排放量", "B": "作為企業向財政部申請，全額沖抵當年度營利事業所得稅之法定憑證", "C": "100% 抵免歐盟 CBAM 憑證之跨境碳關稅費用", "D": "在國家系統上直接等比例自動兌換為免審核之再生能源憑證 (T-REC)"}, "answer": "A", "explanation": "我國自願減量專案核發之減量額度（碳權），其最核心的實務法定用途之一，便是作為收費對象扣抵或折抵應繳納碳費之收費排放量。【一、氣候變遷與溫室氣體管理(下冊)講義 P.48；三、溫室氣體自願減量作業與減量額度講義 P.2】"}, {"id": 75, "stem": "某水泥廠年溫室氣體排放量已達到碳費徵收門檻。若該廠擬透過採購國內自願減量專案或抵換專案核發之「減量額度（碳權）」來抵減其年度應繳費之排放量，依據我國《碳費收費辦法》規定，此類額度可扣抵之最高比例上限為何？", "options": {"A": "不得超過該廠當年度收費排放量的 10%", "B": "不得超過該廠當年度收費排放量的 5%", "C": "不得超過該廠當年度收費排放量的 20%", "D": "得由企業自主申報，法規上並無設定任何扣抵上限"}, "answer": "A", "explanation": "為了落實「自身減量為主、外部抵換為輔」之原則，我國《碳費收費辦法》明文限制：收費對象使用國內自願減量專案、抵換專案所取得之減量額度進行扣抵時，其扣除上限不得超過該事業收費排放量的 10%。【一、氣候變遷與溫室氣體管理(下冊)講義 P.48】"}, {"id": 76, "stem": "我國《氣候變遷因應法》第四章正式確立了開徵碳費之法源基礎。依據該法之法規管理精神，政府依法對排碳大戶開徵碳費，最上位之核心政策目的為何？", "options": {"A": "增加一般政府財政收入，以作為年度各類基建之一般性公務支出", "B": "專款用以補貼與平衡進出口跨國海運及貿易逆差之財務損失", "C": "藉由經濟工具內化外部成本，用以「達成國家溫室氣體減量目標及各階段管制目標」", "D": "提供高額專用資金，無償補償因開徵碳費而拒不配合轉型之高耗能大廠"}, "answer": "C", "explanation": "碳費本質上屬於具有專款專用特性的價格型直接碳定價工具。依據我國《氣候變遷因應法》，徵收碳費最主要的法理目的，在於透過經濟誘因驅使企業自發進行溫室氣體減量，以達成國家溫室氣體減量目標及各階段管制目標，並將所得資金專款專用於綠色轉型與調適工作。【一、氣候變遷與溫室氣體管理(下冊)講義 P.48】"}, {"id": 77, "stem": "我國碳費徵收之收入將專款專用於「溫室氣體管理基金」。依據《氣候變遷因應法》規範之基金法定用途，下列哪一項用途「不包含」在該基金之使用範疇之內？", "options": {"A": "補助地方政府執行溫室氣體減量工作及氣候變遷調適計畫", "B": "輔導與補助事業採行能資源節約、減碳措施及開發低碳技術", "C": "執行溫室氣體減量、氣候變遷調適之教育宣導及綠領人才培育", "D": "補貼化石燃料進口採購成本以降低民生用油、用氣與電力價格"}, "answer": "A", "explanation": "我國《氣候變遷因應法》設計了「直接碳定價（強制性碳費）」與「自願減量信用」的雙軌互補機制。企業自發執行減量措施取得並經環境部核發之「減量額度」，最重要的法理用途之一即為提供給碳費收費對象進行排放量扣抵（扣抵應繳納碳費之排放量）。【一、氣候變遷與溫室氣體管理(下冊)講義 P.48】"}, {"id": 78, "stem": "某碳費收費大廠為了協助其上下游之中小型供應鏈夥伴（非屬碳費徵收對象）進行低碳製程優化，規劃向其採購國內自願減量專案或早期抵換專案之減量額度。依據我國《氣候變遷因應法》及配套折抵規範，此類額度用以扣抵該大廠應繳納碳費之收費排放量時，其「折抵之扣除比率」與「最高扣抵上限比例」分別為何？", "options": {"A": "扣除比率為 1.2；且累計抵扣之上限比例，不得超過該大廠當年度收費排放量的 10%", "B": "扣除比率為 1.0；且累計抵扣之上限比例，不得超過該大廠當年度收費排放量的 5%", "C": "扣除比率為 0.5；且累計抵扣之上限比例，不得超過該大廠當年度收費排放量的 15%", "D": "扣除比率為 1.5；且累計抵扣之上限比例，不得超過該大廠當年度收費排放量的 20%"}, "answer": "A", "explanation": "依據我國碳費徵收與配套子法，為了鼓勵碳費收費對象（排碳大戶）積極帶動非收費對象（如中小型供應鏈、大專院校等）實施自願減量，優先讓資金留在國內，法規設計了「1.2 扣除比率」之優惠，即購買並使用 1 公噸之自願減量額度可折抵 1.2 公噸之收費排放量，惟該項額度之累計扣抵比例，最高不得超過該事業當年度收費排放量之 10%。【一、氣候變遷與溫室氣體管理(下冊)講義 P.48】"}, {"id": 79, "stem": "依據經濟學與我國《氣候變遷因應法》規範之直接碳定價（Direct Carbon Pricing）分類，屬於由政府行政機關主導、直接制定每噸排碳應繳納金額之「費率制」政策工具為下列何者？", "options": {"A": "總量管制下發行之法定免費配額拍賣 (Allowances)", "B": "由特定高排放源申報並繳納之國家「碳費（Carbon Fee）」", "C": "國際自願性碳信用交易平台上之自願減量信用額度定價 (Offsets)", "D": "歐盟碳邊境調整機制下向進口商徵收之 CBAM 憑證費用"}, "answer": "B", "explanation": "直接碳定價主要可細分為價格工具（費率制）與數量工具（排放交易）。依據我國《氣候變遷因應法》第四章之規劃，我國目前採行之直接碳定價機制中，由政府主管機關直接審議並定費率徵收者，即為「碳費」，【一、氣候變遷與溫室氣體管理(下冊)講義 P.48】"}, {"id": 80, "stem": "我國為落實污染者付費原則，自西元 2025 年起正式針對特定高排放源開徵碳費。請問此項關鍵直接碳定價政策在行政與司法上的最上位授權「母法（法律依據）」為何？", "options": {"A": "氣候變遷因應法", "B": "空氣污染防制法", "C": "環境基本法", "D": "再生能源發展條例"}, "answer": "A", "explanation": "我國實施碳費徵收、成立費率審議會並建立溫室氣體管理基金等制度，最上位之核心法律與法源依據為總統於 112 年 2 月 15 日公布施行的《氣候變遷因應法》（第 28 條），【一、氣候變遷與溫室氣體管理(下冊)講義 P.48】"}, {"id": 81, "stem": "依據我國《氣候變遷因應法》及配套辦法之規範，由政府所徵收之碳費（納入溫室氣體管理基金），其最合規之實務「專款專用」用途「不包含」下列哪一項非特定目的之用途？", "options": {"A": "輔導與補助中小企業進行能資源節約、減碳措施及開發低碳技術", "B": "補助與撥配予各級地方政府執行溫室氣體減量工作及氣候變遷調適計畫", "C": "撥充為政府之一般性財政預算收入，用以支應一般性公務與基建行政開支", "D": "辦理溫室氣體減量、氣候變遷調適之教育宣導、公正轉型與專業人才培育"}, "answer": "C", "explanation": "依據氣候法與《溫室氣體管理基金收支保管及運用辦法》，碳費收入必須全數納入溫室氣體管理基金並「專款專用」，用於補助地方政府、投資低碳研發、公正轉型與調適、輔導中小企業等。「增列中央一般財政預算收入」非屬其法定使用與專款範圍，【一、氣候變遷與溫室氣體管理(下冊)講義 P.48】"}, {"id": 82, "stem": "為了強化溫室氣體管理基金之社會公信力，政府在規劃我國碳費制度時，明文訂定應落實「碳費收支透明」機制。依據氣候法與財務管理精神，此項「收支透明」在行政與公開資訊上的核心要求為何？", "options": {"A": "定期且確實「公開支出用途與實質減量效益」，專款專用並接受社會及國會之監督", "B": "由臺灣碳權交易所統一核配與發放免審查之免費自願性碳信用額度", "C": "限制碳費收入一律撥入一般公務歲入，其具體之收支使用科目依法列為國家機密", "D": "交由各別收費大廠自主在其官方網站上進行質性宣示，免予接受政府年度查核"}, "answer": "A", "explanation": "溫室氣體基金之徵收與管理講求公開與公信。為了貫徹「碳費收支透明」制度之落實，法規與行政監管的核心要求，即在於必須完整並定期「公開支出用途」，供全社會檢視其溫室氣體基金之實質減量效益，【一、氣候變遷與溫室氣體管理(下冊)講義 P.48】"}, {"id": 83, "stem": "某晶圓代工廠年溫室氣體排放量為 5 萬公噸，該廠「非屬」高碳洩漏風險產業。依據我國碳費徵收公式：收費排放量 = (年排放量 - K值) * 排放量調整係數值。請問，針對此類「非屬高碳洩漏風險」之一般管制對象，其法定之 K 值與排放量調整係數值，依序應分別設定為多少？", "options": {"A": "起徵扣除門檻 K 值為 2.5 萬公噸；調整係數值 = 1 (代表不打折)", "B": "起徵扣除門檻 K 值為 0 萬公噸；調整係數值 = 1 (代表不打折)", "C": "起徵扣除門檻 K 值為 2.5 萬公噸；調整係數值 = 0.2 (代表打二折)", "D": "起徵扣除門檻 K 值為 5.0 萬公噸；調整係數值 = 0.4 (代表打四折)"}, "answer": "A", "explanation": "依據我國碳費起徵與計算之配套規定，其起徵免徵門檻 K 值為「2.5 萬公噸」（即扣除 2.5 萬噸之排放量）；由於屬於「非高碳洩漏風險之事業」，其排放量調整係數值無須進行折扣折減，因此調整係數值等於「1」，【一、氣候變遷與溫室氣體管理(下冊)講義 P.48】"}, {"id": 84, "stem": "某石化廠正著手規劃年度碳盤查與自主減量計畫申報作業。我國針對特定高排放源開徵碳費，並授權訂定自主減量計畫優惠費率等管理辦法（俗稱碳費三子法）。請問，此套碳費徵收機制與子法之最上位法定「授權母法（依據）」為何？", "options": {"A": "國家再生能源發展條例", "B": "氣候變遷因應法", "C": "國家空氣污染防制法", "D": "中華民國環境基本法"}, "answer": "B", "explanation": "我國「碳費」徵收制度、收費對象、以及搭配之自主減量計畫優惠費率等管理細則（碳費三子法），其最上位、最核心之直接法源授權依據一律為**《氣候變遷因應法》（簡稱氣候法）**第 28 條及第 29 條，【一、氣候變遷與溫室氣體管理(下冊)講義 P.48】"}, {"id": 85, "stem": "某不鏽鋼精加工廠年溫室氣體排放量經查證核實為 40,000 公噸 CO2e，該廠經主管機關判定「非屬」高碳洩漏風險產業，惟達到碳費徵收門檻。已知我國設定之免徵起徵扣除額（K 值）為 25,000 公噸，且一般基本費率採每公噸新台幣 300 元計算。請問在不申請自主減量計畫優惠費率之前提下，該廠該年度應繳納之實際碳費總額為多少新台幣元？", "options": {"A": "新台幣 450 萬元", "B": "新台幣 300 萬元", "C": "新台幣 1,200 萬元", "D": "新台幣 1,500 萬元"}, "answer": "A", "explanation": "依據我國碳費起徵起算公式：應繳碳費 = (年排放量 - K 值) * 調整係數 * 一般費率。本題中，年排放量為 40,000 噸，K 值為固定之 25,000 噸。因為該廠「非屬高碳洩漏風險產業」，其排放量調整係數值為 1（不打折）。費率為 300 元/噸。代入公式計算：(40,000 - 25,000) * 1 * 300 = 15,000 * 300 = 新台幣 4,500,000 元（即 450 萬元），【一、氣候變遷與溫室氣體管理(下冊)講義 P.48】"}, {"id": 86, "stem": "依據我國碳費徵收公式規劃，非高碳洩漏風險產業在計算應繳納碳費之「收費排放量」時，在公式中設計了扣除起徵點門檻的「K 值」（即扣除 2.5 萬公噸之免徵排放額度）。請問，此項「K 值」在政策制度設計上，其最主要的管理與緩衝目的為何？", "options": {"A": "用作設定與限制國內碳權交易所上架額度之每日最高交易價格大於定值", "B": "依據企業之實際營收與虧損狀況，動態調整其應繳納之每噸碳費基本費率", "C": "避免台灣鋼鐵與水泥等外銷導向之高碳洩漏產業，在國際市場面臨雙重課稅", "D": "排除與扣除部分基礎起徵排放量，以集中行政管制資源於高耗能熱點，並減輕受管事業之初期合規與財務衝擊"}, "answer": "D", "explanation": "K 值的起徵免徵點設計（2.5 萬噸）是我國碳費制度的特色。其政策與管理目的，在於**「排除部分與起徵規模重疊之基礎排放額度」**，促使有限的行政監管資源能集中於高碳排熱點，同時作為經濟緩衝，避免對製造業大廠造成過度劇烈的初期合規與財務衝擊，【一、氣候變遷與溫室氣體管理(下冊)講義 P.48】"}, {"id": 87, "stem": "為貫徹排碳有價之治理精神，我國依法對列管對象開徵碳費。依據氣候法規定，政府所徵收之碳費在財政上應實施「專款專用」，其收費所得應全額撥入哪一個法定的政府基金，以專供國家減碳與氣候變遷調適工作之推行？", "options": {"A": "溫室氣體管理基金", "B": "空氣污染防制基金", "C": "永續經濟轉型特別公積", "D": "中央一般財政預算國庫"}, "answer": "A", "explanation": "依據我國《氣候變遷因應法》第 32 條規定，政府徵收之碳費應納入專款專用的「溫室氣體管理基金」，用於氣候調適、補助自主減量、科技研發等專門目的。（本題標準答案為 A），【一、氣候變遷與溫室氣體管理(下冊)講義 P.48】"}, {"id": 88, "stem": "某造紙廠在評估是否需繳納我國開徵之碳費。依據我國現行碳費徵收機制與《碳費收費辦法》之適用規劃，其核心課徵對象主要鎖定下列何者？", "options": {"A": "資本額在新台幣 100 億元以上之全體上市及上櫃公司", "B": "全國所有營造業、住商部門及一般大眾交通運輸之終端用電單位", "C": "積極推動新植造林與加強森林經營之林業增匯主體", "D": "年直接與電力間接溫室氣體排放量合計達到法定起徵門檻之特定排放源"}, "answer": "D", "explanation": "我國碳費徵收採取「先大後小，分階段徵收」原則。現階段主要收費對象為電力業、特定製程之製造業，且其直接與電力間接溫室氣體年排放量達到 2.5 萬公噸 CO2e 門檻之排放源（亦即達法定起徵門檻之排放源），收費對象並不包含一般住商與交通運輸，【一、氣候變遷與溫室氣體管理(下冊)講義 P.49】"}, {"id": 89, "stem": "某水泥大廠提報之自主減量計畫已獲核准，且該大廠被認定屬於我國「高碳洩漏風險產業別」。依據我國《碳費收費辦法》規定，該大廠在第一期（第一階段過渡期）所得適用折減收費排放量之「排放量調整係數（值）」設定為多少？", "options": {"A": "0", "B": "0.2", "C": "0.4", "D": "0.6"}, "answer": "B", "explanation": "為避免碳洩漏、兼顧本國特定高碳密集且貿易密集行業之產業競爭力，環境部公告之《碳費收費辦法》明定：若收費對象經核定屬高碳洩漏風險行業，其提出自主減量計畫並經核准後，第一期之排放量調整係數值定為「0.2」，【一、氣候變遷與溫室氣體管理(下冊)講義 P.49】"}, {"id": 90, "stem": "某水泥大廠已提報自主減量計畫並獲審查核定通過，該廠被環境部認定屬於高碳洩漏風險產業別，得以適用排放量調整係數值。依據我國《碳費收費辦法》之規範，該高碳洩漏風險產業在「第二期（階段）」所適用之排放量調整係數值設定為多少？", "options": {"A": "0.2", "B": "1.0 (代表不予折減)", "C": "0.4", "D": "0.6"}, "answer": "C", "explanation": "依據我國《碳費收費辦法》規定，經核定符合高碳洩漏風險資格之事業，其提出之自主減量計畫經環境部審查核准後，方可適用「排放量調整係數值（K 值）」進行碳費折減。其第一期係數定為 0.2，第二期係數定為 0.4，第三期係數定為 0.6，【一、氣候變遷與溫室氣體管理(下冊)講義 P.49】"}, {"id": 91, "stem": "某鋼鐵廠年溫室氣體排放量經查證核實為 10 萬公噸 CO2e，且該廠經環境部核准屬於高碳洩漏風險產業別。若該廠成功提報「自主減量計畫」並承諾達成 SBTi 之指定削減率（適用優惠費率 A，費率為每公噸新台幣 50 元）。已知其第一期適用之排放量調整係數值為 0.2。請問依據我國碳費徵收公式，該鋼鐵廠該年度應繳納之碳費總額為新台幣多少元？", "options": {"A": "新台幣 200 萬元", "B": "新台幣 100 萬元", "C": "新台幣 750 萬元", "D": "新台幣 600 萬元"}, "answer": "B", "explanation": "依據高碳洩漏風險之碳費計算公式：應繳碳費 = 排放量 * 排放量調整係數 * 適用費率。本題中，排放量為 100,000 公噸，調整係數值為 0.2，優惠費率 A 為 50 元/公噸。代入公式：100,000 * 0.2 * 50 = 1,000,000 元（即新台幣 100 萬元）。（本題標準答案為 B），【一、氣候變遷與溫室氣體管理(下冊)講義 P.49】"}, {"id": 92, "stem": "某水泥製造業大廠擬向環境部申請核定自主減量計畫以適用優惠費率。關於我國碳費徵收對象之溫室氣體減量指定目標規範與其判斷邏輯，下列哪一項敘述最符合實務與法規之規劃？", "options": {"A": "列管大廠不論其製程如何，一律強制規定必須將「氟化氣體之100%去除」設定為唯一削減目標", "B": "事業應根據其廠區之「實質排放型式（如固定燃燒或製程排放）」，將相對應減量措施彈性納入其自主減量計畫中執行", "C": "管制法規強制所有水泥業大廠一律僅能使用「生物質碳匯抵減」來限制全部熟料生產程序之碳費", "D": "列管企業在撰寫自主減量計畫時，得全數以同業平均之二級預設數據取代其實際一級排放流"}, "answer": "B", "explanation": "依據我國《自主減量計畫管理辦法》之規定，事業在申請優惠費率與設定指定目標時，應本於實務需求原則，依據其「實際排放型式（如固定燃燒燃料轉換、製程優化能效提升等）」，彈性選擇、搭配並落實合適之自主減量措施。（本題標準答案為 B），【一、氣候變遷與溫室氣體管理(下冊)講義 P.49】"}, {"id": 93, "stem": "某科技大廠透過自願減量專案取得了環境部核發之溫室氣體減量額度（碳權），規劃進行交易。依據我國《溫室氣體減量額度交易拍賣及移轉管理辦法》，我國之國內減量額度交易平台係由哪一個單位負責設立與管理？", "options": {"A": "經濟部產業發展署綠色貿易網", "B": "財團法人全國認證基金會 (TAF)", "C": "金融監督管理委員會證券期貨局", "D": "環境部與臺灣碳權交易所"}, "answer": "D", "explanation": "依據我國《自願減量專案額度交易拍賣及移轉管理辦法》，為保障市場交易安全、防範詐騙與炒作，環境部唯一委託「臺灣碳權交易所（TCX）」設置國內額度交易平台，辦理定價交易、協議交易與拍賣業務。【一、氣候變遷與溫室氣體管理(下冊)講義 P.62；三、溫室氣體自願減量作業與減量額度講義 P.6】"}, {"id": 94, "stem": "臺灣碳權交易所已正式開設國際碳權交易專區，提供企業採購境外額度。依據我國主管機關之規定，當企業在臺灣碳權交易所平台上，針對國外自願減量額度進行線上採購與交易時，其交易平台所強制規定統一使用之計價貨幣為何？", "options": {"A": "新台幣 (TWD)", "B": "歐元 (EUR)", "C": "美元 (USD)", "D": "澳幣 (AUD)"}, "answer": "C", "explanation": "依據我國碳權交易平台之金融與外匯管理規範，臺灣碳權交易所在提供「國外自願減量額度（國際碳權）」交易與移轉時，統一以「美元（USD）」為平台之唯一報價與結算計價貨幣。【一、氣候變遷與溫室氣體管理(下冊)講義 P.62】"}, {"id": 95, "stem": "臺灣碳權交易所已正式開設國際碳權交易專區，以協助國內有自願碳抵銷需求之企業辦理採購與移轉。請問，目前交易所平台上架提供國內企業採購之境外額度，在性質上主要屬於下列哪一類別之碳權？", "options": {"A": "經主管機關或國際公信標準核發、可用於自願性抵銷與中和之**「自願性減量額度（碳信用）」**", "B": "歐盟總量管制機制（EU ETS）下所發行、具強制履約法律效力之歐盟排放配額 (EUA)", "C": "聯合國氣候公約締約國間直接進行巴黎協定第六條國際合作所產生的 ITMOs 額度", "D": "國內環境部已依法公告廢止與註銷之早期溫室氣體先期專案額度"}, "answer": "A", "explanation": "臺灣碳權交易所（TCX）配合國家雙軌碳定價政策（強制性碳費與自願性減量）。在其國際碳權交易專區中，上架之境外額度主要是源自國際具公信力黃金標準（GS）或 Verra 等機構、經我國環境部認可適用之**「自願性減量額度（Voluntary Carbon Credits）」**，以利企業執行自願性碳抵銷與中和，【一、氣候變遷與溫室氣體管理(下冊)講義 P.62】"}, {"id": 96, "stem": "我國環境部為防範國內自願減量額度（碳權）被投機炒作，維護碳市場秩序。依據最新之交易、拍賣及移轉管理辦法，減量額度在平台成交並辦理移轉登記時，其轉讓次數有何法理限制？", "options": {"A": "可在不同的企業與子公司之間無限次數地自由轉售與套利交易", "B": "使用年限一律限制為一年，且在系統移轉後自動強制予以註銷歸零", "C": "僅能無償移轉給境外之自願性碳信用機構以執行巴黎協定第六條抵換", "D": "額度之移轉以一次為限（買方購入後即不可再度於平台轉售，僅得用於抵扣碳費或執行自願中和）"}, "answer": "D", "explanation": "我國自願減量信用額度之移轉極為嚴格，為實質鼓勵實體減碳而非金融金融炒作。依據管理辦法，當減量額度經由臺灣碳權交易所進行交易、拍賣並移轉至買方帳戶後，「其額度移轉以一次為限」，即買方購入後不可再次轉售，只能用於抵扣碳費或執行自身碳中和宣告，【一、氣候變遷與溫室氣體管理(下冊)講義 P.62】"}, {"id": 97, "stem": "某永續工程師在研析我國「2050 淨零排放路徑及策略」時，探討國家兩大治理基礎中的「科技研發」前瞻佈局。依據官方策略規劃，下列何者屬於科技研發領域所主導之核心關鍵去碳作法？", "options": {"A": "規劃建立高碳洩漏風險產業之跨國避稅及碳稅折減之宏觀財務評估模型", "B": "二氧化碳固定純度與製程化學轉換效率之 100% 精準熱值計算", "C": "發展自然碳匯（負排放技術）與碳捕捉利用及封存（CCUS）等前瞻技術研發", "D": "限制所有大專校院之環境工程與化學系所進行任何基礎能資源探勘"}, "answer": "C", "explanation": "我國 2050 淨零轉型兩大治理基礎之一的「科技研發」，其關鍵的前瞻佈局與淨零科技發展作法，即著重於前瞻能源、綠電電力系統與儲能、節能、資源循環，以及「自然碳匯（負排放技術）」與「碳捕捉利用及封存（CCUS）」等關鍵關鍵去碳領域，【一、氣候變遷與溫室氣體管理(下冊)講義 P.9】"}, {"id": 98, "stem": "淨零排放與去碳轉型是一項跨領域、跨部門之巨型社會工程。依據我國政策綱領與治理實務，推動我國氣候治理及達成 2050 淨零排放目標之最上位「成功關鍵要素」應包含哪些層面？", "options": {"A": "建立國家級之「系統性規劃」路徑、落實各部會之「跨部門合作」、並引導「全民與全社會之共同參與」", "B": "優先推行高強度之國際碳稅，並對不配合的中小型非納管事業課予高額特別關稅", "C": "強制要求所有製造業一律必須在工廠屋頂架設等當量之太陽能光電自發自用系統", "D": "限制所有高耗能產業之年度總用電量，以此達成被動式之碳中和宣告"}, "answer": "A", "explanation": "淨零與氣候治理是跨產業、跨部會與全社會的系統性轉型工程。其成功之最上位技術與管理關鍵，在於建立「系統性規劃」路徑、落實部會與供應鏈之「跨部門合作」，並全面擴大引導「全民參與（生活與社會轉型）」，【一、氣候變遷與溫室氣體管理(下冊)講義 P.9】"}, {"id": 99, "stem": "某石化大廠在研析如何使廠內高能耗製程實質去碳。集團規劃引進一套前瞻減碳技術，其運作流程「旨在從大型固定排放源（如發電廠、石化窯爐）中，將燃燒或製程產生的二氧化碳氣體進行實體分離與捕捉，經高壓液化、管道或船運配送後，直接投入工業原料合成、或高壓注入地底適當之深層地質構造（如深部鹹水層）中以達到永久隔離」。請問，此類去碳技術在國際上統稱為何？", "options": {"A": "巴黎協定第 6.2 條國際轉移減量成效 (ITMOs)", "B": "產品生命週期衝擊評估與分類系統 (LCIA)", "C": "碳捕捉、利用與封存 (Carbon Capture, Utilization and Storage, CCUS)", "D": "歐盟碳邊境調整機制與憑證憑證結算 (CBAM)"}, "answer": "C", "explanation": "「碳捕捉、利用與封存（CCUS）」是全球邁向淨零排放的重要負碳與去碳技術。該技術範疇涵蓋二氧化碳之分離與「捕捉（Capture）」、高壓壓縮與「運輸（Transport）」、工業加值「利用（Utilization）」、以及地質結構「封存（Storage）」，【一、氣候變遷與溫室氣體管理(下冊)講義 P.9】"}, {"id": 100, "stem": "我國《氣候變遷因應法》明文定義與確立了氣候政策的公平性。當政府在推動淨零碳排、引導高能耗產業重構或實施高額碳費時，必須考量部分傳統重工業、煤炭或特定地區勞工所面臨之失業、燃料通膨等衝擊。依據法規，「在尊重人權及尊嚴勞動之原則下，向所有受影響之社群進行諮商，並協助受衝擊之產業、地方、勞工、消費者及原住民族落實穩定、和諧與包容性之轉型」。請問此一兼顧社會正義之核心概念稱為何者？", "options": {"A": "公正轉型 (Just Transition)", "B": "自願減量 (Voluntary Reduction)", "C": "雙重重大性 (Double Materiality)", "D": "自然碳匯 (Carbon Sinks)"}, "answer": "A", "explanation": "依據我國《氣候變遷因應法》第 3 條之法理定義，「公正轉型（Just Transition）」 旨在確保在向低碳經濟過渡的過程中，落實穩定、和諧與包容性之轉型，維護受轉型衝擊之勞工、弱勢族群、原住民族與地方社區之權益與社會正義，【一、氣候變遷與溫室氣體管理(下冊)講義 P.9】"}, {"id": 101, "stem": "我國政府推動「2050 淨零轉型」是一項全方位的社會與經濟重構工程。依據「臺灣 2050 淨零排放路徑及策略總說明」，政府所制定的四大轉型策略中，下列哪一項「不屬於」這四大策略的範疇？", "options": {"A": "社會轉型", "B": "產業轉型", "C": "生態轉型", "D": "生活轉型"}, "answer": "C", "explanation": "我國「臺灣 2050 淨零排放路徑及策略」總體推動架構中，確立之四大轉型策略明確為「能源轉型、產業轉型、生活轉型及社會轉型」，並非包含「生態轉型」。（本題標準答案為 C），【一、氣候變遷與溫室氣體管理(下冊)講義 P.9】"}, {"id": 102, "stem": "某生態顧問在為一家金融集團舉辦「自然碳匯與負排放技術」之綠領內部培訓，並說明如何利用自然界的力量來達成淨零排放。在溫室氣體與生態學術語中，「碳匯（Carbon Sink）」是指能夠將二氧化碳等溫室氣體自大氣中持續移除、吸收、固定或安全儲存之自然生態系統或物理介質。依此定義，下列哪一個選項「不屬於」碳匯或吸收二氧化碳的匯（反而屬於碳排放源）？", "options": {"A": "發生於乾旱季節、大範圍燃燒陸域林木並釋放大量溫室氣體之「森林野火（Wildfires）」", "B": "透過光合作用實質吸收大氣中二氧化碳並將其固定於木質部中之「陸域森林生態系統（Green Carbon）」", "C": "藉由植物殘體分解與根系分泌，長期將碳元素儲存於有機質中之「土壤與泥炭地系統（Yellow Carbon）」", "D": "利用海草床、鹽沼、紅樹林或海洋物理與化學作用溶解並儲存大氣碳源之「海洋生態系統（Blue Carbon）」"}, "answer": "A", "explanation": "森林（綠碳）、海洋與濕地（藍碳）、土壤與農地（黃碳）均為地球上最核心的自然碳匯（Carbon Sink），能實質儲存並減少大氣中溫室氣體濃度。而野火（Wildfire）本質上是林木劇烈燃燒並將儲存之碳元素轉化為大量二氧化碳直接釋放至大氣之「碳排放源」，不屬於碳匯。【一、氣候變遷與溫室氣體管理(下冊)講義P.10 / 附錄、名詞定義】"}, {"id": 103, "stem": "關於自然碳匯的分類，儲存於農地、泥炭地、土地及一般土壤等生態系統中的碳匯，在國際與我國綠領專業實務上，通常以哪一種顏色的碳匯來稱呼？", "options": {"A": "黃碳 (Yellow Carbon)", "B": "藍碳 (Blue Carbon)", "C": "綠碳 (Green Carbon)", "D": "紅碳 (Red Carbon)"}, "answer": "A", "explanation": "自然碳匯可依生態系統類型劃分：「綠碳」指森林等陸域植編碳匯；「藍碳」指海洋與濕地之藍色碳匯；而「黃碳」則專指儲存於農地、泥炭地及一般土壤中之土壤碳匯。【一、氣候變遷與溫室氣體管理(下冊)講義P.10】"}, {"id": 104, "stem": "為了積極回應聯合國對加強國家自主減量之呼籲，我國提出的「國家自主減量目標（NDC）」草案中，規劃於西元 2030 年的溫室氣體減量目標應達到相較於基準年（西元 2005 年）減少多少百分比？", "options": {"A": "20 ± 1%", "B": "24 ± 1%", "C": "28 ± 2%", "D": "35 ± 2%"}, "answer": "C", "explanation": "臺灣第三期溫室氣體階段管制目標（NDC 3.0）中，已將 2030 年國家減量新目標調整為較基準年（2005 年）減少 28±2%。【一、氣候變遷與溫室氣體管理(下冊)講義P.11】"}, {"id": 105, "stem": "我國於西元 2023 年公布施行《氣候變遷因應法》，其中最核心的修法重點之一，便是正式將國家長期溫室氣體減量目標明定為下列何者，以加快臺灣國家減碳與淨零轉型步調？", "options": {"A": "西元 2030 年達成溫室氣體減量 50%", "B": "西元 2050 年達成溫室氣體淨零排放", "C": "西元 2050 年達成相較基準年（2005年）減量 50%", "D": "西元 2030 年達成相較基準年（2005年）減量 24±1%"}, "answer": "B", "explanation": "《氣候變遷因應法》明文將我國溫室氣體長期減量目標正式修訂為「西元 2050 年達成溫室氣體淨零排放」，推進國家氣候治理 。【一、氣候變遷與溫室氣體管理(下冊)講義P.20】"}, {"id": 106, "stem": "依據我國《氣候變遷因應法》對相關專有名詞之法定定義，下列敘述何者有誤？", "options": {"A": "溫室氣體減量：指減少人類活動衍生之溫室氣體排放，或增加溫室氣體之吸收、儲存", "B": "淨零排放：指溫室氣體排放量與碳匯移除量達成平衡，使淨排放量為零", "C": "碳匯：指將二氧化碳或其他溫室氣體自排放源或大氣中持續移除後，吸收或儲存之樹木、森林、海洋、土壤等", "D": "氣候變遷調適：指人類與自然系統為回應實際或預期之氣候變遷衝擊，而進行調整之適應過程"}, "answer": "B", "explanation": "依據氣候法之名詞定義，「淨零排放」係指溫室氣體排放量與碳匯「移除量」達成平衡，使「淨排放量」為零。原坊間考題選項將淨零排放誤導為「排放量完全為零，不產生任何二氧化碳」，本題重新改寫選項以釐清此觀念。【一、氣候變遷與溫室氣體管理(下冊)講義P.20】"}, {"id": 107, "stem": "依據我國《氣候變遷因應法》所建置之國家氣候治理架構，各中央目的事業主管機關應依權責共同推動溫室氣體減量。下列關於中央政府機關與其主辦之氣候因應業務配對，何者有誤？", "options": {"A": "公正轉型及總體國家淨零政策規劃：國家發展委員會", "B": "自然碳匯管理與農業部門減碳推動：農業部", "C": "大眾運輸系統低碳發展與軌道建設：交通部", "D": "國家碳費徵收制度之規劃、法規建置與徵收：財政部"}, "answer": "D", "explanation": "依據我國《氣候變遷因應法》之中央氣候治理分工，我國的「碳費徵收制度」之主管機關與執行單位為「環境部」，而非由「財政部」作為一般國家稅收進行徵收。【一、氣候變遷與溫室氣體管理(下冊)講義P.25】"}, {"id": 108, "stem": "為加速接軌國際自定貢獻（NDC）並擴大國家減碳力道，我國最新公告之 2030 年國家溫室氣體階段管制目標，規劃應達到下列哪一項削減比例（相較於基準年 2005 年）？", "options": {"A": "減少 20 ± 1%", "B": "減少 24 ± 1%", "C": "減少 28 ± 2%", "D": "減少 38 ± 2%"}, "answer": "C", "explanation": "依據我國溫室氣體階段管制目標及最新 NDC 規劃，我國 2030 年國家溫室氣體減量目標已提升至較基準年（2005 年）減少 28±2%；而 2035 年目標則為減少 38±2%。【一、氣候變遷與溫室氣體管理(下冊)講義P.26】"}, {"id": 109, "stem": "為了積極落實我國最新提升之 2030 年減碳自主目標（較基準年 2005 年減少 28 ± 2%），政府各部門共同推動低碳發電轉型。請問在各部門協同減碳規劃下，此目標所對應之 2030 年全國公用電網「電力排碳係數」之政府官方階段管制目標值應降為多少公斤 CO2e／度？", "options": {"A": "0.490 公斤 CO2e／度", "B": "0.379 公斤 CO2e／度", "C": "0.319 公斤 CO2e／度", "D": "0.234 公斤 CO2e／度"}, "answer": "C", "explanation": "依據我國中長期淨零策略與 NDC 階段目標，為了達成 2030 年減量 28±2% 之承諾，政府規劃於 2030 年將公用電網之電力排碳係數階段性控制降至 0.319 公斤 CO2e／度 的目標。【一、氣候變遷與溫室氣體管理(下冊)講義P.26】"}, {"id": 110, "stem": "依據《氣候變遷因應法》與國際《京都議定書》之規範，下列哪一種氣體「不屬於」法定應執行強制盤查與登錄管理之七大溫室氣體？", "options": {"A": "三氟化氮 (NF3)", "B": "氨氣 (NH3)", "C": "氧化亞氮 (N2O)", "D": "六氟化硫 (SF6)"}, "answer": "B", "explanation": "法定應執行盤查之七大溫室氣體包含：二氧化碳（CO2）、甲烷（CH4）、氧化亞氮（N2O）、氫氟碳化物（HFCs）、全氟碳化物（PFCs）、六氟化硫（SF6）以及三氟化氮（NF3）。氨氣（NH3）屬於一般空氣污染物，並非溫室氣體管理法規列管之範疇。【一、氣候變遷與溫室氣體管理(下冊)講義P.3】"}, {"id": 111, "stem": "依據《氣候變遷與溫室氣體管理》講義，在聯合國 IPCC 第五次評估報告（AR5）與第六次評估報告（AR6）之溫室氣體對比中，下列哪一種主要溫室氣體的「100年溫暖化潛勢（GWP）數值」在 AR6 中呈現「下降（變小）」？", "options": {"A": "氧化亞氮 (N2O)", "B": "三氟化氮 (NF3)", "C": "二氧化碳 (CO2)", "D": "甲烷 (CH4)"}, "answer": "D", "explanation": "依據講義表 1.1（主要溫室氣體之溫暖化潛勢對照），甲烷（CH4）之 GWP 數值在 AR5 中為 28，於 AR6 中微幅調整下降至 27.9。氧化亞氮（N2O）從 265 升至 273，三氟化氮（NF3）從 16,100 升至 17,400，二氧化碳（CO2）在各版本中皆固定為 1。【一、氣候變遷與溫室氣體管理(下冊)講義P.3】"}, {"id": 112, "stem": "我國環境部公告列管之應盤查登錄溫室氣體排放量之排放源，其要求企業進行定期盤查、登錄及查驗作業的最高法源依據為何？", "options": {"A": "氣候變遷因應法", "B": "溫室氣體減量及管理法", "C": "能源管理法", "D": "環境保護基本法"}, "answer": "A", "explanation": "我國強制列管之溫室氣體排放源辦理盤查、登錄及查驗，其最高法源基礎為 2023 年修正公布施行的《氣候變遷因應法》（第 21 條明定特定排放源應辦理溫室氣體盤查、登錄與查驗）。【一、氣候變遷與溫室氣體管理(下冊)講義P.42】"}, {"id": 113, "stem": "某鋼鐵廠透過採行負排放技術，順利取得環境部核發之「自願減量專案減量額度」。依據我國《氣候變遷因應法》之互補設計，此項國內自願減量額度（碳權）在政府碳管理制度中最具法律約束力之主要用途為何？", "options": {"A": "依法作為抵繳或扣減本國碳費收費排放量之抵換來源", "B": "作為免除該廠參與金管會永續報告書揭露義務之法定證明文件", "C": "供廠家直接向經濟部抵銷其身為「用電大戶」應建置之再生能源比例", "D": "提供作為向主管機關申請免除全廠安全與消防檢查之抵減憑證"}, "answer": "A", "explanation": "依據《氣候變遷因應法》之規定，我國實施碳費徵收之配套與自願減量交易屬互補設計。事業透過執行自願減量專案所取得之「減量額度（碳權）」，最核心的實務法定用途之一即為可用於「抵繳或扣抵台灣本國應繳納之碳費」（抵繳上限一般為收費排放量之 10%）。【一、氣候變遷與溫室氣體管理(下冊)講義P.48, P.50 / 三、溫室氣體自願減量作業與減量額度講義P.2】"}, {"id": 114, "stem": "我國規劃並推動碳費徵收制度。當收費對象在計算應繳交之碳費總量時，依據現行溫室氣體盤查與申報管理辦法，下列哪一項溫室氣體排放範疇「不包含」在碳費的強制徵收與計算範圍之內？", "options": {"A": "全廠區內燃燒天然氣或重油等化石燃料之「直接固定燃燒排放」", "B": "製造製程中因化學反應或物理反應直接產生之「製程排放」", "C": "廠區內備用緊急柴油發電機所產生的「直接固定燃燒排放」", "D": "企業價值鏈上下遊產生的「其他間接排放」（如員工日常通勤、商務差旅及物流外包等範疇三排放）"}, "answer": "D", "explanation": "依據我國碳費徵收相關法規，目前碳費徵收的計算範疇僅涵蓋事業的「直接排放（範疇一，包含燃料燃燒與製程排放）」以及「使用外購電力的能源間接排放（範疇二）」。員工通勤、差旅、物流外包等屬於範疇三（其他間接排放），目前並未納入碳費徵收的強制計算基準中。【一、氣候變遷與溫室氣體管理(下冊)講義P.48】"}, {"id": 115, "stem": "我國《氣候變遷因應法》奠定了國家碳定價之政策基礎。依據法規規劃與公告，我國自西元 2025 年（民國 114 年）起正式開徵下列哪一項直接碳定價工具，並將該年度之溫室氣體排放量正式納入計費基準？", "options": {"A": "碳關稅（Carbon Tariff）", "B": "碳環境稅（Carbon Tax）", "C": "能源稅（Energy Tax）", "D": "碳費（Carbon Fee）"}, "answer": "D", "explanation": "我國係以《氣候變遷因應法》為授權母法，規劃推動「碳費（Carbon Fee）」徵收制度。依據現行法規進程，我國自西元 2025 年（民國 114 年）起正式開徵碳費，將該年之溫室氣體排放量正式納入計費基準，以落實污染者付費原則。【一、氣候變遷與溫室氣體管理(下冊)講義P.48】"}, {"id": 116, "stem": "在我國邁向淨零排放的政策路徑中，導入碳定價制度（如碳費徵收與自願減量額度機制）具有特定的政策定位。下列關於碳定價在我國產業轉型中所扮演之角色，何者敘述最正確？", "options": {"A": "僅為向高能耗產業課徵高額罰鍰之行政裁罰手段", "B": "作為驅動產業進行能資源節約、製程改善與低碳技術轉型之關鍵機制", "C": "主要用於撥充國家一般性國庫歲入以平衡一般性預算赤字", "D": "作為撥付給化石燃料進口商進行價格補貼之專款專用來源"}, "answer": "B", "explanation": "碳定價並非一般的行政裁罰，亦非一般的財政收入工具。其核心定位係透過「排碳有價」之市場機制，將溫室氣體排放之外部成本內部化，以實質驅動國內產業與排放源進行低碳與淨零技術之綠色轉型。【一、氣候變遷與溫室氣體管理(下冊)講義P.48】"}, {"id": 117, "stem": "我國推動碳費徵收機制，首波針對直接排放與電力間接排放合計年排放量達 2.5 萬公噸 CO2e 以上之「排碳大戶」進行徵收。依據環境部統計，此類列管收費對象之總排放量合計約占我國全年度溫室氣體總排放量之多少比例？", "options": {"A": "約占 34%", "B": "約占 54%（約 5 成）", "C": "約占 74%", "D": "約占 94%"}, "answer": "B", "explanation": "依據環境部公告，首波碳費收費對象（約計 281 家公司、500 家廠房）申報之溫室氣體年總排放量約為 145 百萬公噸 CO2e，約占我國全國溫室氣體總排放量之 54%（約 5 成）。其餘大眾運輸、住商部門與營建業等則非初期徵收對象，以平穩民生物價。【一、氣候變遷與溫室氣體管理(下冊)講義P.48】"}, {"id": 118, "stem": "依據環境部發布之《碳費收費辦法》，初期碳費之收費對象，係指經公告應盤查登錄及查驗溫室氣體排放量，且其全廠（場）之直接排放量與電力間接排放量合計達多少門檻以上之事業單位？", "options": {"A": "2.5 萬公噸 CO2e", "B": "1 萬公噸 CO2e", "C": "5 萬公噸 CO2e", "D": "10 萬公噸 CO2e"}, "answer": "A", "explanation": "依據收費辦法規定，初期碳費之徵收與課稅門檻，鎖定為全廠（場）直接排放量與電力間接排放量合計年排放量達 2.5 萬公噸 CO2e 以上之電力業及製造業。【一、氣候變遷與溫室氣體管理(下冊)講義P.49】"}, {"id": 119, "stem": "依據環境部發布之《碳費收費辦法》，我國碳費徵收初期（首期開徵時）之首批強制申報並繳納碳費之收費對象，主要鎖定下列哪一類高排放單位？", "options": {"A": "全國所有年排放量達 1 萬公噸 CO2e 以上之一般商業、零售與住宅部門", "B": "國內所有進口鋼鐵、水泥、肥料與鋁製品之跨國貿易進口商", "C": "營業車輛合計達 200 輛以上、且年用油量超標之交通運輸業與大眾捷運部門", "D": "經公告應辦理盤查登錄，且其直接排放與電力間接排放合計年排放量達 2.5 萬公噸 CO2e 以上之電力業、燃氣供應業及特定製造業"}, "answer": "D", "explanation": "我國實施碳費徵收初期，收費對象以特定高排放源為主。法規明定首批收費對象為：經公告應辦理溫室氣體盤查登錄之排放源，且其直接排放與電力間接排放量合計達 2.5 萬公噸 CO2e 以上之電力業、燃氣供應業及特定製造業（俗稱排碳大戶），營建、住商與一般交通運輸部門初期未納入。【一、氣候變遷與溫室氣體管理(下冊)講義P.49】"}, {"id": 120, "stem": "依據現行《碳費收費辦法》規定，我國初期碳費之收費對象，係指經公告應辦理盤查登錄之事業，且其全廠（場）之直接排放量與電力間接排放量，合計達到下列哪一項法定門檻之排碳大戶？", "options": {"A": "達年排放量 2.5 萬公噸 CO2e（含）以上", "B": "達年用電量 1,000 萬度以上", "C": "達年外購電力二千萬度以上", "D": "達年營業額新台幣五億元以上"}, "answer": "A", "explanation": "碳費徵收初期主要針對高排放之發電及特定製造業。收費辦法第 6 條明定，收費對象為全廠之直接排放與電力間接排放合計**「年排放量達 2.5 萬公噸 CO2e 以上」**之事業。【一、氣候變遷與溫室氣體管理(下冊)講義P.49】"}, {"id": 121, "stem": "全球溫室效應所造成的氣候變遷對地球環境與人類社會帶來深遠衝擊。依據《氣候變遷概論》，下列哪一項環境現象「並非」由全球暖化直接引起的自然衝擊？", "options": {"A": "極地冰帽與高山冰川大幅融化", "B": "海平面上升導致沿海低窪地區面臨淹沒風險", "C": "極端天氣事件（如暴雨、乾旱、熱浪）發生頻率增加", "D": "人為過度抽取地下水所導致的陸地區域地層下陷"}, "answer": "D", "explanation": "全球暖化的直接影響包含極端天氣增加、生態系統改變、海平面上升及冰川融化等。然而，「地層下陷」主要是因為特定區域過度抽取地下水所導致的土壤與地質人為破壞，非屬全球暖化直接引發之自然變遷衝擊。【一、氣候變遷與溫室氣體管理(下冊)講義P.5】"}, {"id": 122, "stem": "依據我國《碳費收費辦法》之折抵規範，收費對象若欲使用國內自願減量專案（碳權）所取得之減量額度來扣抵其年度計費之排放量，其最高得折抵之比例上限，為該收費對象年度收費排放量之多少百分比？", "options": {"A": "5%", "B": "15%", "C": "20%", "D": "10%"}, "answer": "D", "explanation": "依據環境部發布之《碳費收費辦法》規定，為鼓勵事業實質推動廠內之自主減量工作，收費對象得申請使用國內自願減量專案所取得之減量額度進行碳費抵扣，惟其最高抵扣之比例上限，以收費排放量之 10% 為限。【一、氣候變遷與溫室氣體管理(下冊)講義P.50】"}, {"id": 123, "stem": "收費對象若擬採購經環境部認可之「國外減量額度」來折抵其應繳納之碳費，依據我國《碳費收費辦法》之規定，其最高扣抵比例上限與特定產業限制為何？", "options": {"A": "抵扣比例上限為 5%，且僅限於非高碳洩漏風險之行業別適用", "B": "抵扣比例上限為 10%，且不限行業別均得全面折抵", "C": "抵扣比例上限為 15%，且高碳洩漏風險行業得優先折抵", "D": "我國目前法規為防範碳洩漏，完全不允許任何國外減量額度用於折抵國內碳費"}, "answer": "A", "explanation": "依據《碳費收費辦法》之折抵規範，收費對象得使用經環境部認可之國外減量額度折抵收費排放量，其扣抵比例上限為 5%；但考量高碳洩漏風險行業已享有排放量調整係數值（K值或調整係數 0.2）等優惠，因此高碳洩漏風險行業不得使用國外減量額度折抵碳費，即國外折抵僅限非高碳洩漏風險之行業別適用。【一、氣候變遷與溫室氣體管理(下冊)講義P.50】"}, {"id": 124, "stem": "某半導體材料供應商並非環境部強制課徵碳費之排碳大戶，但其自發性申請並成功註冊了廠內綠電自發自用之自願減量專案。請問該公司未來經核發取得之「自願減量額度（碳權）」，在國內最具備實質法制效力的主要用途為何？", "options": {"A": "供我國碳費收費對象依法在申報時進行收費排放量之扣抵", "B": "直接提供予台電公司作為其履行再生能源義務之綠電轉供證明", "C": "作為向環保署申報降低其組織型範疇三其他間接排放量之唯一憑證", "D": "自動由金管會轉換為其上市櫃公司 ESG 評比之官方加分數據"}, "answer": "A", "explanation": "自願減量額度（國內碳權）在法制與實務上最核心的用途之一，是提供給受管制之碳費收費對象，依法於每年申報碳費時折抵其收費排放量（最高以 10% 為限）。【一、氣候變遷與溫室氣體管理(下冊)講義P.50】"}, {"id": 125, "stem": "某高耗能傳統石化廠預計於明年面臨國家首批碳費之徵收。為規避一般高昂之碳費成本，該廠財務主管評估購買國內自願減量專案取得之額度。請問該自願減量額度，依法可用於抵繳或扣減下列哪一項法定義務？", "options": {"A": "該廠依《氣候變遷因應法》應繳納之部分國家碳費", "B": "該廠外銷產品至歐洲市場所需繳納之歐盟 CBAM 憑證關稅", "C": "該廠依經濟部法規要求必須達成之用電大戶 10% 再生能源建置義務", "D": "該廠向美國地方政府申報之境外碳稅扣抵額度"}, "answer": "A", "explanation": "我國自願減量額度（碳權）依法僅能用於抵減我國依《氣候變遷因應法》所徵收之本國「碳費」，無法直接用於抵扣歐盟 CBAM 關稅、境外碳稅，亦與經濟部用電大戶之節電或綠電義務無涉。【一、氣候變遷與溫室氣體管理(下冊)講義P.50】"}, {"id": 126, "stem": "依據我國碳費徵收與申報制度，收費對象應於每年 5 月底前申報並繳納前一年度之碳費。若某鋼鐵廠於西元 2026 年 5 月依法辦理首期碳費繳納，其計費與繳納之基礎為該廠在下列哪一個區間之溫室氣體排放量？", "options": {"A": "西元 2026 年全年之實際預估排放量", "B": "西元 2024 年全年之歷史申報排放量", "C": "西元 2026 年第一季之局部統計排放量", "D": "西元 2025 年全年之核定盤查排放量"}, "answer": "D", "explanation": "依據《碳費收費辦法》規定，收費對象應於每年 5 月底前申報前一年度之排放量並繳納碳費。因此，西元 2026 年 5 月應繳交之費用，係以前一年度（即 西元 2025 年全年）之核定溫室氣體排放量為計算基礎。【一、氣候變遷與溫室氣體管理(下冊)講義P.54】"}, {"id": 127, "stem": "依據我國現行碳費徵收與申報制度，收費對象應於每年何時之前，完成前一年度溫室氣體排放量之申報，並依費率計算及繳納碳費？", "options": {"A": "每年 3 月 31 日前", "B": "每年 4 月 30 日前", "C": "每年 10 月 31 日前", "D": "每年 5 月 31 日前"}, "answer": "D", "explanation": "依據環境部規劃之碳費申報與徵收時程，收費對象應於每年 5 月 31 日前申報前一年度之溫室氣體排放量，並依費率及收費排放量計算並繳納碳費。【一、氣候變遷與溫室氣體管理(下冊)講義P.54】"}, {"id": 128, "stem": "當我國碳費制度正式進入實質收費階段後，收費對象必須於每年的哪一個法定截止日前，完成前一年度溫室氣體計費排放量之線上申報，並繳納對應之碳費金額？", "options": {"A": "每年 4 月 30 日前", "B": "每年 5 月 31 日前", "C": "每年 6 月 30 日前", "D": "每年 10 月 31 日前"}, "answer": "B", "explanation": "依據《碳費收費辦法》之時程規範，碳費收費對象應於**「每年 5 月 31 日前」**申報前一年度之溫室氣體排放量，並依費率及自主減量目標計算並繳納碳費。【一、氣候變遷與溫室氣體管理(下冊)講義P.54】"}, {"id": 129, "stem": "依據環境部規劃之我國碳費徵收時程，由碳費費率審議會審議並由環境部正式公告之首期碳費一般費率與優惠費率，其法規之生效日期為下列何者？", "options": {"A": "西元 2024 年 8 月 29 日", "B": "西元 2025 年 1 月 1 日", "C": "西元 2025 年 5 月 31 日", "D": "西元 2026 年 1 月 1 日"}, "answer": "B", "explanation": "依據溫室氣體排放管理與收費時程規劃，環境部審議決議後公告之碳費徵收費率，其正式生效日期為西元 2025 年（民國 114 年）1 月 1 日，以此奠定國家排碳有價之法制基礎。【一、氣候變遷與溫室氣體管理(下冊)講義P.55】"}, {"id": 130, "stem": "依據我國碳費推動時程規劃，西元 2025 年（民國 114 年）為國家碳費之「試辦申報年」。在此試辦申報年度中，列管之收費對象應履行之法定申報義務與計費原則為何？", "options": {"A": "同時完成盤查登錄並全額繳納該年度之試辦碳費", "B": "需進行自願性碳盤查，但完全免予申報與登錄", "C": "申報排放量資料，惟無需實際繳納任何碳費", "D": "無需辦理任何盤查或申報，該年度所有排放量皆不予計入"}, "answer": "C", "explanation": "試辦申報年（114年）係要求收費對象申報 113 年度之溫室氣體排放量。其主要目的在於讓企業試辦申報並熟悉系統與核算法規，但**「該次申報無需實際繳納任何碳費用」**。實際計費與收費自西元 2026 年開始繳納前一年度碳費。【一、氣候變遷與溫室氣體管理(下冊)講義P.55】"}, {"id": 131, "stem": "依據環境部《自主減量計畫管理辦法》及碳費徵收機制之規劃，經政府核定自主減量計畫並認定屬於「高碳洩漏風險」之收費對象，其在計算碳費應繳金額時，於過渡期初期所適用之「排放量調整係數（值）」應為下列何者？", "options": {"A": "0.6", "B": "0.4", "C": "0.2", "D": "0.8"}, "answer": "C", "explanation": "依據我國碳費徵收配套機制與高碳洩漏風險認定審核原則，為兼顧產業國際競爭力並防範碳洩漏，經核定自主減量計畫並認定屬高碳洩漏風險行業別之收費對象，於過渡期初期可適用之排放量調整係數為 0.2，以合理折算其計費之收費排放量。【一、氣候變遷與溫室氣體管理(下冊)講義P.56】"}, {"id": 132, "stem": "依據環境部規劃之我國碳費徵收機制，收費對象在計算應繳納之碳費金額時，其最基本之法定計算公式為下列何者？", "options": {"A": "碳費 ＝ 年總排放量 × 徵收費率", "B": "碳費 ＝ 申報排放量 × K值 × 排放量調整係數值", "C": "碳費 ＝ 收費排放量 × 徵收費率", "D": "碳費 ＝ 收費排放量 × 調整係數 × 碳交易市場價格"}, "answer": "C", "explanation": "依據我國碳費配套制度之規劃，碳費的基本計費公式為「碳費 ＝ 收費排放量 × 徵收費率」。其中「收費排放量」則會依據是否為高碳洩漏風險行業、是否通過自主減量計畫等，依公式（年排放量 - K值）× 調整係數值進行折算與釐定。【一、氣候變遷與溫室氣體管理(下冊)講義P.56】"}, {"id": 133, "stem": "依據環境部《自主減量計畫管理辦法》與碳費徵收機制之規劃，下列哪一個行業「不屬於」主管機關所公告認定並列入之「高碳洩漏風險行業別（附表一）」？", "options": {"A": "石油及煤製品製造業", "B": "紙漿、紙及紙板製造業", "C": "電腦及其週邊設備製造業", "D": "連鎖便利商店業"}, "answer": "D", "explanation": "依據高碳洩漏風險評估之附表一清單，高碳洩漏風險行業包含動植物油脂、紙漿紙板、石油及煤製品、化學原材料、玻璃、水泥、鋼鐵、印刷電路板、電腦及其週邊設備製造業等 17 項行業。連鎖便利商店業非屬高碳洩漏風險行業，不適用高碳洩漏風險之碳費折扣。【一、氣候變遷與溫室氣體管理(下冊)講義P.57】"}, {"id": 134, "stem": "依據環境部公告之我國碳費費率與配套辦法，收費對象在提出自主減量計畫並經審查核定後，若其設定之溫室氣體減量指定目標能符合最嚴格之「技術標竿指定削減率」時，其所適用之優惠碳費費率應為下列何者？", "options": {"A": "一般費率", "B": "優惠費率A", "C": "優惠費率B", "D": "免徵費率"}, "answer": "C", "explanation": "我國碳費費率設有一般費率與兩種優惠費率。收費對象若依規定提出自主減量計畫，且其設定之減量目標符合嚴格之「技術標竿指定削減率」，即可申請適用最優惠之「優惠費率B」；若符合「行業別指定削減率」，則適用「優惠費率A」。【一、氣候變遷與溫室氣體管理(下冊)講義P.58】"}, {"id": 135, "stem": "依據《氣候變遷因應法》與我國碳費制度推動規劃，收費對象若欲向環境部申請適用碳費之「優惠費率」，必須率先研提並提交下列哪一項法規配套文件送審？", "options": {"A": "自主減量計畫", "B": "溫室氣體自願減量專案計畫書", "C": "產品碳足跡盤查報告書", "D": "溫室氣體先期計畫書"}, "answer": "A", "explanation": "依據我國碳費徵收制度之三項核心子法，收費對象若擬採行自願減量措施並達成指定的指定目標，可向主管機關提出**「自主減量計畫」**，經審查小組核定通過後，方可適用對應之優惠費率。【一、氣候變遷與溫室氣體管理(下冊)講義P.58】"}, {"id": 136, "stem": "依據環境部《自主減量計畫管理辦法》規定，碳費收費對象在向中央主管機關提出自主減量計畫以申請適用優惠費率時，計畫書中「必須」包含並詳實登載下列哪一項核心數據與資料？", "options": {"A": "基準年與目標年之溫室氣體年排放量及削減率計算", "B": "歐盟排放交易市場（EU ETS）之免費配額取得證明", "C": "進口原料之跨國海運排碳路徑與報關發票金額", "D": "該公司近五年於科學基礎減量目標（SBTi）之會費繳納收據"}, "answer": "A", "explanation": "依據自主減量計畫管理辦法之申請規定，收費對象申請適用優惠費率時應檢具自主減量計畫，且計畫書內容應載明：計畫基本資料、基準年與目標年之溫室氣體年排放量及削減率計算、減量措施、逐年執行進度、查核機制等核心內容。【一、氣候變遷與溫室氣體管理(下冊)講義P.58】"}, {"id": 137, "stem": "依據我國《自主減量計畫管理辦法》之規定，收費對象提出自主減量計畫並經主管機關審查核定後，該計畫的法定「實質執行與監測期間」應如何界定？", "options": {"A": "一律固定為三年，期滿後必須重新申請，且不可展延", "B": "自自主減量計畫申請日前三年起，至申請之目標年（西元 2030 年）止", "C": "自該事業設立之日起算，至國家正式達成淨零排放（西元 2050 年）止", "D": "自自主減量計畫經主管機關核定之日起，至核定之目標年（西元 2030 年）止"}, "answer": "D", "explanation": "依據自主減量計畫之規範，經核定自主減量計畫之事業，其計畫之實質執行與監測期間，係自主管機關核定該計畫之日起，至計畫中所設定之目標年（即西元 2030 年/中華民國 119 年）止，以落實階段性指定削減目標。【一、氣候變遷與溫室氣體管理(下冊)講義P.58】"}, {"id": 138, "stem": "某化學工廠擬為其廠房申請自主減量計畫以取得優惠費率。依據《自主減量計畫管理辦法》之規定，下列哪一項文件「非屬」自主減量計畫在系統申報時必須檢附並上傳之法定應備圖資與資料？", "options": {"A": "主要生產製程流程圖說及溫室氣體排放資訊", "B": "基準年度之產品產量、產製期程等佐證資料", "C": "企業當年度之完整審計財務報告與資產負債表", "D": "各製程與排放源所使用之燃料或原（物）料種類與年用量"}, "answer": "C", "explanation": "依據自主減量計畫之申請要件，企業必須檢附與「減碳、排放源及能資源」直接相關的製程圖說、主要產品產量與產製期程、溫室氣體排放源及燃料種類等佐證。而企業之年度審計財務報告與資產負債表則非屬減碳自主計畫之法定應檢附資料。【一、氣候變遷與溫室氣體管理(下冊)講義P.58】"}, {"id": 139, "stem": "為鼓勵碳費收費對象加速採行實質減碳工作，我國《氣候變遷因應法》第 29 條與《自主減量計畫管理辦法》明定事業得採行多項減量措施。下列哪一項措施「不屬於」法規明文列入之五大自主減量措施執行範疇？", "options": {"A": "轉換為低碳燃料（如汰換燃煤蒸汽鍋爐改用天然氣）", "B": "提升能源效率或採行能資源節約措施（如汰換高效空調與高能效設備）", "C": "透過擴大採購高碳排的傳統重油或煤炭等化石燃料以平衡供電能耗", "D": "採行負排放技術與自然碳匯移除專案（如自建二氧化碳捕集與封存設備）"}, "answer": "C", "explanation": "自主減量之五大措施包含：轉換低碳燃料、提升能源效率、使用再生能源、製程改善及採行負排放技術等。而**「擴大採購重油、煤炭等高碳排之傳統化石燃料」**顯與減量原則相悖，不符合自主減量之執行範疇。【一、氣候變遷與溫室氣體管理(下冊)講義P.58】"}, {"id": 140, "stem": "某大型傳統製造集團旗下擁有一座電弧爐煉鋼廠、一座熱軋鋼捲廠及多個分布於不同縣市的分廠。若該法人擬針對集團內多個不同的事業單位共同向環境部申請核定「自主減量計畫」以爭取優惠費率，依據《自主減量計畫管理辦法》之規定，其應如何提出申請？", "options": {"A": "各事業單位必須完全獨立向主管機關個別申報，法規明文禁止併同辦理", "B": "必須經由國家發展委員會專案特許並跨部會審查後，方能合併提出申請", "C": "可由該法人指定其中一個事業單位作為代表，統一提出申請", "D": "僅限於各廠區溫室氣體盤查完成後之5年內，方得提出共同合併申請"}, "answer": "C", "explanation": "依據我國《自主減量計畫管理辦法》之規定，同一法人之多個事業單位（如分廠、不同廠區等）可共同申請自主減量計畫，並指定其中一個事業單位作為申請代表，統一向主管機關進行線上申報與後續計畫之執行管理。【一、氣候變遷與溫室氣體管理(下冊)講義P.58】"}, {"id": 141, "stem": "我國碳費徵收機制中設有一般費率與兩種優惠費率。若某水泥製造大廠所提出之自主減量計畫，欲爭取適用碳費折扣幅度最大（即碳費單價最低）之「優惠費率 A」，則該計畫內所設定之減量目標，應符合下列哪一種減量指定目標類型？", "options": {"A": "技術標竿指定削減率", "B": "國家自定減量承諾率 (NDC)", "C": "先期計畫專案削減率", "D": "行業別指定削減率"}, "answer": "D", "explanation": "依據我國碳費徵收之減量指定目標規定，收費對象若欲申請適用最優惠之「優惠費率 A」，其計畫所設定之溫室氣體減量指定目標，必須達成難度與門檻較高之「行業別指定削減率」；而若達成「技術標竿指定削減率」，則適用「優惠費率 B」。【一、氣候變遷與溫室氣體管理(下冊)講義P.58】"}, {"id": 142, "stem": "承上題，若某鋼鐵業一貫煉鋼廠經內部製程能效評估後，其所研提之自主減量計畫，將目標年之減量目標設定能符合並達成「技術標竿指定削減率」，則在該計畫經環境部審查委員會核定通過後，該廠所適用之碳費優惠費率等級為何？", "options": {"A": "基準折減費率", "B": "優惠費率 B", "C": "優惠費率 A", "D": "行業別優惠費率"}, "answer": "B", "explanation": "依據我國碳費配套制度與減量指定目標之規定，自主減量計畫若選擇並達成「技術標竿指定削減率」，其計畫通過後所適用之優惠碳費費率為「優惠費率 B」；若達成更具挑戰性之「行業別指定削減率」，則適用「優惠費率 A」。【一、氣候變遷與溫室氣體管理(下冊)講義P.58】"}, {"id": 143, "stem": "依據環境部《自主減量計畫管理辦法》規定，經核定自主減量計畫並適用優惠費率之事業單位，應於每年的哪一個法定截止日前，向中央主管機關提交前一年度之自主減量計畫執行進度報告，以接受年度查核？", "options": {"A": "每年 4 月 30 日前", "B": "每年 5 月 31 日前", "C": "每年 10 月 31 日前", "D": "每年 12 月 31 日前"}, "answer": "A", "explanation": "依據自主減量計畫管理辦法之規定，取得優惠費率之事業單位，應於每年 4 月 30 日前，向中央主管機關提報前一年度自主減量計畫之執行進度報告，以確保其確實執行減碳承諾並維持適用優惠費率之資格。【一、氣候變遷與溫室氣體管理(下冊)講義P.59】"}, {"id": 144, "stem": "依據我國《自主減量計畫管理辦法》之規定，經核定自主減量計畫並已適用優惠費率之碳費收費對象，應於「每年何種法定截止日前」，向中央主管機關提報前一年度自主減量計畫之執行進度報告，以接受年度查核？", "options": {"A": "每年 3 月 31 日前", "B": "每年 4 月 30 日前", "C": "每年 5 月 31 日前", "D": "每年 10 月 31 日前"}, "answer": "B", "explanation": "依據自主減量計畫管理辦法之監測與年度查核規範，取得優惠費率資格之事業單位，應於每年 4 月 30 日前（與法定溫室氣體盤查登錄截止日一致），向中央主管機關提報前一年度自主減量計畫之執行進度報告，以確保其實質執行減碳承諾並維持優惠費率資格。【一、氣候變遷與溫室氣體管理(下冊)講義P.59】"}, {"id": 145, "stem": "在碳費收費對象每年提交其自主減量計畫之執行進度報告後，主管機關會依法啟動年度查核以確認其進度符合目標。依據《自主減量計畫管理辦法》之查核機制，下列哪一項「不屬於」主管機關法定採行之查核手段？", "options": {"A": "由主管機關或查核人員派員赴現場進行實質執行之「現場勘查」", "B": "由審查小組依據事業上傳之佐證數據與產量進行「書面審查」", "C": "主管機關要求事業針對報告中不符處提供說明之「限期補正行政審查」", "D": "委託第三方專業會計師事務所進行公司所有權之「第三方金融及上市櫃股權審查」"}, "answer": "D", "explanation": "依據自主減量計畫之執行進度查核機制，主管機關對執行報告之查核方式包含「書面審查」與「現場勘查」，並得依進度判定其是否需限期補正或廢止適用優惠費率。而**「委託第三方會計師進行金融與上市櫃股權審查」**則非屬自主減量計畫查核手段之範疇。【一、氣候變遷與溫室氣體管理(下冊)講義P.59】"}, {"id": 146, "stem": "某精密半導體晶圓廠向主管機關環境部提交了自主減量計畫書。主管機關在受理並進行行政審查時，若發現資料不齊全並限期通知其改善補正，依據《自主減量計畫管理辦法》，該計畫書審查期限為三個月（必要時得予延長），而該事業單位的「累計補正日數」上限共為多少天？", "options": {"A": "60 日", "B": "30 日", "C": "45 日", "D": "90 日"}, "answer": "A", "explanation": "依據法規之審查、補正與核定規範，自主減量計畫之審查期限為三個月。若有申請文件不符或資料缺漏需限期補正之情形，收費對象之累計補正日數不得超過 60 日，逾期未補正者將予以駁回不予受理。【一、氣候變遷與溫室氣體管理(下冊)講義P.59】"}, {"id": 147, "stem": "依據環境部針對我國碳費制度與自主減量成效之評估，若未來所有的碳費收費對象（約計252家公司、464廠）均能積極提出自主減量計畫並確實執行，預估至西元 2030 年國家可望減少約多少公噸之溫室氣體排放量？", "options": {"A": "17 百萬公噸 CO2e", "B": "27 百萬公噸 CO2e", "C": "37 百萬公噸 CO2e", "D": "47 百萬公噸 CO2e"}, "answer": "C", "explanation": "依據環境部政策評估分析，若收費對象皆積極研提自主減量計畫並達到指定減量目標，預估至西元 2030 年可為我國實質帶來高達**「37 百萬公噸 CO2e」**之溫室氣體減量成效。【一、氣候變遷與溫室氣體管理(下冊)講義P.60】"}, {"id": 148, "stem": "環境部在規劃與評估推動「碳費徵收制度」對我國產業核心競爭力及宏觀經濟之總體衝擊時，曾對多種不同費率情境進行實質模擬。依據官方公告之經濟衝擊影響分析，我國徵收碳費對國內總體經濟「實質國內生產毛額（GDP）」之衝擊幅度，預估介於下列哪一個百分比區間？", "options": {"A": "0.009% 至 0.12%", "B": "0.1% 至 1.0%", "C": "1.0% 至 2.0%", "D": "0.5% 至 0.8%"}, "answer": "A", "explanation": "依據環境部與經濟部等相關部會之碳費衝擊評估報告，我國碳費費率之實施對總體經濟之影響極為微幅，預估對我國實質 GDP 之衝擊影響僅介於 0.009% 至 0.12% 之間，並未對國家整體經濟增長造成顯著之負面波動。【一、氣候變遷與溫室氣體管理(下冊)講義P.60】"}, {"id": 149, "stem": "為兼顧國家淨零減碳目標與民生物價穩定，我國碳費徵收初期將排碳大戶以外之一般住商、一般大眾與交通運輸部門排除在徵收範疇之外。依據官方經濟模擬數據，我國碳費開徵對全國「消費者物價指數（CPI）」所造成之直接與間接波動影響，預估僅介於下列哪一個百分比區間？", "options": {"A": "0.1% 至 0.5%", "B": "0.5% 至 1.0%", "C": "1.0% 至 2.0%", "D": "0.006% 至 0.08%"}, "answer": "D", "explanation": "依據我國碳費徵收之衝擊分析與配套優惠費率，由於首期碳費排除了直接影響一般民生與交通物價之部門，加上自主減量計畫之打折機制，評估開徵後對國內消費者物價指數（CPI）之影響極其微弱，約僅介於 0.006% 至 0.08% 之間，對民生物價衝擊甚小。【一、氣候變遷與溫室氣體管理(下冊)講義P.60】"}, {"id": 150, "stem": "關於 2015 年通過的《巴黎協定》（Paris Agreement）長期升溫控制目標，下列何者敘述正確？", "options": {"A": "控制全球升溫在工業化前 1.5℃ 內，並力求不超過 1.0℃", "B": "控制全球升溫在工業化前 2.0℃ 內，並力求不超過 1.5℃", "C": "控制全球升溫在工業化前 2.5℃ 內，並力求不超過 2.0℃", "D": "控制全球升溫在工業化前 3.0℃ 內，並力求不超過 1.5℃"}, "answer": "B", "explanation": "依據 2015 年通過的《巴黎協定》長期目標為確立控制全球升溫在工業化前 2.0℃ 內，並致力積極控制不超過 1.5℃。【一、氣候變遷與溫室氣體管理(下冊)講義P.8】"}, {"id": 151, "stem": "某綠能科技大廠財務長正評估赴日本進行再生能源及氫能技術投資。日本政府已將 2050 淨零碳中和目標明文入法，並推動一整套「綠色轉型（GX）」計畫。在此一政策脈絡下，日本結合低碳技術研發與產業轉型，針對 14 個核心產業領域所提出的關鍵總體推動指引與戰略藍圖為何？", "options": {"A": "綠色貿易與碳邊境調整法案", "B": "氣候變遷企業責任申報條例", "C": "2050 碳中和綠色成長戰略（Green Growth Strategy）", "D": "循環經濟與再生能資源整合計畫"}, "answer": "C", "explanation": "日本為實現 2050 年碳中和目標，於 2021 年修訂《全球暖化政策推進法》將目標入法，並搭配制定針對 14 個產業領域之「2050 碳中和綠色成長戰略」，作為引導低碳產業與技術轉型之總體綱領。【一、氣候變遷與溫室氣體管理上冊講義P.150 / 紙本考卷P.38第406題】"}, {"id": 152, "stem": "能源轉型為四大轉型策略之首。依據我國 2050 淨零路徑規劃，我國在推動「能源轉型」時，最首要、最核心之技術與政策推動目標為何？", "options": {"A": "在「穩定供電」的技術前提下，積極建置與整合高比例之再生能源電力系統", "B": "優先依賴海外廉價之天然氣進口作為終期唯一發電燃料，逐步完全汰除風力與太陽光電", "C": "重新重啟高耗能燃煤電廠，並在無設置任何 CCS 技術下進行滿負載發電以壓低電價", "D": "強制限制所有高科技產業之年度用電上限，以此達成被動式之去碳目標"}, "answer": "A", "explanation": "我國能源轉型戰略在「穩定供電」之國家基本前提下，核心目標在於極大化建構與發展風力、太陽光電等高比例之「再生能源電力系統」，作為支持整體社會電氣化轉型之基磐。【一、氣候變遷與溫室氣體管理下冊講義P.151, P.182 / 紙本考卷P.38第415題】"}, {"id": 153, "stem": "氫能被視為未來終極的潔淨能源之一。依據我國 2050 淨零轉型路徑，政府對於「氫能（含氨）戰略」之短中期實務應用與技術定位，主要聚焦於哪一方面？", "options": {"A": "定位為僅能作為偏遠海島及離網型家用熱水器之一次性燃料", "B": "作為過渡時期用以取代所有小型乘用車之最高比例燃煤燃料替代方案", "C": "在電力部門以混燒燃氣發電為主，在產業部門則以工業製程低碳化為主，逐步擴大範疇", "D": "全權作為電網因天災斷電時，各分廠之高污染備用柴油發電機的添加劑"}, "answer": "C", "explanation": "我國在氫能與前瞻能源關鍵戰略中，將其定位為中長期之去碳技術。具體應用以「混燒燃氣發電（去碳燃氫）」與「工業製程低碳化（如氫能煉鐵、低碳化學品）」為主，逐步擴充與建立本土供應鏈。【一、氣候變遷與溫室氣體管理下冊講義P.151, P.185 / 紙本考卷P.38第419題】"}, {"id": 154, "stem": "某大學氣候法律研究所舉辦「國際比較法視野下的氣候治理」學術研討會。英國於西元 2008 年通過（並於 2019 年修訂）的《氣候變遷法》（UK Climate Change Act）在國際氣候立法史上被公認極具開創性，其最核心且被多國借鏡的立法特色為何？", "options": {"A": "訂有具法律拘束力之「碳預算（Carbon Budgets）」，並成立獨立之「氣候變遷委員會（CCC）」監督政策落實", "B": "僅針對重工業與公用電力部門設定一次性之減量義務，排除所有生活與交通運輸之管制", "C": "規定政府若未達成年度減碳目標，一律強制向聯合國氣候基金繳納對等之關稅罰金", "D": "全面廢除國內所有化石燃料補貼，並強制將全國電力系統在十年內轉為 100% 離岸風電"}, "answer": "A", "explanation": "英國《氣候變遷法》的核心特色之一，在於其明文訂定具法律約束力的中期「碳預算（Carbon Budgets）」，以確保長期減碳目標的落實，並設置獨立的「氣候變遷委員會（CCC）」提供科學諮詢與政策成效之獨立監管。【一、氣候變遷與溫室氣體管理下冊講義P.166 / 紙本考卷P.38第405題】"}, {"id": 155, "stem": "某法律合規人員正在編寫公司內部之環境合規手冊，需載明我國最重要的氣候法案施行歷史。我國為明確推動「2050 淨零排放」之法制化，並為碳費徵收與自願減量機制奠定上位法源，將《溫室氣體減量及管理法》修正為《氣候變遷因應法》，此部極具里程碑意義的法案，是由總統於何時正式公布施行？", "options": {"A": "西元 2022 年 3 月 30 日", "B": "西元 2023 年 2 月 15 日", "C": "西元 2021 年 4 月 22 日", "D": "西元 2024 年 5 月 20 日"}, "answer": "B", "explanation": "我國《氣候變遷因應法》（簡稱氣候法）經立法院三讀通過後，由總統於西元 2023 年 2 月 15 日正式公布施行，將 2050 淨零排放目標正式入法。【一、氣候變遷與溫室氣體管理下冊講義P.178 / 紙本考卷P.38第404題】"}, {"id": 156, "stem": "某市政府永續發展會正依據國家「2050 淨零轉型」總藍圖，研擬地方之氣候行動綱領。我國在 2050 淨零排放路徑中所規劃的「四大轉型策略」，旨在全方位重構我國社會經濟體系。請問下列哪一項「不屬於」這四大轉型策略的範疇？", "options": {"A": "能源轉型", "B": "生活轉型", "C": "產業轉型", "D": "教育轉型"}, "answer": "D", "explanation": "臺灣 2050 淨零排放路徑中之「四大轉型策略」明確包含：能源轉型、產業轉型、生活轉型及社會轉型。而「教育轉型」並非四大轉型策略之列（教育主要融入生活與社會轉型推廣中）。【一、氣候變遷與溫室氣體管理下冊講義P.178 / 紙本考卷P.38第410題】"}, {"id": 157, "stem": "某 NGO 組織計畫在社區舉辦一系列以推廣「生活轉型（低碳綠生活）」為核心的宣導活動。依據我國 2050 淨零轉型規劃，旨在引導民眾行為改變、建立低碳商業模式的「生活轉型」戰略，其推動領域與內涵廣泛。請問下列哪一項「不屬於」生活轉型策略之內涵（反而屬於傳統化石燃料能資源投資領域）？", "options": {"A": "節能生活型態推廣與低碳飲食宣導", "B": "綠色運輸推廣、共享運具與低碳運具之普及", "C": "提升全民氣候素養、形塑淨零綠生活", "D": "扶植與擴大天然氣等高碳化石能源基礎設施之開發投資"}, "answer": "D", "explanation": "「生活轉型」戰略旨在從食、衣、住、行各面向切入引導全民行為改變，建立低碳與綠生活產業鏈。而「扶植天然氣等化石能源基礎設施投資」非屬生活轉型範疇，反而屬於能源結構供應面範疇。【一、氣候變遷與溫室氣體管理下冊講義P.182 / 紙本考卷P.38第413題】"}, {"id": 158, "stem": "建築部門之能耗占我國終端用電極高比例。依據我國 2050 淨零關鍵戰略，針對「住宅與建築部門」之轉型，政府擬採取之最核心、最關鍵之減碳手段為何？", "options": {"A": "僅強制要求所有住商建築一律採用 100% 生物可
