planation": "溫室氣體查驗之標準作業流程依序為：首先，雙方「建立並簽訂查驗協議契約」（b）；接著，查驗機構收集資料並「執行書面與現場查驗作業」（a）；第三，經內部評審後「完成內部技術覆核並出具查驗總結報告書與聲明」（c）；最後，雙方至官方平台「確認登錄資訊」以完成申報（d），【三、溫室氣體自願減量作業與減量額度講義 P.56】"}, {"id": 344, "stem": "查驗小組在對某化學原材料製造廠之組織型溫室氣體盤查進行「現場訪查（On-site Visit）」程序。在溫室氣體符合性查核實務中，執行現地勘訪查的最主要技術目的為何？", "options": {"A": "審核該化學廠向稅捐機關申報之營業稅與所得稅金額是否完全正確", "B": "定量評估該廠在地方社區參與、公正轉型與人權盡職調查上之非財務指標分數", "C": "實地核實與驗證廠區內與排放相關之實體設備配置、操作運轉狀況，並確認現場抄表讀數與原廠DCS系統記錄確實與盤查報告書及清冊一致", "D": "協助該廠將年度盤查數據轉換為特定產品在跨國海運配送時之延噸公里碳含量"}, "answer": "C", "explanation": "「現場訪查（On-site Visit）」是查驗程序中極為關鍵的實體檢證環節。其最核心的技術目的，在於讓查驗人員赴工廠現地，核對與驗證專案邊界內各設施之實際配置、監測計量電表或流量計之校正狀態與實際讀值，確保現場物理現實與所提報之數據及監測報告書內容完全一致。【三、溫室氣體自願減量作業與減量額度講義 P.57】"}, {"id": 345, "stem": "某玻璃製造廠之綠領專員在進行組織溫室氣體盤查時，發現廠內計算緊急柴油發電機之移動燃燒排放量時，所套用之柴油二氧化碳排放係數與環境部最新公告之標準係數不一致。當查驗人員在實地查證現場發現此「係數引用不一致」之情事時，應如何合規處置？", "options": {"A": "為了展現行政便利與便民彈性原則，得直接同意並採用業者自行引用之任意係數，免予要求其修正", "B": "為了貫徹最上位之保守性原則，主動指派查驗小組成員直接將其數據以全國最高之重油燃燒係數進行折算", "C": "應開立澄清或限期補正事項，要求該廠說明其所引用參數之合理與檢測依據，否則應限期調整為政府最新公告之標準係數", "D": "直接忽略此項微小的排放係數引用差異，但必須在最終之查驗總結報告中以註腳方式進行備查"}, "answer": "C", "explanation": "數據量化與參數選用必須具備科學性、合規性與一致性。若查驗人員發現受查單位所用之排放係數或低位熱值與主管機關公告之係數不一致，應開立不符合或澄清要求（CL/CAR），要求其提出可信之一手檢測依據（如CNS/ISO 17025認證實驗室檢測報告），否則應限期更正為主管機關公告之標準係數，不得直接放行或忽略。【三、溫室氣體自願減量作業與減量額度講義 P.57】"}, {"id": 346, "stem": "某主導查驗員在現場查證某晶圓廠之「自願減量專案」時，核對現場製程流程，發現實際安裝之尾氣破壞處理設備型號與位置，與當初環境部註冊核定之《專案計畫書（PDD）》規格不符，且該廠並未辦理任何行政變更。承此情境，查驗小組在程序上應如何處置？", "options": {"A": "查驗人員得直接依據原計畫書中所載之「預估年減量值」進行查證，並直接出具合格聲明", "B": "應開立不符合事項，要求受查驗者依規定向環境部提出計畫書之「變更申請」，並經核准後，查驗小組方得據以查證", "C": "為了配合晶圓廠之時效，查驗員得主動協助該廠在線上碳交易系統中修改相關參數，免除行政變更程序", "D": "直接在查驗報告中對此設備差異予以忽略不提，僅對天然氣流量計之數據執行查證即可"}, "answer": "B", "explanation": "依據我國自願減量與抵換專案之確證查證規範，當實際實施狀況與核定計畫書有實質差異（如設備規格變更、邊界異動）時，申請單位必須依法向環境部提出「計畫書變更申請」。查驗機構必須在該變更申請「獲得主管機關核准同意後」，方得據以對變更後之數據執行實質查證，【三、溫室氣體自願減量作業與減量額度講義 P.57】"}, {"id": 347, "stem": "溫室氣體查驗與報告撰寫講求客觀與科學嚴謹性。下列關於查驗報告編寫與數據呈現之技術原則，何者最符合我國查驗指引中對於「可重現性與可追溯性」之標準要求？", "options": {"A": "報告應以質性定性描述為主，並檢附公司高階董事會成員在現場巡視與剪綵之大篇幅照片佐證", "B": "確保報告中所有資訊與數據均可被第三方追溯、可被重現，且與線上申報系統之數據完全一致，並詳實標註所有量測設備、公式及參數引用之科學依據", "C": "所有查驗報告在遞交環境部審查時，不論受查主體是否涉及外銷，一律強制必須同時提供繁體中文與歐盟各國官方語言之雙語譯本", "D": "報告中凡涉及製程之高耗能數據，得直接以受查企業之最高階總經理簽字之「營業秘密切結書」替代，免予登載原始抄表單"}, "answer": "B", "explanation": "查驗之可重現性與可追溯性（MRV之核心）要求報告具備高度科學與紀錄透明度。這意味著：報告中的每一筆關鍵活動數據、排放因子及計算結果，都必須有清楚、具備可信任來源之佐證，且能讓獨立之專業人員依據報告所標註之假設、公式與參數，完全重現相同的量化與查證結論。【三、溫室氣體自願減量作業與減量額度講義 P.58】"}, {"id": 348, "stem": "查驗人員在對某醫院（醫療醫事機構）之組織型盤查進行查證時，應對數據品質進行核實。為了滿足主管機關與查驗標準對於「數據可追溯性（Traceability）」的嚴格要求，查驗人員最應確認下列哪一項資訊在報告中的完整呈現？", "options": {"A": "該醫院在各級醫學中心評鑑中所獲得之綜合醫療技術品質及財務毛利率排名", "B": "每一筆用於計算之活動數據的原始來源出處（如電費單、流量計）、記錄版本、抄表時間、以及適用之排放型式等資訊的詳實標註", "C": "受查醫院全體醫護人員之勞動工時紀錄、員工通勤方式與生活水肥處理量", "D": "該醫院所使用之各項醫療製程設備，其原廠出口國之海關關稅及營業稅申報傳票"}, "answer": "B", "explanation": "「數據可追溯性（Traceability）」要求查驗人員與審查人員能夠循著數據軌跡，一路回溯至最初的計量源頭。因此，盤查報告書與清冊中，對於每一項活動數據之「來源（如台電電費單、實體流量計）、記錄版本、量測時間、儀器校正週期」均應詳實記載與標註，方屬合規。【三、溫室氣體自願減量作業與減量額度講義 P.58】"}, {"id": 349, "stem": "某化學工廠在接受自願減量專案查證時，因其蒸汽流量計在年初曾故障停機兩週，導致該期間無任何流量監測記錄（即部分資料無法提供）。依據自願減量與抵換專案查證規範與保守性原則，查驗機構與受查單位應如何妥善處理此段數據缺口？", "options": {"A": "詳實記錄數據故障與缺漏之期間與項目，並就已取得之有效資訊與參數進行「保守性評估（如傾向於低估減量效益）」，以核實其可確信之實質減量", "B": "直接判定本案之數據品質管理不符合規定，中止本年度之全部案件並不予評估其額度", "C": "查驗人員得為求行政便利，直接同意受查對象套用該製程之歷史最高能效發電數據進行全額虛報", "D": "無條件同意在最終報告中直接忽略與扣除該兩週之天數，且不需在監測報告書中執行任何替代估計"}, "answer": "A", "explanation": "依據查證規範中對於數據缺失與故障之處理程序，當部分監測數據因儀表故障等原因而無法直接提供時，申請單位與查驗機構不得隨意忽略或高估。應於監測報告中詳實記錄，並「採用經認可之保守性估算或替代方法學」來填補缺口（例如低估其減量效果、或高估專案排放），確保不發生高估減量成效之漂綠情事。【三、溫室氣體自願減量作業與減量額度講義 P.9 / P.58 / P.59】"}, {"id": 350, "stem": "某綠能開發商正評估將其自願減量專案產出之減量額度（碳權）上架交易。依據我國氣候法與國際自願碳市場（VCM）之公信力要求，一項減量額度若要具備上架與合法流通交易之基本品質，在技術與管理特性上必須同時符合下列哪一項核心要件？", "options": {"A": "必須具備高昂之掛牌交易價格，並由查驗機構主動為其提供 100% 財務保證", "B": "該專案之減碳設備與措施，必須早已是同業普遍採行之常規措施", "C": "該減量額度必須完全限制僅能由自然人（個人）身分提出造林申請", "D": "量化成效應符合「MRV（可量測、可報告、可查證）原則」，且專案實質具備「外加性（Additionality）」"}, "answer": "D", "explanation": "依據自願性碳信用管理之國際準則與我國《溫室氣體自願減量專案管理辦法》，用以申請、核發並進行上架交易的自願減量額度（碳權），必須符合「可量測、可報告、可查證之 MRV 原則」，且該專案在技術與資金上必須具備明確且實質的「外加性（Additionality）」，方具備上架與交易資格，【三、溫室氣體自願減量作業與減量額度講義 P.9、P.14】"}, {"id": 351, "stem": "依據我國《氣候變遷因應法》所建立之第三方溫室氣體確證與查證體系。請問，政府推動此項第三方符合性查驗體系的最上位政策設計目的為何？", "options": {"A": "旨在全權輔導強制納管之排碳大戶撰寫自主減量計畫，並提供設備採購之會計諮詢", "B": "為了直接介入並主導國內碳交所上之自願性碳信用額度交易，以強制干預市場價格", "C": "強制要求所有未達納管標準之中小企業，一律必須申報範疇一至範疇三之全生命週期排放", "D": "建立一套具備公正、透明、可追溯且富專業技術判定能力之「MRV 驗證機制」，確保組織排放量與專案減量數據具備公信力"}, "answer": "D", "explanation": "符合性查驗體系之政策目的，在於提供政府與社會大眾一個公正、客觀、可追溯且具專業判斷之「MRV 驗證機制」（可量測、可報告、可查證），藉由第三方把關，防範企業漂綠並確保盤查登錄數據與碳權核發之公信力，【三、溫室氣體自願減量作業與減量額度講義 P.9】"}, {"id": 352, "stem": "我國《氣候變遷因應法》第三條確立了多項科學與技術管理之法理名詞。請問在氣候治理實務中，「指針對組織或專案之排放量、或減量與移除成效，進行標準化之『可量測（Measurement）、可報告（Reporting）及可查證（Verification）』」之總體科學量化作業體系，其英文簡稱為何？", "options": {"A": "SBT (Science Based Targets)", "B": "LCA (Life Cycle Assessment)", "C": "MRV (Measurement, Reporting, and Verification)", "D": "DQM (Data Quality Management)"}, "answer": "C", "explanation": "在溫室氣體自願減量與強制盤查管理中，為確保數據之環境誠信與真實性，必須依據標準程序落實「MRV」機制。即透過科學化可量測（M）、透明誠實可報告（R）、以及獨立第三方可查證（V）之作業體系，保障數據公信力，【三、溫室氣體自願減量作業與減量額度講義 P.9】"}, {"id": 353, "stem": "某生質能開發商擬在台灣提出「農業廢棄物發電」之自願減量專案。依據我國《溫室氣體自願減量專案管理辦法》之規定，該開發商在申辦並取得碳權的實務流程中，主要需經歷哪兩大核心行政與技術階段？", "options": {"A": "碳強度申報階段 與 碳標籤審查階段", "B": "企業內部碳定價設定 ＋ 歐盟 CBAM 認證", "C": "國家先期分配階段 ＋ 抵換額度轉換階段", "D": "自願減量專案註冊階段 ＋ 減量額度核發（額度申請）階段"}, "answer": "D", "explanation": "我國自願減量專案之執行與額度取得，在法規上嚴格分為兩個步驟：第一步為「專案註冊申請」（計畫書撰寫、確證與核准註冊），第二步為專案執行監測後的「減量額度核發申請」（監測、查證與額度核發）。（本題標準答案為 D），【三、溫室氣體自願減量作業與減量額度講義 P.9】"}, {"id": 354, "stem": "某電子製造大廠擬為其多項節能方案申請「自願減量專案」註冊。依據我國現行《溫室氣體自願減量專案管理辦法》之規定，下列哪一項情形在法律與技術上「不屬於」專案之法定排除條件，亦即「可以」納入專案計畫邊界中申請核發碳權？", "options": {"A": "該排放源屬於氣候法第 28 條規定、年排放大於 2.5 萬噸且「應繳納碳費」之實體排放源", "B": "該減量設備已向經濟部標準檢驗局正式提出「國家再生能源憑證（T-REC）」核發申請", "C": "該排放源屬於環境部公告之第一批及第二批強制盤查登錄及查驗之大規模工業源", "D": "專案屬於中小型製造業之低碳能源鍋爐替換，且實質「起始執行日在申請日前 2 年之內」"}, "answer": "D", "explanation": "依自願減量專案管理辦法第 11 條（排除條款），已申請綠電憑證者、應繳碳費者、公告第一與第二批強制納管大廠、以及「註冊申請日3年前執行之減少或避免排放措施」均屬法規排除對象，編制時予以扣除。而起始日在3年內、且非強制盤查與碳費徵收之減量措施則屬於合格、非排除之合規對象，【三、溫室氣體自願減量作業與減量額度講義 P.9】"}, {"id": 355, "stem": "依據《碳定價與自願性減量制度》之內涵，在自願性碳市場或非強制性總量管制體系下，企業或各級政府主動執行溫室氣體減量專案，經第三方確證與查證，並經中央主管機關核發之溫室氣體減量成效單位，通常被稱為什麼？", "options": {"A": "減量信用額度（Credit）", "B": "排放許可（Permit）", "C": "排放配額（Allowance）", "D": "碳關稅（Carbon Tariff）"}, "answer": "A", "explanation": "碳定價工具中，在總量管制與交易（Cap and Trade）等強制性市場下的排放權利稱為「配額（Allowance）」或「許可（Permit）」；而在非總量管制之自願性機制下，事業或各級政府主動申請自願減量，經核准後取得之成效則稱為「減量信用額度（Credit）」，即俗稱的碳信用。【三、溫室氣體自願減量作業與減量額度講義P.1】"}, {"id": 356, "stem": "某客運公司成功向環境部完成「電動公車汰換自願減量專案」之註冊核准。依據我國自願減量專案標準執行程序，該公司在獲得註冊通過之下一步，實務上應開展何項合規之工作？", "options": {"A": "立即向台灣碳權交易所提出額度拍賣上架申請", "B": "委託另一家查驗機構針對專案計畫書進行第二次「重複確證」", "C": "將專案直接移轉給其他不具備公司資格之自然人進行額度分配", "D": "依核定之計畫書實施減量措施與監測作業，並於執行後提報監測報告以申請核發減量額度"}, "answer": "D", "explanation": "自願減量專案執行程序之流程為：1. 提出專案計畫書、2. 確證、3. 註冊申請、4. 審核通過完成註冊、5. 專案執行與監測、6. 提報監測報告並經第三方查證、7. 申請取得減量額度。故專案註冊通過之下一步即為「專案實施、數據監測與記錄」並依監測數據申請額度。【三、溫室氣體自願減量作業與減量額度講義P.10 / P.182】"}, {"id": 357, "stem": "某商業大樓在通過「高效冰水主機汰換自願減量專案」註冊並執行一段時間後，擬向環境部申請「核發減量額度」。在進入「額度申請」階段前，該大樓之管理委員會必須落實下列哪一項核心實務工作，以作為核發額度之數據佐證？", "options": {"A": "委託專業會計師事務所出具公司的社會成本評估報告與資產減損證明", "B": "依照註冊通過之計畫書中之監測計畫，確實記錄監測數據，依實際監測結果計算減量成效並撰寫「監測報告書」", "C": "重新召開利害關係人研商會議，修訂下一個十年的綠色碳中和長期目標", "D": "逕自修改監測計畫中之儀器校正頻率，將原定「每年校正一次」改為免校正以簡化程序"}, "answer": "B", "explanation": "依據講義說明，在申請核發自願減量額度（碳權）前，專案執行單位必須落實之首要工作是：依照註冊通過之專案計畫書中所承諾之「監測計畫（Monitoring Plan）」落實監測，並依實際監測結果量化計算，編製「監測報告書」，且此報告需先經合格第三方查驗機構「查證」出具查證總結報告，方能向環境部送審。【三、溫室氣體自願減量作業與減量額度講義P.10 / P.57】"}, {"id": 358, "stem": "某查驗機構受託對某造紙廠之「生物質燃料替代」自願減量專案之監測報告書執行確證與查證工作。依據我國自願減量專案管理辦法與查驗管理規範，查驗機構與查驗人員在執行該專案之第三方查核程序時，其法定工作範疇與技術審查範圍「不包含」下列哪一項？", "options": {"A": "實地確認專案實際運作設備、邊界劃定是否與註冊通過之計畫書完全一致", "B": "核實監測報告中各數據之採集、傳輸流程，並確認所引用參數符合方法學之保守原則", "C": "針對受託專案在台灣碳權交易所上架交易時之「碳信用成交價格與財務投資回報」提供實質定價建議", "D": "核對該專案是否符合法規外加性，且確認專案邊界內無任何重複申請額度之行為"}, "answer": "C", "explanation": "第三方查驗機構之職責為客觀、獨立之「符合性驗證」，包括數據真實性查核、計畫與實施一致性審查、外加性與不確定性控制確認等。查驗機構屬於中立之認證機構，絕對「不可介入」企業之商業交易或提供碳權定價、財務回顧等商業性諮詢服務，以避免利益衝突。【三、溫室氣體自願減量作業與減量額度講義P.10 / 柒、查證重點P.56】"}, {"id": 359, "stem": "某醫院之環安主管正與顧問規劃一項「鍋爐蒸汽系統優化與高效熱泵替換」之自願減量專案。為了使該專案在行政與技術上完全符合法規要求並能順利取得碳權，該專案「自起始至最終取得減量額度」的標準合規執行流程順序應為何？", "options": {"A": "撰寫專案計畫書 -> 確證並取得確證報告 -> 向環境部申請註冊通過 -> 專案實施與數據監測 -> 撰寫監測報告書並由查驗機構查證 -> 向環境部提出額度申請並經審定核發", "B": "專案實施與數據監測 -> 直接至碳權交易所掛牌上架 -> 委託查驗機構事後追溯確證 -> 每年自動由申報系統核給額度並存入帳戶", "C": "向環境部繳納足額試辦碳費 -> 完成年度組織盤查報告書之登錄 -> 系統自動核定註冊並由查驗人員出具免確證特許聲明 -> 取得交易額度", "D": "計畫書撰寫 -> 直接向環境部提出額度核發申請 -> 經自願減量平台自動比對基線 -> 委託查核人員至現場進行一次性之行政備查"}, "answer": "A", "explanation": "我國自願減量專案之標準執行程序，嚴格區分為兩大階段與其配套程序。依序為：1. 專案計畫書(PDD)編製；2. 查驗機構執行「確證(Validation)」；3. 環境部審核通過完成「註冊」；4. 依核定計畫書實施減量與數據監測；5. 編製監測報告書並由查驗機構執行「查證(Verification)」；6. 向環境部提出「額度申請」審定核發。【三、溫室氣體自願減量作業與減量額度講義P.10 / 圖3.1】"}, {"id": 360, "stem": "某精密鑄造廠計畫提出一項節能設備汰換專案。該廠發現其採行之措施，在向環境部申請註冊時「得免予執行第三方確證（Validation）」。依據現行《溫室氣體自願減量專案管理辦法》規定，此類註冊階段得「免除確證」之豁免資格，主要取決於下列哪一項法定條件？", "options": {"A": "該專案之計畫計入期是否選擇最長的「30年固定型計入期」", "B": "該專案活動所使用之全部資金是否完全來自於國家發展基金之政府補貼", "C": "該專案所採行之減量措施，是否符合環境部所公告「減量技術成熟、計算簡易明確且於我國有執行案例」之10項免確證減量方法學之適用條件", "D": "該事業單位在前一年度之組織型溫室氣體盤查總排放量是否低於 2.5 萬公噸 CO2e"}, "answer": "C", "explanation": "為簡化程序並鼓勵參與，環境部特別針對「減量技術成熟、計算簡易明確且於我國已有執行先例者（如：高效率燈具、變頻風扇/泵浦、空調設備汰換等 10 項減量方法學，如表 3.1）」之專案，放寬為在提出「註冊申請」時得免予執行確證（確證豁免），可大幅減輕小規模與微型專案之負擔。【三、溫室氣體自願減量作業與減量額度講義P.10, P.13】"}, {"id": 361, "stem": "當某一自願減量專案已成功註冊，並在其適用之減量方法學（Methodology）或管理辦法中明定「在申請核發額度前必須經過查證（Verification）」程序。請問，此項「查證」程序在額度管理上之實質法制意義為何？", "options": {"A": "代表該專案技術屬於高風險與高環境危害類別，必須由環境部指派專家天天駐廠看管", "B": "表示該專案活動僅能在海外或我國境外之碳配額市場中進行移轉交易，不可在國內碳交所上架", "C": "要求申請單位必須在減量措施實施、監測後，由經許可之第三方查驗機構對其「實際減量數據」進行事後之實質查核與確認，方得據以申請額度", "D": "旨在確認該專案計畫在動工興建前，其計畫書中所做的各項基線預估模型是否完全符合法規外加性"}, "answer": "C", "explanation": "在額度申請階段，「查證（Verification）」的主要目的在於確認專案實際執行的監測數據、營運狀況與計算方法，完全與註冊通過之計畫書一致。必須經許可之查驗機構實質查驗、確認數據無計算錯誤或重複計算（即查證合格）後，方能向環境部提出核發額度的行政申請。【三、溫室氣體自願減量作業與減量額度講義P.10, P.56】"}, {"id": 362, "stem": "某太陽能發電自願減量專案已成功營運滿兩年，該綠能大廠計畫向環境部正式提出「減量額度申請」。在遞交申請文件時，依據法規要件，該廠實務上「必須」檢附下列哪一組關鍵文件與報告，方能啟動額度審查？", "options": {"A": "符合官方最新格式要求之「監測報告書」，以及由許可之第三方查驗機構出具之「查證總結報告」", "B": "由國際第三方評等機構出具之該年度企業 ESG 績效評分證明，以及全球碳排查證合格之「確證總結報告」", "C": "由地方政府核發之「非應繳納碳費對象」之行政免除證明文件，以及再生能源躉購電費收據", "D": "經會計師簽證之全廠近三年財務審計報告，以及廠房固定污染源操作許可證"}, "answer": "A", "explanation": "依據講義與法規之額度申請程序規定，進入第二階段之「額度申請」時，申請者必須提報：1.「監測報告書」（內容須完整說明專案描述、監測情形、減量計算及法規外加性分析）；2.「查證機構出具之查證總結報告」（證明其實質減量效果且無計算錯誤或重複計算），送主管機關審核。【三、溫室氣體自願減量作業與減量額度講義P.10, P.56】"}, {"id": 363, "stem": "依據環境部發布之《溫室氣體自願減量專案管理辦法》，我國推動之自願減量機制為確保減碳成效之真實與嚴謹性，在行政與審查程序上，標準的完整執行流程主要劃分為哪兩個核心申請階段？", "options": {"A": "「註冊申請」階段與「額度申請」階段", "B": "「盤查登錄」階段與「碳費申報」階段", "C": "「確證申請」階段與「交易拍賣」階段", "D": "「自主減量」階段與「抵換專案」階段"}, "answer": "A", "explanation": "我國溫室氣體自願減量專案在實務執行上分為兩大核心程序階段：第一階段為「註冊申請」（審查專案計畫書以核定專案註冊）；第二階段為「額度申請」（依監測報告與查證結果審查並正式核發減量額度）。【三、溫室氣體自願減量作業與減量額度講義P.10】"}, {"id": 364, "stem": "依據環境部《溫室氣體自願減量專案管理辦法》及確證、查證規範，下列關於自願減量專案申請流程與審查之敘述，何者正確？", "options": {"A": "自願減量專案限於由政府機關提出申請，一般民營事業與公司行號不具備申請資格", "B": "自願減量專案僅需在資訊平台登載減碳計畫即可自動取得碳權，無須核發審查", "C": "所有的自願減量專案不論規模大小，其計畫書在申請註冊階段一律免除第三方確證", "D": "專案實施應包含「註冊申請」與「額度申請」兩大階段，且額度核發前應經查證機構查證"}, "answer": "D", "explanation": "依據自願減量專案規範，事業與各級政府皆可提出申請（不含個人/自然人）。專案實施須完整執行「註冊申請」與「額度申請」程序；除了 10 項特定能效或設備汰換之免確證方法學外，其餘專案計畫書皆須確證，且在申請額度前一律必須經查驗機構之「查證」出具聲明方能送審核發。【三、溫室氣體自願減量作業與減量額度講義P.10】"}, {"id": 365, "stem": "當列管事業已完成自願減量專案之註冊並開始實施減碳工作，若擬向環境部正式申請「核發自願減量信用額度（即俗稱之碳權）」，依據自願減量管理辦法，該事業在遞交申請前「必須」先完成下列哪一項法定工作？", "options": {"A": "撰寫「監測報告書」，並經許可之第三方查驗機構完成「查證」出具查證總結報告", "B": "撰寫「專案計畫書」，並委託查驗機構進行「確證」以確認其外加性", "C": "取得 ISO 14064-1 合理保證等級之年度組織盤查查證聲明書", "D": "取得經濟部產業發展署核發之「綠色低碳轉型優良廠商證書」"}, "answer": "A", "explanation": "依據我國自願減量專案程序，已註冊專案於執行後申請核發額度（碳權）時，必須依據註冊之計畫書執行監測，並撰寫「監測報告書」，委託合格查驗機構執行「查證」並出具查證總結報告（查證結果須為合理保證等級），方能向環境部提出額度申請。【三、溫室氣體自願減量作業與減量額度講義P.10】"}, {"id": 366, "stem": "當某電子廠擬針對其廠區之能資源轉型措施，申請適用「需執行確證」之溫室氣體自願減量專案。在專案「註冊階段」中，該廠應遵循之標準合規程序順序應為何？", "options": {"A": "自行估算減量數據 -> 直接向碳交所申請額度上架 -> 主管機關自動註冊", "B": "專案計畫書撰寫 -> 委託查驗機構確證 -> 遞交註冊申請 -> 環境部審查通過完成註冊", "C": "完成年度盤查申報 -> 繳納足額碳費 -> 線上申報系統自動轉換為註冊通過專案", "D": "計畫書撰寫 -> 直接實施減碳監測 -> 提報監測報告書完成行政備查"}, "answer": "B", "explanation": "依據講義自願減量專案註冊程序，標準的「註冊階段」程序依序為：1. 申請單位撰寫「專案計畫書」；2. 委託合格查驗機構執行「確證」並取得確證總結報告；3. 向環境部提出註冊申請；4. 經環境部自願減量專案審議會審查通過，正式完成註冊。【三、溫室氣體自願減量作業與減量額度講義P.10】"}, {"id": 367, "stem": "某造林業者依自願減量計畫在海岸線成功種植了抗鹽防風林。當該專案執行滿一定計入期、擬向環境部申請核發首批碳匯減量額度時，在法規上其必須委託下列哪一個單位進行何種實質程序，以確認實際減碳成效無誤？", "options": {"A": "委託內政部進行土地使用權與公眾意見之行政備查", "B": "委託經認可之第三方查驗機構，依據其註冊之減量方法學對監測報告之數據進行實質「查證（Verification）」", "C": "邀請地方環安領域學者專家組成勘查小組進行非正式之質性評估", "D": "委託執業會計師進行企業社會成本與ESG財務估值之審計"}, "answer": "B", "explanation": "已註冊通過之自願減量專案於執行後申請核發額度時，必須依監測報告撰寫資料，並經由取得許可之第三方查驗機構進行「查證（Verification）」，出具合理保證等級之查證總結報告書後送審。【三、溫室氣體自願減量作業與減量額度講義P.10】"}, {"id": 368, "stem": "某科技公司自願於廠區屋頂設置太陽能發電系統並向環境部成功完成「自願減量專案註冊」。若該公司未來欲正式取得可用於抵扣碳費之「自願減量額度（碳權）」，依據現行法規，應透過下列哪一種程序與機制來辦理核發？", "options": {"A": "專案註冊通過後，每年由系統平台依發電量自動核發並直接匯入帳戶", "B": "委託第三方查驗機構完成「確證」後，即可直接免審核取得碳額度", "C": "於專案實際執行並實施監測後，提報監測報告書與第三方查證證明，依「額度申請」流程送主管機關審查核發", "D": "逕自向台灣碳權交易所提出交易申請，經媒合成功後由平台自動折算核發"}, "answer": "C", "explanation": "自願減量專案的減量額度核發並非自動產生，亦不因註冊或確證而直接核給。申請單位必須先依核定之計畫書執行減量與監測，再撰寫監測報告書、經合格第三方查驗機構執行「查證」出具查證總結報告，並透過資訊平台正式提出「額度申請」階段審查，經環境部核准後方能核發額度並存入帳戶。【三、溫室氣體自願減量作業與減量額度講義P.10】"}, {"id": 369, "stem": "某綠領顧問在輔導客戶執行「溫室氣體自願減量專案」時，必須協助其掌握正確的法定申請流程以降低行政合規成本。請問下列哪一項工作，在性質上「不屬於」我國自願減量專案之標準申請與執行流程的環節？", "options": {"A": "依據環境部審定公開之自願減量方法學，撰寫專案計畫書並向主管機關「申請註冊」", "B": "於專案註冊通過後，依據計畫書中之監測計畫，確實實施減碳工作並詳實記錄能資源監測數據", "C": "於專案執行中向主管機關提出「碳費豁免特許證明書」申請以完全免除其組織盤查與登錄義務", "D": "委託經環境部認可之第三方查驗機構執行實質查證，出具合理保證等級之查證聲明並「申請額度」"}, "answer": "C", "explanation": "我國自願減量專案之合規流程明確包含「註冊申請」與「額度申請」兩大程序，並要求於兩大程序中分別執行「確證（除免確證外）」及「查證」。我國法規中完全「沒有」申請碳費豁免特許證明書以直接免除組織盤查登錄義務之流程，強制列管對象之盤查與自願減量是獨立並行之管理。【三、溫室氣體自願減量作業與減量額度講義P.10】"}, {"id": 370, "stem": "某電子廠在著手向環境部「申請註冊」自願減量專案（非免確證之方法學）時，依據《溫室氣體自願減量專案管理辦法》之規定，下列哪一項法定申請文件「必須」先委託政府許可之第三方查驗機構進行實質審核並出具？", "options": {"A": "監測報告書 (Monitoring Report)", "B": "確證總結報告 (Validation Report)", "C": "查證總結報告 (Verification Report)", "D": "自願減量專案基本資料表"}, "answer": "B", "explanation": "我國自願減量專案標準執行流程主要劃分為「註冊申請」與「額度申請」兩大階段。在「註冊申請」階段，除環境部公告之 10 項免確證方法學外，其專案計畫書皆必須委託查驗機構執行「確證（Validation）」並出具「確證總結報告」；而「查證總結報告」與「監測報告書」則是第二階段「額度申請」之必備文件。【三、溫室氣體自願減量作業與減量額度講義P.10】"}, {"id": 371, "stem": "某市交通局擬針對轄區內 5,000 盞傳統高壓鈉路燈進行「全面升級為智慧高效 LED 道路路燈」之溫室氣體自願減量專案。專案小組正在溫室氣體平台檢索適用之減量方法學。承上述市政路燈升級節電專案情境，依據環境部審定公開之自願減量方法學大綱，此類「室外及道路照明之能源效率提升技術」，應選用下列哪一個標準減量方法學之代碼與名稱？", "options": {"A": "AMS-II.L. 需求端：高效率室外及街燈照明技術 (Demand-side activities for efficient outdoor and street lighting technologies)", "B": "AMS-II.C. 需求端：利用特定技術的能源效率活動 (Demand-side energy efficiency activities for specific technologies)", "C": "AMS-I.F. 再生能源電力之控制使用及微電網 (Renewable electricity generation for captive use and mini-grid)", "D": "AMS-III.C. 排放減緩：低排放車輛與綠色公共交通運輸技術 (Emission reductions by low-greenhouse gas emitting vehicles)"}, "answer": "A", "explanation": "依據講義「自願減量專案免確證減量方法表3.1」，針對街燈及室外公共照明之高效率汰換專案，其標準選用之方法學代碼為 AMS-II.L. 需求端：高效率室外及街燈照明技術，此方法學亦屬於免確證之 10 項方法學之一。【三、溫室氣體自願減量作業與減量額度講義P.13 / P.215】"}, {"id": 372, "stem": "某化學材料製造商早期曾依舊制註冊過「溫室氣體抵換專案」，如今擬依新制提出「溫室氣體自願減量專案」。在比較「新舊機制」於申請程序與確證查證之法理規定時，下列哪一項屬於兩者在註冊審查階段的最主要實質差異？", "options": {"A": "抵換專案之計入期完全不設上限，而自願減量專案之計入期則固定為一律不可展延", "B": "抵換專案在註冊時完全不需撰寫計畫書，而自願減量專案則必須提交長達五百頁的計畫書", "C": "抵換專案僅限於製造業申請，而自願減量專案則限制只有服務業與學校等單位得提出申請", "D": "抵換專案在註冊階段一律必須由第三方查驗機構執行「確證」；而新制自願減量專案針對符合環境部公告之特定能效等10項方法學之專案，放寬為「免確證」"}, "answer": "D", "explanation": "在比較新舊制度之確證與查證規範時，舊制之「溫室氣體抵換專案管理辦法」在註冊階段，所有案件無一例外均必須由第三方查驗機構進行確證；而新制「自願減量專案管理辦法」則因應程序優化，新增了特定 10 項技術成熟明確之方法學於註冊階段得「免除確證」之重要彈性規定。【三、溫室氣體自願減量作業與減量額度講義P.13, P.204】"}, {"id": 373, "stem": "為了積極鼓勵並簡化自願減量專案之註冊程序，環境部針對減量技術成熟、計算簡易明確且於我國有執行案例之減量方法學，規劃了「免確證」之機制。下列哪一種減量方法在提出專案註冊申請時，「不屬於」免除第三方確證之適用範疇？", "options": {"A": "併網的再生能源發電 (AMS-I.D.)", "B": "需求端：利用特定技術的能源效率活動 (AMS-II.C.)", "C": "工業設施採用高效率燈具 (TMS-II.001)", "D": "離岸風力發電廠建置與海洋增匯專案 (AR-TMS0001)"}, "answer": "D", "explanation": "依據自願減量專案免確證減量方法表 3.1，免除第三方確證的減量方法計有 10 項（包括併網再生能源發電 AMS-I.D.、特定技術能效活動 AMS-II.C.、高效率燈具 TMS-II.001、高效率空調 TMS-II.003 等）。大型離岸風力發電與造林增匯專案（如 AR-TMS0001）不屬於免確證範疇，仍須執行確證。【三、溫室氣體自願減量作業與減量額度講義P.13】"}, {"id": 374, "stem": "依據環境部「溫室氣體自願減量暨抵換資訊平台」之分類架構，為了因應不同產業與製程的減碳特性，審定公開之「溫室氣體自願減量專案減量方法學」（如能源工業、製造工業、林業、農業及土地利用等），總共劃分為幾大類別？", "options": {"A": "10 大類別", "B": "12 大類別", "C": "14 大類別", "D": "16 大類別"}, "answer": "C", "explanation": "依據講義，環境部審定公開之自願減量專案減量方法，依產業與製程性質共細分為 14 大類別（自 B-1 能源工業至 B-14 其他類別）。【三、溫室氣體自願減量作業與減量額度講義P.13】"}, {"id": 375, "stem": "在環境部審定公開之自願減量專案減量方法分類編碼中，若某百貨大樓擬採用「更換為高效率空調設備（TMS-II.003）」之方法學，其所對應之減量方法範疇應屬於下列哪一個特定代碼之分類？", "options": {"A": "B-3. 能源需求業", "B": "B-1. 能源工業", "C": "B-6. 運輸業", "D": "B-11. 林業"}, "answer": "A", "explanation": "依據講義方法學分類大綱，高效率空調汰換（TMS-II.003）或工業設施高效率燈具（TMS-II.001）等在需求端採行之節能技術，皆歸類於「B-3. 能源需求業」之方法學類別。【三、溫室氣體自願減量作業與減量額度講義P.13】"}, {"id": 376, "stem": "當企業或研發機構發現其所擬實施之創新低碳製程技術，目前國內外均無現成適用之溫室氣體減量方法學時，得依規定提出「新自願減量方法學」之申請。請問，此項新方法學之受理與最終審查、核定，主責之中央主管機關為下列何者？", "options": {"A": "經濟部產業發展署", "B": "環境部", "C": "國家發展委員會", "D": "台灣碳權交易所"}, "answer": "B", "explanation": "依據《溫室氣體自願減量專案管理辦法》及氣候法規範，所有新自願減量方法學之申請、審定、公開與滾動修正，皆屬於中央主管機關「環境部（氣候變遷署）」之法定權責。【三、溫室氣體自願減量作業與減量額度講義P.13】"}, {"id": 377, "stem": "國際標準與我國法規對執行溫室氣體符合性評估之查驗機構，制定了多項嚴格之行為與技術準則。下列哪一項要素「不屬於」查驗機構或查驗人員本身在執業時應遵循之核心治理與管理原則？", "options": {"A": "獨立性 (Independence) — 確保查驗活動與受查單位無任何經濟或管理利益糾葛", "B": "專業性 (Professionalism/Competence) — 確保查驗人員具備足夠的低碳與能資源量化技術能力", "C": "外加性 (Additionality) — 論證專案在基線情境下並非屬於法規或常規營運", "D": "公正性 (Impartiality) — 確保查驗過程與判定不受任何偏見、偏袒或外部壓力之干擾"}, "answer": "C", "explanation": "查驗機構與人員所應遵循之三大核心治理原則包含：獨立性、公正性（客觀性）及專業能力。而「外加性（Additionality）」是專指自願減量專案（計畫層級）在量化與判定其減碳成效得否核發碳權時所適用之「科學設計原則」，屬於專案邊界與基線本身的物理與政策屬性，非查驗機構本身執業之管理原則。【三、溫室氣體自願減量作業與減量額度講義P.14 / P.44】"}, {"id": 378, "stem": "在自願減量確證作業中，查驗人員應對計畫書中之「外加性（Additionality）」分析進行嚴格評估。下列關於外加性判定原則之敘述，何者最符合法規與方法學之科學精神？", "options": {"A": "只要該專案活動由該公司董事會全票通過且編列大額專案預算，即視為具有技術外加性", "B": "減量效益必須與國際自願性碳交易市場之最新碳權成交價格直接連動方具備市場外加性", "C": "只要該專案活動屬於該公司既有生產製程之例行設備維護保養工作，即具備常規外加性", "D": "證明該專案活動並非現行法規強制要求，且在克服了財務、技術、普遍性等實質障礙下，其減量或移除效益非屬常規下自然發生"}, "answer": "D", "explanation": "「外加性（Additionality）」指專案所產生的溫室氣體減量或移除量，是額外於基線情境的。這意味著該減量活動並非現行法規所強制要求（法規外加性），且若沒有本專案的投入（如因面臨財務、技術或普遍性障礙而難以實施），該減碳效益即無法自然產生。【三、溫室氣體自願減量作業與減量額度講義P.14 / P.48】"}, {"id": 379, "stem": "某晶圓廠在規劃製程含氟廢氣削減自願減量專案。在評估是否符合「法規外加性（Regulatory Additionality）」時，工程師正在確認政府對於此類氣體的法定排放限制。依據溫室氣體自願減量方法學之科學定義，下列哪一項最符合自願減量專案計畫中「法規外加性分析」的核心判斷邏輯？", "options": {"A": "證明該專案所採行之溫室氣體減量措施，並非現行國家法律、地方政府自治條例或任何強制性行政規定所課予之法定義務", "B": "證明該項減碳設備之引進，能協助公司百分之百獲得金管會對於綠色金融授信的最低利率貼補", "C": "確認該廠在過去五年內，沒有因為發生水污染或廢棄物清理不合規而遭受主管機關開立任何罰單", "D": "證明該專案活動所使用之全部資金，百分之百來自非政府組織或私營金融機構之無償投資"}, "answer": "A", "explanation": "「法規外加性」之核心精神，在於確認「該減碳措施並非法律強制要求」。如果某項減碳行為（例如安裝某種尾氣處理設備）已經是我國環保法令、污染防制標準或工廠操作許可條件中明文強制要求必須達成的法定義務，則該行為不具備法規外加性，無法註冊為自願減量專案。【三、溫室氣體自願減量作業與減量額度講義P.14 / P.48】"}, {"id": 380, "stem": "某傳產鋼鐵廠擬為其加熱爐能效改進方案申請註冊自願減量專案。確證小組在評估該專案是否具備「外加性（Additionality）」時，下列哪一種實務情況，會最可能導致該專案被判定「不具備外加性」而遭到退件？", "options": {"A": "該廠所採行之餘熱回收技術仍處於前期示範，且在不考量碳權下其投資回收期長達 15 年", "B": "該專案之推動與施工過程，必須克服多項跨部會之地方自治條例與操作安全法規障礙", "C": "該項減碳設備與措施早已被國內同類業者「普遍採用（Common Practice）」，且政府目前已有強制性補助計畫正在全面推行該措施", "D": "該鋼鐵廠為國內大型上市櫃公司，具備充沛且穩定的自有資金及財務投資能力"}, "answer": "C", "explanation": "外加性（Additionality）要求專案之減碳效益是額外的。如果某項低碳技術或減量措施早已在相同地理與行業別中被「普遍執行（Common Practice）」，或是政府已透過法規、強制性補貼在全面推廣，則該行為在基線情境下屬於常規，不具備技術、障礙或法規外加性，將無法通過註冊。【三、溫室氣體自願減量作業與減量額度講義P.14 / P.48】"}, {"id": 381, "stem": "某大型商辦大樓在順利註冊了「中央空調系統能效優化」自願減量專案後，積極開展節能監測。若在專案「執行與監測期間（計入期內）」，國家修改了《能源管理法》，將該大樓所汰換之能效標準改列為「強制性法定基準」時，依據自願減量管理精神與查證重點，下列關於其「法規外加性（Regulatory Additionality）」之判定與處理原則，何者正確？", "options": {"A": "由於法規發生變動，該專案之計畫計入期應自法規公布之日起算，自動強制展延五年", "B": "該專案應立即轉為「移除（Removal）類型」專案，並重新委託查驗機構執行普遍性分析", "C": "大樓得向環境部申請全額財政補償，用以彌補因法規調整所損失之預期碳權經濟收益", "D": "查驗人員於執行查證時，應確認並評估該減量成效在註冊時是否已符合「法規外加性」，且專案實際實施之成效與監測數據仍符合核定之計畫書與保守原則"}, "answer": "D", "explanation": "法規外加性（Regulatory Additionality）主要是於「註冊申請（確證）階段」進行嚴格之判定（證明其在專案起始日或註冊時非屬強制性要求）。在進入實質執行查證階段時，查驗人員主要核實其是否依據已註冊核定之計畫書執行監測，並評估其數據與計算是否合規、保守。【三、溫室氣體自願減量作業與減量額度講義P.14 / P.57】"}, {"id": 382, "stem": "某林業控股公司計畫透過增加森林碳匯來向環境部申請註冊「移除型（Removal）」自願減量專案。依據我國《溫室氣體自願減量專案管理辦法》，下列哪一項具體措施在定義上屬於典型的移除型（或自然碳匯）專案？", "options": {"A": "設置廠房頂樓併網型太陽光電系統進行發電", "B": "將廠區老舊燃油堆高機汰換為高能效之電動堆高機", "C": "採行加強森林經營或低蓄積林增匯之植樹造林專案", "D": "引進高效冰水主機與變頻空調設備進行節能"}, "answer": "C", "explanation": "移除類型專案（Removal）指的是透過吸收或捕集大氣中的溫室氣體，達成實質減量的目標，例如植樹造林、森林再生、土壤增匯或碳捕集與封存（CCS）等。而 (A)(B)(D) 均屬於減少或避免排放類型。【三、溫室氣體自願減量作業與減量額度講義P.14 / 簡報P.21】"}, {"id": 383, "stem": "自願減量專案依其減量措施類型可分為「移除」及「減少或避免排放」兩大類。依據規範，下列哪一項措施在歸類上「不屬於」減少或避免排放類型中的「節能措施」，而屬於其他獨立的減量措施類別？", "options": {"A": "提升工業設施或鍋爐的能源利用效率", "B": "在既有生產設備或建築物中導入節能技術設備", "C": "推動太陽能、風能等再生能源發電替代化石燃料發電", "D": "改善工業製程並汰換為低能效之耗能設備"}, "answer": "C", "explanation": "在減少或避免排放類型中，「節能措施（A、B、D）」旨在提高既有能源利用效率；而「再生能源替代（C）」則是推動太陽能、風能或水力發電替代化石燃料，這兩者在減量方法學與措施歸類上屬於不同的類別。【三、溫室氣體自願減量作業與減量額度講義P.14】"}, {"id": 384, "stem": "依據《溫室氣體自願減量專案管理辦法》之核心原則，專案活動所取得並核發之「自願減量額度（碳權）」，其量化之碳扣抵或減量成效，是透過專案實際排放量（或移除量），與下列哪一個最可能發生之對照情境進行比對計算而得？", "options": {"A": "全球同業之平均最佳可行技術排放強度情境", "B": "該事業歷史最高碳排放年份之排放情境", "C": "基線情境 (Baseline Scenario)", "D": "先期計畫之既有核定排放情境"}, "answer": "C", "explanation": "自願減量專案的外加性與減量計算核心在於證明減量成效是額外產生的。其減量或移除量，是透過**實際之專案情境（實際排放/移除）與「基線情境」（Baseline Scenario，即若無此專案活動，在既有情況下最可能發生之參照情境）**進行比對與相減得出。【三、溫室氣體自願減量作業與減量額度講義P.14】"}, {"id": 385, "stem": "某電子廠規劃在其既有廠房中導入「智慧能源管理系統（EMS）」並全面汰換低效能的製程冷卻水主機。依據我國自願減量專案之措施分類，此類「透過製程優化與能效提升」來減緩排碳的做法，在申報分類上屬於下列哪一種自願減量專案類型？", "options": {"A": "減少或避免排放類型中的「節能措施」", "B": "溫室氣體移除類型中的「自然碳匯措施」", "C": "減少或避免排放類型中的「燃料替代措施」", "D": "溫室氣體移除類型中的「負排放技術」"}, "answer": "A", "explanation": "汰換高效能設備、導入能管系統以降低能源耗用，屬於自願減量專案中「減少或避免排放」類型底下的「節能措施」。(B)、(D) 為移除型，(C) 則是以低碳燃料替代高碳燃料。【三、溫室氣體自願減量作業與減量額度講義P.14】"}, {"id": 386, "stem": "自願減量專案分為兩大減量路徑。若企業擬規劃「移除（Removal）類型」的減碳專案，下列哪一項技術或實務在規範分類上屬於合規的移除措施？", "options": {"A": "研發更換低碳化學原料以減少反應排放", "B": "採行直接自空氣中補集二氧化碳並將其永久儲存於地底之負排放技術（CCS）", "C": "將廠內公務汽機車全面替換為純電動車輛", "D": "在鋼鐵廠燃燒製程中將燃煤蒸汽鍋爐改用天然氣"}, "answer": "B", "explanation": "移除類型專案（Removal）包含利用林業/土壤等自然碳匯，或利用工程技術如碳捕集與封存（CCS）將大氣中之溫室氣體實質移除並儲存。而 (A) 屬製程改善、(C) 屬移動源替代、(D) 屬固定源燃料轉換，此三者皆屬「減少或避免排放」類型。【三、溫室氣體自願減量作業與減量額度講義P.14】"}, {"id": 387, "stem": "自願減量專案在專案設計（註冊申請）階段，必須明確建立「基線情境（Baseline Scenario）」。請問在碳管理方法學中，設定基線情境的最核心實務目的為何？", "options": {"A": "作為專案實施後，與實際監測排放量（或移除量）進行科學對比，以精確核算「額外減碳效益（減量效果）」的對照依據", "B": "作為向金融機構申請綠色金融綠色授信時，評估專案財務回收期的比較基礎", "C": "證明該專案技術已在我國該地理區域中被廣泛且普遍使用", "D": "作為確認該產品系統是否符合歐盟 CBAM 簡單貨品特定內含排放量的計量依據"}, "answer": "A", "explanation": "基線情境是指在沒有此自願減量專案下，最可能發生的溫室氣體排放或移除情境。設定基線是為了與專案實際執行後的「專案情境」進行相減比對，進而量化出此專案所實質「外加」的減碳或移除效果。【三、溫室氣體自願減量作業與減量額度講義P.14】"}, {"id": 388, "stem": "在自願減量專案的審查中，查驗人員會針對專案計畫書中所執行的「外加性（Additionality）」分析進行嚴格的實質評估。請問，執行外加性分析的最核心目的為何？", "options": {"A": "證明該專案活動並非法律強制要求或常規營運，其所帶來的減量效果確實屬於「額外發生」", "B": "確認設備在運轉過程中，其電力與燃料消耗之質量平衡絕對沒有任何數據誤差", "C": "為了向金融機構證明該專案具有極高之投資報酬率與財務效益", "D": "確認該專案技術是否完全符合歐盟 CBAM 次階段所擬新增的管制範疇"}, "answer": "A", "explanation": "「外加性（Additionality）」是自願減量專案最核心的原則。其核心目的在於論證並證明「該減碳或移除成效，是額外於基線情境（即若沒有此專案，在常規下最可能發生的狀態）」，確保核發的碳權代表真實、額外的環境貢獻，防範漂綠。【三、溫室氣體自願減量作業與減量額度講義P.14】"}, {"id": 389, "stem": "自願減量專案可劃分為「減少或避免排放」及「移除」兩大技術路徑。下列哪一項措施在規範分類上，屬於典型的「減少或避免排放」類型之措施？", "options": {"A": "藉由推動陸域或海岸造林碳匯專案來吸收大氣中二氧化碳", "B": "採行地熱、風力能等「再生能源替代」化石燃料發電", "C": "於沿海濕地復育紅樹林或海草床等藍碳增加專案", "D": "建置高科技二氧化碳直接空氣捕集與永久地底封存（CCS）設備"}, "answer": "B", "explanation": "「減少或避免排放」措施旨在減少現有或預估的排放，包含節能、再生能源替代、改善製程、減少運輸與廢棄物管理。(A)(C)(D) 均屬於藉由增加碳匯或捕集技術直接降低大氣中溫室氣體濃度之「移除（Removal）」路徑。【三、溫室氣體自願減量作業與減量額度講義P.14】"}, {"id": 390, "stem": "某林業公司規劃辦理一項自然造林增匯之自願減量專案。在申請註冊時，該專案屬於「移除（Removal）類型」，若其選擇採用「展延型（Renewable）」計入期，則依據法規限制，其包含展延次數在內之「總計入期年限最高上限」累計可達多少年？", "options": {"A": "20 年", "B": "30 年", "C": "40 年", "D": "15 年"}, "answer": "C", "explanation": "依據管理辦法（表 3.2），移除類型之自願減量專案若選擇「展延型」，其首次計入期以 20 年為限，且最多得展延 2 次（每次展延以 10 年為限），因此總計入期上限累計最長為 20 + 10 + 10 = 40 年。【三、溫室氣體自願減量作業與減量額度講義P.17 / 簡報P.311】"}, {"id": 391, "stem": "某客運公司擬推動「汰換為低碳運輸工具（電動公車）」之自願減量專案。該專案屬於「減少或避免排放類型」，若其在註冊申請時選擇了「固定型（Fixed）」計入期，則依據管理辦法規定，其專案計入期（可取得減量額度之執行期間）最長以幾年為限且「不得展延」？", "options": {"A": "5 年", "B": "15 年", "C": "20 年", "D": "10 年"}, "answer": "D", "explanation": "依據管理辦法第 7 條（表 3.2），屬於「減少或避免排放類型」之專案（如能效提升、電動公車等），若在註冊時選擇「固定型」計入期，其取得減量額度之執行期間一律以 10 年 為限，且期滿後不得再申請展延。【三、溫室氣體自願減量作業與減量額度講義P.17 / 簡報P.311】"}, {"id": 392, "stem": "某智慧製造園區規劃提出「低碳熱回收與廠房能效節能提升」之自願減量專案。財務總監在試算該專案未來可供申請取得碳權之年限，以進行 IRR 之敏感性分析。依據現行《溫室氣體自願減量專案管理辦法》第七條關於「專案計入期（Crediting Period）」之年限與展延規範，下列哪一個選項之敘述最為正確？", "options": {"A": "為了避免碳權浮濫，所有註冊專案之計入期一律被法定制約為最長 10 年，期滿後絕對不得提出展延申請", "B": "計入期之展延型與固定型之選擇，僅屬文書格式之不同，兩者在最終之總累計可取得碳權年限上限上完全沒有任何差異", "C": "屬於「減少或避免排放」技術類型之專案（如：節能或燃料替代），若選擇「展延型計入期」，其單次計入期為 5 年，且最多得申請展延 2 次，累計最長年限不得超過 15 年", "D": "展延型計入期之起始生效日期，一律強制必須自該減碳設備之破土動工建造日（而非專案註冊通過或實際執行日）起自動開始計算"}, "answer": "C", "explanation": "依據管理辦法計入期規定，屬於「減少或避免排放」技術類型之專案（如：節能或燃料替代），若選擇「展延型計入期」，其單次計入期為 5 年，且最多得申請展延 2 次（5年 × 3期 ＝ 累計最長 15 年），期滿後不可再展延。且計入期起始日不可早於註冊完成日。【三、溫室氣體自願減量作業與減量額度講義P.17 / 簡報P.311】"}, {"id": 393, "stem": "依據環境部自願減量專案之設計要求，「減少或避免排放類型」之減量措施，在申請註冊時，其開始執行的時間原則上應以註冊申請日前幾年內執行者為限？", "options": {"A": "一年內", "B": "兩年內", "C": "三年內", "D": "五年內"}, "answer": "C", "explanation": "依據規範，屬於「減少或避免排放類型」之自願減量措施，應以註冊申請日前三年內開始執行者為限，以確保專案符合執行之時效性。【三、溫室氣體自願減量作業與減量額度講義P.19】"}, {"id": 394, "stem": "某綠領顧問在向一家傳統中小型精密金屬加工廠的董事會介紹我國的「自願減量專案（碳權）」機制。依據我國《氣候變遷因應法》之立法宗旨與配套辦法，政府建立本國「自願減量交易與專案制度」的最上位核心政策目標為何？", "options": {"A": "強制要求國內所有未達強制盤查列管標準的中小企業，一律必須無償向政府交出其碳資產以充實國庫", "B": "由政府核發紙本憑證並允許民間一般單位自由進行線下的代銷、仲介與買賣，以刺激國內一般金融商品之高頻交易", "C": "專門為了向外銷歐盟之鋼鐵、水泥等碳密集產業課徵懲罰性的關稅成本而設計之行政管制手段", "D": "提供經濟與市場誘因，鼓勵非屬強制納管之排放源及各級政府自發執行實質減量或增匯，並核發碳額度供抵扣碳費或市場交易，協同達成國家氣候目標"}, "answer": "D", "explanation": "自願減量交易制度之政策核心宗旨，在於提供市場誘因與彈性機制，透過「碳有價化」引導國內非強制納管之一般企業、機關或學校等主動採行低碳與增匯措施，核發的碳權可作為碳費折抵或在碳交所交易，以多元管道促進國家整體溫室氣體減量成效之提升。【三、溫室氣體自願減量作業與減量額度講義P.2 / P.9】"}, {"id": 395, "stem": "隨著我國正式推動碳費徵收與淨零轉型，環境部訂定《溫室氣體自願減量專案管理辦法》以建立本國碳信用機制。請問，下列關於我國推動「自願減量專案」之核心政策宗旨與精神，何者敘述最為精確？", "options": {"A": "旨在提供經濟誘因，鼓勵非屬強制納管之事業及各級政府自主實施減碳或增匯措施，並依方法學核發「減量額度」以供抵扣碳費或於市場交易", "B": "為配合國家產業政策，強制要求國內所有中小企業一律必須購買並持有特定數量的自願減量額度方得繼續營運", "C": "專門為了補貼化石燃料進口商及高污染重工業而特別設計之無償財務返還制度", "D": "限制只有在海外註冊之跨國投資機構方能提出專案申請，藉此引進國外之熱錢與外資"}, "answer": "A", "explanation": "自願減量專案（碳信用機制）本質上是一種「鼓勵並獎勵自願減量行為」的機制。其政策定位在於提供經濟補足與市場誘因，鼓勵國內企業、機關或學校主動執行實質減碳或自然碳匯措施，並將認證的減量成果（碳權）供抵免碳費或交易，輔助國家減量目標之達成。【三、溫室氣體自願減量作業與減量額度講義P.2, P.9】"}, {"id": 396, "stem": "在自願減量專案之專案監測期間，若原導入之減量設備發生損壞或故障，依據環境部自願減量專案註冊申請與監測規範，申請單位應採取何種方式因應以符合保守性原則？", "options": {"A": "應更換較高效率或相同效率之設備；且若更換為更高效率產品，在實際減量計算上仍應以原產品效率計算", "B": "於監測報告中說明損壞情形即可，無須更換設備亦無須調整減量計算", "C": "一律以過去該設備損壞前的監測數據直接估算並維持原計畫書預估量", "D": "採購同類型的類似設備進行替換，無須考量效率是否相同或是否高於原設備"}, "answer": "A", "explanation": "依據自願減量專案監測規範（如汰換燈具之檢核表條款），專案監測期間若設備有損壞，應採用較高效率或相同效率之設備。但若更換為效率更高的產品時，考量「保守性原則」，於實際減量計算上，仍應以原註冊計畫書中產品之效率來計算，以防高估外加之減量成效。【三、溫室氣體自願減量作業與減量額度講義P.23】"}, {"id": 397, "stem": "某養豬場擬向環境部提出「厭氧消化發電與沼氣收集」之微型規模自願減量專案註冊。專案人員在編寫環境與利害關係人意見時，正在確認是否需要召開大型公聽會。依據環境部自願減量專案確證與計畫書編寫要件，關於「環境衝擊分析及公眾意見確認」之查驗重點，下列哪一項敘述「錯誤」？", "options": {"A": "計畫書應清楚載明本案之環境影響分析重點、預估可能造成之環境衝擊，並提出可行之因應或緩解對策與文獻", "B": "必須在計畫書中檢附實質調查或徵詢公眾與利害關係人意見之相關證明，例如：公眾調查問卷、上網公示紀錄、說明會通知或會議簽到紀錄等", "C": "申請單位應對收集到之公眾意見進行系統性彙整，並在計畫書中對公眾關切之議題提出明確之答覆與因應作為", "D": "不論專案規模大小，即使是申請「微型規模（年減量小於2萬公噸）」之自願減量專案，亦必須強制提交完整的環境影響評估法規說明書與大規模公聽會報告"}, "answer": "D", "explanation": "依據計畫書之揭露規範（表4.2、表4.3），對於「微型規模自願減量專案」，其計畫書在環境衝擊與公眾意見章節之揭露要求已大幅簡化，無需像大/小型規模專案般提交極為繁複之環境評估佐證與程序。因此 (D) 的描述是錯誤的（即為本題之正確答案）。【三、溫室氣體自願減量作業與減量額度講義P.25 / P.26】"}, {"id": 398, "stem": "在撰寫小規模或大規模之溫室氣體自願減量「專案計畫書（PDD）」以申請註冊時，依據環境部公告之標準格式與確證要件，計畫書之「核心技術論述」章節中，必須包含且詳實論證下列哪一組項目？", "options": {"A": "企業未來五年的財務合併報表與股權架構", "B": "該專案之設備供應商全球低碳行銷策略與智慧財產權授權書", "C": "全廠固定污染源之空氣污染防制設備折舊率與維護合約", "D": "該專案之「專案邊界」界定與「外加性（Additionality）」分析"}, "answer": "D", "explanation": "依據計畫書必要揭露與審查格式，計畫書在技術論證上的核心重點，為依循方法學明確界定「專案邊界」，並執行「基準線情境選擇」與「外加性之分析與說明」，以確認其實質減碳效果與合規性。【三、溫室氣體自願減量作業與減量額度講義P.25 / 簡報P.296】"}, {"id": 399, "stem": "某半導體廠綠領工程師在著手編寫其「製程氟氣（SF6/NF3）削減自願減量專案」之「專案計畫書」以申請註冊。依據環境部公告之標準格式與必要公開揭露事項，該計畫書中「不需」包含或著墨下列哪一項與專案技術無關之章節？", "options": {"A": "減量方法之適用性分析與該製程設備之機齡與效能說明", "B": "針對未來十年歐盟與英國 CBAM 政策發展趨勢之宏觀經濟與地緣政治展望評估", "C": "基線情境之選擇論述，以及多個替代情境之法規與財務外加性分析", "D": "針對可能造成之環境衝擊進行分析並提出可行因應對策，且檢附調查公眾意見之證明文件"}, "answer": "B", "explanation": "依據專案計畫書必要公開揭露事項（表 4.2、表 4.3），計畫書必填與審查章節包含：一般描述、方法學適用性及邊界設定、基線與外加性分析、減量計算、監測計畫、環境衝擊與公眾意見。計畫書主要著眼於該減量專案的實質工程技術與減量效益，無須也「不需包含歐盟/英國 CBAM 宏觀政治經濟之展望與分析」。【三、溫室氣體自願減量作業與減量額度講義P.25, P.26】"}, {"id": 400, "stem": "在自願減量專案計畫書的標準格式中，申請單位必須清楚臚列並推估「基線排放量（Baseline Emissions）」、「專案排放量（Project Emissions）」以及「洩漏量（Leakage）」，並核算出預估總減量。此項推算過程與公式應用，應撰寫於計畫書的哪一個特定章節中？", "options": {"A": "環境衝擊分析說明", "B": "減量計算說明", "C": "公眾意見描述與回應", "D": "專案活動之一般描述"}, "answer": "B", "explanation": "依據專案計畫書必要公開揭露格式（表 4.3），對於減量公式之套用、參數選用、預估基準線排放與專案排放之運算過程，皆應統一完整撰寫於「三、減量計算說明」章節中。【三、溫室氣體自願減量作業與減量額度講義P.26 / 簡報P.297】"}, {"id": 401, "stem": "某化學製品廠擬申請「蒸汽鍋爐低碳燃料替代」之自願減量專案。專案人員在編寫專案計畫書時，必須針對基線情境排放量、專案預估排放量及可能產生的洩漏量進行公式推導與數值填報。依據環境部自願減量專案計畫書之標準格式與編寫重點，上述關於「基線排放、專案排放與洩漏排放」之數據推估與核算，在性質上屬於專案設計的哪一個核心環節？", "options": {"A": "減量或移除量計算說明", "B": "註冊申請階段之行政格式與齊備性審查", "C": "利害關係人與公眾意見之收集與回應", "D": "查驗機構對自廠量測設備之技術符合性確證"}, "answer": "A", "explanation": "依據《溫室氣體自願減量專案計畫書》必要公開揭露格式，基線排放量、專案排放量與洩漏量之推算與其預估之年度總減量，均應統一編製與填列於「三、減量或移除量計算說明」章節中。【三、溫室氣體自願減量作業與減量額度講義P.26】"}, {"id": 402, "stem": "某市客運公司為了減少其市區營運路線之直接排放，擬採購並引進 22 輛全新之「純電動大客車」以完全替代原有 3 條路線上高碳排之舊型「重油柴油公車」，並以車輛實際行駛里程、用電與燃油之二氧化碳當量差，來申請核發自願減量專案之減量額度。承上述客運交通工具汰換情境，該公司在撰寫自願減量專案計畫書時，其所引用之標準車輛減量方法學（Methodology）代碼應為下列何者？", "options": {"A": "AMS-II.L. 需求端：高效率照明技術之推廣與改善", "B": "AMS-I.F. 再生能源電力之自主控制與離網利用", "C": "AMS-III.C. 排放減緩：低溫室氣體排放之車輛與電動/混合動力載具之減排活動 (Emission reductions by low-greenhouse gas emitting vehicles)", "D": "AMS-II.C. 需求端：利用特定高效設備之節電技術活動"}, "answer": "C", "explanation": "依據講義之自願減量專案實例，交通客運之電動公車、電動汽車或混合動力運具之減排專案，其所套用與引用之標準溫室氣體自願減量方法學代碼為 AMS-III.C.（低排放車輛與載具之減量活動）。【三、溫室氣體自願減量作業與減量額度講義P.27 / 表4.4】"}, {"id": 403, "stem": "查驗機構在執行組織型溫室氣體盤查之「邊界設定確證」時，為確保邊界合規，下列哪一項是查驗人員「不應」予以接受或確認的錯誤做法？", "options": {"A": "核對目的事業主管機關核准設立或登記資訊（如工廠登記證）之編號與實體範圍", "B": "確認受查驗者之邊界設定方法已文件化，並在報告書中清楚揭露", "C": "檢核本廠（場）排放源平面配置圖是否已完整繪製並標註所有關鍵設施", "D": "允許受查驗者因部分子公司數據蒐集不易，而逕自改採「營運控制權法」或「股權持分法」設定強制盤查之實體邊界"}, "answer": "D", "explanation": "我國強制列管對象辦理盤查時，邊界設定應以目的事業主管機關核准設立、登記或營運之實體邊界（如工廠登記證或商工登記地址）辦理。這與 ISO 14064-1 組織盤查中可以自由選擇「營運控制權」或「股權持分」的設定方式不同。查驗人員應確證其符合我國法規邊界，不可接受自由切換或比例分攤子公司邊界。【三、溫室氣體自願減量作業與減量額度講義P.29】"}, {"id": 404, "stem": "某列管事業於其新建廠房之屋頂自行建置太陽光電發電系統，並將該系統所產生的電力全部以「自發自用」之方式供給廠內特定生產線使用。依據溫室氣體盤查量化實務，在盤查申報該自發自用電力所生之排放量時，其電力排碳係數應如何估算？", "options": {"A": "應採用國家最新公告之一般電力排碳係數（如：0.495 公噸 CO2e／千度）", "B": "由於屬太陽能再生能源之利用，其電力排放係數應視為「0」計算", "C": "應依據太陽能板製造之生命週期碳足跡進行折算", "D": "應依該製程電爐之出廠額定最大功率進行推估"}, "answer": "B", "explanation": "依據盤查及查驗規範之量化方法規定，屬太陽能及風力類型之再生能源，不論是自發自用或向售電業者購買並取得電證合一證明者，其使用該再生能源電力之排碳係數皆以 0 計算。【三、溫室氣體自願減量作業與減量額度講義P.33】"}, {"id": 405, "stem": "某精密電子廠向外部再生能源售電業者購買綠電以降低其間接排放。若該廠擬於溫室氣體盤查清冊中，宣告該筆購電之排放係數為零，依據環境部規範，除需檢具受查驗者所擁有之國家再生能源憑證（T-REC）外，還必須提供下列哪一項關鍵佐證文件？", "options": {"A": "外購電力設備之 ISO 50001 能源管理系統證書", "B": "該批發電設備出廠之出廠合格檢驗報告", "C": "台電公司或售電業者提供轉供服務之轉供證明", "D": "該售電業者之合併財務報告與營收證明"}, "answer": "C", "explanation": "依據講義中電力係數引用之確證與查證重點，外購電力之再生能源使用應檢具標準檢驗局國家再生能源憑證中心核發之憑證，以及「台電公司或售電業者提供轉供服務之轉供證明」（電證合一），方能據以將該用電部分之排放係數引用為 0。【三、溫室氣體自願減量作業與減量額度講義P.33】"}, {"id": 406, "stem": "依據環境部《溫室氣體排放量盤查作業指引》與數據量化規範，下列關於再生能源憑證與電力排放係數引用之敘述，何者正確？", "options": {"A": "屬生質能發電之再生能源憑證，其排放係數不可直接視為「0」，應依生質能與廢棄物之種類與組成比例自行計算", "B": "只要取得國家再生能源憑證（T-REC），不論是太陽能、風力或生質能，其排碳係數一律以 0 計算", "C": "屬生質能發電者，其排放係數應統一比照燃煤發電之預設排碳係數", "D": "生質能發電在任何情況下皆不屬於國家盤查列管之邊界範圍，免予盤查"}, "answer": "A", "explanation": "依據講義量化與查證規定，太陽能與風力類型之再生能源其排放係數為 0；但若「屬生質能者，其排放係數應另行計算」，不得直接視為 0 計算。【三、溫室氣體自願減量作業與減量額度講義P.33】"}, {"id": 407, "stem": "某鋼鐵廠永續部門正著手編寫其新一期「高爐低溫餘熱回收發電自願減量專案」之「專案計畫書（PDD）」以向環境部申請註冊。依據《溫室氣體自願減量專案管理辦法》及確證格式規範，該計畫書在技術確證與行政審查時，其「格式與必填章節」在合規上必須遵循下列哪一項標準？", "options": {"A": "可由業者根據公司內部慣用之文書處理格式自由設計章節，僅需以簡單文字摘要列出年度總減量目標即可", "B": "計畫書得在初審前完全省略基線情境設定與不確定性分析，留待第二階段申請額度時，再由系統平台自動編製", "C": "專案若屬於年減碳量達一萬公噸以下之小規模專案，計畫書中得全數免予填寫「環境衝擊分析與公眾意見」章節", "D": "必須嚴格依據環境部所公告之最新版標準計畫書範本格式撰寫，並確實完整填報包含專案活動描述、減量方法適用性、專案邊界、外加性分析、減量計算、監測計畫、環境衝擊與公眾意見等所有法定章節"}, "answer": "D", "explanation": "依據自願減量專案計畫書格式（6.2條），不論是大、中、小、微型專案，專案計畫書均必須採用環境部公告之最新格式。計畫書所有必填章節（包括專案活動一般描述、方法學適用性及邊界設定、減量計算、監測計畫、環境衝擊及公眾意見等，詳見表 4.2、表 4.3）均應完整填寫並提供充分佐證，不可任意遺漏或留待事後再補。【三、溫室氣體自願減量作業與減量額度講義P.44 / 6.2條】"}, {"id": 408, "stem": "某電子零組件廠在評估是否能將其廠區內多項節能及屋頂光電措施，申請註冊為「溫室氣體自願減量專案」。依據現行《溫室氣體自願減量專案管理辦法》之「專案排除條件」，下列哪一項減量措施或排放源，在法規上「並非」明文禁止或排除於自願減量專案申請範疇之外？", "options": {"A": "屬於依《氣候變遷因應法》規定，應繳納國家碳費之溫室氣體排放源", "B": "該減量措施或能效提升方案之實際「執行起始日」，係落於自願減量專案「註冊申請日之前兩年」", "C": "專案邊界內已申請或規劃申請主管機關核發「再生能源憑證（T-REC）」之發電設備", "D": "屬於政府所公告、應辦理盤查登錄及查驗之第一批及第二批溫室氣體強制列管排放源"}, "answer": "B", "explanation": "依據自願減量管理辦法第 11 條規定，專案排除條件包含：1. 屬強制盤查列管對象；2. 屬應繳納碳費之排放源；3. 已申請再生能源憑證之發電設備。此外，法規規定排除「註冊申請日 3 年前已執行之減量措施」。因此，若執行起始日為註冊申請日前兩年（未滿 3 年），在時間上是合規的、非排除對象。【三、溫室氣體自願減量作業與減量額度講義P.44 / 簡報P.251】"}, {"id": 409, "stem": "某造紙廠擬向環境部申請其「鍋爐改用天然氣」之自願減量專案註冊。在第一階段的「註冊申請」程序中，該廠在系統申報時，所提報之「專案計畫書」依法應包含下列哪些核心內容與規劃？", "options": {"A": "該廠近十年的合併財務審計報告與股東股權分配明細", "B": "由第三方獨立機構進行之同業惡性競爭防範與行銷策略評估", "C": "詳述專案活動、界定專案邊界與基線情境、進行外加性分析，並提出減量計算公式與監測計畫", "D": "該廠引進之特定設備之智慧財產權與專利技術之獨家授權合約書"}, "answer": "C", "explanation": "自願減量專案計畫書（PDD）在註冊確證與審查時之法定格式必填內容，主要包括：專案活動描述（含執行費用、地點等）、減量方法適用性、專案邊界與基準線界定、外加性分析、減量計算、監測計畫、環境衝擊與公眾意見。財務審計報告、智慧財產專利等非屬必要之申報內容。【三、溫室氣體自願減量作業與減量額度講義P.44】"}, {"id": 410, "stem": "某鋼鐵廠委託合格第三方查驗機構，對其「高爐高能量餘熱發電」自願減量專案之計畫書執行註冊前確證。依據《溫室氣體自願減量專案確證重點》，查驗人員在檢核「自願減量專案計畫書（PDD）格式」與應附文件時，下列哪一項敘述最為正確？", "options": {"A": "確證時僅需檢附專案設備之實體活動配置圖說，無須填列任何文字內容", "B": "若該專案之額度僅用於折抵自廠碳費而不涉及公開碳交易，得完全免填計畫書中之「環境衝擊分析」章節", "C": "專案計畫書之內容與各章節架構，應嚴格依據環境部所公告之最新版標準格式填寫，並檢附相關數據與佐證資料", "D": "在「減量計算」章節中，計畫書僅需列出公式結構即可，其實際推估之減量數據與基線數據得留待第二階段額度申請時再行填報"}, "answer": "C", "explanation": "確證人員必須核對申請案是否採用環境部公告之最新計畫書範本與格式。計畫書所有必填章節（含環境衝擊、減量計算預估等）均應依規定填列，並提供充足、具備可追溯性之佐證文件，不可遺漏或留待額度申請時才填寫。【三、溫室氣體自願減量作業與減量額度講義P.44】"}, {"id": 411, "stem": "第三方查驗機構在防範利益衝突（Conflict of Interest）上受到嚴格的法律約束。下列關於溫室氣體查驗機構與查驗作業的相關描述，何者「錯誤」？", "options": {"A": "查驗機構必須取得中央主管機關（環境部）核發且在有效期限內之許可證書，方得承接法定業務", "B": "為了協助企業加速取得碳權，查驗機構可同時擔任同一個專案的計畫書（PDD）「輔導撰寫顧問」與「確證/查證機構」，以提供一條龍的高效服務", "C": "參與確證或查證之查驗人員（如主導查驗員），其專業資格與訓練證明必須符合環境部之審查與認可要件", "D": "查驗機構所執行之符合性評鑑，標準程序必須包含前期的「書面文件審查」與實質的「現場勘查與確認」"}, "answer": "B", "explanation": "依據《溫室氣體認證機構及查驗機構管理辦法》與國際標準（如 ISO/IEC 17029），為維護公正性，查驗機構絕對禁止「自己輔導、自己查驗」（既當裁判又當球員）。查驗機構不得為同一個盤查或自願減量專案同時提供顧問輔導與確證/查證服務。因此 (B) 的描述是錯誤的（符合題意）。【三、溫室氣體自願減量作業與減量額度講義P.45 / P.258】"}, {"id": 412, "stem": "在執行組織型碳盤查查證或自願減量確證時，第三方查驗機構（Validation and Verification Body, VVB）扮演著極為關鍵的品質把關角色。依據我國溫室氣體法治，查驗機構在法律與實務上的「核心角色與定位」應為下列何者？", "options": {"A": "經由國家認證機構認證、並取得環境部許可，執行客觀、中立與具備獨立性之「第三方符合性查驗機構」", "B": "為受列管企業引進高效低碳製程設備並提供工程安裝與技術整合服務之「設備供應商」", "C": "協助受查驗之事業單位撰寫盤查報告書、規劃自主減量計畫並協助財務優化之「顧問機構」", "D": "與受列管之排碳大戶簽訂長期策略性財務分成合約、共同爭取國家碳費最大折扣之「合作夥伴」"}, "answer": "A", "explanation": "第三方查驗機構之法理與實務定位，是經由認證機構（如 TAF）符合性認證，並向主管機關（環境部）申請許可通過、具備高度獨立、客觀與公正性之中立「第三方機構」，其職責在於為政府與社會大眾把關碳數據品質，不可扮演顧問、設備商或合夥人等有利益衝突之角色。【三、溫室氣體自願減量作業與減量額度講義P.45 / P.271】"}, {"id": 413, "stem": "查驗人員在執行自願減量專案計畫書之「確證」作業時，必須針對「專案活動描述」之合規性與完整性進行審查。下列關於計畫書中「專案活動描述」之敘述，何者最為正確？", "options": {"A": "聯合共同提出專案者，無需提供經公證之合約書，僅需口頭承諾額度分配即可", "B": "專案活動描述只需著重於設備名稱，免予詳列地理區位之經緯度一致性", "C": "若選擇減少排放類型，其減量設備機齡與負載平衡等技術細節可免予在計畫書中交代", "D": "必須詳列執行費用（資金來源），並敘明經費是否包含政府補助或躉購費率等"}, "answer": "D", "explanation": "依據確證與計畫書撰寫規範，計畫書必須確實敘明執行費用與資金來源，包含是否享有政府補助或再生能源躉購費率等。而共同合作者必須檢具「經公證之合約書」；地理區位與經緯度必須維持高度一致性；技術細節（如設備機齡、壽命、負載係數）為減少排放型專案之必填項目。【三、溫室氣體自願減量作業與減量額度講義P.45 / 簡報P.253】"}, {"id": 414, "stem": "某垃圾掩埋場計畫引進「沼氣收集燃燒發電」設備。查驗人員在執行專案計畫書確證時，正對第一章「專案活動之一般描述」之合規性進行把關。依據環境部《自願減量專案確證重點》，查驗人員在審查計畫書之「專案活動描述」時，下列哪一項敘述最為正確？", "options": {"A": "查驗人員必須確認計畫書所臚列之減量設備、工藝技術及活動範疇，是否完全符合其所選用之自願減量方法學（Methodology）之適用條件，且該專案「並無惡意拆解活動、刻意降低申報規模」之嫌", "B": "專案描述僅需簡單提供一張廠區地理位置之衛星地圖，無須在計畫書中交代各製程單元之細部能資源流動流程", "C": "計畫書得完全省略其建置資金來源、是否包含政府補助或綠色信貸等財務合作資訊，僅需交代硬體設備之技術參數", "D": "若申請案件屬於太陽光電或風力發電等再生能源專案，計畫書僅需標明電力受電端之併網位置與裝機容量，無須提供任何製程設備明細"}, "answer": "A", "explanation": "依據計畫書之確證與審查要件，查驗人員應核對專案之技術明細與活動，確認其完全落在所選方法學的適用範疇與邊界內，且應特別留意申請單位是否為了適用簡化程序，而將一個大專案惡意「拆解」為數個小規模或微型專案申請。同時，資金來源與政府補助等合作資訊亦屬必填項目。【三、溫室氣體自願減量作業與減量額度講義P.45 / 簡報P.253】"}, {"id": 415, "stem": "某百貨集團綠領永續師正在為多個營業據點之「節能汰換計畫」，評估套用環境部審定公開之「自願減量專案減量方法學」。依據溫室氣體自願減量專案確證要件，在決定與確證所選用之量化方法學時，查驗人員與申請單位最應優先且核心檢核的合規原則為何？", "options": {"A": "確認所選用之方法學是否為歐盟碳邊境調整機制（CBAM）或英國 CBAM 於過渡期內所強制要求採用之公式", "B": "評估並確認該項方法學所核算出來之溫室氣體減量百分比，是否能達成公司在自家 ESG 永續報告書中所宣稱的最大化", "C": "確認該專案之「實質減量技術、設備規格及營運活動」，是否完全對應並符合該方法學所明訂之「適用條件（Applicability Conditions）」與範疇", "D": "確認該方法學在國際自願性碳交易市場（如 VCS 或 GS）中之單噸碳權交易價格是否大於美金 10 元"}, "answer": "C", "explanation": "依據自願減量專案計畫書確證重點（6.4條），減量方法適用性（Applicability）之確證為核心要件。確證人員應確實核對受查專案之實際製程、燃料、設備能力或土地類型，是否完全與該減量方法學所規定之各項適用門檻、限制及條件一致，防止方法學之誤用與亂用。【三、溫室氣體自願減量作業與減量額度講義P.46 / 6.4條】"}, {"id": 416, "stem": "某林業公司規劃向環境部遞交一項新植造林自然碳匯專案之「註冊申請」。在第一階段的技術確證（Validation）與註冊審查中，下列哪一種技術或格式上的缺失，會最直接且最嚴重地導致該專案被判定不合規、進而「無法成功註冊」？", "options": {"A": "計畫書附件中未檢附公司最新的年度會計財務報表與股東股權結構明細", "B": "所選用之溫室氣體減量方法學（Methodology）版本不一致，或方法學之適用條件與專案實質減碳措施不符", "C": "專案計畫書中所承諾之高能效設備或植樹養護，在確證送審當日尚未全部完工並進入實質營運", "D": "計畫書中尚未累積滿 12 個月以上的實際連續數據監測及定期儀器校正紀錄"}, "answer": "B", "explanation": "依據確證與註冊審查規範，專案橫向跨入自願減量之關鍵前提之一，為其所選用的減量方法學（Methodology）及其版次必須完全正確，且專案之實質技術與邊界必須完全符合該方法學所規定之「適用條件（Applicability Conditions）」。若方法學適用性存在根本性錯誤或與專案不符，將導致專案在確證階段即被退件。相較之下，註冊階段設備無須全部汰換完成，亦無須滿 12 個月之監測紀錄（監測屬於額度申請階段之要求）。【三、溫室氣體自願減量作業與減量額度講義P.46 / 6.4條】"}, {"id": 417, "stem": "某鋼鐵集團擬將其新建的一貫煉鋼廠「焦爐煤氣高效發電與資源回收系統」，申請為「大規模」溫室氣體自願減量專案。依據環境部《溫室氣體自願減量專案管理辦法》之規定，此類「大規模」減量專案，其計畫書在技術確證時，依法「強制必須執行並完整提交」下列哪一組外加性分析？", "options": {"A": "僅需執行法規外加性分析，財務外加性、障礙分析與普遍性分析皆享有免除", "B": "財務外加性分析、障礙分析及普遍性分析採「三擇二」執行，法規外加性則可視情況省略", "C": "法規外加性分析、財務外加性分析、障礙分析及普遍性分析「四者皆應完整執行」", "D": "僅需在計畫書中定性說明普遍性即可，其餘外加性分析均交由查驗機構赴現地估算"}, "answer": "C", "explanation": "依據自願減量專案規模與外加性分析規定（表 3.3/表 6.2），對於引用「大規模減量方法」之專案，其計畫書中之外加性分析為最嚴格等級，法規外加性、財務外加性、障礙分析及普遍性分析四個維度「均必須完整執行且不可免除」。【三、溫室氣體自願減量作業與減量額度講義P.47 / 表6.2】"}, {"id": 418, "stem": "某中小企業擬為其廠房推動「汰換為 15 台高效率變頻空調設備（年減量預估達 1,200 公噸 CO2e）」之自願減量專案。承上述專案情境，由於該專案規模符合我國「微型規模（Micro-scale）」之範疇。依據《溫室氣體自願減量專案管理辦法》，此案之計畫書在註冊確證時，其外加性分析可簡化為下列何者？", "options": {"A": "必須強制分析該汰換工程之折現率與投資回收期，但免予執行法規分析", "B": "財務外加性、障礙分析及普遍性分析仍應完整執行，僅能免除法規外加性", "C": "只需針對該汰換措施是否符合普遍性（Common Practice）進行定性論述即可", "D": "得享有簡化程序，在計畫書中「僅需執行法規外加性（Regulatory Additionality）分析」"}, "answer": "D", "explanation": "依據自願減量專案外加性分析之規定，微型規模自願減量專案（年減量小於或等於 2 萬公噸 CO2e，或節能型年節電量小於或等於 2,000 萬度）在計畫書之外加性章節，享有最大的簡化優待，其財務外加性、障礙分析及普遍性分析皆免予執行，「得僅分析法規外加性」。【三、溫室氣體自願減量作業與減量額度講義P.47 / 表6.2】"}, {"id": 419, "stem": "某客運公司擬將其旗下特定市區路線上「22 輛柴油公車汰換為純電動公車（預估年減碳量達 4,500 公噸 CO2e）」之專案，申請為「小規模」自願減量專案。依據環境部《溫室氣體自願減量專案管理辦法》之規定，此類「小規模」專案在計畫書中應執行之外加性分析要求為何？", "options": {"A": "強制必須執行「法規外加性分析」，且其餘三項（財務外加性、障礙分析或普遍性分析）得「三擇一」執行", "B": "必須與微型規模專案完全一致，計畫書中可豁免所有外加性分析、直接送件註冊", "C": "必須與大規模專案完全相同，法規外加性、財務外加性、障礙分析及普遍性分析「四者皆應完整執行」", "D": "無須套用任何方法學，外加性之分析由查驗機構赴現場實地抄表後自行決定"}, "answer": "A", "explanation": "依據規模與外加性分析之規定（表 3.3/表 6.2），對於引用「小規模減量方法」之專案，其外加性分析要求為：1.「法規外加性分析」為必填項目；2. 其餘三項（財務外加性、障礙分析或普遍性分析）則享有彈性，「僅需三擇一執行」即可。【三、溫室氣體自願減量作業與減量額度講義P.47 / 表6.2】"}, {"id": 420, "stem": "某集團之永續委員會正在針對旗下多個不同減量規模之「低碳替代專案」，進行確證程序之合規性分類評估。依據我國現行自願減量管理與確證技術規範，關於不同規模自願減量專案在外加性分析上的要求，下列敘述何者最為精確？", "options": {"A": "所有自願減量專案無論年減量規模大小，其計畫書在技術確證時，一律必須執行並提交完整之四項外加性分析", "B": "大規模專案必須完整分析法規、財務、障礙與普遍性；小規模專案為法規必填且其餘三擇一；微型規模專案則得僅分析法規外加性", "C": "微型規模自願減量專案因享有程序之簡化，其計畫書中得全數免除法規外加性分析，僅需交代財務外加性即可", "D": "只有小規模專案享有外加性之豁免，大規模與微型規模專案之計畫書一律皆強制採用四項完整分析"}, "answer": "B", "explanation": "依據「不同規模之專案活動應執行之外加性分析表（表 3.3/表 6.2）」，我國法規依規模提供不同嚴謹度之外加性分析規定：大規模專案（法規+財務+障礙+普遍性，四項皆應分析）；小規模專案（法規必填，其餘三擇一）；微型專案（得僅分析法規外加性）。【三、溫室氣體自願減量作業與減量額度講義P.47 / 表6.2】"}, {"id": 421, "stem": "某專業工程檢測公司擬向環境部申請許可為合格之溫室氣體查驗機構。依據《溫室氣體認證機構及查驗機構管理辦法》之組織要件規定，該申請主體必須符合下列哪一項關鍵條件？", "options": {"A": "必須置有足額之合格專職查驗人員，且該機構本身「非屬中央主管機關（環境部）或其所屬機關」", "B": "該申請機構在向政府遞交申請前，本身必須已全面取得 ISO 14001（環境管理系統）之認證", "C": "該機構必須具備在台灣碳權交易所或其他國際自願碳市場累積達 5,000 噸以上的「碳權交易與移轉實績」", "D": "為了確保財務擔保能力，該申請主體之法律性質一律強制限制必須為國內上市或上櫃之公開發行公司"}, "answer": "A", "explanation": "依據查驗機構管理標準，申請成為查驗機構之主體，除需置有足額並經訓練合格之主導查驗員與專業人員外，最關鍵之利益衝突迴避條款即為「非屬中央主管機關（環境部）或其所屬機關」，以確保行政監管與技術查驗之權責徹底分離。上市櫃狀態、交易實績或 ISO 14001 證書皆非許可之法定必要條件。【三、溫室氣體自願減量作業與減量額度講義P.47 / 圖3.13 / 管理辦法】"}, {"id": 422, "stem": "依據環境部《溫室氣體認證機構及查驗機構管理辦法》之規定，第三方查驗機構若擬向政府申請許可，其所被許可執行查驗之業務類別（三大查驗領域），主要包含下列哪三大項？", "options": {"A": "固定源製程型（工業生產）、服務業型（綠色營運）、供應鏈型（範疇三採購）", "B": "盤查報告型（清冊核算）、線上登錄型（系統申報）、財務審計型（碳費專用審查）", "C": "本土減量型（自願減量）、國際揭露型（SBTi/CDP）、現場稽核型（地方環保局代查）", "D": "組織型（組織層級溫室氣體盤查）、專案型（自願減量/抵換專案）、產品碳足跡（產品生命週期碳足跡）"}, "answer": "D", "explanation": "依據環境部對查驗機構實施許可與分類管理。依據管理辦法，目前許可查驗機構執行查驗業務之「三大查驗類別」分別為：1. 組織型（共計14項查驗項目）；2. 專案型（共計14項查驗項目）；3. 產品碳足跡（共計2項查驗項目）。【三、溫室氣體自願減量作業與減量額度講義P.47 / 圖3.13】"}, {"id": 423, "stem": "依據環境部《溫室氣體自願減量專案管理辦法》之規模界定，在非再生能源及非節能之「其他類型」專案中，若要符合得以簡化確證及外加性分析之「微型規模（Micro-scale）」專案，其預估年溫室氣體年排放總減量必須符合下列哪一項法定門檻？", "options": {"A": "小於或等於 6 萬公噸 CO2e", "B": "小於或等於 1 萬公噸 CO2e", "C": "小於或等於 5,000 公噸 CO2e", "D": "小於或等於 2 萬公噸 CO2e"}, "answer": "D", "explanation": "依據自願減量專案規模劃分（表 6.1），在溫室氣體年排放量總減量（或其他非能效、非綠能之其他類型）指標上，大規模為 6 萬公噸以上；小規模為 2 萬至 6 萬公噸；而微型規模定義為「小於或等於 2 萬公噸 CO2e」。【三、溫室氣體自願減量作業與減量額度講義P.47 / 簡報P.228】"}, {"id": 424, "stem": "某半導體廠規劃整合廠內多項節能措施，並向環境部申請「節能類型」自願減量專案註冊。依據規模分類標準，若該專案欲被歸類為「大規模（Large-scale）」專案，其所設計之措施在目標年之預估「年節電量」必須達到下列哪一項門檻？", "options": {"A": "2,000 萬度電以上", "B": "4,000 萬度電以上", "C": "6,000 萬度（kWh）電以上", "D": "8,000 萬度電以上"}, "answer": "C", "explanation": "依據自願減量專案規模劃分表（表 6.1），針對節能型專案（Energy Efficiency），大規模專案之年節電量定義門檻為「6,000 萬度電以上」（相當於 60,000 MWh）；小規模為 2,000 萬至 6,000 萬度；微型規模為小於或等於 2,000 萬度。【三、溫室氣體自願減量作業與減量額度講義P.47 / 簡報P.228】"}, {"id": 425, "stem": "為了降低中小企業及社區等單位的申請負擔，我國自願減量專案依規模大小給予不同嚴謹度的外加性分析要求。若某專案經核定屬於「微型規模自願減量專案」，則其在計畫書中「得僅分析」下列哪一種外加性？", "options": {"A": "法規外加性 (Regulatory Additionality)", "B": "財務外加性 (Financial Additionality)", "C": "普遍性分析 (Common Practice Analysis)", "D": "障礙分析 (Barrier Analysis)"}, "answer": "A", "explanation": "依據規模與外加性分析之法規（表 6.2），大規模專案必須執行全部四種外加性分析；小規模專案執行法規外加性，且其餘三種（財務、障礙、普遍性）三擇一執行；而「微型規模自願減量專案」則享有簡化優待，計畫書之外加性分析「得僅分析法規外加性」。【三、溫室氣體自願減量作業與減量額度講義P.47 / 簡報P.228】"}, {"id": 426, "stem": "在評估自願減量專案的合規性時，「外加性」是確保碳權品質、防範漂綠的核心支柱。依據我國《溫室氣體自願減量專案管理辦法》第 8 條，對於資源有限的「微型規模（Micro-scale）」專案，計畫書中之外加性分析「得僅針對」下列哪一項進行分析？", "options": {"A": "財務外加性分析（投資分析）", "B": "普遍性分析（Common Practice Analysis）", "C": "障礙分析（Barrier Analysis）", "D": "法規外加性分析（Regulatory Additionality）"}, "answer": "D", "explanation": "依據我國自願減量專案外加性分析之簡化規範，微型規模專案之計畫書，其外加性分析「得僅分析法規外加性」（即證明該專案減量措施非屬現行法律、地方自治條例或強制性規定所要求者），大幅簡化了財務與技術障礙之舉證程序。【三、溫室氣體自願減量作業與減量額度講義P.47 / 簡報P.228】"}, {"id": 427, "stem": "查驗人員在審查某科技園區「廢氣焚化爐餘熱發電」自願減量專案計畫書。在進行「確證」時，發現計畫書在外加性章節中未確實交代若無本專案、在常規下最可能發生之「替代方案比較基準」。承上述確證實務情境，依據環境部自願減量專案確證重點，確證人員此時應採取何種正確的合規處理方式？", "options": {"A": "直接忽略該部分之外加性論證，逕予在其確證報告中判定該專案自動符合法規外加性", "B": "限期開立不符合事項（CAR/CL），要求申請單位補充合理的替代方案比較資料，重新修訂計畫書並送審", "C": "主動代替客戶在計畫書中填寫一組符合財務回收率標竿值之虛擬數據以縮短確證時限", "D": "判定該案件之不符合事項屬於無法改善之弊端，應立即上報主管機關並駁回專案申請"}, "answer": "B", "explanation": "依據確證與計畫書格式審查重點，基線情境之界定與外加性分析（包含替代方案比較）屬於註冊前必須嚴格把關之核心要件。若確證人員發現其未完整說明或缺乏論證，應開立補正改善要求（CAR/CL），要求受查單位依減量方法學步驟補充替代方案之說明，修訂計畫書後再進行覆核。【三、溫室氣體自願減量作業與減量額度講義P.48 / 6.6條】"}, {"id": 428, "stem": "查驗人員在執行組織型溫室氣體盤查查驗或自願減量專案確證時，首要工作之一即為審查「邊界設定」。下列關於組織型盤查邊界與專案邊界之管理要求，何者最為正確？", "options": {"A": "與專案排放和基線排放計算相關之排放源、碳匯及溫室氣體，應完整納入邊界中", "B": "邊界設定得僅以手繪廠區概略建築物輪廓表示，無須與工廠登記證所登載地址一致", "C": "為了簡化不確定性，只要排放量占比低於5%之用電或燃料設備，一律得直接排除於邊界外", "D": "專案邊界僅需包含監測設備所在之特定機房，其餘與能資源平衡相關之製程可省略"}, "answer": "A", "explanation": "邊界界定的最核心目的，在於確保與專案排放（或組織營運）及基準線計算相關之所有重大溫室氣體排放源與碳匯已被「完整且正確地納入邊界中」，避免漏算或重複計算。邊界設定在法理上必須與目的事業主管機關之設立登記文件（如工廠登記證地址）一致。【三、溫室氣體自願減量作業與減量額度講義P.48 / 簡報P.302】"}, {"id": 429, "stem": "企業在撰寫自願減量專案計畫書時，必須在「專案邊界（Project Boundary）」章節中清楚界定並列表呈現所有納入計算之排放源與移除源。請問，在技術確證實務中，明確界定專案邊界的最主要目的為何？", "options": {"A": "為了與該公司母集團之海內外子公司的合併財務邊界進行等比例核配", "B": "明確界定並約束該專案活動所實質控制與涵蓋之所有排放源或碳匯範圍，以作為後續減量核算之精確範疇", "C": "為了向地方地政事務所申請該專案廠區土地所有權與地上權之地籍劃分", "D": "便於查驗人員將專案之減碳效益與國際黃金標準（GS）進行雙重核配與宣告"}, "answer": "B", "explanation": "「專案邊界」旨在明確界定與宣告受專案活動實質控制、且與該計畫溫室氣體排放或移除直接相關之實體或地理範圍。唯有精確鎖定專案邊界，方能確實比對邊界內之基線排放與專案排放，防止漏算或將邊界外無關之減碳效益納入計算。【三、溫室氣體自願減量作業與減量額度講義P.48】"}, {"id": 430, "stem": "自願減量專案之申請單位在撰寫計畫書時，必須依據專案所屬之減量方法規模，完成對應的外加性分析。下列關於不同規模專案應執行之外加性分析規範，何者敘述「錯誤」？", "options": {"A": "引用大規模減量方法者：法規外加性、普遍性分析、財務外加性以及障礙分析「皆應」執行", "B": "若為微型規模自願減量專案，其計畫書中之外加性分析「得僅分析」法規外加性", "C": "引用小規模減量方法者：除了法規外加性以外，必須針對財務外加性、障礙分析或普遍性分析進行「三擇二」之分析", "D": "倘若專案活動涉及多項減量方法或多個活動地點，其外加性分析應分別臚列並進行論述"}, "answer": "C", "explanation": "依據講義規範，小規模自願減量專案，其外加性分析除了法規外加性外，其餘三項（財務外加性、障礙分析或普遍性分析）僅需「三擇一」執行即可，並非「三擇二」。因此選項 (C) 的描述是錯誤的，符合題意。【三、溫室氣體自願減量作業與減量額度講義P.48】"}, {"id": 431, "stem": "在進行大規模自願減量專案確證時，若專案涉及實質投資，查驗人員會審查計畫書中的「財務外加性分析（投資分析）」。請問，在財務外加性分析中採用「標竿值分析（Benchmark Analysis）」或投資障礙評估，其在技術上的最主要目的為何？", "options": {"A": "為了論證該專案若在不考量「減量額度（碳權）」效益下，其投資不存在經濟效益，或其經濟誘因明顯低於其他可行的替代方案", "B": "為了證明該技術在該地域範圍與同業製程中，其運轉機齡與設備效率已達標竿頂尖水準", "C": "為了評估各別監測流量計與計量電表在進行年度定期校正時的標準公差與系統誤差值", "D": "為了推算產品之宣告單位在「搖籃到大門」部分生命週期中所累積之特定內含碳含量"}, "answer": "A", "explanation": "財務外加性試算與標竿值分析之目的，在於論證該減碳專案在常規下是不具備財務吸引力或經濟效益的（例如：不考量碳權收入下，其投資回報率低於企業一般基準門檻或成本高於替代方案），藉此證明該減碳效益確實是因為本專案（及預期碳權效益）的投入方得額外產生。【三、溫室氣體自願減量作業與減量額度講義P.48】"}, {"id": 432, "stem": "某物流集團擬申請「全台多個低碳轉運中心節能優化」自願減量專案。顧問正協助其劃定與確證專案的空間與營運邊界。依據環境部《自願減量專案確證重點》關於「專案邊界（Project Boundary）」的劃定與檢核要求，下列哪一項敘述最為正確？", "options": {"A": "申請單位得完全依據自身行政便利決定邊界，僅需將主要之大型耗能設備劃入邊界即可", "B": "為了保障商業機密，專案邊界圖說與流程中無須標示原料、燃料與能源之流動方向，僅需條列排放源設備名稱", "C": "若專案邊界內涵蓋多個不同地理位置的相似生產設施，在量化計算時，得僅選擇其中單一設施進行實際監測代表", "D": "專案邊界應完整包含與專案排放、基線排放計算直接相關之所有直接排放源、能源間接排放源與碳匯，並於計畫書中提供流向圖與應監測參數之對應關係"}, "answer": "D", "explanation": "專案邊界之確證旨在確認專案正確界定並登載地理範圍與營運邊界內之所有溫室氣體源、匯與氣體。確證人員應核對流程圖是否完整涵蓋設備、系統、能源變化，以及與基線和專案計算直接相關之所有應監測參數與對應關係。【三、溫室氣體自願減量作業與減量額度講義P.48】"}, {"id": 433, "stem": "某玻璃製造廠擬將其「熔窯餘熱利用系統」申請自願減量專案。審查委員正針對其「基準線情境選擇及外加性分析」進行重點質詢。依據《溫室氣體自願減量專案管理辦法》之核心量化原則，在確證與審查「基線情境及外加性分析」時，其最首要的法理與科學目的為何？", "options": {"A": "評估並確認該專案所宣稱之減量成效，確實是在既有常規環境（基線情境）下所「額外產生」的淨環境貢獻，且該基線設定為最可能發生之合理情境", "B": "作為主管機關審查該低碳工程是否可豁免執行國家環境影響評估（環評）之決策依據", "C": "評估該專案是否能直接轉換並無償取得瑞士黃金標準（GS）或國際核證碳標準（VCS）等國外碳信用", "D": "檢驗與試算該低碳技術在不考量碳交易或額度收益下，其自身的財務回收期與企業淨利潤是否顯著"}, "answer": "A", "explanation": "基線情境及外加性分析的最核心目的，在於論證並證明「如果沒有本專案的推動，在常規下該減碳效益是不會自然發生的（即具備外加性）」，並以最可能發生之常規狀態作為計算減量成效之「基準線」，防範非實質減量之漂綠行為。【三、溫室氣體自願減量作業與減量額度講義P.48】"}, {"id": 434, "stem": "某紡織廠擬針對其「低溫高能效染色設備」執行小規模自願減量專案之確證。因涉及大規模投資，確證小組要求其提供「財務外加性（投資分析）」之細部算式。依據自願減量專案計畫書確證指南，若專案涉及財務障礙、需在計畫書中執行「財務外加性分析」時，下列哪一項屬於該分析章節中「必須」完整揭露與證明的核心技術要素？", "options": {"A": "僅需提供政府核發之該設備專案補助款金額及支票影本即可", "B": "為了保障商業機密，應避免在分析中呈現與計算專案之獲利能力、淨現值或內部投資報酬率", "C": "應清楚說明投資分析所採用之合理基本假設、關鍵技術參數、所選用之評估方法（如：標竿分析法），並與多個可行的常規替代方案進行財務比對", "D": "僅需提供所取得之減量額度（碳權）在未來上架交易後，對該公司合併財務報表每股盈餘（EPS）影響之估算值"}, "answer": "C", "explanation": "財務外加性分析旨在論證專案在經濟上是不具備常規吸引力的（如：不考量碳權下，其 IRR 低於行業標竿）。因此，分析必須清晰列出所有假設（如折現率、電價、壽命、維護成本等）、採用標竿值法或淨現值法，並與多個常規替代方案進行詳細財務對比，方屬合規。【三、溫室氣體自願減量作業與減量額度講義P.48】"}, {"id": 435, "stem": "某化學原材料大廠擬就其「熔窯黑液高效汽電共生」專案，在計畫書中執行「財務外加性分析」。依據自願減量計畫書編寫手冊與技術確證規範，當專案因應大規模或小規模要求而必須提供「財務外加性分析」時，計畫書中「必須」完整揭露與交代下列哪一組核心內容？", "options": {"A": "該公司近五年在台灣證券交易所之上櫃股票每日收盤價，以及其與他國碳稅之稅率折減比例", "B": "設備供應商之全球銷售利潤與毛利率分析，以及該技術在歐洲排放交易系統（EU ETS）之免費配額取得證明", "C": "該項低碳工程之可行性研究中所使用的地政地籍編號，以及全廠空氣污染防制設備折舊之財務分攤表", "D": "本專案在排除「減量額度（碳權）」效益下之財務指標（如 IRR、NPV），與多個可行替代方案之財務比較及敏感度分析"}, "answer": "D", "explanation": "財務外加性分析（投資分析）的核心目的，在於論證該專案「若無碳權額度收益，其在經濟上是不具投資吸引力的（或成本顯著高於替代方案）」。因此，分析必須詳實列出關鍵參數假設、選用標竿分析或淨現值分析，並與其他常規替代方案進行財務比對，以證明該項目具有財務外加性。【三、溫室氣體自願減量作業與減量額度講義P.48】"}, {"id": 436, "stem": "某主導查驗員正在對一項「半導體氟氣破壞削減」之自願減量專案計畫書（PDD）進行確證。在確證與評估計畫書中的外加性分析與基線情境時，確證人員在技術上最應優先檢核與確認下列哪一項合規要件？", "options": {"A": "該半導體廠是否已在自家的官方網站上無償公布公司所有高階綠領主管的個人履歷與薪資", "B": "專案所引進之廢氣破壞處理設備，其全球商利專利之獨家授權證書是否已完整翻譯為歐盟各國文字", "C": "外加性之分析與論證過程是否具備科學邏輯、關鍵之假設與估算是否透明、數據參數是否具備可信出處，且前後文數據具備高度一致性", "D": "該半導體公司是否已被主管機關列入國家永續轉型計畫下之首波特許免繳納碳費之示範名單中"}, "answer": "C", "explanation": "依據確證與計畫書確證要件，確證人員必須核對外加性與基線情境之合理性，確認計畫書中提供之論證具備科學邏輯、所有關鍵假設（如折現率、電價、基線排放係數）必須透明、數據與參數之引用應檢附合規出處（如官方公告、檢測報告或公信文獻），且各章節數據應前後一致。【三、溫室氣體自願減量作業與減量額度講義P.48】"}, {"id": 437, "stem": "在大規模自願減量專案計畫書確證中，除了投資分析與障礙分析外，還需執行「普遍性分析（Common Practice Analysis）」。請問，普遍性分析的核心技術精神與判定邏輯為何？", "options": {"A": "確認專案所使用之全部設備皆具備 ISO/IEC 17025 實驗室認證，且數據不確定性大於 60%", "B": "評估並證明此專案所採行之特定減量技術或低碳實務，並「未」在所界定的區域與同產業型態中被廣泛且普遍執行", "C": "證明該專案在計入期間內之實際監測頻率、取樣方式與不確定性量化百分比皆符合最高等級", "D": "確認專案邊界與所產生的減碳成效確實已同時向聯合國清潔發展機制（CDM）申領碳額度"}, "answer": "B", "explanation": "普遍性分析的核心精神在於「可信度檢查」，旨在檢視及證明專案活動「並非在該區域或產業中已經被廣泛、普遍地實施（Common Practice）」。如果該技術早已是同業的常規標準，則該專案即不具備技術外加性。【三、溫室氣體自願減量作業與減量額度講義P.49】"}, {"id": 438, "stem": "某科技研究機構研發出「新型超臨界流體二氧化碳材料回收製程」。此技術在國內甚至全球皆屬首創、尚無任何類似商用前例。機構擬為其提出「首例（First-of-its-kind）」自願減量專案註冊。當自願減量專案之減碳措施屬於「國內首創、完全無任何可比對先例（First-of-its-kind）」之特殊類型時，在執行計畫書之「普遍性分析」時，申請單位應遵循何種法規程序辦理？", "options": {"A": "由於屬首創技術，得在計畫書中直接勾選「無須執行普遍性分析」，免予提報任何佐證", "B": "僅需在計畫書附件中檢附該技術之新聞媒體專訪報導或綠色專題採訪，即可直接通過確證", "C": "僅需由自廠研發部門提交一份學術性的理論減量效益推估報告，即可免予第三方確證", "D": "必須在計畫書中提供該技術屬於國內首例之實質確鑿佐證資料，並經由第三方查驗機構於確證現場執行實質確認與判定"}, "answer": "D", "explanation": "依據確證與普遍性分析要件，若申請單位主張該專案技術屬於「國內首例（First-of-its-kind）」，藉此論證其不具備普遍性、具備外加性時，必須提供完整且客觀之佐證（如：專利檢索、行業公會證明、無同類商用設施之市場調查），並委託第三方查驗機構於確證時進行實質的技術檢核與確證。【三、溫室氣體自願減量作業與減量額度講義P.49】"}, {"id": 439, "stem": "確證小組在審查某石化大廠「導入先進二氧化碳化學重整製程」之普遍性分析（Common Practice Analysis）章節。依據《溫室氣體自願減量專案計畫書》確證指引，在確證「普遍性分析」時，查驗人員主要評估與判定下列哪一個實務狀況？", "options": {"A": "評估該廠各別煙囪之連續自動監測系統（CEMS），其測量溫室氣體之濃度變化與年際不確定性是否大於 60%", "B": "評估並確認該專案所採行之低碳技術或特定減排實務，在相同之地理區域與同產業型態中，並「非」屬於已被廣泛採行且普遍存在之常規措施", "C": "核實該項製程改善方案在不依賴任何外部碳權（額度）效益下，其自身的財務回收期與毛利率是否顯著", "D": "說明並證明該項設備之全球製造商在其母國之智慧財產權專利登記，是否已完整文件化並登載於資訊網"}, "answer": "B", "explanation": "普遍性分析（Common Practice Analysis）是確證外加性的關鍵步驟，旨在確認專案活動是否為「常規（Common Practice）」。如果該低碳製程或設備早已是同行普遍採用的基本配備（即已具普遍性），則此專案便不具備技術外加性，其減碳效益不應被核發碳權。【三、溫室氣體自願減量作業與減量額度講義P.49】"}, {"id": 440, "stem": "某光電集團擬將其多個廠區的「全廠一般照明燈具更換為高效 LED 燈具」申請註冊為小規模自願減量專案。在確證與審查過程中，若某項減量措施在全國各行各業、甚至多數公共工程中早已被強制推行且「普遍執行」，在技術判定上最容易因下列哪一種原因而無法通過自願減量之註冊審查？", "options": {"A": "該高效燈具之發光效率過高，會導致範疇二電力間接排放出現不確定性誤差", "B": "因該節電活動並非屬於林業造林或負排放技術等「溫室氣體移除型（Removal）」專案", "C": "該低碳措施因已屬於市場高度成熟且廣泛採行之常規（Common Practice），不具備實質「外加性」", "D": "該燈具在更換過程中，其包裝廢棄紙盒無法以「質量平衡法」進行每功能單位之精確核算"}, "answer": "C", "explanation": "普遍性分析之目的即為篩除已屬「常規」的低碳行為。當某項節能措施（如更換 LED 燈具或一般冷氣）在市場上已是極度普及之常規做法時，如果仍對其核發額度，便違反了自願減量「外加性」之科學精神。【三、溫室氣體自願減量作業與減量額度講義P.49】"}, {"id": 441, "stem": "為貫徹自願減量專案中「避免重複計算」與「公開透明」之環境治理要求，我國政府在法治與管理工具上採取了下列哪一項關鍵技術與行政措施，以確保國內發放的減量額度（碳權）不被多重宣告？", "options": {"A": "由環境部建立集中化管理之「溫室氣體自願減量暨抵換資訊平台」，並對核發之減量額度給予獨一無二之專屬「編碼」以利追溯", "B": "授權各地方政府環保局自行核發紙本憑證，並允許民間一般單位自由進行線下的代銷、仲介與買賣", "C": "規定企業僅需在自家的永續報告書（ESG Report）中進行口頭宣告，免予在任何官方系統中登錄編碼", "D": "僅接受與聯合國清潔發展機制（CDM）註冊庫連線，禁止於國內建立任何獨立之登錄與移轉平台"}, "answer": "A", "explanation": "為防範漂綠並透明化碳交易，我國對減量額度採取政府「集中管理模式」，不允許民間單位隨意代銷、仲介。所有註冊、監測及額度取得等資訊，一律在官方資訊平台公開，且核發的每噸額度皆帶有專屬的「編碼」以落實唯一性追溯。【三、溫室氣體自願減量作業與減量額度講義P.5, P.6】"}, {"id": 442, "stem": "環境部配合排碳有價與淨零路徑，發布實施《溫室氣體自願減量專案管理辦法》以規範本國自願減量與額度核發之法治程序。請問，此部辦法的最上位法律授權依據（母法）為何？", "options": {"A": "環境保護基本法", "B": "氣候變遷因應法", "C": "能源管理法", "D": "溫室氣體減量及管理法"}, "answer": "B", "explanation": "《溫室氣體自願減量專案管理辦法》係依據《氣候變遷因應法》（原溫室氣體減量及管理法於2023年大修正）第二十五條第四項之明確法條授權所修訂發布，屬於氣候變遷因應法下之關鍵配套子法。【三、溫室氣體自願減量作業與減量額度講義P.5】"}, {"id": 443, "stem": "某紡織廠在實施其「染整製程低溫能效提升」自願減量專案期間，因為現場廠房動線調整，將原本兩台核定之染色機替換為另一款同等能效之新型號機台，導致現場實際運作之設備規格與原核定計畫書（PDD）不一致。當查驗人員在執行查證現場發現此「執行版本與計畫書不符」之情事時，應採取何種合規處理措施？", "options": {"A": "要求受查驗者依法向主管機關提出專案計畫書之「變更申請」，並經環境部核准同意變更後，查驗機構方得就新設備之數據進行實質查證", "B": "為了避免申報延誤，得直接在查驗報告中逕行塗改並調高其 GWP 預設參數，免除行政變更程序", "C": "立即宣布該專案失效，並建請環境部永久註銷該法人在平台上的所有自願減量專案帳號", "D": "委託執業會計師針對該設備進行殘值與財務折舊試算，若未產生重大經濟收益即可不予處理"}, "answer": "A", "explanation": "依據我國自願減量專案管理與確證查證規範，當專案實施狀況（如設備、監測方式、邊界等）與經環境部註冊通過之計畫書不一致時，若屬於實質變更，申請者必須先向環境部提出「變更申請」並獲得核准。查驗機構必須確認該變更已完成合規程序後，方得據以核實查證其數據。【三、溫室氣體自願減量作業與減量額度講義P.50 / P.250】"}, {"id": 444, "stem": "某半導體廠綠領工程師在配合查驗人員執行「製程廢氣削減」自願減量專案之現場查證時，查驗小組發現廠區實際安裝之破壞處理設備（POU）廠牌與型號，與當初註冊通過之計畫書（PDD）所載明之規格不符，但該廠並未向環境部辦理任何行政變更申請。承上述實務情境，查驗人員應如何合規處理此項異常？", "options": {"A": "由於設備仍能正常運作且具有實質減量，得直接於報告書中予以忽略不提，並由查驗機構主動進行確證", "B": "應立即協助該半導體廠在網上購買足額之國外自願性碳權進行數據沖抵，以規避國家平台之審查", "C": "應判定此項設備不符屬於「實質變更（實質不符）」，並要求受查驗者依規定向環境部提出計畫書變更申請並取得核准後，查驗小組方得對其實質數據進行核實查證", "D": "得直接依據原計畫書中預先設定之「預估年減量值」進行查證，並強制要求受查驗者改採高位熱值計算"}, "answer": "C", "explanation": "依據自願減量專案與抵換專案查證指引，當實際實施狀況（如關鍵設備型號或製程）與註冊計畫書有實質差異時，申請者必須完成計畫書變更並經環境部核准。查驗機構必須對其符合性進行核實，確認其變更已合法通過後，方能針對新設備之實質監測數據出具查證聲明。【三、溫室氣體自願減量作業與減量額度講義P.50 / P.57】"}, {"id": 445, "stem": "某顧問機構在彙整其過去協助多個中小企業申請自願減量專案之不合格退件案例。依據環境部自願減量與抵換專案確證、查證常見退件缺失，下列關於計畫書或申報內容「最常見之實質性錯誤與不合規狀況」，何者敘述正確？", "options": {"A": "常見錯誤包括：選用之減量方法學版本不符、專案邊界與現場排放源不一致、外加性分析未依規範提供對比", "B": "計畫書可以先於平台上送件審查，待通過註冊後，再視需要補填計畫邊界與不確定性分析即可", "C": "微型規模專案（年減量 2 萬公噸以下）因享有程序簡化，在註冊前一律不需要辦理任何法規外加性分析", "D": "專案實際運作之減量設備，若廠牌與原核定計畫書不同，只要其總用電量不變，即不需向環境部辦理變更申請"}, "answer": "A", "explanation": "依據自願減量確證與查證實務解析，最常見之行政與技術退件錯誤，通常為「所選減量方法學版次不符」、「專案計畫邊界及應監測參數未與現場設施完全核對」、以及「外加性分析過於籠統、未確實與多個基準替代方案進行比較」。計畫書在註冊前必須資訊完備，而設備規格若有實質不符，必須先完成行政變更申請。【三、溫室氣體自願減量作業與減量額度講義P.50 / P.57】"}, {"id": 446, "stem": "查驗人員在執行某「電爐能效提升」自願減量專案之計畫書確證時，正針對「減量計算」章節的數據品質進行技術檢核。依據環境部《溫室氣體自願減量專案計畫書》與確證指引，下列哪一項「不屬於」查驗人員在檢核「減量計算」時應實質確認之技術要件？", "options": {"A": "確認計算公式與參數中是否存在溫室氣體減量效益重複計算之情事", "B": "確認公式推導與基線設定是否完全符合「保守性估計原則」，避免高估減量成效", "C": "確認公式中所採用之排放係數、低位熱值或 GWP 值等各類參數來源之正確性", "D": "確認該事業是否已申報並取得財政部之企業所得稅或碳費抵免優惠工具"}, "answer": "D", "explanation": "減量計算之確證重點在於確認數據之正確性、保守性、參數合理性並防止重複計算。而「企業是否取得財政部稅務抵免工具」非屬自願減量專案技術計算與確證之範疇。【三、溫室氣體自願減量作業與減量額度講義P.52】"}, {"id": 447, "stem": "某水泥大廠在規劃其「熟料燒成爐替代燃料」自願減量專案時，正在設計其量測儀表配置與抄表校正程序。依據環境部《溫室氣體自願減量專案計畫書》之規範，在計畫書中詳細設定與揭露「監測方法（Monitoring Methodology）」的最核心實務目的為何？", "options": {"A": "確保專案在計入期間內之實際減量或移除成效，能透過制度化、標準化的計量方式被持續追蹤與記錄", "B": "提供主管機關定期稽核與評估第三方查驗機構之內部稽核與運作效能", "C": "協助各地方政府環保局測試與調查其轄區內各行業之潛在低碳轉型空間", "D": "作為評估該專案在參與自願碳交易或拍賣時所衍生之印花稅與營業稅扣繳"}, "answer": "A", "explanation": "監測方法之設立目的，在於規定專案執行期間，如何準確、連續地量測與記錄與基線、專案排放相關之所有關鍵活動數據與參數（如燃料用量、熱值、運轉工時等），確保減碳效益可被科學追蹤、查驗與複核。【三、溫室氣體自願減量作業與減量額度講義P.53】"}, {"id": 448, "stem": "某半導體廠在撰寫「製程含氟氣體（PFCs）破壞處理」自願減量專案計畫書。在編寫「監測計畫（Monitoring Plan）」時，團隊需要說明如何對監測儀表進行管理與故障排除。依據環境部《溫室氣體自願減量專案計畫書》之確證重點，申請單位在監測方法與監測計畫中，必須明確且詳實說明下列哪一個項目？", "options": {"A": "所引用之減量方法學（Methodology）在聯合國或我國之歷史沿革與發展背景", "B": "監測數據之採集、記錄、傳輸方式，以及儀器校正、品質保證（QA）與不確定性控制之品質監控流程", "C": "專案取得減量額度後，擬委託之國內外碳交易平台、上架機制與定價原則", "D": "該減量工程之可行性研究報告（FSR）中的折現率、淨現值等財務試算模型"}, "answer": "B", "explanation": "監測計畫的核心在於確保監測數據的完整性、精確度與可追溯性。因此，計畫書中必須明確說明資料收集之工作程序、品質保證與控制流程（如：數據異常排除、儀器校正週期、不確定性量化分析），以利查驗機構對其可行性進行確證。【三、溫室氣體自願減量作業與減量額度講義P.53】"}, {"id": 449, "stem": "某化工廠擬於其廢水處理系統旁增設「高效厭氧沼氣發電系統」自願減量專案。計畫小組正著手彙整附近鄰里村民之意見，以編製計畫書的第七章。依據環境部自願減量專案計畫書編寫手冊與查證指引，在處理與呈現「環境衝擊分析與公眾意見」時，下列哪一項做法與敘述最符合合規之實務要求？", "options": {"A": "即使是微型規模專案（如：大樓汰換幾盞燈具），亦必須強制在當地鄰里舉辦至少三場大型公聽會，並檢附簽到簿與影音光碟佐證", "B": "必須在計畫書中清楚交代本專案可能衍生之各項環境影響與相應對策，且應詳實提供徵詢公眾意見之意見彙整紀錄、公眾關切議題之回應與具體因應做法", "C": "意見調查僅需由廠方單方面在官方自願減量資訊平台上進行一次性的文字留言揭露即可，免予保留任何線下的問卷與座談會調查紀錄", "D": "所有收集到之利害關係人反對意見，廠方得在計畫書中直接予以忽略，並由廠內法務主管或專案主辦人簽字覆核結案即可"}, "answer": "B", "explanation": "依據講義「自願減量專案環境衝擊及公眾意見重點」規範，申請單位必須確實進行環境衝擊評估並提出改善對策，且針對利害關係人之意見，應進行問卷、座談會等實質調查，並將其關切重點之彙整、廠方因應與改善方式詳實記載於計畫書中，以作為確證人員核對之必備文件。【三、溫室氣體自願減量作業與減量額度講義P.54 / P.55】"}, {"id": 450, "stem": "某查驗機構出具之自願減量專案查證總結報告，因內容缺漏，未標明實際之監測起訖期間、設備控制台之實體範圍，且缺乏任何流量計原始抄表單。承上述不完整查驗報告之情境，此一查證結論在技術評估上，最直接違反了環境部溫室氣體查驗指引中的哪一項關鍵之科學與技術管理原則？", "options": {"A": "歐盟 CBAM 少量豁免與產業反規避原則", "B": "綠色轉型（GX）引導資金投入之金融平衡原則", "C": "再生能源憑證（T-REC）之生質能熱值轉換原則", "D": "溫室氣體數據之「資訊可追溯性與一致性原則」"}, "answer": "D", "explanation": "依據溫室氣體確證與查證重點，所有確證與查證總結報告（或聲明書）均必須確保其量化結果與監測數據具備高度的「可追溯性（Traceability）」與「一致性」。查證報告若無法呈現數據獲取之軌跡、原始單據、監測期間與設備邊界，將使數據無法被複核，屬於嚴重的合規專案缺失。【三、溫室氣體自願減量作業與減量額度講義P.56 / 7.1-7.4條】"}, {"id": 451, "stem": "某中型風力發電業者，其廠內部分發電機組在前幾年已向台電公司辦理並參與了「再生能源電能躉購費率（FIT）」。現在，該業者擬為此風場申請自願減量額度（碳權）。當自願減量專案之邊界內包含已參與並享有再生能源電能躉購費率（FIT）之發電設備時，依據自願減量與查證規範，該業者在向環境部正式申請「核發減量額度（碳權）」時，必須額外檢附下列哪一項關鍵之法定證明文件？", "options": {"A": "由內政部或地方局處出具之綠色硬體設施環保說明書", "B": "由國際黃金標準（GS）或國際獨立碳登記機構核發之國際碳權雙重交易註冊表", "C": "由合格執業會計師簽證之項目投資經濟財務評估與內部回報率分析報告", "D": "經濟部能源署或相關主管機關核發之「溫室氣體減量無重複計算之相關證明」"}, "answer": "D", "explanation": "依據「自願減量專案/抵換專案查證重點」關於減量額度申請資格之規範，若專案邊界內涵蓋已參與再生能源躉購費率之設備，因其發電已享有躉購補貼政策，為了避免國家綠色成效與碳額度之重複計算，申請時「應檢附溫室氣體減量無重複計算之相關證明」。【三、溫室氣體自願減量作業與減量額度講義P.56 / 7.1條】"}, {"id": 452, "stem": "某半導體製造廠順利完成了製程氟氣削減自願減量專案的實施。當該廠委託第三方查驗機構執行「查證（Verification）」並撰寫監測報告書時，查驗人員實務上應首要核對其所採用的「自願減量方法學（Methodology）版本」是否符合下列哪一項法定合規條件？", "options": {"A": "該方法學於聯合國清潔發展機制（CDM）中所公告之歷史初始版本", "B": "由查驗機構於查證現場根據實務量測便利性，自行推薦或套用的簡化方法學版本", "C": "必須為經我國中央主管機關（環境部）核定且註冊通過之最新計畫書所列之特定版本", "D": "必須為該年度內國際黃金標準（GS）所修訂發布之全球最新技術版次"}, "answer": "C", "explanation": "依據我國自願減量查證指引，查驗人員於執行查證時，應確認專案所引用之減量方法學版次及監測期間，必須完全在經環境部註冊通過之最新版計畫書所載範圍內，不可任意變更或套用未經核定之新舊版次。【三、溫室氣體自願減量作業與減量額度講義P.56 / 7.1條】"}, {"id": 453, "stem": "某光電大廠完成其製程節電自願減量專案，並取得第三方查驗機構出具之「自願減量專案查證聲明書」。依據我國溫室氣體自願減量專案之查證規範，此份由查驗機構出具之「查證聲明書」在內容揭露與合規上，最核心且必須明確包含下列哪一項聲明？", "options": {"A": "明確聲明該專案監測報告之內容與實質數據，確已符合環境部法規與所選用減量方法學之合規要求", "B": "聲明查驗人員與受查對象具有長期商業開發與輔導合約，並可無償協助客戶在系統上修改數據", "C": "聲明該專案所得之減量額度已在台灣碳權交易所上架，且其交易定價已獲得金融監督管理委員會之特許認可", "D": "聲明為保護公司技術秘密，可完全省略主導查驗員之簽名，僅檢附查驗機構之法人章戳即可"}, "answer": "A", "explanation": "依據我國自願減量專案查證重點，查驗機構出具之查證聲明書必須明確確認該監測報告書之內容、監測作業與實質計算，符合《溫室氣體自願減量專案管理辦法》及方法學之規範要求，且聲明數據具備高度一致性、正確性與合理性，不可有虛假、隱瞞或無故省略簽署人資訊之情事。【三、溫室氣體自願減量作業與減量額度講義P.56 / 7.1條】"}, {"id": 454, "stem": "某風力發電業者在其自願減量專案執行滿一年後，擬向環境部申請核發其首期之減量額度。依據環境部《溫室氣體自願減量專案管理辦法》之規定，該業者在遞交「額度申請」文件時，為了貫徹國際減碳之「防範重複計算（Double Counting）」與「唯一性」原則，其申報佐證中「必須強制檢附與出具」下列哪一項特定宣告文件？", "options": {"A": "由台電公司或能源署核發之該廠發電設備在未來三十年內，一律不對外進行任何躉購電費核付之行政豁免切結", "B": "聲明並證明該專案所採行之減量措施與專案邊界，均未向其他國內或我國境外之機關（構）重複申請減量額度或獎勵之「無重複申請聲明文件」", "C": "經執業會計師親自簽字覆核、且載明本項低碳工程無任何重複向金融機構申請綠色融資貸款之財務切結報告書", "D": "由歐洲證券及市場管理局所公告之該再生能源專案在歐盟排放交易系統（EU ETS）中之唯一專屬清算編碼"}, "answer": "B", "explanation": "依據「自願減量/抵換專案查證重點」關於減量額度申請資格（7.1條）之規範，為防範重複計算，受查驗者必須檢具：1. 國內之「無重複申請聲明文件」（證明未向國內其他機制重複申請減量額度）；2. 國外之「無重複申請聲明文件」（證明未向我國境外減量機制重複申領額度或獎勵），以確保碳信用品質。【三、溫室氣體自願減量作業與減量額度講義P.56 / 7.1條】"}, {"id": 455, "stem": "為了落實對查驗機構技術品質之滾動監管，並利於環境部及認證機構掌握實際執業情況。依據法規管理要求，經許可之查驗機構「每年」必須定期彙整並向主管機關提交下列哪一項法定報告？", "options": {"A": "記載其過去一年所承接與完成之案件清單、查驗員指派及品管之「年度執行查驗作業報告」", "B": "查驗機構本身的企業社會責任與永續發展（ESG）揭露報告書", "C": "由執業會計師簽證之年度營收財務報表與資產負債表", "D": "本身辦理各項查驗設備耗電與車輛通勤所衍生之實質碳費繳納收據"}, "answer": "A", "explanation": "依據主管機關對查驗機構之監督管理規範，受委託之認證機構及查驗機構應遵循管理辦法之規定，查驗機構應於「每年」向主管機關與認證機構提交其「年度執行查驗作業報告」（載明當年度完成之確證或查證案件清單、查驗人員名單及查核紀錄），以落實主管機關之日常稽核與品質管理。【三、溫室氣體自願減量作業與減量額度講義P.56 / 7.1條】"}, {"id": 456, "stem": "第三方查驗機構在對某事業之自願減量專案順利完成查證（Verification）工作後，必須撰寫正式的「查證總結報告書」以呈送環境部。依據查證指引，該報告書在合規上「必須」包含並詳實登載下列哪一項核心內容？", "options": {"A": "該事業在未來十年內，其財務投資策略與合併資產負債表之會計審計結論說明", "B": "由地方經發局核發之該事業具備高碳洩漏風險特許行業別之產能與營業額成長率評分", "C": "該減碳技術之設備供應商在其母國所取得之各項商利專利與智慧財產權之獨家授權證書影本", "D": "受查驗專案之基本資料、所引用之減量方法學符合性審查結論、監測作業與數據品質管理查證結果，以及減量計算與額度判定等「實質查驗結論與聲明」"}, "answer": "D", "explanation": "依據我國自願減量與抵換專案查證指引及講義，查驗機構出具之「查證總結報告（7.1-7.5條）」核心內容應詳實記載：受查驗專案之實施符合性、監測作業與儀表校正之DQM查驗結果、減量計算之正確性與保守原則判定、以及最終之查證聲明與查證總結，提供給環境部作為額度核發審查之法定科學依據。【三、溫室氣體自願減量作業與減量額度講義P.56 / P.60】"}, {"id": 457, "stem": "第三方查驗機構受託對某造紙廠之「生物質燃料替代」自願減量專案之監測報告書執行查證。依據我國自願減量專案查證重點，下列關於查驗人員在執行現場監測數據查核時的符合性要件，何者「錯誤」？", "options": {"A": "應實質核對各項原始能資源計量儀表（如蒸汽流量計、地磅單等）之校正報告與系統公差", "B": "應實質確認本次申報之監測期間，完全落在經環境部核定通過之專案計入期內", "C": "為了提高查驗效率並配合客戶之申報時程，得直接同意受查驗者針對偶發性故障之電表改採「主觀口頭估算」以簡化查證程序", "D": "應確認監測報告書之章節架構與表格填報，完全符合環境部公告之最新監測報告書格式"}, "answer": "C", "explanation": "依據自願減量專案查證規範，監測報告書之數據必須具備真實性、可追溯性與可信度，所有數據採集必須符合核定之監測計畫。查驗人員絕對禁止因求方便而採行未經校正、無科學佐證之主觀口頭估算，否則屬於嚴重查驗缺失。【三、溫室氣體自願減量作業與減量額度講義P.56】"}, {"id": 458, "stem": "查驗人員在受託執行某水泥廠「餘熱發電」自願減量專案的減量額度申請查證時，為了確認該專案是否具備「減量額度（碳權）申請之基本法理資格」，其在展開數據數據核算前，最首要確認之核對重點應為下列何者？", "options": {"A": "確認本次提報之數據監測期間，確實完全落於經環境部註冊通過之最新版計畫書所列之「計入期間（Crediting Period）」之內", "B": "確認該水泥廠是否已被金管會列入國家高階 ESG 治理之首批王牌示範企業名單", "C": "確認專案所引進之餘熱發電渦輪機，其商標與烤漆是否完全符合製造商之專利外觀技術規範", "D": "核實該廠是否已全額繳納前一年度之全廠直接排放與間接排放合計之實質碳費金額"}, "answer": "A", "explanation": "依據我國自願減量/抵換專案查證重點，查驗人員在確認減量額度申請資格（7.1條）時，首要要點即為確認「本次監測期間，必須完全在經環境部註冊通過之最新版計畫書所列之計入期間內」，且使用之減量方法學版次亦為核定通過之版本，否則不具備額度申請資格。【三、溫室氣體自願減量作業與減量額度講義P.56】"}, {"id": 459, "stem": "為落實國際減碳之「避免重複計算（Avoiding double counting）」原則，保障國家自願減量額度之品質。依據環境部規範，自願減量專案在申請核發額度（碳權）時，申請單位實務上必須檢附並出具下列哪一項必備之法定宣告文件？", "options": {"A": "由地方經發局核發之全廠所有設備皆免予執行國家環境影響評估之行政特許聲明", "B": "本專案所涉及之各項減量措施，均未向其他國內或境外機關（構）重複申請減量額度或重複登錄之「無重複申請聲明（切結）文件」", "C": "由台電公司核發之全廠用電皆已達成 100% 再生能源綠電替代之躉購收據", "D": "經合格會計師簽證之公司近三年淨值與永續發展融資計畫之無重複申貸擔保切結"}, "answer": "B", "explanation": "依據額度申請資格查證規範，受查驗者必須檢具自願減量/抵換專案所涉及減量措施「無申請其他國內減量額度（自行撤案或遭駁回者不在此限）」及「無申請我國境外減量額度獎勵」之無重複申請聲明文件，以實質排除重複申請、保障額度的唯一性。【三、溫室氣體自願減量作業與減量額度講義P.56】"}, {"id": 460, "stem": "某半導體廠已順利實施其製程氣體替代自願減量專案，並擬向環境部申請核發碳權。該廠委託合格的第三方機構執行「查證（Verification）」程序，該查證程序於自願減量制度中之「最主要目的」為何？", "options": {"A": "協助該半導體廠將其累積的減碳量直接在台灣碳權交易所上架並協商交易定價", "B": "取代中央主管機關之權責，由查驗機構直接於線上系統中審查並核發減量信用額度", "C": "核實專案實際執行情形與核定計畫書之符合性，並確認其邊界、量化方法、數據計算及監測品質等合理一致，出具查證聲明書", "D": "提供該廠全面的低碳製程技術輔導，並協助編製其年度財務審計報告與 ESG 投資分析"}, "answer": "C", "explanation": "依據我國自願減量專案查證重點之技術規範，查驗機構執行「查證（Verification）」之最核心與首要目的，在於客觀核實專案之實際實施狀況是否確實依循核定通過之專案計畫書（PDD）進行，並檢核其專案邊界、數據採集、量化計算及 DQM 是否合理、正確與一致，最終出具「查證總結報告與聲明書」，作為環境部核發額度之科學證據。核發額度為環境部之行政權限，非查驗機構之職責。【三、溫室氣體自願減量作業與減量額度講義P.56】"}, {"id": 461, "stem": "某鋼鐵業一貫煉鋼廠擬為其「製程氣體回收」自願減量專案申請核發碳權。該廠綠領人員在編製其首期「監測報告書（Monitoring Report）」時，依據我國法規與查證規範，應遵循下列哪一項標準格式與撰寫原則？", "options": {"A": "可由該廠工程師依據公司內部慣用之 Excel 報表格式自由設計，無須套用任何官方範本", "B": "必須嚴格採用我國環境部規定之最新版自願減量專案監測報告書格式，詳實填妥各項目、欄位，並檢附相關必備佐證之附件資料", "C": "直接將聯合國清潔發展機制（CDM）所使用之全英文原始格式，上傳至我國平台即可，免予翻譯與調整", "D": "僅需在資訊平台上以簡單文字摘要宣告其年度總減量公噸數，免予提供任何具體監測過程與圖資"}, "answer": "B", "explanation": "監測報告書格式（7.2條）之查證要件要求：受查驗者必須使用環境部規定之「最新版自願減量專案監測報告書格式」，且各項目與欄位應詳實填妥並說明，並於附件檢具完整且可追溯之證明文件，方符合格式查證要求。【三、溫室氣體自願減量作業與減量額度講義P.57】"}, {"id": 462, "stem": "某精密機械廠在執行其「空壓系統節能優化」自願減量專案之查證過程中，查驗人員經實地核對電表讀值與原始單據，發現其「實質監測之數據與計算結果」，與當初註冊通過之計畫書預估值存在顯著差異，且部分監測點位因配電箱重整而發生了實質變更。承上述情境，查驗機構與受查驗者應如何處理此項差異？", "options": {"A": "查驗人員得為求行政便利，直接於查驗報告中將實際監測值修改為與原計畫預估值一字不差，以簡化數據品質管理程序", "B": "受查驗者必須針對此項實質差異進行原因分析並準備佐證，若涉及實質變更應依法向主管機關提出計畫書之變更申請，經環境部審查核准後，查驗機構方得據以核實查證並出具查證聲明", "C": "受查驗者應立即向地方政府環保局申請財務補貼，或直接在線上申報平台上以估算值強制覆蓋原數據", "D": "查驗機構可逕自決定將該專案之展延型計入期直接轉換為三十年固定型，免予向環境部報備"}, "answer": "B", "explanation": "依據自願減量專案查證規範，受查驗者實施專案若與經環境部註冊通過之計畫書有實質差異，必須檢附佐證並提出合理說明；若涉及重大變更，應依規定向環境部提出計畫書變更申請並取得核定。查驗機構應確實核對其符合性，不可任意隱瞞或直接修改數據。【三、溫室氣體自願減量作業與減量額度講義P.57】"}, {"id": 463, "stem": "企業在實施溫室氣體自願減量專案並提報監測報告書時，必須建立嚴密的「監測作業與數據品質管理（DQM）」程序。請問，在自願減量機制中，實施該 DQM 程序的首要實務目的為何？", "options": {"A": "為了將所取得之減量數據，直接轉換並無償申領歐盟排放交易系統（EU ETS）之免費配額", "B": "主要作為向財政部申請降低企業當年度營利事業所得稅或土地增值稅之主要會計佐證", "C": "旨在為地方消防安檢人員提供全廠各製程單元之安全與壓力容器操作之合規防爆紀錄", "D": "確保專案在計入期間內所採集、傳輸與計算之所有減量數據，均具備高度的「完整性、正確性與可追溯性」，防範數據造假"}, "answer": "D", "explanation": "監測作業與數據品質管理（DQM）在自願減量專案中的核心目的，是確保所有用於計算減量或移除量之數據（如燃料耗量、電表讀值、儀表校正公差等）均符合品質保證要求，確保最終申請核發之減量額度（碳權）具備高度真實性與公信力。【三、溫室氣體自願減量作業與減量額度講義P.58 / 7.4條】"}, {"id": 464, "stem": "查驗機構於執行「自願減量專案」或「抵換專案」之減量成效查證時，針對受查驗者之監測作業與減量計算，查驗人員至少應確認並檢核下列哪些重點項目？", "options": {"A": "若專案措施涉及公用電網電力替代，應採用國家公告之電力排碳係數作為計算參數", "B": "溫室氣體之減量成效應具備持續性，且已充分評估與考量無洩漏風險", "C": "倘監測期間之實際減量成效與計畫書預估結果具顯著差異，應提出合理說明並檢附證明文件", "D": "以上皆是查驗人員於查證階段必須逐一檢核並確認之重點"}, "answer": "D", "explanation": "關於自願減量/抵換專案之查證重點規範，查驗人員應至少確認公用電網電力替代是否採用國家公告之排碳係數、估算過程無計算或重複計算錯誤、成效具持續性且考量無洩漏風險；同時，若實際成效與原預估有顯著差異，受查驗者也必須提出合理說明並提供佐證。【三、溫室氣體自願減量作業與減量額度講義P.58】"}, {"id": 465, "stem": "在執行自願減量專案查證（Verification）時，查驗人員應對受查驗者之監測作業與不確定性進行評估。為確保監測報告書中各項活動數據之品質，受查驗者「必須」於報告中呈現或準備下列哪一組關鍵之技術資訊與佐證紀錄？", "options": {"A": "原始數據之出處與記錄（如原始電費單、地磅單或自動連線紀錄）、數據收集與傳輸流程、計量儀器校正維護紀錄，以及數據缺失之替代校正與品質保證（QA/QC）程序", "B": "該減碳設備之全球市場行銷推廣計畫書，以及該公司董事會全體成員之專利履歷與薪資福利分配明細", "C": "該製程技術在未來三十年內，因地緣政治與氣候變遷風險所衍生之財務獲利能力與折現率預估", "D": "由經濟部產業發展署核發之「企業所得稅減免與碳費折扣」之官方核定函及會計傳票"}, "answer": "A", "explanation": "依據我國自願減量/抵換專案查證重點，在評估「監測作業與數據品質管理（7.4條）」時，查驗人員至少應確認監測設備之校正保養、數據缺失處理程序、記錄與保存，並交叉核對原始單據與出處，以確保數據的真實性。其餘選項與數據品質管理查核無直接關係。【三、溫室氣體自願減量作業與減量額度講義P.58】"}, {"id": 466, "stem": "第三方查驗機構在對某造紙廠之「黑液回收蒸汽發電」自願減量專案執行查證時，查驗小組必須對受查驗者之「數據品質管理及不確定性控制（DQM）」進行核實。下列哪一項屬於查驗人員在檢核 DQM 時必須實質確認之技術作業內容？", "options": {"A": "確認所有監測設備（如電表、流量計等）是否依據計畫書之規定期限進行定期校正，且數據記錄之流程、品管程序及異常替代方案皆已被系統化執行且保存完整", "B": "確認該造紙廠是否已全額購買足夠之再生能源憑證（T-REC），並在自家的官網上進行了雙重宣告", "C": "確認該廠所採購之所有木質纖維原料，其跨國海運提單與報關發票金額是否存在會計帳務公差", "D": "確認該廠之總經理與高階綠領主管，是否已取得 CNS 14064-1 環境管理證書並全票通過公司政策"}, "answer": "A", "explanation": "在執行「監測作業與數據品質管理（7.4條）」之查證時，查驗人員主要確認受查驗者是否確實依計畫書承諾執行數據管理。包括：監測儀器校正是否在有效期限內、是否有異常數據處理機制、是否保存足夠之原始憑證，以確認數據一致性與正確性。【三、溫室氣體自願減量作業與減量額度講義P.58】"}, {"id": 467, "stem": "為確保自願減量專案監測報告中數據之正確性，查驗人員在執行「監測系統與參數查證（7.4條）」時，應針對監測系統中的哪些核心技術要素進行符合性與一致性檢核？", "options": {"A": "該專案技術所對應之歐盟與美國碳關稅（CBAM/CCA）之宏觀政治經濟風險與匯率敏感度評估模型", "B": "各項應監測數據及參數之計量單位、資料來源、計算與量化方法，以及數據記錄與傳輸之品質保證程序，並交叉比對現場儀表讀數與財務單據", "C": "設備供應商之資本額、企業永續治理（ESG）評級分數，以及其內部員工之勞動條件與人權聲明", "D": "該廠房土地之所有權登記證、廠區周邊交通運輸狀況及地方公眾之滿意度調查百分比"}, "answer": "B", "explanation": "依據自願減量查證規範，監測作業與參數查證旨在核實數據之正確與有效性。查驗人員應逐一核對各項參數（如用電量、燃料量、溫度、壓力等）之計量單位與來源，確認其符合核定之監測計畫，並交叉核對原始憑證與儀器讀值。【三、溫室氣體自願減量作業與減量額度講義P.58】"}, {"id": 468, "stem": "在執行自願減量專案查證時，受查單位所提交之「監測報告書」中，被發現完全缺乏各關鍵流量計與電表之原始數據來源、數據品質控制與保證（QA/QC）流程，且提不出任何在有效期限內之「儀表定期校正維護紀錄」。依據查證要件，查驗機構在合規上應如何處置？", "options": {"A": "為了落實便民原則，主動套用該行業之歷史平均值或同業公會公告之估算係數來彌補數據缺口，並直接放行", "B": "判定此項缺失屬於微小的非實質差異，僅需口頭要求受查單位事後補充說明，即可逕予核發查證聲明", "C": "邀請環安領域之學者專家組成質性勘查小組，根據專家的經驗或主觀判斷直接認定該數據是否可被接受", "D": "認定該專案之監測數據缺乏可信任、可追溯之計量與品管依據，無法核實其減碳效益，應判定不予通過"}, "answer": "D", "explanation": "依據我國自願減量專案/抵換專案查證重點中之「監測作業與數據品質管理（7.4條）」規範，監測數據必須具備高度可追溯性與正確性。若受查單位無法提供計量儀表之有效校正紀錄或 QA/QC 程序，查驗機構應將其視為「缺乏可確認減量/移除量之可靠依據」，其查證結果不符合合理保證等級，依法不得給予通過。【三、溫室氣體自願減量作業與減量額度講義P.58】"}, {"id": 469, "stem": "某造紙廠已成功註冊「廢熱回收利用」自願減量專案。然而，在執行兩年監測後，因實際生產線產能調配，導致實際監測所得之溫室氣體減量額度與當初計畫書中之預估值出現高達 40% 的顯著落差。當專案之「實質減量計算結果」與計畫書之「預估估算值」存在顯著差異時，依據自願減量專案查證重點，申請單位在申請核發額度時應採取何種合規處理方式？", "options": {"A": "系統平台會自動將該專案之計入期予以按比例延長，以彌補減量落差", "B": "為了確保數據品質，必須直接捨棄該段監測數據，並以歷史最高產能數據替代", "C": "必須於監測報告書中針對此落差提出合理之因應說明，並檢附相關佐證與證明文件送審", "D": "必須立即向經濟部產業發展署報備並申請中央財政補償與輔導"}, "answer": "C", "explanation": "依據講義「自願減量專案查證與額度申請重點」，若實際監測並計算所得之溫室氣體減量/移除量與原計畫書預估值存在顯著差異，申請者應於「監測報告書」中提出合理解釋，並檢附產能波動或工藝調整等佐證文件供查驗機構與環境部審查。【三、溫室氣體自願減量作業與減量額度講義P.59】"}, {"id": 470, "stem": "查驗機構在對某化工廠之「廢水處理厭氧消減」自願減量專案進行「減量計算」之查證（7.5條）時，查驗人員之最核心核檢目的與工作項目為何？", "options": {"A": "確認該專案所引進之沼氣發電渦輪機，其品牌、進口關稅與營業稅之會計扣繳憑證是否完全齊備", "B": "為了協助該廠取得最佳之經濟回報，主動協助其調高基線排放量並低估專案排放量，以虛增碳權額度", "C": "確認監測報告書中所使用之減量計算公式、預設參數與實際監測數據之套用，完全符合核定之方法學與「保守估計原則」，確保計算結果正確無誤", "D": "核算該化工廠在全台灣其他未納管分廠的年度總用電度數與自來水度數的合併折算百分比"}, "answer": "C", "explanation": "減量計算查證（7.5條）之核心目的在於：核對數據與計算是否正確，並確認其公式應用、參數（如 GWP、熱值、轉換率）之選用與計算步驟，皆與環境部註冊通過之計畫書或方法學要求一致，且符合保守性原則，避免高估減量成效。【三、溫室氣體自願減量作業與減量額度講義P.59】"}, {"id": 471, "stem": "某鋼鐵廠成功註冊並執行「加熱爐能效改進」自願減量專案。然而，在年度實質監測後，因實際鋼胚產量大幅下滑，導致實際監測計算出之年度減量額度，相較於原註冊計畫書中預估的年減量值出現了 35% 的「顯著落差（顯著減少）」。依據查證規範與額度申請實務，該廠應如何處理此項差異？", "options": {"A": "應直接將實際監測天數人為修改並調高 1.5 倍，以使計算出的實際減量成效與當初預估之目標值完全相符", "B": "應立即向主管機關提出專案終止與撤銷申請，將已產生的減量額度全部宣告作廢並退出自願減量平台", "C": "應於「監測報告書」中詳實揭露此一落差，並針對產能調配或市場波動等造成落差之客觀原因提出合理解釋，檢附相關生產與能源佐證資料供查驗機構與環境部審查", "D": "無須進行任何說明，線上系統會依據原計畫書中預估之減量值自動核發足額碳權，並由碳交所強制上架交易"}, "answer": "C", "explanation": "依據自願減量專案之查證要件，若實際監測核算之實際減量/移除量與註冊計畫書之預估值存在顯著差異，申請者應於監測報告書中提供合理解釋，並檢附相關佐證。查驗人員應確認該解釋之合理性，並依其實際符合保守原則之監測成效核實查證。【三、溫室氣體自願減量作業與減量額度講義P.59】"}, {"id": 472, "stem": "某林業公司申請「造林增匯」自願減量專案額度。在提交額度申請前之查證時，查驗人員發現該森林因遭遇極端颱風侵襲，部分林木折損，導致監測期間實際量測之森林生物量碳蓄積（移除量），相較於原註冊計畫書之預期碳移除量出現了 40% 的大幅落差。請問該公司在申請核發額度時應如何合規辦理？", "options": {"A": "得依據台電公司提供之綠電躉購費率折算公式，將折損之林木生物量直接轉換為等當量之外購電力間接排放進行抵扣", "B": "必須在「監測報告書」中詳實說明此一林木折損事件、分析不確定性、按其實際受災後之「實質監測碳蓄積移除量」進行保守核算，並提報第三方查證聲明送環境部審核核發", "C": "由於實際成效未達計畫書預期，主管機關會自動強制將該移除型專案之計入期予以展延三年以彌補林木損失", "D": "無須提報任何變更說明，線上申報系統將自動套用原預設參數，並依原定預估值全額核發減量信用額度"}, "answer": "B", "explanation": "依據自願減量專案之查證規範，實際減量/移除量與預估值有顯著差異時，申請單位必須於「監測報告書」中提供合理解釋（如颱風受災折損林木），並檢附相關林分調查與監測佐證，依其實際監測並符合保守原則之實質移除成效核實查證與申請額度。【三、溫室氣體自願減量作業與減量額度講義P.59】"}, {"id": 473, "stem": "某連鎖零售集團規劃在全國 200 家門市統一實施「高效 LED 照明汰換」之小規模自願減量專案。由於門市數量龐大，顧問建議採用抽樣調查（Sampling Survey）之方式來監測各門市之實際耗電數據。依據我國溫室氣體自願減量量化實務，若專案涉及多據點、多設施而需採用抽樣檢測設計時，其標準的抽樣架構與調查計畫，得主要參照下列哪一個國際組織或機制之技術指引？", "options": {"A": "國際標準組織 ISO 14064-1 組織盤查查證標準", "B": "聯合國 IPCC 第六次評估報告（AR6）之溫室氣體排放清冊指南", "C": "溫室氣體盤查議定書（GHG Protocol）範疇三價值鏈計算指引", "D": "聯合國清潔發展機制（CDM）所發布之專案活動抽樣與調查標準 (Sampling and surveys for CDM project activities)"}, "answer": "D", "explanation": "我國自願減量專案在涉及多設施抽樣檢測實務時，技術指引明確規定應參照聯合國清潔發展機制（CDM）所制定之專案抽樣指引（Standard: Sampling and surveys for CDM project activities and programme of activities），以確保抽樣之代表性與統計信賴度。【三、溫室氣體自願減量作業與減量額度講義P.61 / 參考文獻】"}, {"id": 474, "stem": "某大型商場集團在其「全台分店節能燈具汰換」自願減量專案中，因為門市據點眾多且部分據點數據採集受限，因而擬採用「抽樣調查（Sampling Survey）」方式來量測活動數據。若其所設計之抽樣計畫與檢測流程，在查證時被發現「未完全依循 CDM 標準之特定嚴格參數」進行，此時最合規之處理與技術審查方式為何？", "options": {"A": "直接判定該抽樣數據無效，並要求該集團必須在三天內完成對全台所有門市之 100% 逐一實地人工抄表與儀器校正", "B": "由主管機關環境部直接將該專案之規模判定為「大規模再生能源專案」，並限制其未來只能進行協議交易", "C": "直接同意受查驗者套用同業公會所公告之當年度產品產量與一般通用之國家預設係數進行推估即可", "D": "申請單位必須於監測報告書中清楚敘明該抽樣調查之設計方法、統計學抽樣程序、所引用之假設與原理依據，以供查驗機構與主管機關執行其科學代表性之合理性審查與符合性判定"}, "answer": "D", "explanation": "在自願減量專案涉及多據點抽樣實務時，若其設計或監測因故未嚴格套用特定指引時，應於報告中清楚交代其抽樣與調查計畫、統計信賴度（如90%信賴區間）、假設與原理，查驗人員應據以實質審查其數據之代表性與可信度，確認其無高估減量成效且符合保守原則。【三、溫室氣體自願減量作業與減量額度講義P.61】"}, {"id": 475, "stem": "綠領人才在進行組織碳盤查或產品碳足跡量化時，常需遵循國際通行的「MRV 制度（量測、報告與查證）」。下列關於 MRV 制度在溫室氣體與環境治理上的實務定位與作用，何者敘述正確？", "options": {"A": "僅強制適用於鋼鐵、水泥等特定第一批與第二批強制列管之排碳大戶，其餘自願性減量專案不適用", "B": "僅涵蓋組織邊界內範疇一與範疇二之溫室氣體量化，在法理與技術上並不包含產品碳足跡（CFP）之核算", "C": "旨在透過規範標準化的「量測（Measurement）」、「報告（Reporting）」與「查證（Verification）」，強化溫室氣體排放與減量數據之可信度、一致性與透明度，輔助國家與企業落實減量目標", "D": "僅在自願減量專案之「確證（Validation）」程序中適用，當進入實質監測與額度申領時，則無須套用 MRV 原則"}, "answer": "C", "explanation": "MRV（量測、報告與查證）制度是溫室氣體管理與碳定價機制的科學磐石。無論是組織溫室氣體盤查、產品碳足跡、或是自願減量專案，均需藉由 MRV 確保數據之可量測、可報告與可查證，以提供高公信力、透明且前後一致的環境績效，進而實質推動國家與企業之碳管理與減碳目標。【三、溫室氣體自願減量作業與減量額度講義P.65 / 7.1條】"}, {"id": 476, "stem": "隨著全球對「漂綠（Greenwashing）」行為的嚴格打擊，各國在設計碳信用與自願減量額度機制時，皆極為強調數據品質。下列關於我國「溫室氣體自願減量專案」之制度設計核心與第三方驗證精神，何者敘述最精確？", "options": {"A": "著重於全面導入由政府主導的財務補助與融資補貼，以快速提升小微型企業的節能設備裝機量", "B": "建立一套科學、透明、具備可查證性、外加性與保守性之量化與監測規範，確保每一公噸核發的減量額度（碳權）均具備真實環境貢獻", "C": "鼓勵企業依據自身商業機密自發性減碳，並全面取消第三方機構之技術審查與確證，以降低行政合規成本", "D": "純粹以自由市場之「碳信用供需價格」作為唯一之篩選機制，價格越高之減碳專案即代表其合規性越佳"}, "answer": "B", "explanation": "自願減量機制的政策與科學定位，在於落實排碳有價與多元減量之補充措施。其核心制度設計與確證/查證精神，為依循「三加五原則」建立一套可量測、可報告、可查證（MRV）的機制，確保專案具備真實的外加性、永久性、保守性且無重複計算，藉此保障發行額度的真實性與高品質。【三、溫室氣體自願減量作業與減量額度講義P.9 / P.234 / 簡報P.289】"}, {"id": 477, "stem": "自願減量專案管理辦法明訂，減量額度之核發應遵循國際認可之「三加五原則」，其中「避免重複計算（Avoiding double counting）」是防範漂綠的關鍵原則。請問該原則在溫室氣體抵換與自願減量實務上之具體要求為何？", "options": {"A": "同一排放源之年度活動數據，不可在同一個計算表格中同時乘上兩種不同的單位轉換因子", "B": "同一個專案邊界內所產生之實質減量效益，不得同時於國內自願減量機制、國際碳權市場或其他減量抵換制度中重複進行註冊或額度申領", "C": "企業在填報排放量清冊時，不得將範疇一之逸散排放源之設備編碼重複填寫兩次", "D": "第三方查驗機構在執行現場查證時，不可對同一個廠區電表進行兩次以上的人工抄表確認"}, "answer": "B", "explanation": "依據講義「三加五原則」之釋義，避免重複計算（Avoiding double counting）旨在確保「每一噸溫室氣體的減量效益僅能被核發與宣告一次」。專案邊界與所產生的額度絕對禁止在不同的制度或多個交易市場（如國內自願減量與國際自願碳信用機制）重複申請，以保障碳額度品質。【三、溫室氣體自願減量作業與減量額度講義P.9 / P.44】"}, {"id": 478, "stem": "在溫室氣體盤查、確證與自願減量額度核發之計算中，「保守性原則（Conservativeness）」是防範漂綠、保障碳信用品質的基石。下列關於「保守性原則」在自願減量計算中所體現之實務精神，何者敘述最正確？", "options": {"A": "在量化減碳成效或移除成效時，若相關技術參數存在不確定性或無法精確計量時，其計算方式與參數之選擇應「傾向於低估減量效益（或高估專案排放）」，以確保所核發額度之真實性", "B": "指的是企業應將全廠所有的温室氣體排放源設備編碼，一律強制設定為「GF01」以降低數據品質管理評分", "C": "是指查驗機構應將受查驗者之所有範疇三運輸排放，一律以國家最新公告之最高等級電力排碳係數進行合併折算", "D": "指的是不論專案規模大小，其計畫計畫期一律必須選擇最長的「展延型計入期（最長40年）」以減少行政作業"}, "answer": "A", "explanation": "依據「三加五原則」中對於「保守性（Conservativeness）」的定義，在自願減量專案之計畫計畫書與監測報告之計算中，當參數或估算存在不確定性時，應採取相對保守的數值與假設，避免高估實質之減量成效（或避免低估專案排放），確保所發行每噸碳權之環境貢獻實至名歸。【三、溫室氣體自願減量作業與減量額度講義P.9 / P.59】"}, {"id": 479, "stem": "企業在規劃溫室氣體自願減量專案時，必須選用經環境部審定公開之「溫室氣體自願減量方法學」來規劃減量措施。請問，在自願減量制度中，此類方法學在科學與法規管理上的最核心目的為何？", "options": {"A": "提供一致性、標準化且具備可查證之溫室氣體減量/移除量之量化與計算準則", "B": "作為評估該減量措施是否具備財務回收效益與企業 ESG 投資報酬率之評估工具", "C": "定義各產業特定耗能設備之維修保養程序與操作安全之技術規範", "D": "自動計算該專案在台灣碳權交易所之定價區間，以提升其市場交易流動性"}, "answer": "A", "explanation": "溫室氣體自願減量方法學（Methodology）的最核心功能與目的，在於提供申請者與第三方查驗機構一套科學、一致且具公信力之「量化計算與監測準則」，確保同一類型專案在設定基線情境、專案邊界與核算實質減碳成效時有據可依，保障減量額度的真實性與可查證性。【三、溫室氣體自願減量作業與減量額度講義P.9 / 簡報P.16】"}, {"id": 480, "stem": "依據環境部《溫室氣體自願減量專案管理辦法》第 3 條規定，下列何者不具備單獨或共同申請溫室氣體自願減量專案註冊之主體資格？", "options": {"A": "依法設立之合夥行號", "B": "自然人（一般個人）", "C": "地方政府機關", "D": "依法登記之股份有限公司"}, "answer": "B", "explanation": "自願減量專案管理辦法第 3 條規定，提出自願減量專案申請者為「事業或各級政府」。事業包括公司、行號、工廠、民間機構等，但定義特別明文不包含自然人（個人）。【三、溫室氣體自願減量作業與減量額度講義P.9】"}, {"id": 481, "stem": "企業在推動與申報「溫室氣體自願減量專案」時，必須確保數據品質並符合多項法規排除與確證原則。下列關於我國自願減量專案之管理與核發原則，何者敘述「錯誤」？", "options": {"A": "申請額度時，必須撰寫監測報告書並由許可之第三方查驗機構完成實質查證", "B": "註冊申請時，若所適用之減量方法學非屬主管機關指定之免確證項目，皆必須執行確證", "C": "為鼓勵企業擴大取得減碳成效，同一個專案範圍可以同時向我國政府與聯合國或國際獨立黃金標準（GS）重複申請核發碳權額度", "D": "專案所申報之減碳效果必須符合實質減量之「外加性」與「保守性」原則"}, "answer": "C", "explanation": "為防範碳權之重複計算（Double Counting），我國自願減量專案之專案邊界與減量效益，絕對禁止與國際碳權或其他機制重複申請核發，且申請時必須出具未向國外重複註冊之切結書。【三、溫室氣體自願減量作業與減量額度講義P.9】"}, {"id": 482, "stem": "企業在申請並執行自願減量專案以量化其實質減碳量時，其減量成效之計算與額度核發認定，應遵循何種法規基準方屬合規？", "options": {"A": "必須嚴格依循中央主管機關（環境部）所審定並公開發布之「溫室氣體自願減量方法學（Methodology）」進行核算與查驗", "B": "企業可依據自身的會計精算系統與工程折舊率自行建模推估", "C": "參照國際碳定價或碳市場（如歐盟 ETS）上類似產品的年度平均碳減量交易數值直接申報", "D": "由查驗機構於查核現場根據實務經驗自行調整計算公式，無須拘泥於特定方法學"}, "answer": "A", "explanation": "我國自願減量額度之認定具高度法治性與嚴謹性。專案之規劃與計算必須完全「依循環境部審定公開之自願減量方法學」執行，並經合格機構確證與查證，方得由主管機關審定核發，不允許企業自創模型或隨意估計。【三、溫室氣體自願減量作業與減量額度講義P.9】"}, {"id": 483, "stem": "依據現行《溫室氣體自願減量專案管理辦法》之規定，我國自願減量專案設有嚴格之申請主體資格限制。下列哪一個主體或自然狀態，在法律與法規定義上「不具備」提出自願減量專案註冊申請之合法資格？", "options": {"A": "依法辦理登記並取得營利事業登記證之民營公司、行號與工廠", "B": "依《氣候變遷因應法》規定被列管、但自發性提出自願減量計畫之各級政府機關", "C": "依法設立登記之財團法人、社會福利機構或公益團體", "D": "宣稱於自家庭院種植樹木、欲以「自然人（一般個人）身分」提出造林碳匯專案申請者"}, "answer": "D", "explanation": "依據管理辦法之法條規範，自願減量專案之申請對象，定義為「事業」或「各級政府」。而所謂事業之範圍雖廣納公司、行號、工廠、行政機關（構）或法人團體，但法規明文定義「不包含自然人（一般個人）」。因此，一般民眾無法以個人身分在平台提出註冊申請。【三、溫室氣體自願減量作業與減量額度講義P.9】"}, {"id": 484, "stem": "依據我國「溫室氣體自願減量暨抵換資訊平台」之已註冊通過案例，下列關於自願減量專案名稱與其所使用之減量方法（Methodology）配對，何者有誤？", "options": {"A": "中碳總部辦公室汰換高效率照明設備自願減量專案：AMS-II.C.", "B": "臺南市政府電動公車自願減量專案：AMS-III.C.", "C": "台積電台中大安海岸造林自願減量專案：AR-TMS0001", "D": "世貿中心國貿大樓冰水主機汰舊換新之節能減碳計畫自願減量專案：TMS-II.003"}, "answer": "D", "explanation": "依據自願減量專案實例，世貿中心國貿大樓冰水主機汰舊換新之節能減碳計畫自願減量專案（專案編號 C00067），其所適用之減量方法學為 「AMS-II.C.」（需求端：利用特定技術的能源效率活動），而非 TMS-II.003。其餘選項配對皆正確。【三、溫室氣體自願減量機制與減量額度簡報第27頁】"}, {"id": 485, "stem": "許多出口導向之鋼鐵、水泥、肥料與電子元件製造商，近年積極導入多項溫室氣體國際標準。關於國際標準「ISO 14067:2018」在溫室氣體家族標準中所扮演的角色與「核心焦點」，下列敘述何者最正確？", "options": {"A": "針對企業或集團之整個組織層級（組織邊界），進行範疇一與範疇二之全盤溫室氣體盤查與登錄", "B": "基於生命週期評估（LCA）標準之原則、要求與指引，為單一「產品（商品或服務）系統」或部分產品之碳足跡量化工作規定具體要求事項", "C": "專為推動陸域森林或濕地藍碳等「自願減量專案」，提供額外性分析與基線情境之判定標準", "D": "規定認證與許可機構在對第三方查驗機構執行符合性評估與管理時，所應具備之一般原則"}, "answer": "B", "explanation": "「ISO 14067:2018」是基於 ISO 14040 與 ISO 14044 生命週期評估（LCA）標準，旨在為「產品碳足跡（CFP）」與「部分產品碳足跡（部分 CFP）」的量化工作提供具體要求與指引，【四、產品碳足跡講義 P.12 / P.15】"}, {"id": 486, "stem": "在進行產品碳足跡（CFP）之生命週期評估（LCA）時，必須依據適用之產品類別規則（PCR）劃定「系統邊界（System Boundary）」。請問，在 CFP量化標準中，「系統邊界」之本質技術意義為何？", "options": {"A": "定義標的產品在各通路配送銷售時，所能覆蓋之最大物理與地理區域範圍", "B": "決定該產品系統在進行化學 or 物理反應時，各原物料轉換為聯產品的質量平衡轉化效率", "C": "決定並界定該產品從原料取得、製造、配送至廢棄處理等生命週期中，有哪些單元過程應被納入或排除於碳足跡計算之中", "D": "作為評估該產品在國際碳市場進行碳信用交易時，各別買賣雙方所應分擔的碳費分配比例"}, "answer": "C", "explanation": "「系統邊界（System Boundary）」是基於一組技術與管理準則，用以表示哪些單元過程（Unit Process）屬於被研究產品系統之一部分、哪些應被排除之外的界限。界定系統邊界能確保產品碳足跡研究有明確且具一致性之範疇。【四、產品碳足跡講義 P.19 / P.33 / P.89】"}, {"id": 487, "stem": "某食品廠在進行「巧克力派」產品碳足跡（CFP）量化時，在產品類別規則（PCR）中通常會適用「截斷準則（Cut-off Criteria）」。請問，在產品碳足跡量化方法學中，設定截斷準則的最主要實務目的是什麼？", "options": {"A": "為了限制產品在市場上的最大銷售範圍，並限制其生產製程中原物料的跨國海運距離", "B": "允許業者在不進行任何科學分析的前提下，直接忽略與排除產品在使用階段及廢棄處理階段的全部排碳量", "C": "允許在不影響碳足跡量化整體信賴度的前提下，合理忽略對總排放或質量貢獻極小、且數據蒐集極度困難之少數次要過程", "D": "強制要求所有單元過程之質量與能量平衡必須維持 100% 絕對一致，藉此大幅增加計算之準確性"}, "answer": "C", "explanation": "「截斷準則（Cut-off Criteria）」是指在定義產品系統系統邊界時，規定可被排除於研究外的物料量、能源或溫室氣體排放之顯著性程度。其目的在於兼顧量化研究之成本效益與實務可行性，避免企業將有限資源耗費在對整體碳足跡結果影響極微、且蒐集困難之微量輔助項目上。【四、產品碳足跡講義 P.19 / P.33】"}, {"id": 488, "stem": "某電子製造廠在執行其「智慧平板電腦」之全生命週期產品碳足跡量化研究（系統邊界為「搖籃到墳墓」）。依據產品生命週期評估原則，在核算產品之累計排放量時，其標準的完整生命週期階段應依序包含哪些單元過程？", "options": {"A": "原物料取得（Raw Material Acquisition） -> 製造（Manufacturing） -> 配送與銷售（Distribution） -> 使用（Use） -> 壽命終結廢棄處理（End-of-life）", "B": "產品概念設計 -> 樣機試產 -> 廠內大量產出 -> 零售通路銷售 -> 顧客售後客服", "C": "廠內裝配製造 -> 外部包裝與裝箱 -> 貨櫃出港與出船 -> 通路商經銷", "D": "能源耗用盤查 -> 數據資料收集與彙整 -> 報告書撰寫 -> 技術內部審核與對外發布"}, "answer": "A", "explanation": "依據 ISO 14040/CNS 14067 定義，產品整個生命週期連續且相互連結之期程，標準的完整階段包括：原物料取得（原料階段）、製造（製造階段）、配送與銷售（配送與銷售階段）、使用（使用階段）及生命終結廢棄處理（廢棄處理階段），【四、產品碳足跡講義 P.19 / P.34】"}, {"id": 489, "stem": "某跨國運動鞋品牌要求其供應鏈代工廠，必須在每一雙慢跑鞋出廠前提供其「產品碳足跡（CFP）」數值。依據國際標準 ISO 14067 與國家 CNS 14067 標準，「產品碳足跡」之最精確科學定義為何？", "options": {"A": "產品系統中溫室氣體排放與移除之總和，係根據生命週期評估（LCA）採用氣候變遷之單一衝擊類別並以二氧化碳當量（CO2e）表示者", "B": "製造該項產品之工廠，在該申報年度內之組織邊界中所量化出之範疇一與範疇二溫室氣體排放總和", "C": "進口商在將該產品經由跨國海運配送至歐盟港口時，在「大門到大門」單一運輸階段所產生之直接碳排放", "D": "該產品在生產製程中所消耗之各項特定化學原輔料之總重量，與其折算所得之環境污染衝擊總和"}, "answer": "A", "explanation": "依據 ISO 14067:2018 與國家標準 CNS 14067:2021 定義，「產品碳足跡（CFP）」是指：產品系統中溫室氣體排放與溫室氣體移除之總和，係根據生命週期評估（LCA），採用氣候變遷的單一衝擊類別（全球暖化），並以二氧化碳當量（CO2e）質量表示，【四、產品碳足跡講義 P.19 / P.89】"}, {"id": 490, "stem": "某包裝飲用水大廠擬對其生產之「1,000 毫升 PET 瓶裝礦泉水」與「330 毫升鋁罐裝氣泡水」進行碳足跡量化。依據產品碳足跡生命週期評估標準，大廠在著手量化前，必須先設定「功能單位（Functional Unit）」。請問，設定功能單位的最核心目的為何？", "options": {"A": "限定與規劃特定產品碳足跡研究中，所能容許之最高溫室氣體削減率與碳費折減比例", "B": "為了精確核算該生產設施在不考慮碳交易或額度收益下之最高能源轉換效率", "C": "提供一個科學與標準化之參考基準，讓不同產品系統之投入與產出能在「同等功能效果」下被公平地比較與評估", "D": "為了向金融機構證明該項綠色包裝製程具備高額之企業永續（ESG）投資回報率"}, "answer": "C", "explanation": "「功能單位（Functional Unit）」定義為產品系統之績效表現。設定功能單位的核心目的，在於提供一個「比較基準」，確保所有輸入與輸出數據能在相同的功用下被標準化、量化與公平比較，【四、產品碳足跡講義 P.19】"}, {"id": 491, "stem": "某不鏽鋼保溫杯大廠依據 ISO 14067 標準編製完成了其產品碳足跡研究報告。依據國際與國家標準，該研究報告在合規上必須揭露並完整交代多項技術參數。請問下列哪一項資訊「最不屬於」產品碳足跡研究報告之必要核心內容？", "options": {"A": "公司創辦人與主要大股東之個人私有資產、年度投資獲利與財務資產配置資訊", "B": "產品之功能單位（Functional Unit）、宣告單位及系統界限設定", "C": "原料、製造、配送等各階段之重要單元過程、一/二級活動數據來源及計算公式", "D": "量化過程中對於使用階段、生命終結（廢棄）階段所設定之關鍵情境假設條件"}, "answer": "A", "explanation": "產品碳足跡研究報告（CFP Study Report）是基於生命週期評估（LCA）之科學環境聲明。必須包含功能單位、邊界、活動數據、係數來源、假設等。公司大股東或老闆之個人財務或投資狀況，與產品系統生命週期環境衝擊量化無關，【四、產品碳足跡講義 P.34】"}, {"id": 492, "stem": "企業在量化產品碳足跡時，必須以「生命週期評估（LCA）」方法論作為量化基石。依據國際標準 ISO 14040 與 14044 之規範，生命週期評估之標準技術架應包含哪四個核心步驟與執行階段？", "options": {"A": "製程與設備評估 -> 全球供應鏈分析 -> 市場碳稅風險測試 -> 技術成果對外公布", "B": "減量措施分析 -> 行動計畫制定 -> 質量平衡與投入產出評估 -> 工廠製程排碳盤查", "C": "劃定功能單位 -> 釐清系統實體邊界 -> 相同類型產品之數據比對 -> 宣告製程之減碳效益", "D": "目的與範疇界定 (Goal & Scope Definition) -> 生命週期盤查分析 (LCI) -> 生命週期衝擊評估 (LCIA) -> 生命週期闡釋 (Interpretation)"}, "answer": "D", "explanation": "依據國際生命週期評估標準（ISO 14040 / ISO 14044），生命週期評估（LCA）之整體框架與執行要求明確劃分為四大關鍵階段：1. 目的與範疇界定（Goal and Scope）、2. 生命週期盤查分析（LCI）、3. 生命週期衝擊評估（LCIA）、4. 生命週期闡釋（Interpretation），【四、產品碳足跡講義 P.5】"}, {"id": 493, "stem": "某綠色包裝材料大廠正在著手量化其「再生澱粉外帶餐具」之產品碳足跡。為了確保其量化範疇、系統邊界、數據蒐集與分配規則等，與同業其他餐具產品具有完全相同、一致的比較與量化基準。該大廠必須優先依循並採行由環境部審定公告之何種規範文件？", "options": {"A": "產品類別規則 (Product Category Rules, PCR)", "B": "物質安全資料表 (Safety Data Sheet, SDS)", "C": "溫室氣體不確定度評估與誤差品質手冊", "D": "物質流成本會計管理手冊 (MFCA)"}, "answer": "A", "explanation": "產品類別規則（PCR）是為一個或多個產品類別定義碳足跡量化與環境宣告的一套特定技術規範與指引，旨在提供相同功能的產品群在計算碳足跡時能有「相同的計算邊界與對比基準」，防範因計算標準不一而無法比較，【四、產品碳足跡講義 P.56 / 附錄、名詞定義】"}, {"id": 494, "stem": "在產品碳足跡（CFP）之生命週期評估中，需要引用大量數據。關於「一級數據（Primary Data，或稱原始數據）」與「場所特定數據（Site-specific Data）」之技術定義與關係，下列何者敘述「錯誤」？", "options": {"A": "所有場所特定數據（Site-specific Data）在性質上與法理分類上皆屬於一級數據（Primary Data）", "B": "所有一級數據（Primary Data）在性質與定義上，必然等同於場所特定數據（Site-specific Data）", "C": "場所特定數據是指在該標的產品系統邊界內，針對特定單元過程所直接取得的一級數據", "D": "一級數據是指過程之量化值，或透過直接量測、原始來源直接記錄所獲得之定量活動數據與排放係數"}, "answer": "B", "explanation": "依據 ISO 14067 與國家標準定義，一級數據包含直接量測與記錄之定量值。場所特定數據是「在被研究產品系統內」取得的一級數據，故「所有場址特定數據皆為一級數據」；但「並非所有一級數據均為場址特定數據」，因為一級數據可能源自其他可類比的產品系統，【四、產品碳足跡講義 P.89 / 附錄、名詞定義】"}, {"id": 495, "stem": "在國際產品碳足跡之管理與計量歷史中，「PAS 2050」與「ISO 14067」均為極具代表性的規範。下列關於此兩套標準在技術與發展背景上之關係，何者敘述最為精確？", "options": {"A": "PAS 2050 僅強制適用於組織層級之範疇三間接排放，其量化範疇不包含產品生命週期", "B": "PAS 2050 要求所有產品之系統邊界一律強制限制為「大門到大門」，不得包含任何原料開採", "C": "PAS 2050 是由英國標準協會（BSI）於早期（2008年）所發布、全球首部針對商品與服務生命週期溫室氣體排放評估之規範（為後續 ISO 14067 之制定奠定重要基礎）", "D": "PAS 2050 無須遵循生命週期評估（LCA）之科學原則，得由業者主觀估算並自由申報"}, "answer": "C", "explanation": "英國標準協會（BSI）於 2008 年發布的 BSI PAS 2050，是世界上第一部基於生命週期評估（LCA）方法論所建立之產品生命週期溫室氣體排放量化規範。該標準為後續 ISO 14067 的誕生奠定了極為關鍵的技術架構與計量基礎。【四、產品碳足跡講義P.1 / P.12 / 1.1條 / P.265】"}, {"id": 496, "stem": "某永續洗髮精品牌研發出兩款全新配方之「無矽靈洗髮精（配方 A 與配方 B）」，經第三方查驗核算，兩者之碳足跡數值極度相近。品牌商董事會正評估要將哪一款配方投入大規模生產。此時，研發部門應在報告中提供下列哪一組關鍵之生命週期技術指標，以支持決策者做出最合規且具韌性之綠色決策？", "options": {"A": "針對各別配方所執行之「敏感度分析」結果、數據品質系譜評估指標（Ti, Ge, Te），以及量化假設條件之差異性分析", "B": "該產品在跨國銷售與報關時，所耗費之海運運費、特定港口印花稅與產品責任保險金額", "C": "設備製造商在其母國所取得之各項商業專利、智慧財產權之跨國授權與保固合約", "D": "公司董事會全體成員在金管會公司治理評鑑中之個人得分，以及產品之全球市場定價"}, "answer": "A", "explanation": "當兩款替代產品或方案之碳足跡量化數值極為接近時，決策者應進一步審查其「數據品質與假設敏感度」。透過評估敏感度分析結果（如：當使用壽命改變時的碳排變化）、一/二級數據代表性（系譜矩陣評估結果）及假設之保守性，可辨識出何種產品配方在不確定性下具備最真實的減碳實力。【四、產品碳足跡講義P.11 / P.34 / 2.9條】"}, {"id": 497, "stem": "某紡織廠在完成其「再生聚酯機能衫」之生命週期盤查數據（LCI）收集後，接著進入「生命週期衝擊評估（Life Cycle Impact Assessment, LCIA）」階段。請問在 LCA 方法論中，執行 LCIA 階段的最主要目的與技術功能為何？", "options": {"A": "為了與該公司母集團之海內外子公司的合併財務邊界進行等比例之碳費核配", "B": "為了精確評估該產品在台灣碳權交易所進行自願性掛牌交易時之單噸碳權交易價格", "C": "協助該機能衫之設備供應商在其母國取得環境影響評估（環評）之官方特許免除證明", "D": "將盤查分析階段所量化之各項能資源投入與排放產出數據，轉換、歸納並關聯至特定的環境衝擊類別，以瞭解其對全球暖化（氣候變遷）、酸化、資源耗竭等潛在環境衝擊之規模與顯著性"}, "answer": "D", "explanation": "生命週期衝擊評估（LCIA）是生命週期評估（LCA）的第三階段。其科學與技術之核心目的，在於藉由特徵化與科學模型，將第二階段 LCI 盤查所得之大量「排放量與資源耗用」數據，轉化、關聯為潛在的「環境衝擊指標（如溫室效應潛勢 GWP、優養化、人體毒性等）」，以量化產品系統對生態之實質衝擊規模。【四、產品碳足跡講義P.11 / 圖1.4 / 名詞定義P.90】"}, {"id": 498, "stem": "在進行產品生命週期衝擊評估（LCIA）時，必須執行多個技術步驟。其中，「分類（Classification）」是基礎步驟之一。依據 ISO 14044 與環境管理標準，「分類」程序之實質技術內容與定義為何？", "options": {"A": "依據產品的銷售管道，將其區分為 B2B（企業對企業）與 B2C（企業對消費者）兩大商業類別", "B": "為了保障商業機密，將計畫書中所涉及之高能效設備依其核心技術機密等級進行編碼與封存", "C": "根據產品生命週期，將所有單元過程區分為原料取得、製造、配送銷售、使用及廢棄處理五大階段", "D": "將生命週期盤查（LCI）中所彙整出之各項環境排放物與輸出入物質，依據其物理與化學反應機制，分別歸類與分配至其所對應之潛在環境衝擊類別（例如將二氧化碳、甲烷分配至全球暖化衝擊類別）"}, "answer": "D", "explanation": "衝擊評估（LCIA）中的「分類（Classification）」程序，是指「將生命週期盤查分析之結果（各物質排放
