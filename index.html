及能資源消耗），依據其已知之環境影響機制，分配與歸類至相對應之環境衝擊類別（Impact Category）中（如：將 N2O 與 CO2 歸入氣候變遷類別）」。【四、產品碳足跡講義P.11 / 圖1.4 / 名詞定義P.90】"}, {"id": 499, "stem": "綠領工程師在配合企業規劃「產品環境宣告（EPD）」與「產品環境足跡（PEF）」管理時，需要引用多套溫室氣體國際標準。在國際標準化組織（ISO）之標準體系中，下列哪一項標準是「專門、核心」針對「產品碳足跡之量化」提供標準與指導綱要之規範？", "options": {"A": "ISO 14064-1", "B": "ISO 50001", "C": "ISO 14067", "D": "ISO 14001"}, "answer": "C", "explanation": "ISO 14067 是 ISO 14060 系列溫室氣體家族標準中，專門針對「產品（商品或服務）碳足跡（CFP）之量化要求與指導綱要」所制定的國際標準（我國對應之國家標準為 CNS 14067）。【四、產品碳足跡講義P.12 / P.15 / 1.5條】"}, {"id": 500, "stem": "依據《產品碳足跡》講義中關於溫室氣體管理標準系列關係之說明，針對產品碳足跡（CFP）量化完成後，若欲進行「環境標誌與足跡資訊溝通」之宣告，其最主要的規範係由下列哪一個國際標準所涵蓋？", "options": {"A": "ISO 14026", "B": "ISO 14040", "C": "ISO 14044", "D": "ISO/TS 14071"}, "answer": "A", "explanation": "依據標準關係圖，ISO 14067 係基於 ISO 14040 與 ISO 14044 生命週期評估（LCA）之要求事項與指引為基礎；而針對產品碳足跡（CFP）進行「足跡溝通與宣告」之相關規定，則是由 ISO 14026 標準所涵蓋。【四、產品碳足跡講義P.12】"}, {"id": 501, "stem": "國際標準組織（ISO）制定了多項與環境管理及碳管理相關之標準。依據標準教材中各 ISO 標準間的關係，針對產品碳足跡（CFP）量化完成後，若欲進行「環境標誌與足跡資訊溝通」之宣告，其最主要的規範係由下列哪一個標準所涵蓋？", "options": {"A": "ISO 14026", "B": "ISO 14027", "C": "ISO 14064-3", "D": "ISO 14044"}, "answer": "A", "explanation": "依據講義標準關係說明，產品碳足跡（CFP）之量化基礎依循 ISO 14067，而產品碳足跡進行「足跡溝通與宣告」之相關規定，則是由 ISO 14026 所涵蓋。產品類別規則（PCR）則是由 ISO 14027 所擬定。【四、產品碳足跡講義P.12】"}, {"id": 502, "stem": "台灣為加速與國際減碳供應鏈接軌，由環境部積極推動「產品碳足跡標籤與減量標籤」制度，以引導綠色消費與低碳轉型。請問我國現行在技術與法規管理上，用以指導企業進行產品碳足跡量化與確證/查證之「最上位、核心之國家標準與國際標準依據」為下列何者？", "options": {"A": "溫室氣體盤查議定書：企業價值鏈標準（GHG Protocol Scope 3）", "B": "英國標準協會所發布之商品與服務生命週期溫室氣體排放評估規範（PAS 2050）", "C": "國際標準化組織之產品碳足跡量化標準（ISO 14067 / 我國對應之國家標準 CNS 14067）", "D": "國際標準化組織之組織層級溫室氣體盤查標準（ISO 14064-1 / 我國 CNS 14064-1）"}, "answer": "C", "explanation": "台灣環境部所推動之「產品碳足跡標籤（碳標籤）」與國家 CNS 標準之產品碳量化核算，在技術指引與查驗管理上，完全「以 ISO 14067 國際標準（我國對應轉化為國家標準 CNS 14067:2021）」為最核心、上位之技術準則依據。PAS 2050 屬英國之先期標準、ISO 14064-1 則為組織盤查標準，皆非我國產品碳足跡最直接、最核心之標準依據。【四、產品碳足跡講義P.15 / 圖1.7 / CNS 14067:2021】"}, {"id": 503, "stem": "某化學品製造商受其國際大廠客戶之供應鏈碳管理要求，必須提報其生產之「環氧樹脂」產品碳足跡。由於該原料屬於中間投入品，廠家決定將系統邊界設定為「搖籃到大門（Cradle-to-Gate）」。依據量化標準，此一系統邊界之涵蓋範疇為何？", "options": {"A": "僅涵蓋該化學廠內部之「大門到大門（Gate-to-Gate）」單一製造製程，不包含任何原料開採", "B": "自產品之使用階段開始，一路計算至產品壽命終結與廢棄回收處理階段之排放", "C": "自最前端的原物料取得（原料階段），一路計算至該產品於製造廠生產完成並準備出廠（製造階段）為止", "D": "完整涵蓋自原料取得、廠內製造、跨國配送、消費者使用至最終回收廢棄之全生命週期"}, "answer": "C", "explanation": "「搖籃到大門（Cradle-to-Gate）」屬於部分產品碳足跡（Partial CFP）之量化。其系統邊界範疇係自原料取得階段（搖籃）開始，包含原物料開採與上游運輸，一路計算至產品在組織廠房內生產完成並準備出廠（大門）為止，但不包含後續之配送銷售、使用及廢棄處理階段。【四、產品碳足跡講義P.16, P.19 / 名詞定義P.89】"}, {"id": 504, "stem": "某食品廠在評估其「原味雞蛋糕」之產品碳足跡時，因其無法精確掌握消費者購買後之烘焙或食用等下游使用數據，因而將系統邊界設定為「搖籃到大門」（Cradle-to-Gate）。依據 ISO 14067 與 CNS 14067:2021 標準，針對此類「部分階段之產品碳足跡（Partial CFP）」，其量化研究之參考基準應採用下列何者？", "options": {"A": "全生命週期功能單位（Functional Unit）", "B": "間接數據分配比率（Allocation Ratio）", "C": "產品類別規則（PCR）通用折算係數", "D": "宣告單位"}, "answer": "D", "explanation": "依據 ISO 14067 與國家 CNS 標準定義，「宣告單位（Declared Unit）」是指用作「部分 CFP 量化（如：搖籃到大門、大門到大門等）」的參考單位之產品數量（例如 1 kg 初級鋼或 1 顆雞蛋糕）。相較之下，完整生命週期（搖籃到墳墓）之量化基準則定義為「功能單位（Functional Unit）」。【四、產品碳足跡講義P.19 / CNS 14067定義】"}, {"id": 505, "stem": "某連鎖餐飲集團擬將其各門市所使用之「傳統塑膠湯匙」全面更換為一款宣稱採用「生物可分解材質（PLA）」之環保湯匙。行銷團隊主張：因為是生物可分解材質，其產品碳足跡必定遠低於傳統塑膠。從綠領專業生命週期評估（LCA）之科學視角，下列哪一個關於此主張之評析最為正確？", "options": {"A": "該主張不一定正確。可分解材質在種植、農藥使用、跨國配送製造等階段仍可能產生顯著排放，必須執行完整生命週期評估（LCA）量化原料到廢棄之總排放，方能判定其實質碳足跡高低", "B": "該主張百分之百正確。因為可分解材質在土壤中分解後，其所釋放之溫室氣體移除量（碳匯）在國際標準中會被自動判定為 100% 抵消", "C": "該主張百分之百正確。因為環境部對於可分解材質之產品，已明文規定其可直接豁免第三方查驗，直接取得減量標籤", "D": "該主張不正確。因為生物可分解材質在配送與銷售階段中，其陸運與海運所衍生之範疇三間接排放會呈三次方指數型增長"}, "answer": "A", "explanation": "產品碳足跡探討的是「全生命週期（原料、製造、配送、使用、廢棄）」的碳排總和。生物可分解材質（如PLA）雖然在废棄物處理上可能對環境較友善，但在上游農作物種植、肥料使用（N2O排放）、化學合成加工及運輸過程中仍可能產生高碳排。因此，不能僅憑「生物可分解」便判定其碳足跡較低，仍須經 LCA 實質盤查量化方具公信力。【四、產品碳足跡講義P.19 / P.34】"}, {"id": 506, "stem": "某包裝飲料廠擬為其生產之「無糖綠茶」進行產品碳足跡評估。在規劃階段，綠領管理師著手界定其「系統邊界（System Boundary）」。依據 ISO 14067 與國家 CNS 標準，明確劃定系統邊界在技術與量化管理上的最主要功能為何？", "options": {"A": "決定該產品系統之生命週期階段中，有哪些特定的單元過程應被納入或排除於碳足跡計算範疇中", "B": "自動計算並核配該產品未來在台灣碳權交易所上架時之自願減量額度比例", "C": "限制產品在跨國運輸時所能使用的交通工具種類與最大海運里程", "D": "作為產品在進行化學或物理反應時，各原物料轉換為聯產品的質量平衡轉化效率之評估基礎"}, "answer": "A", "explanation": "依據 ISO 14067 與 CNS 14067 標準之名詞定義，「系統邊界（System Boundary）」是「基於一組準則來表示那項單元過程（Unit Process）係屬於被研究產品系統之一部分的界限」。其核心功能即在於明確界定哪些生命週期階段與製程活動應納入碳足跡計算，哪些則可予以排除。【四、產品碳足跡講義P.19 / 名詞定義P.89 / CNS 14067定義】"}, {"id": 507, "stem": "某食品廠在評估其「原味雞蛋糕」產品碳足跡時，發現其原料中含有微量的香草精、以及包裝過程中使用的極微量脫水劑，這些物質的重量占比均低於 0.5%，且其相關一級活動數據極難取得。在系統邊界設定中，廠家擬採用「截斷準則（Cut-off Criteria）」來處理這些微量項目。依據 CNS 14067 量化標準，「截斷準則」之科學定義與實務規範為何？", "options": {"A": "作為將該專案活動自動判定符合法規外加性，進而免除第三方確證之法定行政條件", "B": "限制產品在全生命週期之原料階段中，所能容許之最高有害化學物質濃度之上限比例", "C": "作為將該項產品之系統邊界直接由「搖籃到墳墓」簡化為「大門到大門」之唯一量化依據", "D": "指明在不影響量化整體信賴度與顯著性的前提下，規定單元過程或產品系統中，得被排除於碳足跡研究範疇外之物料量、能源或溫室氣體排放之最大容許比例或顯著性程度（通常依重量、能耗或環境衝擊占比衡量）"}, "answer": "D", "explanation": "依據 CNS 14067 與 ISO 14067 標準，「截斷準則（Cut-off Criteria）」是指「規定單元過程或產品系統相關聯之物料量，或能源或溫室氣體排放顯著性程度，屬於可被排除於產品碳足跡研究外的規範（通常於 PCR 中規定為 1% 或 5% 之排除門檻）」。這可兼顧量化研究之成本效益與實務可行性。【四、產品碳足跡講義P.19 / 名詞定義P.89 / CNS 14067定義】"}, {"id": 508, "stem": "某連鎖手搖飲集團擬推出一款可重複裝填使用的「不鏽鋼保溫隨行杯」以替代一次性紙杯，並計劃針對此杯進行產品碳足跡量化以申請碳標籤。依據 ISO 14067 量化標準，針對此類「可重複使用、再填充型」之容器產品，在界定並設定其「功能單位（Functional Unit）」時，下列哪一種做法最正確且符合科學原則？", "options": {"A": "功能單位應設定為完成特定次數（如 1,000 次）之飲料裝填與攜帶服務，且在量化其生命週期物料消耗時，必須將隨行杯的設計預期重複使用次數（循環壽命）以及消費者每次使用後之清洗水電能耗與清潔劑流失等實質耗用，等比例納入計算與分攤", "B": "為了保障商業技術機密，僅需將該不鏽鋼杯之「裸重（出廠重量）」直接設定為唯一之功能單位，不需考量清洗耗能", "C": "逕自套用與一次性塑膠杯完全相同之系統邊界與一級活動數據，並直接忽略其在使用階段之重複填充次數", "D": "設定功能單位為該不鏽鋼杯之跨國海運配送里程，其餘原物料開採與製造製程之能耗得全數豁免"}, "answer": "A", "explanation": "依據產品碳足跡 PCR 與功能單位設定原則，若被研究產品屬於「可重複使用、再填充或可再裝填」之容器，其功能單位之界定必須反映其「重複使用之實質績效表現」（如：提供 1,000 次 500ml 飲料之盛裝與攜帶服務）。因此，計算產品生命週期之碳足跡時，必須將隨行杯之「設計重複使用次數（壽命折算分攤）」以及使用期間每一次清洗所衍生之環境衝擊（如熱水、清潔劑、水電耗用）完整納入量化與計算分攤中，方屬合規。【四、產品碳足跡講義P.19 / 名詞定義P.89 / CNS 14067定義】"}, {"id": 509, "stem": "某綠色超市為了響應永續消費，擬將架上販售的「國產紙盒裝鮮乳（A 品牌）」與「進口玻璃瓶裝鮮乳（B 品牌）」進行產品碳足跡（CFP）之環境績效對比，並標註於價目表旁。依據 ISO 14067 的核心原則，若要對這兩款不同包裝與產地之鮮乳產品進行公平、具科學公信力的碳足跡比較，其最關鍵的前提要件為何？", "options": {"A": "兩者在全台各大通路的銷售單價及市場占有率必須完全相同", "B": "兩者所使用的瓶蓋與內外包裝，必須是由同一家通過組織盤查查證之廠商提供", "C": "兩者之產地距離、牛隻飼養方式及工廠裝瓶之能耗數據必須維持 100% 絕對一致", "D": "兩者之功能單位（或宣告單位）及參考流必須相同，且量化之系統邊界、量化方法與分配規則等必須維持一致"}, "answer": "D", "explanation": "依據 ISO 14067/CNS 14067 對於產品碳足跡績效追蹤與比較（CFP Comparison）之規範，不同產品系統之碳足跡若欲進行比較，其前提為兩者必須具有相同的「功能單位或宣告單位」，且其所採行之系統邊界、數據收集準則、分配規則與截斷準則等必須相同，否則不具備科學可比性。【四、產品碳足跡講義P.19 / 名詞定義P.89 / CNS 14067定義】"}, {"id": 510, "stem": "某綠色超市計畫在其架上販售的「有機燕麥奶」與「傳統牛乳」旁，標示兩者之產品碳足跡以引導消費者進行綠色選購。若要以碳足跡數值為科學依據對這兩種產品之環境績效進行公平、具公信力的比較，依據 ISO 14067 的核心原則，必須滿足下列哪一項關鍵前提？", "options": {"A": "兩者之品牌知名度、市場占有率及在全台連鎖超市之銷售價格必須完全對等", "B": "兩者所使用的外包裝紙盒必須由同一家通過 CNS 14064-1 認證之包材商供應", "C": "兩者必須已在環境部產品碳足跡資訊網上，正式取得有效期限內之自願性產品碳標籤", "D": "兩者之「功能單位（Functional Unit）」必須一致，且其量化所設定之「系統邊界」與計算準則必須相同"}, "answer": "D", "explanation": "依據 ISO 14067 與 CNS 14067 規範，若要對不同產品系統之碳足跡進行比較（CFP Performance Tracking / Comparison），其核心技術前提為「兩者必須具有相同的功能單位（Functional Unit）或宣告單位（Declared Unit）」，且其所採行之系統邊界、量化方法、截斷準則與分配規則等必須維持高度一致與相同，方具備可比性。【四、產品碳足跡講義P.19 / 名詞定義P.89】"}, {"id": 511, "stem": "某家電製造商擬針對其研發之「變頻節能電冰箱」進行完整之「搖籃到墳墓（Cradle-to-Grave）」全生命週期產品碳足跡量化。由於電冰箱在後續數十年的「使用階段」及「壽命終結廢棄處理階段」會產生極其顯著之電力耗用與冷媒逸散排放。依據 CFP 量化標準，針對此類在使用與廢棄階段排碳影響重大之產品，其碳足跡報告應如何合規處理？", "options": {"A": "由於消費者購買後之實際使用行為存在高度不確定性，在報告中得僅定性提及，並得全數排除於實質計算範疇外", "B": "得自動將該變頻冰箱之宣告單位折算為「大門到大門（Gate-to-Gate）」部分碳足跡，藉此合法豁免使用階段之計算", "C": "應將其完整納入產品系統邊界中，並依據標準產品類別規則（PCR）清楚界定並揭露其在使用階段之運轉情境、使用壽命、排放假設及廢棄回收之技術路徑與科學數據", "D": "為求行政便利與數據美化，可逕自套用同業公會所公告之最低預設係數，免予在報告中揭露其使用情境假設"}, "answer": "C", "explanation": "依據 ISO 14067 量化原則，當產品在「使用階段」及「壽命終結與廢棄處理階段」會產生重大或主導性溫室氣體排放時，若採用全生命週期評估（搖籃到墳墓），其使用與廢棄階段之排放必須「完整納入系統邊界中進行量化核算」，且在報告中必須清楚說明、界定並交代其所選用之使用情境假設（如：平均操作頻率、壽命）及數據來源，不可任意忽略。【四、產品碳足跡講義P.19, P.34】"}, {"id": 512, "stem": "某上市櫃電子通路集團正著手建置其「範疇三（類別 4）採購商品」之溫室氣體價值鏈管理。集團規劃在未來採購招標時，將產品碳足跡（CFP）納入評分項目。承上述通路集團情境，在「永續供應鏈管理（Sustainable Supply Chain）」中，產品碳足跡可發揮下列哪一種核心功能？", "options": {"A": "定義跨國配送商品時，各別買賣雙方在貿易合同中所應分擔的碳稅與營業稅扣繳比例", "B": "作為推動「綠色採購（Green Procurement）」之科學計量基準，協助企業評估並篩選低碳供應商，降低供應鏈之整體氣候風險", "C": "強制規定所有下游經銷商與零售據點，在申報年度內之最高外購電力度數不得大於 1,000 度", "D": "自動將集團內所有老舊運輸車輛之折舊殘值，等值抵換為自願減量額度以規避碳費"}, "answer": "B", "explanation": "企業之範疇三（間接排放）通常占其總排放的大部分。透過要求供應商提供其產品碳足跡，並以此作為招標與採購之決策權重，企業可實施科學化的「綠色採購」，引導供應鏈上下游協同減碳，降低企業之整體價值鏈轉型風險。【四、產品碳足跡講義P.2 / P.18 / P.283】"}, {"id": 513, "stem": "某智慧製造集團在順利對其生產之「伺服器外殼」執行產品碳足跡量化管理並取得碳標籤後，集團規劃進一步將該產品之減碳績效整合至集團之「中長期永續戰略（ESG Strategy）」中。下列哪一項是集團在下一步進行戰略整合時最契合且合規之技術路徑？", "options": {"A": "將該外殼之產品碳足跡數據，直接等比例轉換並申請核發歐盟排放交易系統之免費碳權", "B": "全面取消公司內部之組織型溫室氣體盤查登錄（ISO 14064-1）程序，以大幅降低企業行政成本", "C": "強制規定公司所有高階經理人，在出差時其範疇三交通通勤之最高排碳量不得大於 1 公斤 CO2e", "D": "將產品減碳成效連結至集團之「科學基礎減量目標（SBTi）」，並以此設定供應鏈之實質低碳轉型與減量目標"}, "answer": "D", "explanation": "企業導入產品碳足跡後，應將其環境成效與企業的最上位減碳目標進行戰略整合。例如，將產品生命週期的減碳績效（範疇三）與科學基礎減量目標（SBTi）進行掛鉤，要求供應商逐年降低其碳足跡，方能系統性、有邏輯地落實企業整體之淨零路徑。【四、產品碳足跡講義P.2 / P.18 / P.283】"}, {"id": 514, "stem": "某合格查驗機構之產品碳足跡審查專家正在為一家出口導向之精密機械廠進行「產品生命週期碳足跡」之查證（Verification）。依據 ISO 14067 與國家 CNS 標準，實施「產品生命週期碳足跡量化與查證」之最主要、核心之「技術管理價值」為何？", "options": {"A": "系統化協助企業釐清並定位產品各生命週期階段之碳排比重（熱點），作為低碳綠色設計與材料替代之依據，並藉由中立查證與國際低碳供應鏈順暢接軌", "B": "作為向目的事業主管機關申請免繳納或全額折扣國家碳費、空氣污染防制費與關稅之法定科學依據", "C": "確保產品在工廠內進行熔煉與機械加工等物理化學轉換時，其各項單元過程之數據不確定性量化公差自動歸零", "D": "確保申請註冊之自願減量專案（碳權），其展延型計入期在移除型專案（如自然造林）下之總展延年限可直接轉換為 100 年"}, "answer": "A", "explanation": "產品碳足跡的核心價值在於其「科學量化與熱點鑑別」之能力。透過生命週期量化，企業能清晰了解產品在原料、製造、配送或廢棄哪一個階段的碳排最為顯著（熱點），並據以進行材料優化或綠色設計，且經第三方查證後之報告，能直接滿足國際大型買家對低碳供應鏈之稽核要求。【四、產品碳足跡講義P.2 / P.18 / P.34】"}, {"id": 515, "stem": "某連鎖茶飲集團主動完成其「紙杯裝冰紅茶」之產品碳足跡量化與查證，並將其碳足跡數值（例如每杯 150 公克 CO2e）以 QR Code 方式公開於其門市看板及杯身上。依據自願性環境宣告之管理精神，品牌商將產品碳足跡資訊「公開且透明化（Transparency）」的最主要原因與價值為何？", "options": {"A": "作為向金融機構申請無償開發性融資、以及向地方稅捐處申請地價稅減免之唯一法定證明", "B": "確保該款紅茶產品在碳交易平台上進行自願拍賣時，其每公噸碳信用之成交價格維持在美金 100 元以上", "C": "提升消費者對品牌之綠色信賴、消除「漂綠」疑慮，並協助消費者進行具備氣候意識之「低碳綠色採購」", "D": "促使中央主管機關能直接插手、干預與重新核定國內所有連鎖手搖飲料之市場零售定價"}, "answer": "C", "explanation": "氣候資訊公開透明是防範「漂綠（Greenwashing）」的關鍵。透過公開經查證的產品碳足跡報告或標註碳標籤，除可向社會大眾展示企業的永續誠信外，更能為綠色採購提供數據基礎，引導消費者選用低碳商品，落實綠色生活。【四、產品碳足跡講義P.2 / P.18 / P.63】"}, {"id": 516, "stem": "某半導體晶圓廠之永續長（CSO），規劃在董事會上推動「全生命週期產品碳足跡管理計畫」。依據國際溫室氣體與企業ESG管理實務，企業積極執行產品碳足跡量化研究，其對於企業推動「淨零轉型」之「最核心、實質之管理效益」為何？", "options": {"A": "作為向地方政府環保局申請全額免除繳納國家碳費與空氣污染防制費之法定憑證", "B": "協助晶圓廠在不改善製程的前提下，自動由系統平台核發免費之歐盟排放交易配額（EUA）", "C": "系統化協助企業鑑別產品在整個生命週期中之「碳排放熱點（Hotspots）」、建立低碳供應鏈管理機制，並針對熱點精準制定製程減碳或負碳路徑", "D": "便於企業直接將其範疇一之直接排放與範疇三之其他間接排放進行無公差之等值抵抵減"}, "answer": "C", "explanation": "產品碳足跡最實質的價值在於「揭示碳排放熱點（Hotspots）」。例如，透過碳足跡發現 80% 的碳排放集中在原料取得階段，企業即可將轉型資源精準投入「低碳原料替代」或「綠色供應商採購要求」，從而以最高成本效益落實淨零與低碳產品設計。【四、產品碳足跡講義P.2 / P.18】"}, {"id": 517, "stem": "某智慧型手機製造廠在其研發新型手機的「產品概念與設計研發階段」，即要求研發團隊將碳足跡數據導入。廠家將碳足跡大數據納入最前端的「綠色產品設計（Design-for-Environment）」中，在全生命週期評估中，其最直接、最大之實質效益為何？", "options": {"A": "協助該手機產品能無償且自動取得金管會永續經濟活動分類之最高等級評分 3 分", "B": "能使手機在進行物理或化學反應時，其單元過程之質量與能量平衡維持 100% 絕對公差", "C": "能夠在不改變任何製程前提下，自動免除該產品在廢棄處理階段所衍生之全部實際排碳量", "D": "能協助研發人員在最前端進行「低碳材料替代」及「製程能效優化」，以最經濟之成本從源頭降低手機之全生命週期溫室氣體排放"}, "answer": "D", "explanation": "產品碳足跡揭示了產品在各階段的排碳比例。若在「產品設計階段（Eco-design）」就導入碳足跡數據，設計人員便可避免選用高碳包材或高耗能製程，從最源頭降低其全生命週期之碳排，此舉比在製造後再進行末端減碳（End-of-pipe）更具成本效益與減碳成效。【四、產品碳足跡講義P.2 / P.18】"}, {"id": 518, "stem": "某綠領永續師正在為一家新成立的綠色包裝材料公司編製碳足跡量化計算表格。在設定計算公式時，依據產品生命週期評估之標準核算邏輯，每一項單元過程中所產生之溫室氣體排放量（以 CO2e 表示），其最基本、通用之量化計算公式應為下列何者？", "options": {"A": "該產品之年實際銷售量 ÷ 全廠年度組織盤查總排放量", "B": "該單元過程之「活動數據（Activity Data）」 × 相對應之「溫室氣體排放係數（Emission Factor）」", "C": "製造設備之裝機瓦數 × 該原料在跨國海運配送時之延噸公里", "D": "原物料之化學莫耳轉換效率 × IPCC 最新公告之全球暖化潛勢值"}, "answer": "B", "explanation": "依據生命週期碳排之基礎量化公式（圖 2.2），產品碳足跡中各階段之單元過程排放量，在技術上是以其「活動數據（每功能/宣告單位之能資源耗用量，如 kWh、kg）」乘上該能資源相對應之「溫室氣體排放係數（如 kg CO2e/kWh、kg CO2e/kg）」進行乘積核算，最後予以加總。【四、產品碳足跡講義P.21 / 圖2.2 / CFP計算公式】"}, {"id": 519, "stem": "某跨國運動品牌在台灣有兩家不同的受託代工廠（分別位於台中與高雄）同時生產同一款「皮革休閒鞋」。這兩家工廠所使用的熔膠製程與電力來源（電網與自建光電）存在實質差異。當品牌商擬對外發布此款休閒鞋之統一產品碳足跡報告時，依據 ISO 14067 之合規要求，該報告應如何妥善處理此種「多產地、多製程」之數據差異？", "options": {"A": "為了貫徹保守性原則，應直接選擇排放量較高的那家代工廠（如高雄廠）之單一數據，代表品牌商的所有休閒鞋產品", "B": "品牌商得自由選擇在線上系統中，直接套用同業公會所公告之台灣製鞋業通用二級平均係數進行估算，免予進行分廠建模", "C": "允許直接將兩家工廠之一級活動數據進行簡單算術平均（不考量實際產量占比），且無須在報告中交代其地理與技術代表性", "D": "應對台中與高雄兩家代工廠分別建立獨立之生命週期評估模型，再依其在申報年度內之「實際產量占比（代表性）」進行加權整合，並在報告中詳實說明其加權依據與運算條件"}, "answer": "D", "explanation": "依據產品碳足跡量化實務，若同一款產品在多個不同營運場址（多個生產工廠）或採用多種不同製程生產時，碳足跡之計算不應簡單算術平均或任意挑選單一場址。合規做法應為「針對各廠區分別建模計算，並依據其各場址之實際年產量占比（加權比例），對其排放量進行加權平均（整合）」，並於報告中清楚揭露此加權基礎與依據。【四、產品碳足跡講義P.22 / 2.5 盤查作業流程】"}, {"id": 520, "stem": "依據《產品碳足跡》教材之標準規範，在繪製產品碳足跡之「生命週期流程圖」以定義系統邊界時，下列哪一項資訊屬於流程圖內應明確標示的核心內容？", "options": {"A": "僅需標示產品出廠後的消費者使用方式", "B": "僅需標示企業內部的行政管理組織圖", "C": "僅需標示產品的原物料採購合約金額", "D": "系統邊界內的所有單元過程、資源投入與產品產出"}, "answer": "D", "explanation": "產品生命週期流程圖繪製之主要目的在於明確界定整個系統中哪些部分應包含（或排除）於盤查分析中，提供數據資料蒐集與計算時的圖示參考。圖中應完整呈現其製程流程、原物料與能源之投入，以及產品產出等資訊。【四、產品碳足跡講義P.25】"}, {"id": 521, "stem": "在進行產品生命週期盤查分析（LCI）的「數據確證（Data Validation）」時，為查核蒐集到的活動數據的正確性與合理性，下列哪一項「非屬」ISO標準或指引推薦之確證查核方式？", "options": {"A": "針對單元過程建立其輸入與產出之質量平衡（Mass Balance）分析", "B": "針對製程設備系統建立其能量平衡（Energy Balance）分析", "C": "直接引入與該標的產品完全無技術關聯之其他行業產品數據進行排放因子比較", "D": "進行相關數據或排放因子（Emission Factors）之比較性分析"}, "answer": "C", "explanation": "在數據確證與查核中，由於每個單元過程皆遵守質能守恆定律，建立質量平衡與能量平衡可對單元過程數據的有效性提供查核證據；此外亦可進行排放係數之比較性分析（如與同類技術產品比對）。直接引入無技術關聯之產品數據比對，無法提供合理的查核參考。【四、產品碳足跡講義P.26】"}, {"id": 522, "stem": "企業與組織導入「生命週期評估（LCA）」方法學來檢視產品或服務的環境衝擊時，可帶來多項決策支持與管理效益。下列關於執行生命週期評估所帶來之效益，何者「不屬於」其直接之主要目的？", "options": {"A": "直接且必然地提高產品在消費市場上的零售價格與企業短期營收", "B": "協助企業內部鑑別各生命週期階段的環境熱點，以利擬定優化策略", "C": "作為組織評估、量化並長期追蹤自身整體環境績效與減碳成效的重要工具", "D": "提供客觀科學數據，協助政府及相關監管機構制定環境政策與標準"}, "answer": "A", "explanation": "生命週期評估（LCA）是一種客觀且系統性的環境績效分析與資訊管理工具，可用於尋找環境衝擊熱點、輔助綠色設計、制定環保公共政策等，但它本身並不具備商業定價功能，亦無法保證能直接提高產品市場售價或短期利潤。【四、產品碳足跡講義P.3】"}, {"id": 523, "stem": "某造紙廠在核算其特定型號紙漿產品之製造階段碳足跡時，需要蒐集大量活動數據。依據產品碳足跡量化標準，下列哪一項數據來源在性質上屬於最高品質之「一級活動數據（Primary Data）」？", "options": {"A": "由設備供應商所提供之同類技術設備在歐洲運轉時之學術文獻推估排放值", "B": "引用聯合國 IPCC 國家溫室氣體清冊指南中所列之全球生質能燃燒平均預設係數", "C": "由造紙廠環安工程師直接自現場裝設且定期校正之天然氣計量表上，所讀取並記錄之「廠內蒸汽鍋爐實際天然氣消耗量」", "D": "參考同業公會所編印、針對亞洲造紙行業在常規營運下之平均原木消耗推估值"}, "answer": "C", "explanation": "依據 CNS 14067 與 ISO 14067 標準定義，「一級數據（Primary Data）」是指「單元過程（Process）之量化值，或透過直接量測來獲得某項活動、或基於其原始來源直接量測的數據（即現場、場所特定之一手計量數據）」。(A)(B)(D) 均屬於來自文獻、資料庫或估算之「二級數據（Secondary Data）」。【四、產品碳足跡講義P.33 / 名詞定義P.90 / CNS 14067定義】"}, {"id": 524, "stem": "某製鞋廠在量化其「環保運動鞋」之「原料階段」碳足跡時，發現部分非關鍵包材（如防潮紙、乾燥劑）之供應商無法提供一級數據，因而擬採用來自公信資料庫之「二級數據（Secondary Data）」作為替代。依據 ISO 14067 與數據品質評估要件，製鞋廠在引用二級數據時，應嚴格遵守下列哪一項技術原則？", "options": {"A": "必須在報告中詳實標註該二級數據之原始公信資料庫出處、其適用之時間（年代）、地理區域（空間範疇）及技術製程符合度，並科學評估其與工廠實際物理現實之差異與不確定性", "B": "只要該二級數據能使最終之產品碳足跡數據大幅降低，即可自由套用，無須在報告中披露任何資料來源", "C": "僅限於產品在使用階段與廢棄處理階段方能採用二級數據，在原料與製造階段則一律嚴格禁止使用", "D": "只要該數據來自於聯合國 IPCC 的文獻，即可直接將其數據品質指標評定為最優之 1 分，免予執行系譜庫矩陣評估"}, "answer": "A", "explanation": "引用「二級數據（Secondary Data）」之技術規範要求，當蒐集一級數據不可行時，方能採用具公信力之生命週期資料庫（如 Ecoinvent）或文獻之二級數據。在採用時，必須確實說明、評估其適用時間、地理、技術符合度與品質公差，並在產品碳足跡研究報告中詳細登載，不可隱瞞或任意套用。【四、產品碳足跡講義P.33 / 表2.6 / 3.3 排放係數挑選】"}, {"id": 525, "stem": "某精密電子廠擬為其生產之「智慧運動手錶」執行全生命週期之生命週期盤查分析（LCI）。在評估其活動數據與排放參數之「數據品質（Data Quality）」時，依據 ISO 14044 與碳足跡數據品質評估標準，廠家必須系統化評估下列哪一組核心代表性指標？", "options": {"A": "該廠在過去五年內，於環境部資訊平台所申報之累計直接與間接排放總量之不確定性", "B": "數據之時間相關性（年代）、地理相關性（空間區域）以及技術相關性（製程與材料符合度）", "C": "設備供應商之資本額、企業社會責任評級，以及其原料出口國之營業稅申報進度", "D": "該項電子零件之全球銷售預估、製程殘值折舊率，以及客戶售後服務滿意度"}, "answer": "B", "explanation": "依據環境部《碳足跡數據品質評估手冊》與系譜矩陣（Pedigree Matrix）之技術規範，評估生命週期數據品質之三大代表性指標為：時間相關性（Ti, 數據與研究年份之差距）、地理相關性（Ge, 數據之空間與地區符合度）及技術相關性（Te, 數據與實際技術、材料之相符程度）。【四、產品碳足跡講義P.33 / 表2.6 數據品質指標系譜矩陣】"}, {"id": 526, "stem": "某綠領顧問擬協助某鋼鐵廠，為其所生產之「熱軋鋼捲」編製符合國際標準之產品碳足跡量化報告。依據 ISO 14067 關於產品碳足跡研究中之「數據品質（Data Quality）」要求，在收集與篩選量化數據時，下列哪一項敘述最為正確且符合規範？", "options": {"A": "只要廠內財務部門能提供發票，數據即可自由套用，無須在報告中交代其時間與地理背景", "B": "數據之選用與評估應具備科學公信力，並確實滿足時間代表性（Temporal）、地理代表性（Geographical）、技術代表性（Technological）之要求，且應交代數據之不確定性與完整性", "C": "為了保護大廠之商業專利，與熔爐直接相關之一級活動數據得全數以同業平均之二級數據進行替代", "D": "僅需確保範疇二外購電力之數據符合規定，其餘製程原料之活動數據均可由廠家自行主觀推估"}, "answer": "B", "explanation": "依據 ISO 14067、CNS 14067 規範及環境部《碳足跡數據品質評估手冊》，產品碳足跡報告在數據品質上必須交代五大維度之代表性，核心指標包含時間（Ti）、地理（Ge）及技術（Te）之代表性，並應科學地評估其資訊完整性、可信度與不確定性，不可隨意以二級數據或主觀估算替代重大之一級數據。【四、產品碳足跡講義P.33 / 表2.6 數據品質指標系譜矩陣】"}, {"id": 527, "stem": "某上市櫃電子廠永續部門完成其「伺服器主機板」之產品碳足跡量化，正著手編撰「產品碳足跡（CFP）研究報告」以備查驗。依據 ISO 14067 與國家 CNS 14067 標準，該研究報告在技術與格式揭露上，至少應包含下列哪些必要之核心技術資訊？", "options": {"A": "研究目的與範疇、所選用之功能單位或宣告單位、系統邊界、量化方法與數據來源、所引用之假設與限制、以及各階段之量化計算結果與分析", "B": "該伺服器產品在未來三十年內，針對我國碳費政策變動所進行之宏觀財務風險與毛利率敏感度評估", "C": "該生產線全體員工之勞動福利條件、人權盡職調查聲明，以及其母公司之合併資產負債表", "D": "設備供應商之全球行銷策略、智慧財產專利授權合約，以及地方公眾對工廠運轉之滿意度調查"}, "answer": "A", "explanation": "依據 ISO 14067 條文規範（7.3 節 CFP 研究報告要求之資訊），一份合規且完整的產品碳足跡報告，必須清晰載明研究目的、範疇、系統邊界、功能單位/宣告單位與參考流、分配程序與截斷準則之選用、一級與二級活動數據來源、引用之排放因子與參數、量化假設、以及最終之碳足跡量化計算結果分析與數據品質評估。【四、產品碳足跡講義P.34 / 2.9 產品碳足跡報告】"}, {"id": 528, "stem": "某自行車零件大廠為響應淨零碳排，主動完成其「碳纖維車架」產品碳足跡量化，並委託合格之第三方查驗機構執行「查證（Verification）」程序。依據產品碳足跡查證與環境管理精神，此項第三方查證之核心目的與價值為何？", "options": {"A": "作為向地方地政事務所申請該廠區土地所有權與地上權變更之法定技術文件", "B": "為報告之技術內容、數據可信度、量化方法論之適用性及數據品質指標提供客觀驗證，以確保其完全符合 ISO 14067 與國家 CNS 規範", "C": "協助該自行車大廠直接在台灣碳權交易所進行該碳纖維車架之自願減量額度拍賣與協議定價", "D": "提供該大廠在不考量碳足跡前提下，其工廠內部各設備之商用折舊殘值與財務分析報告"}, "answer": "B", "explanation": "產品碳足跡報告之第三方查證（Verification），其最核心的目的在於透過獨立、客觀、具公信力的技術審查（包含文件審查與現場訪勘），來驗證受查單位產品碳足跡量化報告所使用之方法論、數據來源、排放係數選用及數據品質分析等，完全符合國際標準 ISO 14067（或國家標準 CNS 14067）之要求，為數據之真實性與透明度提供合理保證。【四、產品碳足跡講義P.34 / 2.9 產品碳足跡報告】"}, {"id": 529, "stem": "某中小型自行車零組件廠擬將其生產之「鋁合金車架」之溫室氣體量化結果，公布於自家的企業社會責任報告中。依據國際環境宣告與我國查驗規範，下列哪一種形式之報告與數據，在技術上「最具公信力與合規品質」？", "options": {"A": "由自廠品管工程師依據公司內部 Excel 發票紀錄進行自由推估，並由總經理簽字切結", "B": "依據國際標準 ISO 14067 及該車架適用之 PCR 規範執行量化，並委託合格之第三方查驗機構執行實質查證，取得其所出具之「產品碳足跡查證聲明書」", "C": "僅針對範疇二外購電力之數據進行簡單折算，且直接在系統中排除原料開採與廢棄處理之排放量", "D": "套用學術界最先進之 AI 大語言模型，直接在線上平台上預測並定性宣告其產品之碳足跡"}, "answer": "B", "explanation": "產品碳足跡報告在環境聲明上若要具備高度公信力與防範漂綠，其最標準且合規的做法，為依循 ISO 14067 國際標準（或國家 CNS 14067 標準）之量化規範進行，並委託經主管機關許可之第三方機構（VVB）執行獨立查證（Verification），最終取得第三方簽發之「查證聲明書與查證報告」。【四、產品碳足跡講義P.34 / 2.9條 / 5.4條】"}, {"id": 530, "stem": "某外帶連鎖咖啡集團委託顧問，為其新生產之「竹纖維環保外帶杯」進行產品碳足跡量化。然而，在收集數據時發現，由於部分竹纖維供應商之運輸距離與油耗紀錄不完整，導致該項二級數據存在較高之「不確定性（不確定性）」。依據 ISO 14067 標準與數據品質管理規範，集團在提報其碳足跡報告書時應如何合規處置此數據異常？", "options": {"A": "可在報告中直接將該段不完整數據刪除，並以「無不確定性」進行系統申報", "B": "為了展現便民原則，直接套用同業公會所公告之最低預設係數將數據誤差予以強制歸零", "C": "應開立 CAR 不符合事項，並由查驗人員逕自套用高位熱值公式將該不確定性進行扣除", "D": "應在報告書中針對此高不確定性參數執行「敏感度分析（Sensitivity Analysis）」，評估其對最終產品碳足跡數值之影響程度，並於報告書中詳實揭露"}, "answer": "D", "explanation": "依據 ISO 14067 技術指引，在產品碳足跡研究中，若有部分關鍵數據或量化假設存在較高之不確定性或非預期侷限時，必須執行「敏感度分析（Sensitivity Analysis）」，以估算選定方法或數據對最終碳足跡量化結果之實質影響，並於產品碳足跡研究報告（CFP Study Report）中完整文件化與揭露。【四、產品碳足跡講義P.34 / 2.9條 / 名詞定義P.90】"}, {"id": 531, "stem": "某綠色巧克力大廠完成其「85% 堅果黑巧克力」之產品碳足跡盤查，並正在撰寫符合國際標準之產品碳足跡研究報告（CFP Study Report）。依據 ISO 14067 與國家 CNS 標準，下列哪一項技術資訊「非屬」該報告書在合規上必須完整包含並揭露之必要重要內容？", "options": {"A": "研究之目的與範疇、所選用之功能單位或宣告單位、以及系統邊界", "B": "數據之不確定性量化分析、假設條件、選用參數、分配規則以及截斷準則", "C": "該產品在國內及全球之市場占有率、未來五年預期銷售增長率與競爭對手分析", "D": "產品生命週期中原料、製造、配送等各階段之溫室氣體排放與移除之量化計算結果與分析"}, "answer": "C", "explanation": "依據 ISO 14067「7.3 CFP研究報告要求之資訊」規範，報告必須完整揭露功能單位、系統邊界、一/二級數據來源與品質、假設、量化方法、分配規則、截斷準則及計算結果等技術資訊。而「市場占有率及競爭力分析」屬於商業行銷或財務競爭範疇，非屬產品生命週期環境評估報告之法定必要揭露資訊。【四、產品碳足跡講義P.34 / 2.9條】"}, {"id": 532, "stem": "依據 ISO 14067 產品碳足跡標準，在向公眾或第三方公開的產品碳足跡（CFP）研究報告中，下列哪一項資訊屬於「非強制揭露」或可予以排除的項目，以保護企業之營業秘密與關鍵專利？", "options": {"A": "產品之功能單位或宣告單位", "B": "生命週期各階段之系統邊界設定與流程圖", "C": "製造程序中使用的特定關鍵專利配方比例與供應商進貨成本", "D": "盤查時選定之數據分配方法（Allocation method）"}, "answer": "C", "explanation": "依據 ISO 14067 研究報告要求資訊之規範，產品碳足跡報告必須公開功能單位、系統界限、數據分配方法、截斷準則等科學量化基礎，但考量商業秘密，並未強制要求企業揭露高度敏感之「特定機密配方」與「供應商進貨成本」等商業資訊。【四、產品碳足跡講義P.34】"}, {"id": 533, "stem": "在進行產品碳足跡（CFP）之示範案例「腳踏車蛋糕坊」原味雞蛋糕盤查時，若活動數據牛奶之原始單位為「公升」，依據生命週期盤查之單位檢核與轉換原則，換算為重量單位時，1 公升牛奶大約折合多少公斤？", "options": {"A": "0.95公斤", "B": "1.00公斤", "C": "1.03公斤", "D": "1.15公斤"}, "answer": "C", "explanation": "依據產品碳足跡示範案例之單位轉換補充資訊，牛奶之密度轉換為：1 公升（L）牛奶約等於 1.03 公斤（kg）。【四、產品碳足跡講義P.44】"}, {"id": 534, "stem": "某大專院校之環境工程研究所正為企業開辦「產品生命週期評估（LCA）」實務培訓課程。在介紹學術與國際標準架構時，講師指出依據 ISO 14040 與 ISO 14044 標準，一項合規的 LCA 研究在技術程序上，應嚴格遵循哪四大基本步驟之順序？", "options": {"A": "產品概念設計 -> 樣機試產與數據記錄 -> 廠內排碳盤查 -> 對外公布符合性聲明", "B": "建立系統實體邊界 -> 質量與能量平衡計算 -> 與同業產品比對 -> 宣告產品之減碳效益", "C": "目的與範疇界定 (Goal & Scope) -> 生命週期盤查分析 (LCI) -> 生命週期衝質評估 (LCIA) -> 生命週期闡釋 (Interpretation)", "D": "劃定功能單位 -> 委託查驗機構現地訪查 -> 編製監測報告書 -> 向主管機關申請核發額度"}, "answer": "C", "explanation": "依據國際生命週期評估標準（ISO 14040 / ISO 14044），生命週期評估之標準技術架構嚴格包含四個互相關聯之主要階段：1. 目的與範疇界定（Goal and Scope）；2. 生命週期盤查分析（LCI）；3. 生命週期衝擊評估（LCIA）；4. 生命週期闡釋（Interpretation）。【四、產品碳足跡講義P.5 / 圖1.2 / 參考文獻】"}, {"id": 535, "stem": "依據國際 ISO 14040 標準規範，執行「產品生命週期評估（LCA）」以系統性分析產品之環境衝擊時，正確的四個標準階段步驟順序為何？", "options": {"A": "盤查分析 → 目的與範疇界定 → 衝擊評估 → 闡釋", "B": "目的與範疇界定 → 盤查分析 → 衝擊評估 → 闡釋", "C": "目的與範疇界定 → 衝擊評估 → 盤查分析 → 闡釋", "D": "衝擊評估 → 盤查分析 → 目的與範疇界定 → 闡釋"}, "answer": "B", "explanation": "ISO 14040/14044 規範之生命週期評估 (LCA) 標準架構包含四個核心階段，依序為：1. 目的與範疇界定 (Goal and scope definition)；2. 生命週期盤查分析 (Life cycle inventory analysis, LCI)；3. 生命週期衝擊評估 (Life cycle impact assessment, LCIA)；4. 生命週期闡釋 (Interpretation)。【四、產品碳足跡講義P.5】"}, {"id": 536, "stem": "根據國際標準 ISO 14040/14044 之規範，在對產品進行完整的「生命週期評估（LCA）」時，盤查人員將生命週期盤查分析（LCI）所收集到的物質與能資源投入產出數據，對應並分類至氣候變遷（溫室效應）、酸化、優養化等不同的環境影響指標進行計算，此一步驟屬於該評估架構中的哪一個核心階段？", "options": {"A": "第一階段：目標與範疇界定", "B": "第二階段：生命週期盤查分析", "C": "第三階段：生命週期衝擊評估", "D": "第四階段：生命週期闡釋"}, "answer": "C", "explanation": "依據 ISO 14040/14044 架構，生命週期評估（LCA）包含四個核心階段，其中將盤查結果數據（LCI）轉化並歸類為特定環境指標之量化過程，屬於第三階段：生命週期衝擊評估（LCIA）。【四、產品碳足跡講義P.5】"}, {"id": 537, "stem": "依據國際標準 ISO 14040 與 ISO 14067，在進行產品生命週期評估（LCA）及產品碳足跡盤查時，用以作為所有投入與產出量化基準之「功能單位 (Functional Unit)」，是在下列哪一個核心階段中予以界定與明確化？", "options": {"A": "階段二：生命週期盤查分析 (Life cycle inventory analysis)", "B": "階段一：目標與範疇界定 (Goal and scope definition)", "C": "階段三：生命週期衝擊評估 (Life cycle impact assessment)", "D": "階段四：生命週期闡釋 (Interpretation)"}, "answer": "B", "explanation": "依據講義，生命週期評估 (LCA) 第一階段為「目標與範疇界定」，其主要工作即為確定研究之目的、劃定系統界限，並明確定義「功能單位」（作為產品系統量化績效之參照單位），提供後續階段數據分配與比較的基礎。【四、產品碳足跡講義P.5】"}, {"id": 538, "stem": "企業若欲針對其特定產品向環境部申請「產品碳足跡標籤」，在開始執行盤查與計算前，應首要確認下列哪一項文件的存在與適用性？若無則必須向主管機關提出編修或新訂之申請：", "options": {"A": "產品類別規則（Product Category Rules, PCR）", "B": "溫室氣體自願減量方法學（Methodology）", "C": "組織溫室氣體盤查報告書範本", "D": "企業環境影響評估報告書（EIA）"}, "answer": "A", "explanation": "業者若欲申請產品碳足跡標籤，應先至產品碳足跡資訊網確認欲申請之產品是否已有相關且有效的「產品類別規則 (PCR)」，若有應予採用；若無相關或不適用之 PCR 時，則應進行新訂定或擬修訂之流程。【四、產品碳足跡講義P.57】"}, {"id": 539, "stem": "某跨國服飾品牌擬為其暢銷的「有機棉休閒服」申請並標示產品碳足跡標籤。依據我國環境部推動產品碳足跡標籤之政策宗旨，政府建立此項碳標籤制度之「最上位、核心之推動目的」為何？", "options": {"A": "強制要求所有中小企業必須繳納跨國碳邊境調整機制（CBAM）之碳憑證費用", "B": "提供消費者清晰、溫暖且具科學公信力之產品碳排放資訊，進而引導綠色採購，並激勵廠商自發性進行製程低碳優化與技術轉型", "C": "由中央主管機關直接主導與干預自願性碳信用額度在初級市場之拍賣價格", "D": "限制傳統紡織製造業在全生命週期中所能容許之最高原物料進口關稅比例"}, "answer": "B", "explanation": "建立產品碳足跡標籤（碳標籤）的核心宗旨，在於利用環境宣告將產品在生命週期各階段所產生的溫室氣體排放量「可視化」，幫助大眾消費者識別低碳商品，進而引導市場走向綠色採購、帶動整體產業之低碳轉型與減碳風氣。【四、產品碳足跡講義P.63 / 5.1條】"}, {"id": 540, "stem": "某合格查驗機構之主導查驗員，正在核對某家申辦「產品碳足跡標籤（碳標籤）」之食品廠送審文件。依據我國環境管理法制，此項「碳足跡標籤」在台灣的法定主管及核定發布機關為下列何者？", "options": {"A": "經濟部能源署", "B": "環境部", "C": "臺灣碳權交易所", "D": "國家科學及技術委員會"}, "answer": "B", "explanation": "依據我國《自願性產品碳足跡核定標示及管理辦法》，負責受理、審查、核定與管理產品碳足跡標籤及碳足跡減量標籤之中央主管機關，一律為環境部（氣候變遷署）。【四、產品碳足跡講義P.64 / 5.2條】"}, {"id": 541, "stem": "某高科技電子公司之綠領永續經理正在向總經理簡報。簡報中提及，為了提升品牌在國際供應鏈中的綠色競爭力，公司擬自主將多款「筆記型電腦」向環境部申請核定產品碳足跡。依據我國《自願性產品碳足跡核定標示及管理辦法》，目前我國之產品碳足跡標籤（碳標籤）制度之政策定位與性質為何？", "options": {"A": "屬於針對所有高碳密集工業進口產品所課徵之強制性邊境碳關稅制度", "B": "屬於由企業自主、自願性提出核定申請之綠色產品環境標示（宣告）制度", "C": "屬於僅強制要求國內上市櫃公司之特定高耗能產品申報之法規管制手段", "D": "屬於由政府全額出資補助，且完全免除任何第三方技術確證之行政簡化特許"}, "answer": "B", "explanation": "我國產品碳足跡標籤與產品碳足跡減量標籤在法制設計上屬於「自願性制度」，由企業或事業自發向環境部提出申請，通過審查後方能取得 3 年效期之標籤標示權，非屬強制性之稅費或關稅手段。【四、產品碳足跡講義P.64 / 5.2條】"}, {"id": 542, "stem": "某中小型塑膠模具廠為配合國際品牌大廠之供應鏈碳中和目標，規劃為其生產之「環保塑膠外殼」向政府正式提出「產品碳足跡標籤（碳標籤）」核定申請。承上述情境，目前我國負責受理、審查、核定與發行自願性產品碳足跡標籤之法定中央主管機關為下列何者？", "options": {"A": "環境部", "B": "經濟部產業發展署", "C": "金融監督管理委員會", "D": "國家發展委員會"}, "answer": "A", "explanation": "依據我國《自願性產品碳足跡核定標示及管理辦法》，負責受理、審查、核發此項綠色標籤之中央主管機關為環境部（氣候變遷署）。【四、產品碳足跡講義P.64 / 5.2條】"}, {"id": 543, "stem": "某綠色包裝材料公司規劃為其新開發之「再生紙箱」向環境部申請取得碳足跡標籤。在正式递交申請核定之前，下列哪一項「非屬」其依法必須經歷或具備之關鍵步驟或技術要件？", "options": {"A": "依據適用之產品類別規則（CFP-PCR）執行其「原料、製造、配送」之生命週期數據盤查", "B": "委託經許可之合格第三方查驗機構對其產品碳足跡報告書執行「實質查證（Verification）」", "C": "若無現成適用之 CFP-PCR，應先行向環境部提出該類別之新產品類別規則制定或修訂申請", "D": "取得公平交易委員會針對該不鏽鋼或再生紙箱等再生產品在市場銷售定價之特許許可"}, "answer": "D", "explanation": "申請產品碳足跡標籤之標準程序包括：確認/制定PCR、進行生命週期盤查、第三方查驗機構查證並取得查證聲明、向環境部提出申請核定。而「公平交易委員會的價格特許許可」非屬產品碳足跡量化與碳標籤申辦之法定技術與行政程序。【四、產品碳足跡講義P.67 / 5.4條】"}, {"id": 544, "stem": "某食品公司計畫為其生產之產品向環境部申請「產品碳足跡標籤」，在透過線上指定資訊平台遞交正式申請時，下列哪一項文件屬於該公司必須備齊並檢附上傳的法定文件？", "options": {"A": "產品碳足跡標籤申請書", "B": "經中央主管機關許可之查驗機構出具之查驗聲明書（有效期限在一年以上且屬合理保證等級）", "C": "公司設立、商業登記或相關工廠登記等證明文件", "D": "以上三項文件均為必須檢附的必要送審資料"}, "answer": "D", "explanation": "廠商向環境部申請碳標籤時，必須檢具產品碳足跡標籤申請書、公司或商業登記等設立證明文件，以及由許可查驗機構核發、有效期限在 1 年以上之合理保證等級查驗聲明書，故(A)、(B)、(C)皆為必要檢附文件。【四、產品碳足跡講義P.68】"}, {"id": 545, "stem": "依據 CNS 14067 標準對於「產品碳足跡 (Carbon Footprint of a Product, CFP)」之名詞定義，其係根據生命週期評估，採用哪一項單一環境衝擊類別，並以二氧化碳當量（CO2e）表示產品系統中溫室氣體排放與移除的總和？", "options": {"A": "臭氧層破壞 (Ozone Depletion)", "B": "酸化 (Acidification)", "C": "氣候變遷 (Climate Change)", "D": "水資源耗竭 (Water Depletion)"}, "answer": "C", "explanation": "依據 CNS 14067 對產品碳足跡之定義，其為產品系統中溫室氣體排放與移除的總和，係根據生命週期評估採用氣候變遷的單一衝擊類別並以 CO2 當量表示。【四、產品碳足跡講義P.89】"}, {"id": 546, "stem": "某塑膠製品廠擬為其生產之「可重複使用環保杯」進行生命週期評估。在進入第二階段「生命週期盤查分析（Life Cycle Inventory, LCI）」時，專案小組的工作重點應為何？其在科學與技術上的最主要目的為何？", "options": {"A": "針對受研究之產品系統，系統化蒐集與量化在系統邊界內所有單元過程之輸入與輸出數據（如原材料、能源、水資源消耗與對環境之溫室氣體等排放）", "B": "評估並確認該環保杯在生產製程中所使用之原料，是否完全具備法規外加性與財務外加性", "C": "計算產品之各項生產設備在折舊後，對公司年度合併財務報表及每股盈餘（EPS）之影響", "D": "委託第三方查驗機構對其監測儀表進行校正維護，並在官方平台上登錄其組織型排放量清冊"}, "answer": "A", "explanation": "生命週期盤查分析（LCI）是生命週期評估（LCA）的第二階段。其技術要義在於對受研究產品系統整個生命週期階段（或特定邊界內）的所有單元過程（Unit Process）進行「物質與能量之投入與產出數據」的彙編、數據採集與核算量化。【四、產品碳足跡講義P.9 / 圖1.3 / 名詞定義P.90】"}, {"id": 547, "stem": "在進行產品生命週期盤查分析（LCI）的「數據整合」時，若系統邊界內有「用在鍋爐的柴油 A」與「用在堆高機的柴油 B」兩筆數據，依據數據整合之分類與合併原則，此兩筆柴油數據得否直接進行合併？", "options": {"A": "可以直接合併，因為兩者皆屬相同之柴油燃料，物理性質完全一致", "B": "可以直接合併，只要兩者之會計採購發票在同一個會計年度即可", "C": "不得直接合併，因為兩者之用途不同、其排放因子（Emission Factor）存在差異且功能相異", "D": "不得直接合併，因為兩者分別屬於範疇一與範疇二之不同邊界"}, "answer": "C", "explanation": "依據講義與簡報說明，在整合產品系統內的數據時，必須依照作業目的進行適當分類與合併，只有相同物質、功能一致且造成類似環境衝擊的資料，才可以被整合。用在鍋爐與用在堆高機之柴油因用途不同、排放因子有差異且功能不同（熱 vs 動力），故不能直接整合。【四、產品碳足跡簡報第10頁】"}, {"id": 548, "stem": "某金控集團正著手修訂其「中長期氣候實體風險」之投融資授信審查政策。依據世界經濟論壇（WEF）所發布之最新全球風險報告，在未來短期（2年）與長期（10年）的預估中，哪一類風險始終被評估為對全球經濟、生態與人類社會最具威脅、且情勢最為嚴重的核心風險？", "options": {"A": "跨國高科技網絡勒索與惡意資料外洩", "B": "區域性地緣政治衝突與連帶之軍事對抗", "C": "極端天氣與環境風險（如氣候變遷因應失敗、生態系統瓦解等）", "D": "勞動人口結構老化與跨國高齡化財政赤字"}, "answer": "C", "explanation": "依據世界經濟論壇（WEF）最新發布之全球風險報告，在全球面臨的多重威脅中，與氣候變遷、生物多樣性損失、自然災害及生態系統崩潰相關之「極端天氣與環境風險」，在未來短期與長期皆被評為全球最嚴重的核心風險類型。"}, {"id": 549, "stem": "某氣候研究中心在分析世界各國於 COVID-19 疫情大流行期間的氣候監測數據。儘管當時因多國實施邊境管制與暫時性工業停工，導致短期內全球溫室氣體人為排放量出現短暫的下降，但美國國家海洋暨大氣管理局（NOAA）的大氣長期監測數據顯示，當時大氣中二氧化碳（CO₂）累積濃度的實質走勢為何？", "options": {"A": "上升趨勢完全未受實質改變，大氣中二氧化碳累積濃度依然持續攀升", "B": "由於全球交通大幅停擺，大氣中二氧化碳濃度出現歷史性的顯著下跌並逐年改善", "C": "大氣中二氧化碳濃度呈現高頻率的短期劇烈震盪，且於半年內恢復至工業革命前基準", "D": "全球大氣二氧化碳濃度走勢從此轉為平穩，並與全球 GDP 增長率徹底脫鉤"}, "answer": "A", "explanation": "根據 NOAA 的觀測資料，雖然 COVID-19 疫情導致全球經濟活動與人為排放量短期內稍微下降，但這短暫的減幅並不足以逆轉或減緩大氣中累積溫室氣體之濃度趨勢，全球大氣二氧化碳濃度依然持續攀升、未改變其上升趨勢。"}, {"id": 550, "stem": "依據我國現行《氣候變遷因應法》所建立之自願減量與強制性碳費互補設計，事業透過執行自願減量專案並通過查證後，所依法取得之「減量額度（碳權）」，其最主要的法定實務用途為何？", "options": {"A": "可由碳費收費對象用以「扣抵應繳納碳費之排放量」", "B": "得由進口商直接用以 100% 抵免歐盟 CBAM 憑證之租稅費用", "C": "得直接向財政部申請，全額沖抵當年度企業之營利事業所得稅", "D": "可在國家平台上等比例自動兌換為免審核之再生能源憑證（T-REC）"}, "answer": "A", "explanation": "我國《氣候變遷因應法》設計了「直接碳定價（強制性碳費）」與「自願減量信用」的雙軌互補機制。企業自發執行減量措施取得並經環境部核發之「減量額度」，最重要的法理用途之一即為提供給碳費收費對象進行排放量扣抵（扣抵應繳納碳費之排放量）。【一、氣候變遷與溫室氣體管理(下冊)講義 P.48】"}];

    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveRecords(records){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
}
function getMeta(records, id){
  const rec = records[id];
  if(!rec || !rec.attempts || rec.attempts.length === 0){
    return { attempts: [], lastResult: null, lastTs: 0, everAttempted:false };
  }
  const last = rec.attempts[rec.attempts.length-1];
  return { attempts: rec.attempts, lastResult: last.result, lastTs: last.ts, everAttempted:true };
}
function recordAttempt(records, id, result){
  if(!records[id]) records[id] = { attempts: [] };
  records[id].attempts.push({ ts: Date.now(), result: result });
}

/* ---------------- tabs ---------------- */
const tabButtons = document.querySelectorAll("nav.tabs button");
const views = { bank: document.getElementById("view-bank"), quiz: document.getElementById("view-quiz"), records: document.getElementById("view-records") };
tabButtons.forEach(btn=>{
  btn.addEventListener("click", ()=>{
    tabButtons.forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    Object.values(views).forEach(v=>v.classList.remove("active"));
    views[btn.dataset.view].classList.add("active");
    if(btn.dataset.view === "records") renderRecords();
  });
});

/* ---------------- shared question card renderer ---------------- */
function buildOptionsHtml(q){
  return ["A","B","C","D"].map(k=>{
    const cls = k === q.answer ? "q-opt correct" : "q-opt";
    return `<div class="${cls}">(${k}) ${escapeHtml(q.options[k])}</div>`;
  }).join("");
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[s]));
}
function historyIconsHtml(attempts){
  const shown = attempts.slice(-HISTORY_DISPLAY_LIMIT);
  if(shown.length === 0){
    return `<span class="hi none">–</span>`;
  }
  return shown.map(a=>`<span class="hi ${a.result==='O'?'o':'x'}">${a.result}</span>`).join("");
}

function renderQuestionCard(q, opts){
  opts = opts || {};
  const records = loadRecords();
  const meta = getMeta(records, q.id);
  const card = document.createElement("div");
  card.className = "q-card";
  card.innerHTML = `
    <div class="q-head">
      <div><span class="q-num">第 ${q.id} 題</span><span class="q-stem">${escapeHtml(q.stem)}</span></div>
      <div class="q-toggle-icon">▼ 展開</div>
    </div>
    <div class="q-options">
      ${buildOptionsHtml(q)}
      <div class="q-explain"><strong>解析：</strong>${escapeHtml(q.explanation)}</div>
    </div>
    ${opts.showHistory ? `
    <div class="q-history">
      <span>答題記錄：</span>
      <span class="history-icons">${historyIconsHtml(meta.attempts)}</span>
      <span style="margin-left:auto;color:var(--text-mute);">共作答 ${meta.attempts.length} 次</span>
    </div>` : ``}
  `;
  const head = card.querySelector(".q-head");
  const body = card.querySelector(".q-options");
  const icon = card.querySelector(".q-toggle-icon");
  head.addEventListener("click", ()=>{
    body.classList.toggle("open");
    icon.textContent = body.classList.contains("open") ? "▲ 收合" : "▼ 展開";
  });
  return card;
}

/* ---------------- MODULE 1: bank ---------------- */
const bankList = document.getElementById("bankList");
const bankSearch = document.getElementById("bankSearch");
const bankCounter = document.getElementById("bankCounter");

function renderBank(){
  const kw = bankSearch.value.trim();
  let list = QUESTIONS;
  if(kw){
    if(/^\d+$/.test(kw)){
      list = QUESTIONS.filter(q=>String(q.id) === kw);
    }else{
      list = QUESTIONS.filter(q=> q.stem.includes(kw) ||
        q.options.A.includes(kw) || q.options.B.includes(kw) ||
        q.options.C.includes(kw) || q.options.D.includes(kw));
    }
  }
  bankCounter.textContent = `顯示 ${list.length} / ${QUESTIONS.length} 題`;
  bankList.innerHTML = "";
  const frag = document.createDocumentFragment();
  list.forEach(q=> frag.appendChild(renderQuestionCard(q, {showHistory:false})) );
  bankList.appendChild(frag);
}
bankSearch.addEventListener("input", renderBank);
document.getElementById("bankExpandAll").addEventListener("click", ()=>{
  document.querySelectorAll("#bankList .q-options").forEach(el=>el.classList.add("open"));
  document.querySelectorAll("#bankList .q-toggle-icon").forEach(el=>el.textContent="▲ 收合");
});
document.getElementById("bankCollapseAll").addEventListener("click", ()=>{
  document.querySelectorAll("#bankList .q-options").forEach(el=>el.classList.remove("open"));
  document.querySelectorAll("#bankList .q-toggle-icon").forEach(el=>el.textContent="▼ 展開");
});
renderBank();

/* ---------------- MODULE 2: quiz ---------------- */
const quizArea = document.getElementById("quizArea");
let quizState = null;

function pickQuizQuestions(){
  const records = loadRecords();
  const unattempted = [];
  const attempted = [];
  QUESTIONS.forEach(q=>{
    const meta = getMeta(records, q.id);
    (meta.everAttempted ? attempted : unattempted).push(q);
  });
  shuffle(unattempted);
  shuffle(attempted);
  let pool = unattempted.slice(0, QUIZ_SIZE);
  if(pool.length < QUIZ_SIZE){
    pool = pool.concat(attempted.slice(0, QUIZ_SIZE - pool.length));
  }
  shuffle(pool);
  return pool;
}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function startQuiz(){
  const list = pickQuizQuestions();
  quizState = { list, index:0, answers:{}, finished:false };
  renderQuizIdleOrActive();
}
function renderQuizIdleOrActive(){
  if(!quizState){
    quizArea.innerHTML = `
      <div class="quiz-idle">
        <h2>準備好開始測驗了嗎？</h2>
        <p>系統會從題庫中隨機抽取 ${QUIZ_SIZE} 題，並優先抽取您尚未作答過的題目。<br>
        未作答的題目將視為答錯。測驗過程中可隨時結束並查看結果。</p>
        <button class="btn-primary" id="startQuizBtn">開始測驗</button>
      </div>`;
    document.getElementById("startQuizBtn").addEventListener("click", startQuiz);
    return;
  }
  if(quizState.finished){
    renderQuizResults();
  }else{
    renderQuizQuestion();
  }
}

function renderQuizQuestion(){
  const { list, index, answers } = quizState;
  const q = list[index];
  const answeredCount = Object.keys(answers).length;

  const paletteHtml = list.map((qq,i)=>{
    const cls = ["pal-btn"];
    if(answers[qq.id] !== undefined) cls.push("answered");
    if(i === index) cls.push("current");
    return `<button class="${cls.join(" ")}" data-idx="${i}">${i+1}</button>`;
  }).join("");

  quizArea.innerHTML = `
    <div class="quiz-progress">
      <span>第 ${index+1} / ${list.length} 題</span>
      <span>已作答 ${answeredCount} / ${list.length}</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${(answeredCount/list.length*100).toFixed(0)}%"></div></div>
    <div class="quiz-palette">${paletteHtml}</div>
    <div class="quiz-card">
      <div class="quiz-stem">第 ${q.id} 題　${escapeHtml(q.stem)}</div>
      <div id="quizOptions">
        ${["A","B","C","D"].map(k=>{
          const sel = answers[q.id] === k ? "selected" : "";
          return `<div class="quiz-opt ${sel}" data-letter="${k}">
            <span class="opt-letter">${k}</span>
            <span>${escapeHtml(q.options[k])}</span>
          </div>`;
        }).join("")}
      </div>
    </div>
    <div class="quiz-nav">
      <div class="side">
        <button class="btn-secondary" id="prevBtn" ${index===0?"disabled":""}>← 上一題</button>
        ${index < list.length-1 ? `<button class="btn-secondary" id="nextBtn">下一題 →</button>` : `<button class="btn-primary" id="submitBtn">交卷</button>`}
      </div>
      <button class="btn-danger" id="endQuizBtn">結束測驗</button>
    </div>
  `;

  document.querySelectorAll("#quizOptions .quiz-opt").forEach(el=>{
    el.addEventListener("click", ()=>{
      quizState.answers[q.id] = el.dataset.letter;
      renderQuizQuestion();
    });
  });
  document.querySelectorAll(".pal-btn").forEach(el=>{
    el.addEventListener("click", ()=>{
      quizState.index = parseInt(el.dataset.idx,10);
      renderQuizQuestion();
    });
  });
  const prevBtn = document.getElementById("prevBtn");
  if(prevBtn) prevBtn.addEventListener("click", ()=>{ quizState.index--; renderQuizQuestion(); });
  const nextBtn = document.getElementById("nextBtn");
  if(nextBtn) nextBtn.addEventListener("click", ()=>{ quizState.index++; renderQuizQuestion(); });
  const submitBtn = document.getElementById("submitBtn");
  if(submitBtn) submitBtn.addEventListener("click", finishQuiz);
  document.getElementById("endQuizBtn").addEventListener("click", ()=>{
    if(confirm("確定要結束測驗嗎？尚未作答的題目將視為答錯。")) finishQuiz();
  });
}

function finishQuiz(){
  const records = loadRecords();
  let correct = 0;
  const wrongList = [];
  quizState.list.forEach(q=>{
    const picked = quizState.answers[q.id];
    const isCorrect = picked === q.answer;
    if(isCorrect) correct++;
    else wrongList.push({ q, picked: picked || null });
    recordAttempt(records, q.id, isCorrect ? "O" : "X");
  });
  saveRecords(records);
  quizState.finished = true;
  quizState.score = correct;
  quizState.wrongList = wrongList;
  renderQuizResults();
}

function renderQuizResults(){
  const { score, list, wrongList } = quizState;
  quizArea.innerHTML = `
    <div class="result-summary">
      <div class="result-score">${score} <span>/ ${list.length}</span></div>
      <p style="color:var(--text-mute);font-size:13px;margin-top:6px;">答對 ${score} 題，答錯或未作答 ${list.length-score} 題</p>
      <div class="result-actions">
        <button class="btn-primary" id="retryBtn">再測一次</button>
        <button class="btn-secondary" id="backBankBtn">回題庫瀏覽</button>
      </div>
    </div>
    <div id="wrongListArea"></div>
  `;
  document.getElementById("retryBtn").addEventListener("click", ()=>{ quizState = null; startQuiz(); });
  document.getElementById("backBankBtn").addEventListener("click", ()=>{
    quizState = null;
    document.querySelector('nav.tabs button[data-view="bank"]').click();
  });

  const wrongArea = document.getElementById("wrongListArea");
  if(wrongList.length === 0){
    wrongArea.innerHTML = `<div class="empty-state">🎉 全部答對，太厲害了！</div>`;
    return;
  }
  const title = document.createElement("p");
  title.className = "counter";
  title.textContent = `錯題一覽（共 ${wrongList.length} 題）`;
  wrongArea.appendChild(title);

  wrongList.forEach(({q, picked})=>{
    const div = document.createElement("div");
    div.className = "wrong-item";
    div.innerHTML = `
      <div><span class="q-num">第 ${q.id} 題</span><span class="q-stem">${escapeHtml(q.stem)}</span></div>
      <div style="margin-top:10px;">${buildOptionsHtml(q)}</div>
      <div class="your-pick">您的答案：${picked ? `(${picked}) ${escapeHtml(q.options[picked])}` : "未作答"}</div>
      <div class="q-explain"><strong>解析：</strong>${escapeHtml(q.explanation)}</div>
    `;
    wrongArea.appendChild(div);
  });
}

renderQuizIdleOrActive();

/* ---------------- MODULE 3: records ---------------- */
const recordList = document.getElementById("recordList");
const recordSort = document.getElementById("recordSort");
const recordFilter = document.getElementById("recordFilter");
const recordCounter = document.getElementById("recordCounter");

function renderRecords(){
  const records = loadRecords();
  let list = QUESTIONS.map(q=>({ q, meta: getMeta(records, q.id) }));

  const filterVal = recordFilter.value;
  if(filterVal === "o") list = list.filter(x=>x.meta.everAttempted && x.meta.lastResult==="O");
  else if(filterVal === "x") list = list.filter(x=>x.meta.everAttempted && x.meta.lastResult==="X");
  else if(filterVal === "none") list = list.filter(x=>!x.meta.everAttempted);

  const sortVal = recordSort.value;
  if(sortVal === "oldest") list.sort((a,b)=> a.meta.lastTs - b.meta.lastTs);
  else if(sortVal === "newest") list.sort((a,b)=> b.meta.lastTs - a.meta.lastTs);
  // "original": keep QUESTIONS order (already in that order)

  recordCounter.textContent = `顯示 ${list.length} / ${QUESTIONS.length} 題`;
  recordList.innerHTML = "";
  const frag = document.createDocumentFragment();
  list.forEach(({q})=> frag.appendChild(renderQuestionCard(q, {showHistory:true})) );
  recordList.appendChild(frag);
}
recordSort.addEventListener("change", renderRecords);
recordFilter.addEventListener("change", renderRecords);
</script>
