分解塑料作為主體結構材料", "B": "規定所有既有住宅必須在三年內無條件拆除重建，否則處以高額之懲罰性碳費", "C": "提升與修訂建築之節能標準、導入智慧化能源管理系統、並積極推動再生能源導入", "D": "限制所有住商大樓之冷氣空調冷媒一律改為壓縮空氣，直接免除冷媒盤查"}, "answer": "C", "explanation": "依據講義「節能」關鍵戰略與住商部門減量規劃，住宅與建築部門最主要的減碳手段為：提升新建與既有建築之節能性能標準、推廣智慧化能源管理（如節能控制、台數控制）、以及導入再生能源之使用（如屋頂光電自發自用）。【一、氣候變遷與溫室氣體管理下冊講義P.182 / 紙本考卷P.38第416題】"}, {"id": 159, "stem": "某市交通局永續管理科正在編製該市「低碳綠色大眾運輸與移動轉型計畫」。依據我國 2050 淨零轉型關鍵戰略，針對「運輸部門轉型」之核心推動方向，主要涵蓋下列哪一組重點技術與政策路徑？", "options": {"A": "積極推動運具電動化與無碳化、升級與擴大綠色公共運輸系統、並導入智慧化運輸管理", "B": "軌道交通國有化政策、並大幅限制民間業者進口任何新型號之重型柴油大貨車", "C": "油價調整與汽油稅改革，並強制要求所有大眾客運車輛一律改採生質酒精燃料替代", "D": "降低機動車輛擁有率、並在市區邊界全面增建多層次高架快速道路以緩解壅塞"}, "answer": "A", "explanation": "「運具電動化及無碳化」是運輸部門轉型的關鍵戰略。其核心手段包括：推動客運公車與乘用車之電動化（2030年市區公車100%電動化）、提升公共運輸服務比重、並結合智慧化管理提升運輸效能。【一、氣候變遷與溫室氣體管理下冊講義P.182 / 紙本考卷P.38第417題】"}, {"id": 160, "stem": "淨零轉型是一場全民與全社會的運動。依據我國「2050 淨零轉型」之核心精神，用以推動社會大眾共同參與、確保不遺落任何人的「社會轉型」與社會溝通，其最主要之核心內涵為何？", "options": {"A": "限制所有非上市櫃之中小企業在平台進行碳排放數據之質性揭露", "B": "落實公民氣候素養之提升、強化公私協力機制、並建立多元之利害關係人參與管道", "C": "強制規定社區組織及 NGO 必須全額出資協助周邊工廠進行老舊燃氣鍋爐汰換", "D": "以中央威權行政指令強制要求各地方居民接受高污染廢棄物焚化廠之擴建"}, "answer": "B", "explanation": "「社會轉型」策略核心在於「不遺落任何人（公正轉型）」與社會溝通。主要內涵在於藉由公民氣候素養培育、公私協力（NGO、企業、政府）以及多方利害關係人包容性溝通與多元參與，凝聚全民淨零共識並推展關鍵行動。【一、氣候變遷與溫室氣體管理下冊講義P.182 / 紙本考卷P.38第420題】"}, {"id": 161, "stem": "某機械加工廠正制定其「產業轉型」計畫書，以爭取成為綠色供應鏈之合格夥伴。依據我國 2050 淨零排放路徑之指引，製造業與傳統產業在落實「產業轉型」時，其在技術與管理層面最核心、最首要之推動重點與減碳途徑為何？", "options": {"A": "優先爭取政府無條件之碳費減免補貼，並全面將生產線外包至海外氣候寬鬆國家", "B": "發展與導入低碳技術、實質提升製程之能源效率、以及推動資源循環與零廢棄", "C": "全面購買國際自願性碳信用額度進行財務性抵減，維持既有高耗能製程與設備不變", "D": "優先汰除所有低附加價值產品，並強制將工廠用地全部轉化為森林增匯與太陽能光電場"}, "answer": "B", "explanation": "我國 2050 淨零路徑之「產業轉型」戰略，針對製造業部門，其核心之三大減量策略手段即為：1. 發展低碳技術；2. 提升能源效率；3. 推動循環經濟（資源循環零廢棄）。【一、氣候變遷與溫室氣體管理下冊講義P.183 / 紙本考卷P.38第414題】"}, {"id": 162, "stem": "在淨零科技發展中，碳捕捉、利用與封存（CCUS）被定位為關鍵的減碳與負排放技術。依據我國 2050 淨零旗艦行動計畫，此項高成本之新興技術，主要應優先應用並落實於下列哪一類產業或部門？", "options": {"A": "半導體封測與一般精密電子裝配產業", "B": "輕工業、服務業、金融保險業與百貨量販零售據點", "C": "陸域新植造林、竹林與濕地藍碳之生態保護區", "D": "高碳排且難以透過一般電力替代減量之難減行業（如水泥、鋼鐵、石化等產業）"}, "answer": "D", "explanation": "碳捕捉、利用與封存（CCUS）在技術與經濟定位上，是針對製程產生重大高濃度二氧化碳、且一般節能與電氣化手段難以大幅削減的「高碳排難減量部門（水泥、鋼鐵、化學與石化等）」之必備補充性高階減碳技術。【一、氣候變遷與溫室氣體管理下冊講義P.185 / 紙本考卷P.38第418題】"}, {"id": 163, "stem": "某智庫學者正研擬向立法院提出氣候法規修訂建言，並參考瑞典先進之氣候預算管理。瑞典於西元 2018 年正式實施其《氣候法》（Swedish Climate Act）。該法為了確保國家中長期減量承諾不淪為口號，在財政與施政管理上課予政府何種最關鍵的年度法定義務？", "options": {"A": "必須強制向歐盟執行委員會提出無條件購買國外碳權以沖抵全境工業排放之承諾", "B": "要求國家財政部每年發行等同於 GDP 總額 5% 之自願性氣候主權債券", "C": "規定政府內閣成員若未達成當季減量目標，一律停發全體首長之公務年終獎金", "D": "政府必須在每年向國會提交財政預算案的同時，一併呈交「年度氣候報告」，確保預算與氣候目標相輔相成"}, "answer": "D", "explanation": "瑞典《氣候法》的核心法治設計要求：政府每年提報財政預算案時，必須隨案提交一份「年度氣候報告」，詳細評估與審查其減碳施政成效及預算分配，使經濟政策與氣候目標緊密交織、相輔相成。【一、氣候變遷與溫室氣體管理下冊講義P.221 / 紙本考卷P.38第407題】"}, {"id": 164, "stem": "某跨國科技公司永續發展小組在設定各海外分公司的淨零目標時程。瑞典在氣候立法上展現了極高的先驅企圖心，依據其通過之氣候法規與目標架構，瑞典依法承諾達成全國淨零排放（Net-Zero Emissions）的法定目標年份為哪一年？", "options": {"A": "西元 2035 年", "B": "西元 2045 年", "C": "西元 2050 年", "D": "西元 2060 年"}, "answer": "B", "explanation": "瑞典於西元 2018 年實施氣候法，並將其全國溫室氣體淨零排放之目標年，由多數國家的 2050 年更為提前、依法設定為「西元 2045 年」。【一、氣候變遷與溫室氣體管理下冊講義P.221 / 紙本考卷P.38第408題】"}, {"id": 165, "stem": "某綠領工程師在參與一項「氣候變遷調適與減量前瞻技術」之座談會。依據我國「2050 淨零轉型」之政策藍圖，政府除了提出多項轉型策略外，更強調必須建立穩固的「兩大治理基礎」以作為推動所有關鍵戰略的堅實後盾。請問這兩大治理基礎具體指下列哪一個選項？", "options": {"A": "貿易外交 與 關稅減免", "B": "科技研發 與 氣候法治", "C": "產業融資 與 租稅優惠", "D": "勞工公正轉型 與 青年永續教育"}, "answer": "B", "explanation": "我國 2050 淨零路徑架構下之「兩大治理基礎（兩大基礎）」，明確指「科技研發（建基磐）」與「氣候法治（碳排有價、法規調適等）」，作為支持各轉型戰略長遠落地之基石。【一、氣候變遷與溫室氣體管理下冊講義P.9 / 紙本考卷P.38第411題】"}, {"id": 166, "stem": "某科學園區之綠領經理人正為供應鏈夥伴進行「台灣淨零路徑與政策對接」之專題報告。依據我國官方公布之「臺灣 2050 淨零排放路徑及策略總說明」，我國推動淨零轉型之總體政策架構核心，主要是由下列哪一組宏觀策略與治理體系所共同交織構成？", "options": {"A": "全球綠色貿易壁壘因應 ＋ 出口碳關稅補貼 ＋ 綠色證照輔導計畫", "B": "上市櫃公司永續揭露路徑 ＋ 碳費專款專用原則 ＋ 十大示範綠能園區", "C": "四大轉型策略（能源、產業、生活、社會轉型） ＋ 兩大治理基礎（科技研發、氣候法治） ＋ 十二項關鍵戰略", "D": "國營事業碳配額總量管制 ＋ 碳稅費雙軌制 ＋ 國際碳權全額抵減責任"}, "answer": "C", "explanation": "我國「臺灣 2050 淨零排放路徑及策略」總體推動架構，係以四大轉型策略（能源、產業、生活、社會）及兩大治理基礎（科技研發、氣候法治）為核心支柱，並搭配具體落實之「十二項關鍵戰略」共同推動。【一、氣候變遷與溫室氣體管理下冊講義P.9, P.178 / 紙本考卷P.38第409題】"}, {"id": 167, "stem": "某大專院校開設「綠色領袖前瞻人才培育」暑期專題。我國政府所提出的「四大轉型策略（能源、產業、生活、社會）」與「兩大治理基礎（科技、法治）」，共同構成了我國推動永續發展之哪一項最上位、且具指導性的氣候政策主體？", "options": {"A": "臺灣 2050 淨零排放路徑及策略", "B": "國家溫室氣體先期盤查與自主登錄指引", "C": "臺灣永續綠色金融與責任投資路徑圖", "D": "國家因應氣候風險第二階段韌性調適方案"}, "answer": "A", "explanation": "我國於 2022 年 3 月底正式公布的「臺灣 2050 淨零排放路徑及策略總說明」，即是以「四大轉型」及「兩大基礎」作為總體策略骨架，指引國家邁向 2050 淨零碳排。【一、氣候變遷與溫室氣體管理下冊講義P.9, P.178 / 紙本考卷P.38第412題】"}, {"id": 168, "stem": "全球氣候變遷與溫室效應（Greenhouse Effect）息息相關。若地球大氣中完全沒有溫室氣體之存在，則地表之平均溫度將會驟降至攝氏零下 18 度左右（極度不適宜人類生存），然而目前地球表面實際之平均氣溫得以維持在適宜之「攝氏 15 度」。請問，此一溫度維持之「最上位、核心之科學機制」為何？", "options": {"A": "太陽之短波輻射在穿透大氣層時，被大氣中的溫室氣體完全反射回外太空，進而降低地表之極端熱能逸散", "B": "地球表面與都市熱島效應在進行物理產熱時，其所產生之熱能被平流層之臭氧分子百分之百吸收", "C": "大氣中的溫室氣體（如二氧化碳、水蒸氣、甲烷等）能有效吸收地表所釋放之長波（紅外線）熱輻射，並向地表與四周重新輻射熱能，形成溫室效應，進而維持地表溫度", "D": "地底深層地熱、極地地殼板塊擠壓與深海洋流在交匯時，所產生之化學與物理連鎖釋熱反應"}, "answer": "C", "explanation": "溫室效應是地球生命的科學基石。太陽發出的短波輻射可穿透大氣層加熱地表，地表在變熱後會向外太空釋放長波紅外線輻射。大氣中的溫室氣體（如 CO2, CH4, N2O 等）能有效吸收這些長波輻射，並將部分熱能重新輻射回地表，阻擋熱量迅速流失，使地表平均溫度維持在溫暖的攝氏 15 度。若無溫室效應，地表平均溫度將是冰冷的攝氏零下 18 度。【一、氣候變遷講義上冊P.90 / 下冊P.163 / 附錄、名詞定義】"}, {"id": 169, "stem": "某環境顧問在為企業經理人講授「氣候相關財務揭露（TCFD）」之情境分析（Scenario Analysis）。在政府間氣候變化專門委員會（IPCC）所發布的第六次評估報告（AR6）中，科學家為了更全面地模擬未來不同的氣候變遷衝擊與減量調適路徑，採用了結合「代表濃度路徑（RCPs）」與下列哪一種考量社會、人口、經濟及技術發展趨勢之未來假設路徑情境，作為氣候變遷科學推估與風險評估的核心基礎？", "options": {"A": "全球綠色 GDP 增長與低碳外銷路徑", "B": "聯合國永續發展目標整合情境", "C": "氣候敏感度與生態系統承載力模型", "D": "共享社會經濟路徑（Shared Socio-economic Pathways, SSPs）"}, "answer": "D", "explanation": "在 IPCC 第六次評估報告（AR6）中，未來氣候變遷推估情境除以代表濃度路徑（RCPs）為基礎外，更全面結合了考量未來社會、人口、經濟及技術發展可能路徑之「共享社會經濟路徑（Shared Socio-economic Pathways, SSPs）」作為核心假設架構。【一、氣候變遷講義下冊P.166 / 紙本考卷P.38第403題】"}, {"id": 170, "stem": "某晶圓代工廠之黃光與薄膜製程在清洗及化學氣相沈積時，需耗用一定數量的八氟環丁烷（C₄F₈）製程氣體。依據我國氣候法與國際溫室氣體盤查之化學物質分類，此項 C₄F₈ 氣體應歸類為下列哪一種溫室氣體類型？", "options": {"A": "氫氟碳化物 (HFCs)", "B": "三氟化氮 (NF3)", "C": "全氟碳化物 (PFCs)", "D": "六氟化硫 (SF6)"}, "answer": "C", "explanation": "八氟環丁烷（C₄F₈）屬於半導體與光電製程常用之含氟氣體，其國際化學分類上屬於「全氟碳化物（PFCs）」類別。（本題標準答案為 C），【二、溫室氣體盤查作業講義 P.1】"}, {"id": 171, "stem": "我國《氣候變遷因應法》明文規定並定義受國家法令所管制的溫室氣體種類項目。依據現行法理與盤查管制範疇，下列哪一項氣體「不屬於」氣候法所公告管制的七大溫室氣體之一？", "options": {"A": "三氟化氮 (NF3)", "B": "一氧化碳 (CO)", "C": "氧化亞氮 (N2O)", "D": "全氟碳化物 (PFCs)"}, "answer": "B", "explanation": "我國氣候法列管之 7 種主要溫室氣體包含：二氧化碳（CO₂）、甲烷（CH₄）、氧化亞氮（N₂O）、氫氟碳化物（HFCs）、全氟碳化物（PFCs）、六氟化硫（SF₆）及三氟化氮（NF₃），但不包含「一氧化碳（CO）」。（本題標準答案為 B），【二、溫室氣體盤查作業講義 P.1】"}, {"id": 172, "stem": "某大專校院永續工作小組在彙整校區溫室氣體排放清冊。在分類排放源時，學校因「向公用售電業外購電力及蒸汽」以供應教學大樓、冷氣及實驗室運轉所產生之排放，在溫室氣體盤查標準中應歸類為下列何者？", "options": {"A": "輸入能源之間接溫室氣體排放（類別 2 / 範疇二）", "B": "直接溫室氣體排放（類別 1 / 範疇一）", "C": "運輸之間接溫室氣體排放（類別 3 / 範疇三）", "D": "其他來源產生之間接排放（類別 6 / 範疇三）"}, "answer": "A", "explanation": "依據盤查與 ISO 14064-1 之範疇分類：企業或組織「外購且消耗之電力、蒸汽、熱力、冷能」等輸入能源所產生的排放，歸類於「範疇二（輸入能源之間接溫室氣體排放）」（對應新版之類別 2）。【二、溫室氣體盤查作業講義 P.10】"}, {"id": 173, "stem": "某連鎖餐飲集團永續師正在為盤查組織之「範疇三（其他間接排放）」數據進行邊界鑑別。依據溫室氣體盤查標準，下列哪一項企業活動所產生之排放，在性質上「不屬於」範疇三之範疇，而應直接歸類於範疇一（直接排放）？", "options": {"A": "總部地下室所設之「緊急備用柴油發電機」因定期測試運轉而燃燒柴油產生的排放", "B": "集團向外部農場合作採購之有機食材，於上游委託卡車配送過程之排放", "C": "員工搭乘跨國客機進行公務差旅所產生之航空排碳", "D": "顧客在購買餐點外帶後，將包裝紙盒委託外包清潔公司進行焚化處理之排放"}, "answer": "A", "explanation": "範疇一（直接排放）指組織所擁有或控制的排放源。集團總部大樓裝設之「緊急柴油發電機」屬於該集團實體控制之固定燃燒設備，其測試燃燒產生之排放為「範疇一（直接排放）」；其餘則屬於組織邊界外由其他實體活動所產生的「範疇三（其他間接排放）」。【二、溫室氣體盤查作業講義 P.10】"}, {"id": 174, "stem": "我國溫室氣體排放量強制納管事業及自願性申報事業，在執行年度溫室氣體排放量盤查與登錄時。依據環境部《溫室氣體排放量盤查登錄及查驗管理辦法》之規定，事業應於每年「四月三十日」前，將前一年度之哪一組法定盤查文件，透過網路傳輸方式，完成線上資訊平台之申報登錄？", "options": {"A": "溫室氣體排放量清冊 ＋ 溫室氣體盤查報告書", "B": "第三方查驗機構簽發之查驗總結報告書 ＋ 確信聲明書", "C": "企業內部碳定價執行清冊 ＋ 溫管基金補助申請計畫書", "D": "自主減量計畫執行成果報告 ＋ 設備報廢與妥善清理聯單"}, "answer": "A", "explanation": "依據《溫室氣體排放量盤查登錄及查驗管理辦法》第 3 條規定，事業應於每年 4 月 30 日前，將前一年度之溫室氣體「排放量清冊」與「盤查報告書」登錄並申報於平台。而後續之查驗結果上傳期限則為 10 月 31 日前。（本題標準答案為 A），【二、溫室氣體盤查作業講義 P.16】"}, {"id": 175, "stem": "某綠領管理師奉命為工廠進行「溫室氣體排放源鑑別」。在系統化盤點全廠邊界內所有實體與製程設備時，下列哪一個項目在技術上「非屬」溫室氣體之物理排放源？", "options": {"A": "廠區內裝設之污水處理槽與化糞池設施", "B": "製程中用於加溫的原物料燃燒鍋爐設備", "C": "用於載運貨物之柴油堆高機與移動式割草機", "D": "公司生產之商品在市場銷售時之「產品定價與財務經濟價值」"}, "answer": "D", "explanation": "排放源（Sources）是指向大氣中釋放溫室氣體之物理單元、製程或設施。包含固定燃燒（鍋爐）、製程、移動（堆高機）、以及逸散（化糞池）。「產品價格或價值」屬於財務與商業營運指標，不屬於物理上釋放溫室氣體之實體源，【二、溫室氣體盤查作業講義 P.17 / 一、氣候變遷與溫室氣體管理(上冊)講義 P.90】"}, {"id": 176, "stem": "某電子廠之綠領專員正依據標準流程設定「溫室氣體盤查邊界（Boundary Setting）」。在技術與法規審核中，關於如何合理且正確劃定與識別盤查之實體或專案邊界，下列哪一項敘述內容最為完整且正確？", "options": {"A": "組織型盤查之邊界，可依目的事業主管機關所核發之工廠登記或商工登記之實體邊界與營運地址為劃定基礎", "B": "製造業之邊界劃定，應對照並提供環境部所核發之固定污染源管制編號，以明確識別盤查範疇", "C": "若為執行自願減量專案或抵換專案，其確證之實地邊界應完全依據專案計畫書中所列之專案地理與設備邊界為準", "D": "以上敘述之邊界劃定、對照及專案實地確證基礎，均完全正確"}, "answer": "D", "explanation": "邊界設定是溫室氣體量化的第一步。組織型溫室氣體盤查應以工廠登記證、商工登記或管制編號所核准之實體地址與範圍為邊界；而執行專案層級之自願減量（或抵換）時，則應嚴格以專案計畫書（PDD）中所劃定與確證之設備及地理邊界為準。（本題標準答案為 D），【二、溫室氣體盤查作業講義 P.17 / 三、溫室氣體自願減量作業與減量額度講義 P.2】"}, {"id": 177, "stem": "某不鏽鋼熱軋廠正著手執行年度溫室氣體盤查。依據環境部《溫室氣體排放量盤查作業指引》之規範，廠家在設定與劃定其「盤查邊界」時，最上位且最具法定與科學公信力之判定依據為下列何者？", "options": {"A": "目的事業主管機關核准設立、登記之工廠登記證或商工登記登載範圍與營運地址", "B": "廠區自行在內部繪製之未來五新生產線與倉儲區之概念擴建平面配置配置圖", "C": "集團向金融機構申請綠色融資時所檢附之資產負債表與抵押地籍證明文件", "D": "同業公會所推薦之常規典型鋼鐵廠排放源鑑別範本與平均土地使用面積"}, "answer": "A", "explanation": "依據溫室氣體盤查管理辦法及盤查作業指引，組織設定盤查邊界必須具有法定依據，應以目的事業主管機關核准設立、登記或營運之邊界（如：工廠登記證編號或商工登記編號登載範圍）為盤查及量化邊界，【二、溫室氣體盤查作業講義 P.17】"}, {"id": 178, "stem": "某工業區一棟廠房內，由同集團下的 A 製造廠與 B 精密加工廠共同使用同一個物理大門地址，但兩廠各自擁有獨立、不同的「工廠登記證」編號。依據我國溫室氣體排放量盤查登錄之合規申報規範，這兩家大廠在實務上應如何辦理其年度碳盤查？", "options": {"A": "由於物理地址完全相同，直接由集團合併為一個盤查報告與清冊辦理登錄即可", "B": "僅需由產量較高或排放量較大的 A 製造廠辦理盤查，B 廠得直接列為 A 廠之次製程予以豁免", "C": "兩廠「應分別依其工廠登記證設定獨立邊界，進行獨立盤查、編製報告與申報登錄」", "D": "應由查驗機構根據兩廠當年度之實際營收多寡，動態指定其中一家進行代表性盤查即可"}, "answer": "C", "explanation": "溫室氣體盤查之邊界設定是以「目的事業主管機關核准之工廠登記編號或商工登記編號」為法理與實體識別基礎。即使實體地址相同，只要工廠登記證不同，即屬於不同的法律與營運主體，依法「必須分開辦理」獨立的碳盤查與申報登錄，【二、溫室氣體盤查作業講義 P.17】"}, {"id": 179, "stem": "某連鎖零售總部大樓在執行組織型溫室氣體盤查時。環安人員鑑別出地下室設有辦公大樓全體員工公務廢水集中之「化糞池」設備。依據溫室氣體排放源分類與化學物質逸散特徵，大樓之化糞池在日常運作（有機物厭氧分解）中，所產生之最主要逸散溫室氣體種類為何？", "options": {"A": "甲烷 (CH4)", "B": "二氧化碳 (CO2)", "C": "三氟化氮 (NF3)", "D": "六氟化硫 (SF6)"}, "answer": "A", "explanation": "生活廢水與大樓化糞池在處理生活污水時，有機物於厭氧環境下會進行生化分解，其所逸散產生的最主要溫室氣體種類即為「甲烷（CH₄）」。（本題標準答案為 A），【二、溫室氣體盤查作業講義 P.21】"}, {"id": 180, "stem": "某科學園區的高電壓輸配電工程系統中，裝設有大量的變壓器、高壓開關與電路斷路器等關鍵電路設施。在執行範疇一之製程與設備逸散溫室氣體盤查時，此類絕緣開關電路設備，最易產生下列哪一種高溫暖化潛勢之溫室氣體逸散？", "options": {"A": "甲烷 (CH4)", "B": "全氟碳化物 (PFCs)", "C": "三氟化氮 (NF3)", "D": "六氟化硫 (SF6)"}, "answer": "D", "explanation": "電力輸配電線路之變壓器、絕緣開關與氣體絕緣斷路器（GIS）等關鍵電力設備，因物理與氣體絕緣設計，通常採用「六氟化硫（SF₆）」作為其優良之絕緣絕緣介質。（本題標準答案為 D），【二、溫室氣體盤查作業講義 P.21】"}, {"id": 181, "stem": "某公用變電所之高壓電氣設備中，裝設有以六氟化硫（SF6）為氣體絕緣介質之氣體絕緣變電設備（GIS）。依據環境部溫室氣體盤查指引，此類高壓電氣輸配電設施因設備微量滲漏或維護不當所生之 SF6 排放，在性質上屬於下列哪一種排放型式？", "options": {"A": "移動燃燒排放源", "B": "固定燃燒排放源", "C": "逸散排放源", "D": "製造製程化學轉換排放源"}, "answer": "C", "explanation": "逸散排放是指溫室氣體非經由排氣管道或煙道而有意或無意之釋放，高壓電氣輸配電系統中所使用之 SF6 絕緣介質之氣體微量洩漏，在盤查分類上屬於典型的「逸散排放源」，【二、溫室氣體盤查作業講義 P.21】"}, {"id": 182, "stem": "某商業辦公大樓在進行溫室氣體排放源分類。大樓內設有多種設備。請問在下列審查鑑別出的設備中，哪一個在性質上屬於「逸散排放源」？", "options": {"A": "供應全棟暖氣之「燃煤熱水鍋爐設備」", "B": "大樓空調製冷系統中，所封存之「氟化碳冷媒氣體（如 HFC-134a）」之洩漏", "C": "用於行政接駁之「汽油公務小客車」", "D": "大樓所使用之「外購公用電網電力」"}, "answer": "B", "explanation": "逸散排放是指未經由故意設計的排氣管道，而因設備、機件、閥門密封不良或損壞，造成溫室氣體微量逸出。冷調空調設備中氟化冷媒的逸漏即為典型的「逸散排放源」。鍋爐燃煤為固定燃燒，公務車為移動燃燒，外購電力為能源間接，【二、溫室氣體盤查作業講義 P.21】"}, {"id": 183, "stem": "全球氣候政策之制定與升溫路徑之規劃，高度仰賴公正且具公信力之氣候變遷評估。某個成立於西元 1988 年的國際機構，係由世界氣象組織（WMO）與聯合國環境規劃署（UNEP）共同合作創立，旨在凝聚全球氣候與經濟科學家，定期撰寫並發布氣候變遷評估報告（如著名的 AR5、AR6 報告）。請問該權威機構之英文縮寫為何？", "options": {"A": "COP (Conference of the Parties)", "B": "IPCC (Intergovernmental Panel on Climate Change)", "C": "ISSB (International Sustainability Standards Board)", "D": "SBTi (Science Based Targets initiative)"}, "answer": "B", "explanation": "**「政府間氣候變化專門委員會（Intergovernmental Panel on Climate Change, IPCC）」**係由 WMO 與 UNEP 於 1988 年創立之聯合國氣候科學評估組織。其定期發布之氣候變遷評估報告（AR 系列），是各國政府進行氣候談判、修訂減碳政策與排碳係數引用最權威之科學依據，【二、溫室氣體盤查作業講義 P.254】"}, {"id": 184, "stem": "某造紙廠在製程中大量使用「生質木質燃料（Biomass）」作為替代燃料發電。依據溫室氣體盤查與申報規範，當燃料種類含有生物質成分時，下列關於其燃燒產生之溫室氣體量化與申報原則，何者「錯誤」？", "options": {"A": "生質燃料燃燒所產生之 CO₂ 排放，屬自然界短期碳循環之一部分，仍需進行量化並於報告中「單獨表列」，不可直接併入組織之總排放當量中", "B": "雖然生質 CO₂ 屬於中性碳不計入總量，但燃燒生質燃料所伴隨產生之 CH₄ 及 N₂O，依然必須進行實質計算，且「必須彙總」至組織之總溫室氣體排放量中", "C": "生質燃料燃燒伴隨產生之 CH₄ 與 N₂O 溫室氣體，因其暖化影響顯著，在盤查申報時僅需單獨表列，毋須彙總至全廠排放總量中", "D": "若燃料中同時含有化石燃料與生物質，應依其混合比例或檢測數據，分別核算化石源與生質源之排放量"}, "answer": "C", "explanation": "生質燃料燃燒所釋放之二氧化碳（CO₂）屬短期碳循環，依國際與國家規範應計算並單獨表列，不併入組織總排放當量；但其燃燒過程所產生的甲烷（CH₄）與氧化亞氮（N₂O）並非中性碳，依法「必須彙總」計算至全廠的總溫室氣體排放量中，不能僅作單獨表列，【二、溫室氣體盤查作業講義 P.31、P.65】"}, {"id": 185, "stem": "某鋼鐵廠在核算燃燒「高焦爐氣」所產生之溫室氣體排放量時。依據環境部公告之「溫室氣體排放量盤查作業指引」，若廠家決定採用「質量平衡法」進行燃料燃燒之排放量量化核算，則在此一質量守恆計算中，其量化與計算之溫室氣體種類「僅限於」哪一種氣體？", "options": {"A": "甲烷 (CH4)", "B": "六氟化硫 (SF6)", "C": "二氧化碳 (CO2)", "D": "氧化亞氮 (N2O)"}, "answer": "C", "explanation": "依據環境部「溫室氣體排放量盤查作業指引」，當事業採用「質量平衡法」核算燃料燃燒之碳排放量時（基於碳素守恆），其所能計算與量化之溫室氣體種類「僅限於二氧化碳（CO₂）」。（本題標準答案為 C），【二、溫室氣體盤查作業講義 P.31】"}, {"id": 186, "stem": "某顧問機構為開展碳權專案確證與查證業務，向環境部申請增設「專案型溫室氣體查驗類別」之查驗機構許可。依據《溫室氣體認證機構及查驗機構管理辦法》之執業資格規範，該機構之查驗人員編制中，針對「專案型」查驗人力，在法定人數與資格上之最低底線要求為何？", "options": {"A": "至少應配備 5 名具有工程師執照之查驗人員，且全數應為非專職主導查驗員", "B": "至少配備 3 名合格查驗人員，且其中「至少應有 2 名為專職（專任）之主導查驗員」", "C": "僅需編制 1 名具有博士學歷之專職主導查驗員，其餘得以外部兼職顧問彈性充任", "D": "應編制至少 10 名非專任查驗助理，並與金融證交所簽訂兼執業委託書"}, "answer": "B", "explanation": "依據我國查驗機構管理辦法與標準，申請溫室氣體查驗機構許可（專案型），其技術查驗團隊至少應包含「3名合格查驗人員」，且其中「至少應有2名為專職主導查驗員」，以保障專案審驗之品質與科學客觀性，【二、溫室氣體盤查作業講義 P.31】"}, {"id": 187, "stem": "某精密金屬熔接廠在執行溫室氣體盤查時，發現廠內當年度共消耗了 0.885 公噸的乙炔（C₂H₂）氣體。若廠家採用「質量平衡法」進行燃料燃燒二氧化碳排放量核算（已知乙炔分子量為 26，二氧化碳分子量為 44，其完全燃燒化學反應式為 2C₂H₂ + 5O₂ → 4CO₂ + 2H₂O，轉化效率設定為 100%）。請問該廠此項作業所衍生之二氧化碳年排放量約為多少公噸？", "options": {"A": "2.995 公噸", "B": "0.885 公噸", "C": "1.828 公噸", "D": "1.500 公噸"}, "answer": "A", "explanation": "依據質量平衡法，燃燒 1 莫耳的乙炔會產生 2 莫耳的二氧化碳。其理論二氧化碳排放因子為：(4 * 44) / (2 * 26) = 176 / 52 ≒ 3.3846（公噸 CO₂ / 公噸 C₂H₂）。因此，消耗 0.885 公噸乙炔之排放量為：0.885 * 3.3846 ≒ 2.995 公噸。（本題標準答案為 A），【二、溫室氣體盤查作業講義 P.32】"}, {"id": 188, "stem": "某化學原材料製造廠擬為其熔窯與煙囪氣體排出口，建置連續自動監測系統（CEMS）。該技術旨在透過連續測定排氣管道中之「溫室氣體濃度」與「排氣體積流率」，並依此計算出溫室氣體之實際年排放量。請問，此種量化與計算排放量的方法屬於下列何者？", "options": {"A": "直接監測法 (Continuous Emission Measurement / CEMS)", "B": "質量平衡法 (Mass Balance Method)", "C": "排放係數法 (Emission Factor Method)", "D": "投入產出折算係數法"}, "answer": "A", "explanation": "「直接監測法」係指利用連續排放監（檢）測儀器，直接測定排氣管道中之溫室氣體排氣濃度與流量（流率），並根據兩者乘積計算溫室氣體實際排放量之量化科學方法，【二、溫室氣體盤查作業講義 P.33】"}, {"id": 189, "stem": "某發電廠擬針對其排氣煙道裝設連續自動監測系統，採用「直接監測法（CEMS）」計算二氧化碳年排放量。依據盤查與查驗規範，電廠所提報送審之「溫室氣體監測計畫書」中，依法必須完整涵蓋之關鍵核心技術內容包括下列哪些項目？ ① 監測設備之量測方法、原理、規格與設置位置 ② 年度財務損益報表與股東權益分紅規劃 ③ 監測數據之採集、處理、品質保證（QA）與品質控制（QC）作業程序 ④ 現場運行維護工程師之每日上下班打卡及個人績效紀錄", "options": {"A": "①、②", "B": "②、③", "C": "①、③", "D": "③、④"}, "answer": "C", "explanation": "企業若採用直接監測法（CEMS），其提報環境部核定之監測計畫書中，核心技術內容必須包含：1. 監測方法與原理、2. 監測設施規格與位置、3. 數據處理與品質保證/控制作業、4. 數據保存與記錄。不包含財務損益與個人考勤考績等商業行政非環境計量項目，【二、溫室氣體盤查作業講義 P.33】"}, {"id": 190, "stem": "某水泥製造廠在進行溫室氣體盤查數據品質管理（DQM）自我核對時，發現現場人員因疏忽漏計了全廠範疇一中車用移動燃燒之汽柴油量，且套用了未定期校正之天然氣計量表。從數據管理與法規合規角度來看，此種不精確之活動數據蒐集，最直接造成的技術與法律衝擊為何？", "options": {"A": "將自動導致該水泥廠在環境部系統中的自主減量計畫指定目標被強制調整為 0%", "B": "該造紙廠得免予遞交任何盤查報告書與清冊，直接豁免前一年度之所有碳費", "C": "將導致該廠溫室氣體排放當量與計費之收費排放量產生「高估或低估之重大偏差」，進而衍生碳費繳納不實或申報違法之風險", "D": "將促使查驗機構直接將其查證結果由合理保證等級無條件調升為最高之特許等級"}, "answer": "C", "explanation": "數據品質管理（DQM）與碳費申報中，活動數據之精確性是溫室氣體量化與碳費計費之基礎。漏計燃料用量或套用未校正儀表，會直接造成排放量之「高估或低估（重大偏差）」，進而導致碳費申報金額錯誤，可能面臨主管機關補徵及行政裁罰之風險，【二、溫室氣體盤查作業講義 P.35】"}, {"id": 191, "stem": "某化學工廠正在針對其蒸汽天然氣流量計之數據執行不確定性量化分析。依據我國溫室氣體盤查與數據品質管理規範，在評估活動數據與排放係數之「不確定性（Uncertainty）來源」時，下列哪一項「非屬」標準且具公信力之主要評估考量因子或數據來源？", "options": {"A": "鄰近同業大廠在官網定性揭露之非特定同業一般性商業資訊", "B": "儀器本身之定期校正紀錄與擴充誤差值", "C": "國家法規所規定之法定容許公差與量測標準", "D": "統計學方法（如標準差或變異係數分析）與國際組織（如 IPCC）之建議數值"}, "answer": "A", "explanation": "不確定性量化分析講求數據之科學性與可追溯性。其活動數據與係數之不確定性主要來源包含：統計學方法、儀器校正紀錄、法定容許誤差、以及官方或國際組織（如 IPCC）建議值。同業在網路上定性揭露之一般商業資訊，不具備科學計量公信力，不能作為該廠不確定性量化之分析因子，【二、溫室氣體盤查作業講義 P.37、P.66】"}, {"id": 192, "stem": "某科技製造公司正在彙整其年度溫室氣體盤查之成果。依據 ISO 14064-1 與我國環境管理辦法規定，企業所提報之「溫室氣體排放量清冊」在內容上，通常「不包含」下列哪一項非環境相關之商業文件或資訊？", "options": {"A": "事業之基本資料、盤查基準年、所選用之盤查邊界設定與劃定方法", "B": "邊界內所鑑別出的直接與間接溫室氣體排放源、設備清冊與製程編碼", "C": "企業當年度經合格會計師簽證之資產負債表、損益表與商業市場行銷戰略報告", "D": "各排放源所選用之科學量化方法、活動數據、排放係數以及七大溫室氣體之碳當量換算結果"}, "answer": "C", "explanation": "溫室氣體排放量清冊（Inventory）是組織在盤查期間內各溫室氣體源、匯及其排放量及移除量之量化結果清冊。包含組織邊界、排放源、計算數據與結果。會計師財務報表與市場行銷等屬於財務會計範疇，不包含於溫室氣體清冊中，【二、溫室氣體盤查作業講義 P.38 / 一、氣候變遷與溫室氣體管理(上冊)講義 P.90】"}, {"id": 193, "stem": "某合格查驗機構指派其主導查驗員赴某水泥廠執行自願減量專案查證現場工作。依據我國《溫室氣體認證機構及查驗機構管理辦法》與執業道德規範，該查驗人員在現地執行符合性審核與評鑑時，必須始終維持下列哪一種核心態度與立場？", "options": {"A": "秉持獨立、客觀、不偏不倚與誠實信用原則，並主動迴避任何可能影響公正判定之潛在經濟或利益衝突關係", "B": "主動協助受查對象編製其自主減量計畫書，並在確證時協助其規劃後續之財務投資分析與定價策略", "C": "為了提升查驗效率與降低審查成本，應依據受查者之財務實力與同業名望，彈性調減數據品質管理之查核標準", "D": "全權配合受查單位之行政便利，允許受查單位自行決定哪些排放源應被排除於查驗邊界之外"}, "answer": "A", "explanation": "第三方符合性評鑑最根本的基石為「誠信、公正與獨立性」。查驗人員與機構必須與受查單位維持絕對之中立與利益分離，避免任何可能損及客觀判定的經濟、僱用或顧問關係（利益衝突迴避），且在查驗中不得提供任何諮詢或指導服務，以保障查核之公正公信。【二、溫室氣體盤查作業講義 P.45 / 三、溫室氣體自願減量作業與減量額度講義 P.4】"}, {"id": 194, "stem": "某查驗機構為了確保所承接之眾多上市櫃公司組織碳盤查查證及產品碳足跡確證案件，其技術判定與技術準則皆具備一致性，防範因不同查驗員之主觀判斷而發生重大技術誤差。依據我國認證與許可要求，該機構在內部品質管理制度中應建立下列哪一項核心機制？", "options": {"A": "要求全體查驗人員一律取得財政部核發之執業會計師或內部審計師執照", "B": "委由受查對象的外部永續輔導顧問，代為對查驗結論進行最終之簽署覆核", "C": "制定並確實執行「查驗作業標準程序（SOP）」、實施內部品質稽核，並建立持續性之經驗回饋機制", "D": "將所有查驗報告交由地方政府環保局，每日指派專人進行遠端視訊之全天候品質監控"}, "answer": "C", "explanation": "查驗機構為維持符合性評估之高度一致性與技術品質，依據 CNS 17029 與管理規範，其內部品質管理制度必須涵蓋「查驗作業標準程序（SOP）」之制定與落實、定期之內部稽核（Internal Audit）以及查驗團隊之經驗與技術回饋機制，【二、溫室氣體盤查作業講義 P.45】"}, {"id": 195, "stem": "某合格第三方查驗機構（VVB）在台灣同時執行多個行業的溫室氣體查核業務。為了防止在確證與查證流程中發生重大的技術錯漏，保障查驗結論之科學性，依據 CNS 17029 原則，查驗機構應如何避免品質不一致之問題？", "options": {"A": "為了避免利益衝突，應將所有查驗報告之撰寫程序全面外包予非合格之海外技術單位辦理", "B": "簡化查驗人員之專業背景訓練，並允許查驗小組略過書面文審程序以縮短工時", "C": "建立嚴格的「查驗作業標準程序（SOP）」、執行內部品質稽核，並定期辦理查驗人員之經驗回饋", "D": "授權受查核之排碳大戶，得由其高階永續經理人直接兼任查驗機構之內部覆核專家"}, "answer": "C", "explanation": "查驗機構執行多套查驗業務時，應確保「內部品質管理」運作順暢。透過建立標準作業程序、對查驗員實施技術培訓、執行內部品質稽核與技術研討（經驗回饋），是保障第三方驗證公信力、避免品質不一致之必備制度，【二、溫室氣體盤查作業講義 P.45】"}, {"id": 196, "stem": "依據我國《溫室氣體認證機構及查驗機構管理辦法》之規定，認證機構在受託對各第三方查驗機構執行符合性能力評鑑與認證業務時，亦負有法定申報義務。請問，該認證機構（如全國認證基金會 TAF）應於「每年」的哪一個法定日期之前，向中央主管機關（環境部）報送前一年度之認證執行成果報告？", "options": {"A": "每年 3 月 31 日前", "B": "每年 5 月 31 日前", "C": "每年 6 月 30 日前", "D": "每年 10 月 31 日前"}, "answer": "A", "explanation": "認證機構應遵循監督管理規範，於「每年 3 月 31 日前」，向中央主管機關環境部報送前一年度執行成果報告，以利主管機關落實行政與技術監督，【二、溫室氣體盤查作業講義 P.45】"}, {"id": 197, "stem": "永續發展（Sustainability）觀念在企業界已從小眾倡議轉變為主流。當前國際金融與社會大眾在衡量企業非財務營運品質時，普遍採用「ESG」三大維度作為評估基石。請問，在此評估體系中，E、S、G 三個英文字母分別代表哪三大核心治理層面？", "options": {"A": "能源、安全、綠化 (Energy, Safety, Green)", "B": "生態、社會、政府補助 (Ecology, Society, Government)", "C": "環境、社會、公司治理 (Environmental, Social, Governance)", "D": "出口外銷、標準化、綠色金融 (Export, Standardization, Green Finance)"}, "answer": "C", "explanation": "在永續資訊揭露與評估體系中，ESG 三個英文字母分別代表：E — 環境（Environmental，如氣候、水、廢棄物）、S — 社會（Social，如人權、勞工關係）、G — 公司治理（Governance，如董事會運作、道德誠信）。【二、溫室氣體盤查作業講義 P.47】"}, {"id": 198, "stem": "某科技公司擬召開年度永續報告書編製籌備會。在對照 GRI 準則及公司治理評鑑時，下列哪一個項目在性質上「不屬於」ESG 評估體系中「G（公司治理，Governance）」構面所聚焦與揭露之範疇？", "options": {"A": "董事會中獨立董事之席次占比與審計委員會之運作獨立性", "B": "企業內部針對反洗錢、反貪腐、反賄賂等商業道德之舉報與落實機制", "C": "董監事與高階經理人之薪酬政策與企業中長期減碳目標之連結性", "D": "廠區周邊「鄰近社區之安全防護、包容性溝通與社會參與活動」"}, "answer": "D", "explanation": "在 ESG 三大治理維度中，董事會運作、獨立董事、反貪腐、薪酬政策等均屬於「G（公司治理）」構面之範疇；而廠區周邊鄰近「社區之安全防護、包容性溝通與社會參與」則屬於「S（社會，Social）」構面所關注之社會責任範疇，【二、溫室氣體盤查作業講義 P.47】"}, {"id": 199, "stem": "在企業永續發展與非財務資訊揭露的「ESG」三大支柱中，下列哪一項指標或實務行動，標準歸類於「S（社會，Social）」構面的評估範疇？", "options": {"A": "廠區與在地「鄰里社區關係的維護與和諧溝通」", "B": "董事會中「獨立董事的席次占比與審計品質」", "C": "積極引進再生能源與「低碳綠電的實質採購」", "D": "主動配合氣候變遷因應法「申報自主減量計畫與碳費繳納」"}, "answer": "A", "explanation": "在 ESG 評估指標體系中：「E（環境，Environmental）」：聚焦於能資源消耗、溫室氣體盤查、再生能源採購、水資源及廢棄物管理等。「G（公司治理，Governance）」：著重於董事會獨立性、誠信經營、反貪腐、薪酬政策等。「S（社會，Social）」：則關注人權、尊嚴勞動、職業安全衛生、員工健康福利，以及「社區關係維護與包容性利害關係人溝通」等層面。【二、溫室氣體盤查作業講義 P.47】。"}, {"id": 200, "stem": "依據金融監督管理委員會（金管會）所推行之「上市櫃公司永續發展路徑圖」推動期程，我國上市櫃公司必須依其資本額大小分階段完成溫室氣體盤查與確信。請問，全體上市櫃公司「最遲」應於西元哪一年，全面完成其「合併財務報表子公司」之溫室氣體排放量「確信」作業？", "options": {"A": "西元 2027 年", "B": "西元 2029 年", "C": "西元 2025 年", "D": "西元 2030 年"}, "answer": "B", "explanation": "依據金管會上市櫃公司永續發展路徑圖，全面完成合併財務報表子公司之溫室氣體排放量確信（簽證）之最遲法定時限，被訂定在「西元 2029 年」。【二、溫室氣體盤查作業講義 P.7】"}, {"id": 201, "stem": "台灣為加速落實永續治理，提升企業非財務資訊揭露品質。依據主管機關之法規推動時程，自西元哪一年起，我國「全體上市及上櫃公司」均應強制編製並申報其年度「永續報告書」？", "options": {"A": "西元 2025 年", "B": "西元 2023 年", "C": "西元 2027 年", "D": "西元 2026 年"}, "answer": "A", "explanation": "依據主管機關推行之公司治理與永續推動進程，自「西元 2025 年」起，強制編製永續報告書之範圍正式擴大至「全體上市及上櫃公司」，無論其資本額大小均應編製與申報。【二、溫室氣體盤查作業講義 P.7】"}, {"id": 202, "stem": "某連鎖超市大樓在彙整其溫室氣體排放源。環安人員依據盤查議定書（GHG Protocol）將大樓因「向外購用電力以供應照明與冷氣運轉」所產生之排放，進行歸類。請問此類因「輸入並消耗能源」而產生的間接溫室氣體排放，在性質上屬於下列哪一個「排放範疇（Scope）」？", "options": {"A": "範疇一 (Scope 1，直接排放)", "B": "範疇二 (Scope 2，能源間接排放)", "C": "範疇三 (Scope 3，其他間接排放)", "D": "範疇四 (Scope 4，外部減量抵換)"}, "answer": "B", "explanation": "依據溫室氣體盤查國際標準（GHG Protocol 與 ISO 14064-1），「範疇二」專指因使用「外購且輸入之電力、蒸汽、熱力、冷能」等二次能源所伴隨產生之能源間接排放，【二、溫室氣體盤查作業講義 P.8】"}, {"id": 203, "stem": "某精密玻璃廠在辨識其廠區內的溫室氣體排放源。依據溫室氣體排放類別定義，下列哪一項製程或設備所產生之溫室氣體排放，在性質上屬於「直接溫室氣體排放（範疇一）」之範疇？", "options": {"A": "廠房向外部電力公司購買並消耗之電力，供應生產線馬達運轉", "B": "熔爐設備之蒸汽管道，係向鄰近汽電共生大廠購買之輸入蒸汽", "C": "廠區內裝設之「蒸汽鍋爐設備」，實質在現場燃燒「天然氣或重油」產生熱能所致之排放", "D": "委託外部物流公司提供之跨國貨物海運與包裝箱之卡車陸運運輸服務"}, "answer": "C", "explanation": "直接溫室氣體排放（範疇一）係指在組織擁有或控制之邊界內「直接產生」之排放，例如固定燃燒源中之「鍋爐燃燒天然氣或燃煤」。而外購電力、外購蒸汽屬於間接排放（範疇二），委託外部運輸則屬於範疇三，【二、溫室氣體盤查作業講義 P.8】"}, {"id": 204, "stem": "某智慧商辦大樓正在彙整其溫室氣體清冊。下列大樓內運作之設備與設施中，哪一個「屬於」溫室氣體「能源間接排放（範疇二）」之量化範疇？", "options": {"A": "大樓空調機台運作過程中所產生之「氟化冷媒氣體逸散」", "B": "大樓向公用售電業「外購電力」所供應之照明與電梯等設備用電", "C": "地下室配置之「緊急柴油發電機」因定檢發電所消耗之柴油燃料燃燒", "D": "員工餐廳廚房裝設之「瓦斯爐與天然氣燃燒」設施"}, "answer": "B", "explanation": "範疇二（能源間接排放）專指組織所「消耗之輸入能源（如外購電力、外購蒸汽）」所產生之排放。冷媒逸散屬於範疇一之逸散排放，發電機與瓦斯爐燃燒則屬於範疇一之固定燃燒排放，【二、溫室氣體盤查作業講義 P.8】"}, {"id": 205, "stem": "某半導體晶圓廠在彙整其年度溫室氣體排放清冊。廠內無自備發電廠，全廠製程設備與空調運轉所需電力均為「向公用電力網絡（台電）購買之電力」。請問，此項因外購電力所生之間接溫室氣體排放，在組織碳盤查中應歸類為下列何者？", "options": {"A": "範疇二 (Scope 2，輸入能源之間接溫室氣體排放)", "B": "範疇一 (Scope 1，直接溫室氣體排放)", "C": "範疇三 (Scope 3，上游與下游間接溫室氣體排放)", "D": "類別 6 (其他來源產生之間接排放)"}, "answer": "A", "explanation": "依據溫室氣體盤查議定書與 ISO 14064-1 之範疇分類：企業外購且消耗電力、蒸汽、熱力等所產生的間接溫室氣體排放，標準歸類於「範疇二（輸入能源之間接排放）」（對應 ISO 14064-1:2018 之類別 2），【二、溫室氣體盤查作業講義 P.8】"}, {"id": 206, "stem": "依據環境部《溫室氣體排放量盤查作業指引》之分類，企業向台灣電力公司購買電力供其生產機台使用，此電力消耗在溫室氣體盤查範疇中應歸類為下列何者？", "options": {"A": "輸入能源之間接溫室氣體排放（範疇二）", "B": "直接溫室氣體排放（範疇一）", "C": "其他間接溫室氣體排放（範疇三）", "D": "免予盤查之非管制排放源"}, "answer": "A", "explanation": "依據講義，外購電力、外購蒸汽或外購熱能之使用，因其實質溫室氣體排放發生於外部發電廠或汽電共生廠，而非企業內部實體邊界，故在分類上屬於「輸入能源之間接溫室氣體排放（範疇二/類別 2）」。【二、溫室氣體盤查作業講義P.10】"}, {"id": 207, "stem": "依據我國環境部針對公告列管排放源之強制規定，其辦理溫室氣體排放量盤查與登錄作業時，法規明文「強制要求」必須涵蓋之範疇包括下列何者？", "options": {"A": "僅限於範疇一（直接溫室氣體排放）", "B": "範疇一（直接溫室氣體排放）與範疇二（輸入能源之間接溫室氣體排放）", "C": "範疇一（直接排放）、範疇二（能源間接排放）與範疇三（其他間接排放）", "D": "僅限於範疇三（包含員工日常通勤、商務差旅及上下游物流）"}, "answer": "B", "explanation": "依據我國溫室氣體排放量盤查登錄及查驗相關規定，環境部目前針對公告列管排放源強制要求之盤查邊界範疇，僅限於「直接排放（範疇一）」與「輸入能源之間接排放（範疇二）」。至於其他間接排放（範疇三，如供應鏈上下游、員工差旅通勤等）目前未納入環境部之強制盤查與查驗規範中，僅為自願性選擇項目。【二、溫室氣體盤查作業講義P.11】"}, {"id": 208, "stem": "依據中央主管機關公告應辦理溫室氣體排放量強制盤查登錄與查驗之對象規定，下列哪一種條件的事業，屬於我國「依法應強制辦理溫室氣體排放量盤查、登錄及查驗」的第一批或第二批列管主體？", "options": {"A": "鋼鐵業具備電弧爐鋼胚生產程序者，或水泥業具備熟料生產程序者", "B": "全廠（場）化石燃料燃燒之直接排放產生之溫室氣體年排放量達 2.5 萬公噸 CO2e（含）以上者", "C": "製造業全廠（場）之直接排放量與使用電力之間接排放量合計達 2.5 萬公噸 CO2e（含）以上者", "D": "以上各項條件之事業均屬於強制列管對象"}, "answer": "D", "explanation": "依據環境部公告之應盤查登錄及查驗溫室氣體排放量之排放源規定，列管對象包含特定行業（如發電業、具電弧爐鋼胚生產程序之鋼鐵業、具熟料生產之水泥業、半導體業、液晶顯示器業等）及達量化門檻之排放源（第一批全廠化石燃料燃燒直接排放達 2.5 萬公噸 CO2e 者，以及第二批全廠直接與電力間接排放量合計達 2.5 萬公噸 CO2e 之製造業），故(A)、(B)、(C)皆屬列管對象。【二、溫室氣體盤查作業講義P.13】"}, {"id": 209, "stem": "依據環境部發布之《溫室氣體排放量盤查登錄及查驗管理辦法》，下列哪一種事業之能資源使用或營運規模，在歸類上屬於應辦理溫室氣體盤查、登錄之法定列管範圍？", "options": {"A": "全年外購電力僅達 1,000 萬度且不具特定程序之一般零售商", "B": "營業車輛數合計 50 輛之客運公司", "C": "門市總數為 80 家之連鎖便利商店", "D": "全廠（場）化石燃料燃燒之直接溫室氣體年排放量達 2.5 萬公噸二氧化碳當量（CO2e）以上者"}, "answer": "D", "explanation": "依據管理辦法及應盤查登錄溫室氣體排放量之排放源規定，第一批列管對象包含「全廠（場）化石燃料燃燒之直接排放產生之溫室氣體年排放量達 2.5 萬公噸 CO2e 以上者」。其餘選項規模（A、B、C）均未達法定強制納管之門檻（如：外購電力需達二千萬度、車輛數達二百輛、便利商店門市達百家以上）。【二、溫室氣體盤查作業講義P.13】"}, {"id": 210, "stem": "依據環境部公告之「事業應盤查登錄溫室氣體排放量之排放源」，針對連鎖便利商店業，其應辦理溫室氣體盤查登錄作業之強制納管門檻條件為何？", "options": {"A": "門市（含直營及加盟）總數達 50 家以上者", "B": "門市（含直營及加盟）總數達 100 家以上者", "C": "門市（僅限直營店）總數達 100 家以上者", "D": "全年營業額達新台幣 10 億元以上且用電量達 1,000 萬度者"}, "answer": "B", "explanation": "依據強制盤查登錄之規定，連鎖便利商店業若其門市（含直營及加盟）總數達 100 家以上者，即屬於強制盤查登錄之排放源對象 。【二、溫室氣體盤查作業講義P.14】"}, {"id": 211, "stem": "環境部於西元 2025 年正式公布並擴大辦理第三波強制碳盤查之納管名單。依據最新法規公告，下列哪一種事業或機構「不屬於」此波新增的強制盤查登錄管制對象？", "options": {"A": "軌道運輸之捷運系統", "B": "醫療服務之醫學中心", "C": "門市達 100 家以上之連鎖超商", "D": "國內各級公私立學校"}, "answer": "D", "explanation": "第三波強制碳盤查公告名單包含大眾捷運、醫學中心、連鎖便利商店（門市達 100 家以上）等，但並未將「所有學校」納入強制列管範圍。故選項 (D) 非強制列管對象。【二、溫室氣體盤查作業講義P.14】"}, {"id": 212, "stem": "依據環境部溫室氣體排放量盤查作業指引，列管事業在設定組織盤查之邊界時，應以下列何者作為核定與鑑別排放源的實體邊界基準？", "options": {"A": "企業自行認定對營業額貢獻最大之主要生產線", "B": "目的事業主管機關核准設立、登記或營運之邊界（如工廠登記證或商工登記所載地址）", "C": "企業內部的人事組織架構圖與勞健保投保單位範圍", "D": "金融監督管理委員會規定之合併財務報表所涵蓋之所有海內外子公司"}, "answer": "B", "explanation": "事業應以目的事業主管機關核准設立、登記或營運之邊界辦理排放源之排放量盤查（如工廠登記證或商工登記所登載之地址為實體邊界）。此為法規強制要求與自願性組織型盤查（如 ISO 14064-1）之關鍵差異。【二、溫室氣體盤查作業講義P.17】"}, {"id": 213, "stem": "企業在依循主管機關規範執行「溫室氣體盤查」時，其在環境管理與永續實務上的核心目的或效益，通常「不包含」下列哪一項？", "options": {"A": "掌握組織內部各製程與基礎設施的碳排放熱點以規劃減碳行動", "B": "提升組織內部的能資源管理效率與溫室氣體數據管理品質", "C": "作為向政府申報前一年度溫室氣體排放量及繳納碳費之量化基礎", "D": "自動且直接在資訊平台上將申報之「總排放量」轉換為「自願減量額度（碳權）」進行市場交易"}, "answer": "D", "explanation": "溫室氣體盤查的核心目的在於量化組織之溫室氣體排放、掌握碳排熱點並建立數據基礎以利減量管理。盤查所登錄的排放量是繳納「碳費」的基準，絕不能自動、直接轉為「自願減量額度（碳權）」。自願減量額度必須另外透過申請自願減量專案，並通過確證與查證流程後，方可由環境部核發。【二、溫室氣體盤查作業講義P.17】"}, {"id": 214, "stem": "依據環境部溫室氣體盤查登錄作業規範，若在同一個實體廠址地址上，某事業體因為不同製程分別辦理並擁有兩筆獨立的「工廠登記證」，在辦理強制盤查、登錄時，其盤查邊界應如何界定與申報？", "options": {"A": "應依據兩筆不同的工廠登記證分別進行獨立的邊界設定、盤查登錄及委託查驗", "B": "必須將兩筆工廠登記證合併為單一盤查主體，並撰寫同一份盤查報告書申報", "C": "企業可依據兩筆登記證的營業額比例，選擇性僅申報其中一筆", "D": "可由查驗機構於查驗時直接進行數據合併登錄"}, "answer": "A", "explanation": "依據溫室氣體盤查規範之邊界設定原則，事業應以目的事業主管機關核准設立、登記（如工廠登記證）之邊界辦理盤查。若在同一地址擁有兩筆不同的工廠登記證，在主管機關規範與資訊平台登錄上視為不同之列管主體，應「分別」設定邊界並獨立申報與查驗。【二、溫室氣體盤查作業講義P.17】"}, {"id": 215, "stem": "依據《溫室氣體排放量盤查作業指引》，事業在正式導入並開展溫室氣體盤查作業時，其首先應執行的第一個核心步驟為何？", "options": {"A": "邊界設定", "B": "排放源鑑別", "C": "排放量計算", "D": "數據品質管理"}, "answer": "A", "explanation": "依據指引之標準盤查流程，事業執行盤查作業之第一步驟為「邊界設定」（明確劃定工廠登記證或商工登記等核定之實體或營運邊界），其後方能精確執行排放源鑑別與量化計算。【二、溫室氣體盤查作業講義P.17】"}, {"id": 216, "stem": "依據環境部《溫室氣體排放量盤查作業指引》，溫室氣體盤查之標準作業程序包含六大核心步驟。下列哪一項「不屬於」這六大步驟之一？", "options": {"A": "排放源鑑別", "B": "數據品質管理", "C": "環評作業及脆弱度分析", "D": "盤查資料保存"}, "answer": "C", "explanation": "溫室氣體盤查之六大核心步驟為：1. 邊界設定、2. 排放源鑑別、3. 排放量計算、4. 數據品質管理、5. 盤查資料保存、6. 排放量清冊及盤查報告書撰寫。「環評作業及脆弱度分析」屬於環評法及氣候調適範疇，並非盤查指引之六大步驟。【二、溫室氣體盤查作業講義P.17】"}, {"id": 217, "stem": "依據《溫室氣體排放量盤查作業指引》之大綱，請將下列盤查之核心步驟依照標準的執行順序進行正確排列： ①邊界設定、②排放源鑑別、③排放量計算、④數據品質管理、⑤盤查資料保存、⑥排放量清冊及盤查報告書撰寫", "options": {"A": "① → ② → ③ → ④ → ⑤ → ⑥", "B": "① → ③ → ② → ④ → ⑥ → ⑤", "C": "② → ① → ③ → ④ → ⑤ → ⑥", "D": "① → ② → ④ → ③ → ⑥ → ⑤"}, "answer": "A", "explanation": "依據溫室氣體盤查指引，標準的盤查步驟依序為：首先設定邊界，接著進行排放源鑑別、排放量計算，再進行數據品質管理與不確定性評估，然後落實盤查資料保存，最後撰寫清冊及報告書。【二、溫室氣體盤查作業講義P.17】"}, {"id": 218, "stem": "在進行溫室氣體組織邊界設定時，依據 CNS 14064-1 組織型盤查標準，下列何者「非屬」用來定義、分攤或界定組織盤查邊界之標準整合方法？", "options": {"A": "營運控制權法", "B": "財務控制權法", "C": "股權比例法", "D": "權重分配法"}, "answer": "D", "explanation": "依據國際組織盤查標準，組織在設定邊界與進行排放量彙整時，其所採行的標準整合方法（Consolidation Approaches）包含「股權比例法」與「控制權法」（控制權法又可細分為財務控制權法及營運控制權法）。「權重分配法」並非標準定義之整合方法。【二、溫室氣體盤查作業講義P.17】"}, {"id": 219, "stem": "盤查指引中規定，列管事業在撰寫盤查報告書的「邊界設定」章節時，必須呈現「廠（場）排放源平面配置圖」。此平面圖在盤查與查驗作業上的最核心目的為何？", "options": {"A": "作為申請政府綠色工廠設備汰換補助的必備審查圖資", "B": "清楚標註盤查邊界內之所有溫室氣體排放源及電表所在位置，以防止漏算或重複計算", "C": "提供給建築管理機關作為廠房消防與違建稽查之佐證", "D": "提供作為廠區製程與產品之市場行銷宣傳之用"}, "answer": "B", "explanation": "繪製「排放源平面配置圖」旨在將核定邊界內所有溫室氣體相關製程、排放源及關鍵基礎設施（如電表）之具體位置清晰呈現，協助企業與第三方查驗人員逐一比對核對，以確保無重複計算並防止遺漏任何排放源。【二、溫室氣體盤查作業講義P.18】"}, {"id": 220, "stem": "依據環境部溫室氣體盤查作業指引，廠區內員工日常使用之水肥處理程序（如生活污水化糞池），其因厭氧發酵產生之甲烷（CH4）排放，在排放型式上應歸類為下列何者？", "options": {"A": "製程排放", "B": "固定燃燒排放", "C": "逸散排放", "D": "移動燃燒排放"}, "answer": "C", "explanation": "依據溫室氣體盤查作業指引之排放源鑑別原則，廠內之化糞池水肥處理程序、冷媒設備洩漏、滅火器洩漏等，因其溫室氣體無法藉由特定排氣管道有組織地排放，在排放型式上均歸類為「逸散排放源」。【二、溫室氣體盤查作業講義P.20】"}, {"id": 221, "stem": "依據溫室氣體盤查之特定行業與製程鑑別，積體電路或半導體製造業在乾蝕刻（Etching）或化學氣相沉積（CVD）等製程中，因含氟氣體（如 SF6, NF3）在機台內未完全反應而直接排放至大氣之溫室氣體，應歸類為下列何種排放型式？", "options": {"A": "固定燃燒排放", "B": "逸散排放", "C": "能源間接排放", "D": "製程排放"}, "answer": "D", "explanation": "蝕刻與氣相沉積製程中使用之含氟氣體（如 HFCs、PFCs、SF6、NF3），其排放直接與製程的化學或物理反應相關，不屬於固定燃燒，在排放分類上應歸屬於「製程排放源」。【二、溫室氣體盤查作業講義P.20】"}, {"id": 222, "stem": "某工廠設有一台以重油為燃料的工業用鍋爐。依據溫室氣體盤查作業規範，此類「固定燃燒排放源」在燃料燃燒反應中，主要會產生哪些法定溫室氣體且必須納入盤查？", "options": {"A": "二氧化碳（CO2）、甲烷（CH4）、氧化亞氮（N2O）", "B": "僅有二氧化碳（CO2）", "C": "甲烷（CH4）、氫氟碳化物（HFCs）、六氟化硫（SF6）", "D": "二氧化碳（CO2）、臭氧（O3）、三氟化氮（NF3）"}, "answer": "A", "explanation": "化石燃料在固定燃燒設備（如鍋爐、發電機）中燃燒時，主要產生的直接溫室氣體包含二氧化碳（CO2）、甲烷（CH4）及氧化亞氮（N2O）。【二、溫室氣體盤查作業講義P.21】"}, {"id": 223, "stem": "依據特定行業常見溫室氣體排放源之鑑別，半導體製造業與光電面板業在進行「乾蝕刻（Etching）」或「化學氣相沉積（CVD）」等關鍵製程時，最常排放下列哪一組含氟溫室氣體？", "options": {"A": "氨氣（NH3）、臭氧（O3）、二氧化硫（SO2）", "B": "一氧化碳（CO）、氟氯碳化物（CFCs）、氫氟碳化物（HFCs）", "C": "氫氟碳化物（HFCs）、全氟碳化物（PFCs）、六氟化硫（SF6）、三氟化氮（NF3）", "D": "二氧化碳（CO2）、甲烷（CH4）、氧化亞氮（N2O）"}, "answer": "C", "explanation": "半導體與光電面板製程中使用之含氟氣體，其未反應完全而直接排放的直接製程排放源，主要包含 HFCs、PFCs、SF6 及 NF3 等高暖化潛勢之溫室氣體。【二、溫室氣體盤查作業講義P.21】"}, {"id": 224, "stem": "依據環境部《溫室氣體排放量盤查作業指引》之分類，下列哪一種廠內常見設備在鑑別時應被歸類為典型的「固定燃燒排放源」之直接排放？", "options": {"A": "製程用之天然氣蒸汽鍋爐", "B": "廠內原物料搬運動力之柴油堆高機", "C": "行政大樓使用之辦公照明與插座用電", "D": "自來水供水系統與給水管線"}, "answer": "A", "explanation": "固定燃燒排放源係指在固定位置燃燒化石燃料以產生熱能、動力或蒸汽之設備，如蒸汽鍋爐、發電機、瓦斯爐。堆高機屬移動燃燒源；插座用電屬範疇二能源間接排放；自來水管線本身不直接因燃燒而排放溫室氣體。【二、溫室氣體盤查作業講義P.21】"}, {"id": 225, "stem": "某製造廠在鑑別與分類廠內之溫室氣體排放源時，下列哪一項設施或用電活動所產生之排放，在定義上屬於企業的「直接排放（固定燃燒）」，而非範疇二之「能源間接排放」？", "options": {"A": "廠房頂樓空調系統運作所耗用之電力", "B": "廠內備用之柴油發電機燃燒柴油產生電力", "C": "向外部汽電共生廠購買並輸入廠內使用之製程蒸汽", "D": "行政辦公大樓之日常照明與插座電力"}, "answer": "B", "explanation": "藉由燃燒化石燃料產生熱能、蒸汽或電力之固定式設備（如：蒸汽鍋爐、加熱爐、緊急備用柴油發電機），其產生的排放歸類為「固定燃燒排放源」之直接排放。而外購電力、外購蒸汽則屬於使用外部輸入能源所產生之「能源間接排放（範疇二）」。【二、溫室氣體盤查作業講義P.21】"}, {"id": 226, "stem": "依據環境部《溫室氣體排放量盤查作業指引》，廠區內裝設之冷水機組或空調設備，若在運作或維修過程中發生氟氣冷媒（如 HFCs 系列）之洩漏，此排放屬於下列哪一種溫室氣體排放型式？", "options": {"A": "製程排放源", "B": "逸散排放源", "C": "固定燃燒排放源", "D": "移動燃燒排放源"}, "answer": "B", "explanation": "依據講義，逸散排放源指非藉由排氣管道或煙囪有組織排放，而是因設備密封不良、管線接頭老化等導致溫室氣體直接逸散至大氣之來源，例如消防滅火設備、空調或冷凍設備之冷媒洩漏，以及污水/水肥處理設施之釋放等。【二、溫室氣體盤查作業講義P.21】"}, {"id": 227, "stem": "依據環境部《溫室氣體排放量盤查作業指引》，工廠內裝設之「緊急備用柴油發電機」，其在停電測試或啟動運轉時燃燒柴油所產生之溫室氣體排放，在定義上應歸類為下列哪一種排放型式？", "options": {"A": "製程排放源", "B": "移動燃燒排放源", "C": "逸散排放源", "D": "固定燃燒排放源"}, "answer": "D", "explanation": "依據講義，藉由燃燒化石燃料以產生熱能、蒸汽或電力之固定式設備（如蒸汽鍋爐、緊急柴油發電機、熱風爐等），其排放皆歸類為「固定燃燒排放源」之直接排放。【二、溫室氣體盤查作業講義P.21】"}, {"id": 228, "stem": "在進行廠區溫室氣體排放源鑑別時，盤查人員需正確區分移動燃燒源。依據環境部盤查指引，下列哪一項設施或設備「不屬於」移動燃燒排放源？", "options": {"A": "跨廠區運輸產品之柴油大貨車", "B": "廠內原料倉儲區搬運物料之燃油堆高機", "C": "生產線上用於冷卻製程氣體之冷水主機壓縮機", "D": "公司配給高階主管日常拜訪客戶之公務汽機車"}, "answer": "C", "explanation": "依據講義，移動燃燒排放源係指具備運輸功能或物料移動能力之乘坐式機動運具與機械（如大貨車、堆高機、公務汽機車）。冷水主機壓縮機本身為固定裝設之空調製冷設備，其運轉用電屬於能源間接排放（範疇二），冷媒洩漏則屬逸散排放，兩者皆不屬於移動燃燒源。【二、溫室氣體盤查作業講義P.21】"}, {"id": 229, "stem": "依據環境部溫室氣體盤查相關規範，廠區內之逸散排放源通常是因下列哪一種實務狀況或物理現象所直接導致？", "options": {"A": "閥件密封不良、管線接頭損壞或物理性自然蒸發", "B": "燃料之熱值轉換不完全與碳轉化率設定有誤", "C": "空氣污染防制設備之電能消耗過高", "D": "製程化學反應當量與催化劑配方錯誤"}, "answer": "A", "explanation": "依據講義，逸散排放通常是由於設備管線密閉不良、法蘭或閥件接頭損壞老化、污水化糞池厭氧發酵、或滅火器藥劑與冷媒洩漏等非組織性洩漏因素所造成。【二、溫室氣體盤查作業講義P.21】"}, {"id": 230, "stem": "依據環境部《溫室氣體排放量盤查作業指引》之逸散排放量化實務，針對空調設備或冷水主機所產生之氟氣冷媒（如 HFCs）洩漏之逸散排放，其活動數據之取得與推估通常與下列哪一項資訊最為直接相關？", "options": {"A": "自來水費收據與員工人數推估", "B": "冷媒之年度新增充填量與定期維護更換紀錄", "C": "廠區內辦公室與生產線之總樓地板面積", "D": "各用電設備與冷水機組之年度總運轉時數"}, "answer": "B", "explanation": "依據盤查指引，逸散排放源中冷媒設備（如空調、冷凍設備等）之溫室氣體排放，在量化其活動數據時，最直接且精確的依據為設備實際維護保養時所記錄之冷媒新增充填量與定期更換紀錄。【二、溫室氣體盤查作業講義P.21】"}, {"id": 231, "stem": "依據環境部《溫室氣體排放量盤查作業指引》規範，當列管事業使用「排放係數法」來量化其廠內鍋爐等「燃料燃燒」所產生的特定溫室氣體排放當量（公噸 CO2e）時，其標準的完整計算公式為何？", "options": {"A": "年活動數據 × 低位熱值 × 單位轉換因子 × 排放係數 × 溫暖化潛勢 (GWP)", "B": "年活動數據 × 高位熱值 × 排放係數 × 轉化率 × 溫暖化潛勢 (GWP)", "C": "年活動數據 × 排放係數 × 設備效率係數 × 溫暖化潛勢 (GWP)", "D": "年活動數據 × 質量平衡係數 × 單位轉換因子 × 排放係數"}, "answer": "A", "explanation": "依據盤查指引，燃料燃燒產生之溫室氣體排放量計算公式為：年活動數據（重量或體積）先乘以「低位熱值」，再乘以「單位轉換因子」轉換為能量單位，接著乘上該氣體之「排放係數」，最後乘以該氣體之「溫暖化潛勢 (GWP)」，得出二氧化碳當量。【二、溫室氣體盤查作業講義P.25】"}, {"id": 232, "stem": "下列哪一種溫室氣體排放來源在盤查量化計算時，最標準且應優先採用環境部指引中之「燃料排放係數法」？", "options": {"A": "廠內作為製程熱源或動力之固定燃燒排放源", "B": "辦公大樓空調冷媒之逸散排放源", "C": "員工餐廳廚餘回收產生之逸散排放", "D": "委託外部承攬商執行物流配送之運輸排放"}, "answer": "A", "explanation": "依據講義之量化方法與計算規範，燃料燃燒產生之溫室氣體排放量計算公式（活動數據 × 低位熱值 × 單位轉換因子 × 排放係數 × GWP），主要適用於廠內燃燒化石燃料產生熱、蒸汽或電力之固定燃燒排放源。【二、溫室氣體盤查作業講義P.25】"}, {"id": 233, "stem": "某中小企業在首次辦理全廠溫室氣體盤查時，因其鍋爐設備上未安裝連續排放監測儀器，亦無從建立複雜之化學質量平衡反應。依據《溫室氣體排放量盤查作業指引》，該廠在缺乏直接監測數據下，應優先採用下列哪一種最普遍之科學方法來計算其排放量？", "options": {"A": "主觀估計法", "B": "產能折算法", "C": "排放係數法", "D": "基準線反推法"}, "answer": "C", "explanation": "依據講義，溫室氣體盤查主要有三種科學量化方法：排放係數法、質量平衡法與直接監測法。在一般無連續監測儀器之固定燃燒源實務中，最普遍且標準之做法即為採用「排放係數法」，利用活動數據（燃料使用量）乘上對應之排放係數與 GWP 來推估其排放量。【二、溫室氣體盤查作業講義P.25】"}, {"id": 234, "stem": "依據環境部《溫室氣體排放量盤查作業指引》，事業單位在計算鍋爐等化石燃料燃燒所產生之溫室氣體直接排放量（公噸 CO2e）時，下列哪一個公式正確呈現了「燃料燃燒排放係數法」之標準計算邏輯？", "options": {"A": "年活動數據 × 高位熱值 × 燃料燃燒效率 × 溫暖化潛勢 (GWP)", "B": "年活動數據 × 低位熱值 × 單位轉換因子 × 排放係數 × 溫暖化潛勢 (GWP)", "C": "年活動數據 × 質量平衡係數 × 二氧化碳原子量比值 × 設備運轉係數", "D": "年活動數據 × 官方排放係數 × 碳稅稅率折減比例"}, "answer": "B", "explanation": "依據盤查指引中對於燃燒排放源之量化規定，其二氧化碳等氣體之排放量計算公式為：年活動數據 × 低位熱值 × 單位轉換因子 × 該氣體之排放係數 × 該氣體之溫暖化潛勢 (GWP)。【二、溫室氣體盤查作業講義P.25】"}, {"id": 235, "stem": "依據環境部《溫室氣體排放量盤查作業指引》，在量化鋼鐵、水泥等特定行業之製程溫室氣體排放量時，其所使用之關鍵參數「製程物料或原物料之碳含量」，原則上應優先取自下列何者？", "options": {"A": "新聞媒體之綠能低碳專題報導", "B": "同業公會彙整之當年度產能估算平均數值", "C": "原物料供應商出具之成分分析報告、專業檢測報告或公信文獻資料", "D": "經濟部能源署網站之一般通用燃料熱值公告表"}, "answer": "C", "explanation": "依據盤查指引中之參數選用原則，製程中原物料（如冶金煤、合金鐵）之碳含量，應優先採用由供應商出具之商品成分標示、第三方檢測報告（如 CNS 17025 認證實驗室出具之分析）或公信文獻資料，以符合數據可追溯性與保守性原則。【二、溫室氣體盤查作業講義P.28】"}, {"id": 236, "stem": "依據我國《氣候變遷因應法》與溫室氣體盤查登錄之法定規範，下列哪一種氣體「不包含」在法定應辦理強制盤查與申報的七大溫室氣體之中？", "options": {"A": "甲烷 (CH4)", "B": "二氧化硫 (SO2)", "C": "六氟化硫 (SF6)", "D": "三氟化氮 (NF3)"}, "answer": "B", "explanation": "依據我國氣候法與盤查指引，法定應盤查之七大溫室氣體為：二氧化碳 (CO2)、甲烷 (CH4)、氧化亞氮 (N2O)、氫氟碳化物 (HFCs)、全氟碳化物 (PFCs)、六氟化硫 (SF6) 與三氟化氮 (NF3)。二氧化硫 (SO2) 屬於一般空氣污染物，並非溫室氣體盤查法規的管理範疇。【二、溫室氣體盤查作業講義P.3】"}, {"id": 237, "stem": "在量化製程溫室氣體排放量時，若該排放涉及複雜的物理或化學反應，企業依據原料與產品的進出、消耗、產生及轉換之平衡關係來推算未完全反應而排放至大氣的溫室氣體量，此種科學量化方法稱之為何？", "options": {"A": "排放係數法", "B": "直接監測法", "C": "質量平衡法", "D": "設備參數折減法"}, "answer": "C", "explanation": "「質量平衡法」是基於質量守恆定律，透過化學反應或製程系統中物質（如碳元素）的投入、產出、消耗、轉移之平衡關係（即：投入之總碳量減去留在產品中的總碳量），來計算出最終轉化為溫室氣體而排放的量。【二、溫室氣體盤查作業講義P.31】"}, {"id": 238, "stem": "鋼鐵業在高爐煉鐵或煉焦製程、以及化工產業中特定的化學合成反應中，其溫室氣體排放多屬於非燃料燃燒性質的「製程排放」。針對此類排放源，若無法以直接監測法進行量化，通常主要依賴下列哪一種科學方法來推算最為貼近真實排放情況？", "options": {"A": "依據機台設備的每日用電度數乘上電能轉換係數", "B": "利用製程中含碳物種質量與能量之進出、消耗、產生及轉換之「質量平衡法」", "C": "依據廠房內部空氣之環境背景濃度進行歷史比對", "D": "依據廠內載運車輛的年行駛里程與燃料係數推估"}, "answer": "B", "explanation": "依據講義說明，在鋼鐵廠製造或化學工業製程中，因產品與廢棄物中通常含有碳（如：有機化學品、碳黑等），難以將排放量直接與單一物料輸入連結。此時，利用**「質量平衡法」**依據製程或化學反應中碳元素之進出、消耗與轉換進行碳投入產出計算，最能貼近真實排放情況。【二、溫室氣體盤查作業講義P.31】"}, {"id": 239, "stem": "依據《溫室氣體排放量盤查作業指引》，事業若擬採用「直接監測法」（如：於煙囪安裝連續排放監（檢）測系統 CEMS）來申報法定溫室氣體排放量，必須先執行下列哪一項法定程序？", "options": {"A": "必須先取得經濟部產業發展署核發之「低碳技術轉型證明」", "B": "必須先提出「排放量監（檢）測計畫書」送經中央主管機關（環境部）核定後實施", "C": "必須先取得 CNS 17025 認證之檢測報告並完成三年歷史排放比對", "D": "必須先經第三方查驗機構確證具備財務外加性"}, "answer": "B", "explanation": "事業以直接監測法計算排放量，應提出「排放量監（檢）測計畫書」送經中央主管機關（環境部）核定後方可實施，計畫書應包含監測方法、原理及相關校驗規定。【二、溫室氣體盤查作業講義P.33】"}, {"id": 240, "stem": "依據現行《溫室氣體排放量盤查登錄及查驗管理辦法》之規定，事業單位在量化溫室氣體排放量時，其所引用之溫室氣體「溫暖化潛勢 (GWP)」數值，應優先採用聯合國 IPCC 公告之哪一個版本？", "options": {"A": "第一次評估報告 (FAR)", "B": "第四次評估報告 (AR4)", "C": "第五次評估報告 (AR5)", "D": "第六次評估報告 (AR6)"}, "answer": "C", "explanation": "依據管理辦法及盤查報告書規範，各項溫室氣體之溫暖化潛勢 (GWP) 應採用 IPCC 第五次評估報告 (AR5) 版本（例如二氧化碳為 1、甲烷為 28、氧化亞氮為 265等），以統一組織邊界內排放量之量化計算基準。【二、溫室氣體盤查作業講義P.33】"}, {"id": 241, "stem": "企業在盤查溫室氣體時應評估「定量不確定性」，以實務管理與指引規範而言，下列關於不確定性量化分析的敘述何者「錯誤」？", "options": {"A": "評估時需考慮活動數據不確定性之影響", "B": "評估時需考慮溫室氣體排放係數之不確定性", "C": "計算活動數據不確定性時，通常是以誤差值乘上擴充係數 2 倍來呈現", "D": "定量不確定性之量化結果，法規明文要求單一排放源之數據不確定性必須強制小於 20%"}, "answer": "D", "explanation": "依據不確定性量化分析指引，定量不確定性的分析是用於估算不確定性的分散特性，並合理尋求提高數據品質之機會。法規與指引並未強制規定「單一不確定性必須強制小於 20%」，而是著重在數據品質的管理與持續改善。【二、溫室氣體盤查作業講義P.35】"}, {"id": 242, "stem": "依據環境部《溫室氣體排放量盤查作業指引》規範，強制列管且應辦理查驗之事業，必須於盤查報告書中納入「數據品質管理」章節。請問建立該章節之最主要實務目的為何？", "options": {"A": "作為向目的事業主管機關申請高碳洩漏風險資格認定之唯一財務審查文件", "B": "藉由數據品質評分，自動折算並抵減前一年度全廠之實質碳費應繳金額", "C": "作為向環境部申請展延盤查登錄截止期限（最長得展延15日）之法定證明", "D": "確認其盤查管理程序可有效鑑別錯誤、降低不確定性並提高數據品質"}, "answer": "D", "explanation": "依據講義，盤查報告書中設立「數據品質管理」之目的，在於確認事業所建置之溫室氣體盤查程序能有效鑑別數據錯誤、降低量化數據的不確定性，進而提高數據品質，同時也是查驗機構判斷數據品質的參考依據。【二、溫室氣體盤查作業講義P.35】"}, {"id": 243, "stem": "依據環境部溫室氣體數據品質管理評分機制（DQM），評估單一排放源之數據誤差等級時，主要是透過三個指標相乘（A1 × A2 × A3）來量化。下列何者「非屬」此公式中評估數據品質與誤差等級之核心項目？", "options": {"A": "全廠或該製程之年度營業額及產能成長率", "B": "儀器校正誤差等級 (A2)", "C": "活動數據誤差等級 (A1)", "D": "排放計算參數（如燃料低位熱值或碳含量）誤差等級 (A3)"}, "answer": "A", "explanation": "依據講義「溫室氣體數據品質管理誤差等級評分」表，單一排放源數據誤差等級（A）之公式為 A1 × A2 × A3。其中 A1 為活動數據誤差等級、A2 為儀器校正誤差等級、A3 為排放計算參數誤差等級。企業的「年度營業額或產能成長率」非屬評估溫室氣體數據誤差等級之項目。【二、溫室氣體盤查作業講義P.35】"}, {"id": 244, "stem": "依據《溫室氣體盤查作業》教材中有關數據品質管理之評分規則，針對活動數據誤差等級（A1）、儀器校正誤差等級（A2）及排放計算參數誤差等級（A3）之評估，各指標在量化評分上，共劃分為哪些分數等級？", "options": {"A": "1分、2分、3分、4分", "B": "優、良、可、差 四個等級", "C": "1分、2分、3分", "D": "1分至5分"}, "answer": "C", "explanation": "依據教材表 1.10「溫室氣體數據品質管理誤差等級評分」，活動數據、儀器校正、排放計算參數三個維度（A1、A2、A3）之分數設計均分為：1分、2分、3分三個量化等級。分數越低，代表不確定性越小、數據可信度與品質越高。【二、溫室氣體盤查作業講義P.35】"}, {"id": 245, "stem": "企業在評估特定排放源之「活動數據誤差等級（A1）」時，若該燃料或原料之年度活動數據，是直接來自於經定期校正合格、且具備自動連線記錄系統之儀器進行「連續監測」所得之結果，則該排放源之 A1 指標應評定為幾分？", "options": {"A": "2分", "B": "1分", "C": "3分", "D": "4分"}, "answer": "B", "explanation": "依據溫室氣體數據品質管理評分表（表1.10）之 A1 活動數據評分標準：若數據來源為經定期校正儀器所量測之「連續監測」讀值，因其數據精確度最高，活動數據誤差等級（A1）評為最佳的 1 分。【二、溫室氣體盤查作業講義P.35】"}, {"id": 246, "stem": "若某排放源因為電表或計量儀器故障損壞，且缺乏任何採購發票單據，在數據蒐集上僅能透過物料生產配方比率、經驗法則或在「缺乏資料時重建數據（自行估算）」，則該排放源之活動數據誤差等級（A1）應評定為幾分？", "options": {"A": "1分", "B": "2分", "C": "4分", "D": "3分"}, "answer": "D", "explanation": "依據數據品質評分標準（表1.10）之活動數據誤差等級（A1）規範：若數據來源為非量測所得，而是採用經驗法則、配方比率或在「缺資料時重建數據（即估算值）」，因其不確定性最高，故應評定為 3 分。【二、溫室氣體盤查作業講義P.35】"}, {"id": 247, "stem": "依據環境部《溫室氣體排放量盤查作業指引》之數據品質管理規範，針對「排放計算參數誤差等級（A3）」，下列哪一種來源之參數，其可信度最高，且在 A3 評分中應評為 1 分？", "options": {"A": "經檢測驗證之自廠產出參數或質量平衡所得參數", "B": "同業於公會或公用平台登載之製程估算平均數值", "C": "國家經濟部或環境部資訊網站最新公告之國家預設係數", "D": "聯合國 IPCC 國家溫室氣體清冊指南所列之國際預設通用係數"}, "answer": "A", "explanation": "依據數據品質管理評分標準，排放計算參數誤差等級（A3）中，最精確且評為 1 分的是「自廠產出參數、自廠發展參數、質量平衡所得參數或同製程/設備之經驗參數」。若採用公告之國家或國際預設係數，因屬於一般通用值，未完全貼合廠房真實製程特性，故評為 3 分。【二、溫室氣體盤查作業講義P.35】"}, {"id": 248, "stem": "企業在蒐集活動數據時，有不同的資料來源。請依據環境部《溫室氣體排放量盤查作業指引》之數據品質管理精神，將下列活動數據來源由「可信度最高（誤差最小）」排序至「可信度最低（誤差最大）」： (甲) 依據經驗法則或生產產能推估燃料用量 (乙) 透過校正之連續監測儀器讀值得出用量 (丙) 以定期人工採樣抄表方式記錄用量", "options": {"A": "甲→丙→乙", "B": "乙→甲→丙", "C": "乙→丙→甲", "D": "丙→乙→甲"}, "answer": "C", "explanation": "依據溫室氣體數據品質管理評分（表1.10），可信度最高（誤差最小）的是經校正之「連續監測儀器（乙）」，得評為 1 分；其次為人工之「定期採樣（丙）」，得評為 2 分；而可信度最低（誤差最大）的則是「經驗法則推估（甲）」，評為 3 分。故正確可信度高低排序為乙→丙→甲。【二、溫室氣體盤查作業講義P.35】"}, {"id": 249, "stem": "某高耗能工廠在其溫室氣體盤查作業中，為了提升特定重大排放源的活動數據精確度，裝設了經國家標準校驗合格且具備自動連續記錄功能的計量儀表。依據環境部《溫室氣體排放量盤查作業指引》之數據品質管理（DQM）評分規範，該排放源之「活動數據誤差等級（A1）」應評定為下列哪一個分數等級？", "options": {"A": "1分", "B": "2分", "C": "3分", "D": "4分"}, "answer": "A", "explanation": "依據數據品質管理之評分標準，活動數據若由定期校正之儀表進行「連續監測」或量測取得，其不確定性與誤差最低，故其活動數據誤差等級（A1）應評定為最佳之 1分。【二、溫室氣體盤查作業講義P.35】"}, {"id": 250, "stem": "企業在執行溫室氣體數據品質管理（DQM）之「儀器校正誤差等級（A2）」評估時，若廠房內某流量計因環境限制無法取得國家認可實驗室之校正報告，但能提供「設備製造商所出具之原廠技術文件資料」或「原廠校驗合格紀錄」作為佐證。依據指引，其 A2 誤差等級應評定為下列何者？", "options": {"A": "1分", "B": "2分", "C": "3分", "D": "4分"}, "answer": "B", "explanation": "依據數據品質評分標準，儀器校正誤差等級（A2）分為三級 ，若流量儀器雖無國家標準級校正報告，但其校驗係依據設備製造商提供之原廠技術文件資料或原廠校驗紀錄辦理者，其 A2 應評定為 2分。【二、溫室氣體盤查作業講義P.35】"}, {"id": 251, "stem": "在溫室氣體盤查數據品質評估（DQM）中，若某中小型工廠因製程設備未單獨裝設電表，且無法取得任何會計採購憑證，僅能由盤查人員以「當年度產品的生產總量」搭配經驗配方比率，回推估算出該設備的用電量。依據環境部指引，此種估算方式所取得之活動數據，其「活動數據誤差等級（A1）」應評定為幾分？", "options": {"A": "1分", "B": "2分", "C": "3分", "D": "4分"}, "answer": "C", "explanation": "依據溫室氣體數據品質管理評分標準，若活動數據為非量測所得，而是採用經驗法則、配方比率或在**缺乏資料時重建數據（自行估算）**者，因其不確定性最高，故 A1 指標應評定為 3分。【二、溫室氣體盤查作業講義P.35】"}, {"id": 252, "stem": "環境部《溫室氣體排放量盤查作業指引》中要求應查驗之事業建立「數據品質管理（DQM）」章節。下列關於實施數據品質管理之實務精神與關鍵效益，何者敘述最為精確？", "options": {"A": "核心在於簡化盤查流程以完全免除第三方查驗機構的現場查核", "B": "目的是自動在線上登錄平台上折抵當年度應繳納之部分碳費", "C": "強調數據的取得來源多元性重於計算程序的穩定性", "D": "旨在確認其盤查管理程序可有效鑑別錯誤、降低不確定性並提高數據品質"}, "answer": "D", "explanation": "數據品質管理（DQM）之最核心實務精神，在於確認受盤查事業所建置之內部溫室氣體管理程序，能夠有效鑑別數據錯誤、降低量化不確定性，並實質提高數據品質，以達到持續改善之目標。【二、溫室氣體盤查作業講義P.35】"}, {"id": 253, "stem": "依據環境部《溫室氣體排放量盤查作業指引》之數據品質管理（DQM）規範，若某單一排放源之活動數據誤差等級為 A1、儀器校正誤差等級為 A2、排放計算參數誤差等級為 A3，則該排放源之「數據誤差等級」應如何計算？", "options": {"A": "A1 + A2 + A3", "B": "A1 × A2 × A3", "C": "(A1 + A2) / A3", "D": "(A1 + A2) × A3"}, "answer": "B", "explanation": "依據數據品質評分機制，單一排放源之數據誤差等級（A）計算公式為三個指標相乘：A1 × A2 × A3。乘積得分數值越低，代表其量化不確定性越低、數據可信度與品質越高。【二、溫室氣體盤查作業講義P.35】"}, {"id": 254, "stem": "某石化廠在核算其製程排放源之碳排放量不確定性時，需要針對所選用的「排放係數」評估其誤差等級。依據環境部《溫室氣體排放量盤查作業指引》之數據品質管理（DQM）與不確定性分析原則，下列哪一種數據來源之排放係數，其科學上的「不確定性（誤差機率）最高」，通常在 DQM 評分中被評為最不精確之 3 分？", "options": {"A": "由 CNS 17025 認證實驗室經多次實質取樣、自行檢測所得之「自廠產出係數」", "B": "聯合國 IPCC 國家溫室氣體清冊指南所列、未經本土化修正之「國際預設通用係數」", "C": "經濟部能源署網站每年定期公告並動態更新之國家級「公用電網電力排碳係數」", "D": "設備製造商出具之原廠技術手冊中，針對特定設備在額定功率下之「經驗排放係數」"}, "answer": "B", "explanation": "依據數據品質評分標準中「排放計算參數誤差等級（A3）」之評分規定：最精確且評為 1 分的是「自廠發展/產出係數或質量平衡所得參數」；而採用未經本土製程與燃料特性修正之「國際通用預設係數（如 IPCC 預設值）」，其不確定性與誤差程度最高，故 A3 指標評定為最差的 3 分。【二、溫室氣體盤查作業講義P.35】"}, {"id": 255, "stem": "企業在蒐集天然氣或柴油鍋爐之活動數據時，若因為缺乏獨立計量表，而改以「會計財務系統之燃料採購發票或請款帳單金額」反推實際燃料消耗量，此做法在數據品質管理與查驗上，最可能面臨下列哪一項重大不確定性與推估誤差？", "options": {"A": "採購發票帳單無法提供給台電公司進行轉供證明", "B": "採購發票無法證明燃料是否屬於生質燃料", "C": "採購金額無法套用 IPCC 推薦之最新第五次評估報告之 GWP 值", "D": "燃料單價隨市場價格波動，導致相同採購金額對應的實際燃油/燃氣體積產生落差"}, "answer": "D", "explanation": "在量化活動數據時，使用採購單據金額反推消耗量，最大的風險與誤差來源在於「油價或氣價之變動與市場價格波動」 。若燃料單價浮動，則固定的金額所購得之實際活動數據（重量或體積）就會出現顯著落差，進而造成排放量計算失準。【二、溫室氣體盤查作業講義P.36】"}, {"id": 256, "stem": "依據環境部《溫室氣體排放量盤查作業指引》，在進行排放源定量不確定性量化評估時，若評估所得之單一排放源數據不確定性大於或等於多少閾值（threshold），通常即代表其量化精確度欠佳，事業單位應優先檢討並改善該排放源之數據品質？", "options": {"A": "40%", "B": "50%", "C": "60%", "D": "80%"}, "answer": "C", "explanation": "依據不確定性評估與管理規範，不確定性量化分析可輔助組織尋求提高數據品質之機會。當特定單一排放源之量化不確定性大於或等於 60% 之閾值時，代表該數據品質有待加強，事業應著手規劃優先改善程序。【二、溫室氣體盤查作業講義P.36】"}, {"id": 257, "stem": "企業在計算溫室氣體排放量時，若使用「原（燃）物料使用量」或「產品產量」等活動數據，乘上對應之「係數」，並乘上各類氣體之「溫暖化潛勢 (GWP)」以換算為二氧化碳當量，此種最普遍之量化方法稱為何者？", "options": {"A": "直接監測法", "B": "排放係數法", "C": "質量平衡法", "D": "設備參數折減法"}, "answer": "B", "explanation": "依據量化方法定義，利用原（燃）物料之使用量或產品產量等活動數據乘上其對應之排放係數，並乘以溫暖化潛勢（GWP）來量化排放量的方法，即為「排放係數法」，是目前國內最主要的計算方法。【二、溫室氣體盤查作業講義P.37】"}, {"id": 258, "stem": "對於特定化學製造或金屬還原製程，若無法使用排放係數法，通常會利用投入物質與產出產品或廢棄物之「碳質量守恆」關係進行排放推算。此種量化方法稱之為何？", "options": {"A": "質量平衡法", "B": "排放係數法", "C": "直接監測法", "D": "連續流速檢測法"}, "answer": "A", "explanation": "依據講義之量化方法定義，「質量平衡法」是基於質量守恆定律，透過製程或化學反應中碳元素之投入、產出、消耗及轉換的平衡當量關係，來計算轉化為溫室氣體之排放量。【二、溫室氣體盤查作業講義P.37】"}, {"id": 259, "stem": "在進行溫室氣體盤查之數據品質管理（DQM）與不確定性分析時，依據環境部指引，活動數據之 95% 信賴區間不確定性，通常是由該數據之實質誤差值乘以幾倍之「擴充係數（分佈擴散係數）」來呈現？", "options": {"A": "2 倍", "B": "1.5 倍", "C": "3 倍", "D": "4 倍"}, "answer": "A", "explanation": "依據數據品質不確定性量化實務，計算活動數據之 95% 信賴區間時，通常是以檢驗或計量校正所得之實質量測誤差，乘以 95% 信賴區間對應之擴散係數經驗值（通常設定為 2 倍）。【二、溫室氣體盤查作業講義P.37】"}, {"id": 260, "stem": "某精密機械廠已依據 CNS 14064-1 建立並登錄其基準年（Base Year）溫室氣體排放量清冊。依據《溫室氣體排放量盤查登錄及查驗管理辦法》與盤查指引規定，當企業在後續營運中發生下列哪一種情況時，「不需」重新計算或調整其基準年之盤查數據？", "options": {"A": "該機械廠發生了重大之實體合併、收購或分割事件，導致其組織邊界範圍與基準年存在實質性差異", "B": "僅因為該申報年度之產品市場供需波動，導致其「實際產品生產產量（或產能調配）」相較於基準年發生重大增減", "C": "該廠因為生產線製程技術優化，導入新量化方法學或採用更精確之自廠排放係數，導致原計算數據產生重大改變", "D": "機械廠將原有的兩條高耗能熱處理生產線，改委託由外部具備獨立法人登記之專業外包商進行加工處理（營運邊界異動）"}, "answer": "B", "explanation": "依據溫室氣體基準年再計算（Recalculation）之技術規範，基準年排放量之調整與再計算，旨在反映組織邊界、營運邊界或量化方法改變等導致的「非實質營運改變」所衍生之重大數據偏差（如收購、外包、公式變更等）。然而，若僅是因為該年度之「生產量（或產能/產量）發生重大波動與增減」，在法理與盤查實務上「並不需要」亦不可重新計算其基準年數據。【二、溫室氣體盤查作業講義P.38 / 氣候變遷與溫室氣體管理(下冊)】"}, {"id": 261, "stem": "企業在依循環境部規範申報全廠溫室氣體排放量清冊時，其彙總與申報之「排放量數據結果」，其法定與實務上最標準的計量單位應為下列何者？", "options": {"A": "公噸二氧化碳當量 (tCO2e)", "B": "公噸甲烷當量 (tCH4)", "C": "公斤碳當量 (kg C)", "D": "百萬分之幾濃度 (ppm)"}, "answer": "A", "explanation": "依據溫室氣體盤查量化實務，為將不同溫室氣體（如甲烷、氧化亞氮等）之暖化效應予以統一加總，全廠總排放量與個別排放量必須透過 GWP 值換算，並以「公噸二氧化碳當量 (tCO2e)」作為最終申報與清冊登錄之標準計量單位。【二、溫室氣體盤查作業講義P.38】"}, {"id": 262, "stem": "聯合國體系下負責評估氣候科學警告、發布多次氣候評估報告（AR1~AR6），並於 1988 年由世界氣象組織（WMO）與聯合國環境規劃署（UNEP）共同成立之跨政府科學評估機構，其英文縮寫為何？", "options": {"A": "UNFCCC", "B": "WMO", "C": "IPCC", "D": "UNEP"}, "answer": "C", "explanation": "**IPCC（政府間氣候變化專門委員會）**係由 WMO 與 UNEP 於 1988 年創立，彙整氣候變遷相關資訊，並定期發布氣候科學評估報告，是國際氣候治理與減碳政策最權威之科學依據。【二、溫室氣體盤查作業講義P.4】"}, {"id": 263, "stem": "依據《溫室氣體排放量盤查登錄及查驗管理辦法》規定，當列管事業擬自行檢測燃料之低位熱值或原（物）料之碳含量以作為排放量計算參數時，該檢測報告應由取得何種認證資格之實驗室出具，方可作為法規申報之依據？", "options": {"A": "ISO 14064-1 認證", "B": "ISO 14067 認證", "C": "ISO 9001 認證", "D": "ISO/IEC 17025（或 CNS 17025）認證"}, "answer": "D", "explanation": "依據管理辦法規定，原燃物料碳含量及熱值檢測若由企業自檢或要求供應商提供，皆應委託取得 CNS 17025 或 ISO/IEC 17025 認證之實驗室或檢測機構辦理，以確保檢測數據品質並符合檢測標準方法。【二、溫室氣體盤查作業講義P.42】"}, {"id": 264, "stem": "依據環境部《溫室氣體排放量盤查作業指引》，列管事業若需執行燃料熱值及原（物）料與燃料碳含量之自行檢測，該檢測報告必須由取得下列何種標準認證之實驗室或檢測機構出具，方屬合規之佐證數據？", "options": {"A": "ISO 14064-3", "B": "ISO 14067", "C": "ISO 14065", "D": "ISO/IEC 17025 (或 CNS 17025)"}, "answer": "D", "explanation": "盤查規範與管理辦法第 5 條明定，執行熱值及原（物）料與燃料碳含量檢測之機構或實驗室，應取得 CNS 17025 或 ISO/IEC 17025 認證資格，並依最新版標準檢測方法進行，以確保參數數據之可信度與數據品質。【二、溫室氣體盤查作業講義P.42】"}, {"id": 265, "stem": "經中央主管機關環境部公告強制列管辦理溫室氣體排放量盤查、登錄之事業，應於每年度的哪一個法定日期截止前，完成前一年度之線上盤查登錄作業（包含上傳排放量清冊與盤查報告書）？", "options": {"A": "4 月 30 日", "B": "6 月 30 日", "C": "10 月 31 日", "D": "12 月 31 日"}, "answer": "A", "explanation": "依據《溫室氣體排放量盤查登錄及查驗管理辦法》規定，應辦理盤查登錄之事業，應於每年 4 月 30 日前，完成前一年度溫室氣體排放量之線上登錄與盤查報告書上傳作業。【二、溫室氣體盤查作業講義P.43】"}, {"id": 266, "stem": "依據我國現行溫室氣體盤查登錄及查驗作業時程，列管事業在完成前一年度排放量的登錄申報後，必須委託經認可之第三方查驗機構辦理查驗，並於每年的哪一個法定截止日前，完成該年度查驗總結報告書及查驗聲明書之線上上傳作業？", "options": {"A": "4 月 30 日", "B": "6 月 30 日", "C": "8 月 31 日", "D": "10 月 31 日"}, "answer": "D", "explanation": "列管事業完成盤查登錄（4 月 30 日截止）後，應委託查驗機構進行查驗作業，並於每年 10 月 31 日前，將查驗聲明書及查驗總結報告書等查驗結果資料，完成線上登錄與平台核定上傳。【二、溫室氣體盤查作業講義P.43】"}, {"id": 267, "stem": "依據環境部溫室氣體排放量申報與登錄實務，若某事業體在同一廠址地址上登記有多筆獨立的「工廠登記證」時，在線上資訊平台申報與登錄前一年度排放量時應如何操作？", "options": {"A": "僅需選擇其中一筆生產規模最大的工廠登記編號進行申報即可", "B": "應依據各個獨立的工廠登記證，分別輸入並完成所有場址資訊的登錄申報", "C": "必須將所有工廠登記的數據合併計算後，以其中一筆工廠登記編號統一登錄", "D": "由查驗機構於查驗時視現場情況，在查驗報告中決定是否合併登錄"}, "answer": "B", "explanation": "依據盤查登錄之邊界原則，事業應以目的事業主管機關核准設立或登記之邊界辦理盤查。多筆獨立登記之工廠在資訊平台上被視為不同的申報列管主體，必須分別登錄其對應之排放資訊與廠址資料。【二、溫室氣體盤查作業講義P.43】"}, {"id": 268, "stem": "依據環境部《溫室氣體排放量盤查登錄及查驗管理辦法》規定，因天災或其他不可抗力之事由，致未能於法定規定期限內完成前一年度之溫室氣體排放量盤查登錄或查驗申報作業時，事業單位應於原因消滅後之規定期限內以書面敘明理由向中央主管機關申請展延，其展延期限最長不得超過多少日？", "options": {"A": "30 日", "B": "15 日", "C": "45 日", "D": "60 日"}, "answer": "A", "explanation": "依據管理辦法，事業若因天災或其他不可抗力事由，致未能於規定期限內（盤查登錄為每年 4 月 30 日，查驗結果為每年 10 月 31 日）完成登錄或查驗申報，應於原因消滅後 15 日內，以書面敘明理由並檢具相關證明文件向環境部申請展延，其展延期限最長不得超過 30 日。【二、溫室氣體盤查作業講義P.43】"}, {"id": 269, "stem": "依據環境部《溫室氣體排放量盤查登錄及查驗管理辦法》規定，應辦理盤查登錄之事業單位若因故面臨停業、歇業或解散等法定事由時，應自該事實發生之日起算多少日內，依法辦理並完成其溫室氣體排放量之盤查登錄作業？", "options": {"A": "10 日", "B": "15 日", "C": "20 日", "D": "30 日"}, "answer": "D", "explanation": "依據管理辦法，列管之收費對象或強制申報事業若面臨停業、歇業或解散，應自事實發生之日起 30 日內辦理並完成當年度溫室氣體排放量之盤查登錄，以利後續數據核定與遵合程序。【二、溫室氣體盤查作業講義P.43】"}, {"id": 270, "stem": "某工程顧問公司雖具備高度的工業工程檢測技術與人才，但在開展「法定溫室氣體盤查登錄之確證或查證業務」前，必須先滿足哪一項法定「前提條件」，其所出具之查驗結果方具備法律效力？", "options": {"A": "取得由工業技術研究院核發之「企業碳盤查與碳足跡實務分析資格證書」", "B": "依法通過認證機構之認證，並正式取得中央主管機關（環境部）核發之「許可證」，且該許可證尚處於「法定有效期間內」", "C": "必須由其查驗團隊全員完成由地方政府環保局舉辦之「實地環境訪查與稽查技能實務訓練」", "D": "與同業公會或學術研究機構簽訂「低碳轉型技術合作與確證資源共享協議書」"}, "answer": "B", "explanation": "依據我國強制盤查登錄與查驗實務，查驗機構要執行具法理效力的查驗業務，必須「先通過認證（TAF）及取得主管機關（環境部）核發之許可證，且該許可證須在有效期間內（第Y年內）」，方能開展該許可查驗類別下之業務，否則其出具之任何查驗文件在法律上均屬無效。【二、溫室氣體盤查作業講義P.45 / 三、自願減量講義P.43 / 7.1條】"}, {"id": 271, "stem": "為了規範溫室氣體認證機構與查驗機構之資格、許可條件、審查程序及日常監管，政府特別訂定了《溫室氣體認證機構及查驗機構管理辦法》。請問，此部管理辦法的中央主管機關（主責機關）為下列何者？", "options": {"A": "經濟部能源署 (Energy Administration, MOEA)", "B": "國家發展委員會 (National Development Council)", "C": "工業技術研究院 (ITRI)", "D": "環境部 (Ministry of Environment, MOENV)"}, "answer": "D", "explanation": "依據《氣候變遷因應法》相關授權子法，《溫室氣體認證機構及查驗機構管理辦法》之立法與執法主體、以及對各查驗機構進行行政許可、開罰、核發或廢止許可證之法定中央主管機關，一律為環境部（實務由環境部氣候變遷署承辦）。【二、溫室氣體盤查作業講義P.45 / 三、自願減量講義P.43】"}, {"id": 272, "stem": "我國溫室氣體查驗機構之管理採取「認證與許可雙軌制」。在查驗機構向環境部申請許可證「前」，必須先向政府委託或指定之「認證機構」申請並通過技術能力認證。請問，目前我國唯一獲得環境部授權與委託、執行溫室氣體查驗機構符合性認證之全國性認證機構為下列何者？", "options": {"A": "國家發展委員會所屬之國家發展基金會 (NDF)", "B": "經濟部能源署 (BOE)", "C": "臺灣碳權交易所 (TCX)", "D": "財團法人全國認證基金會 (Taiwan Accreditation Foundation, TAF)"}, "answer": "D", "explanation": "依據我國《氣候變遷因應法》及配套《認證機構及查驗機構管理辦法》之架構，環境部目前所委託之唯一國家級符合性「認證機構」為財團法人全國認證基金會（TAF）。查驗機構必須先取得 TAF 之證書（證明其符合 ISO/IEC 17029 等規範），方能向環境部申請核發許可證。【二、溫室氣體盤查作業講義P.45 / 三、自願減量講義P.47 / 圖3.13】"}, {"id": 273, "stem": "依據我國環境部發布之《溫室氣體認證機構及查驗機構管理辦法》，查驗機構在通過各項行政審查與技術能力評估後，所取得之「查驗機構許可證書」，其法定之「有效期間」最長為幾年？（期滿前需依法辦理展延）", "options": {"A": "5 年", "B": "3 年", "C": "2 年", "D": "7 年"}, "answer": "B", "explanation": "依據《溫室氣體認證機構及查驗機構管理辦法》之規定，主管機關（環境部）核發給查驗機構之許可證，其有效期間最長為 3 年。查驗機構若欲於期滿後繼續執業，應於許可證安全期限屆滿前之規定期限內，向環境部提出展延申請，每次展延期限亦以 3 年為限。【二、溫室氣體盤查作業講義P.45 / 三、自願減量講義P.47 / 圖3.13】"}, {"id": 274, "stem": "在溫室氣體確證或查證實務中，主導查驗員與專業查驗人員（如技術專家）必須具備法定的合格資格。請問，在我國法規下，此類「查驗人員之個人資格審查與登記認定」，其法定的行政程序與主責單位為何？", "options": {"A": "由台灣碳權交易所（TCX）於查驗員辦理碳信用上架交易時進行其執業資格之一併審查", "B": "全權委託財團法人全國認證基金會（TAF）於進行查驗機構總部評鑑時直接給予技術認可", "C": "由各地方政府環保局或經發局於執行轄區內工廠之現場安全大稽查時進行資格核對", "D": "由查驗機構彙整人員符合性證明後自行提出申請，並統一由中央主管機關（環境部）執行審查與登記認定"}, "answer": "D", "explanation": "依據我國《認證機構及查驗機構管理辦法》之規定，查驗人員之資格管理與登記具備高度之法治性。查驗人員的個人學經歷、查驗實績及受訓結業證明等資格，必須由「其所屬之查驗機構向環境部提出資格登記申請，並由環境部執行實質審查與核定登記」，方具備主導查驗員或查驗員之執業身分。【二、溫室氣體盤查作業講義P.45 / 三、自願減量講義P.47 / 圖3.13】"}, {"id": 275, "stem": "某大學化學工程系畢業生擬規劃考取溫室氣體主導查驗員資格以跨入綠領職涯。依據我國《溫室氣體認證機構及查驗機構管理辦法》，查驗人員在向環境部申請登記合格資格時，其法定的「基本應備條件」中，「不包含」下列哪一項非強制性之背景？", "options": {"A": "必須具備國家律師考試及格、或置有證券投資分析師、執業會計師等財務與法務專業執照", "B": "與所申辦查驗類別（如組織型或專案型）直接相關之學術背景或實務經歷", "C": "在合格主導查驗員指導下所累積之實質查驗實績，或查驗機構內部之符合性技術培訓紀錄", "D": "通過環境部所認可之專業訓練機構主辦之溫室氣體查驗員培訓、且取得「認可訓練結業證明」"}, "answer": "A", "explanation": "依據查驗人員資格認定標準，合格查驗人員之核心要件包括：1. 相關理工、環境或管理等大專學經歷；2. 完成環境部認可之查驗人員專業培訓並取得結業證明；3. 累積足夠之實際查驗天數與案例（實績）。而「律師法務背景」或「財務分析師執照」雖然對跨域發展有加分作用，但在法規中「並非」列為查驗人員資格評估之必備與強制性基本條件。【二、溫室氣體盤查作業講義P.45 / 三、自願減量講義P.47 / 圖3.13】"}, {"id": 276, "stem": "查驗機構之技術品質與人員誠信息息相關。若查驗機構在向主管機關申報查驗人員登記或執行個案查核時，其所登載之查驗人員資格出現下列哪一項嚴重異常，主管機關將會依法撤銷或影響該查驗機構的合格資格？", "options": {"A": "所登載或指派之查驗人員（如主導查驗員），其學經歷、歷史查驗實績、受訓證明或專業證書資料存在「登載不實或偽造」之情事", "B": "查驗小組成員中有人未取得由國際認證機構核發之個人 ISO 14067（產品碳足跡）之分析師證照", "C": "指派之主導查驗員被發現不曾擁有在台灣碳權交易所操作線上碳信用買賣或協議交易之實務經驗", "D": "查驗小組中之技術專家，在求學期間非屬會計、財務管理、金融保險或企業永續（ESG）之相關科系畢業"}, "answer": "A", "explanation": "依據管理與查驗規範之法律責任，查驗人員之誠信為核發執照之基本。若查驗機構提報之查驗人員其「學經歷、查驗實績、訓練合格證明等資料不實或偽造」，屬於重大誠信違規，主管機關將依法廢止其許可，或處以停權等重罰。學科背景不限於金融，亦無須交易操作實務。【二、溫室氣體盤查作業講義P.45 / 三、自願減量講義P.56】"}, {"id": 277, "stem": "某查驗機構在為一家大型石化廠執行年度組織溫室氣體盤查查證時，被檢舉其主導查驗員與該石化廠存在重大商業輔導合約（涉及利益衝突）。若查驗機構被證實「違反利益衝突迴避原則」，將直接面臨下列哪一種法律或行政後果？", "options": {"A": "屬於輕微之行政瑕疵，僅需由查驗機構於事後補交一份無利益衝突切結書，即可維持該次查證效力", "B": "基於企業自治原則，該次查證得否繼續使用，全權由該石化廠自行選擇並以書面回報環境部即可", "C": "該次查證所出具之「查證聲明書與報告」，其效力將完全不被中央主管機關（環境部）所認可，企業須重新委託他廠查驗", "D": "該案件之查證聲明書將自動由系統平台強制移轉給 TAF 認證機構，由其直接進行事後之行政簽署與蓋印"}, "answer": "C", "explanation": "依據我國《溫室氣體認證機構及查驗機構管理辦法》之規定，查驗機構與受查單位必須維持高度之獨立與公正性。若查驗機構在執行業務時被證實違反利益衝突迴避規定，其所產生的「確證或查證結果將完全不予認可」，且該查驗機構亦將面臨限期改善、停權甚至廢止許可證等嚴厲行政處分。【二、溫室氣體盤查作業講義P.45 / 三、自願減量講義P.56】"}, {"id": 278, "stem": "依據我國《氣候變遷因應法》與現行溫室氣體盤查登錄制度，第三方查驗機構若要執行受列管事業之現場溫室氣體盤查查證業務，其在查驗實務上必須取得下列哪一項資格證明？", "options": {"A": "ISO 14001 環境管理系統認證", "B": "經濟部核發之能源管理人員登記證", "C": "環境部核發之溫室氣體查驗機構許可證書", "D": "消防安全設備設計監造測試檢修技術執照"}, "answer": "C", "explanation": "依據《溫室氣體排放量盤查登錄及查驗管理辦法》規定，查驗機構必須取得中央主管機關（環境部）核發且在有效期限內之「溫室氣體查驗機構許可證書」，方能合法執行事業排放量之確證與查證業務。【二、溫室氣體盤查作業講義P.45】"}, {"id": 279, "stem": "依據我國強制盤查登錄與查驗實務，列管事業在每年 10 月 31 日前，應將前一年度之查驗結果登錄上傳至指定資訊平台。下列哪一項資訊或文件「非屬」申報系統強制要求輸入之查驗相關欄位？", "options": {"A": "查驗對象之年度財務狀況與資產負債表", "B": "查驗機構名稱與主導查驗員姓名", "C": "查驗總結報告書名稱與上傳檔案", "D": "第三方查驗機構核發之查驗聲明書編號與內容"}, "answer": "A", "explanation": "事業完成查驗申報時，應於每年 10 月 31 日前登錄查驗機構名稱、主導查驗員姓名、查驗聲明書編號與內容，並上傳查驗聲明書與查驗總結報告書之檔案。**企業年度財務狀況（資產負債表）**非屬溫室氣體盤查登錄之法定申報範疇。【二、溫室氣體盤查作業講義P.45】"}, {"id": 280, "stem": "依據環境部《溫室氣體排放量盤查作業指引》，事業在規劃盤查並撰寫報告書時，必須檢附「本廠（場）排放源平面配置圖」，其在盤查實務與查驗稽核上的主要目的為何？", "options": {"A": "作為內政部消防署進行廠房消防安檢與逃生路線審查之必備佐證", "B": "提供給金管會進行企業資本額與土地資產增值稅之核定估算", "C": "作為向經濟部申請綠能屋頂及高能效設備補助之設計圖說", "D": "標註與溫室氣體排放相關之製程、所有排放源及關鍵電表所在位置，以確保無重複計算並防止遺漏"}, "answer": "D", "explanation": "事業在報告書中呈現排放源平面配置圖，主要目的在於清楚標示盤查邊界內與溫室氣體排放相關之製程、排放源及關鍵電表之具體位置，以防止漏算或重複計算，確保數據的完整性。【二、溫室氣體盤查作業講義P.48】"}, {"id": 281, "stem": "依據環境部溫室氣體盤查作業規範，為合理簡化盤查程序，單一移動或逸散排放源經盤查後，排放量以公噸 CO2e 為單位，若計算至小數點後第幾位並經四捨五入後未達 0.0001 公噸 CO2e，得免予納入清冊計算？", "options": {"A": "第三位", "B": "第四位", "C": "第五位", "D": "第六位"}, "answer": "C", "explanation": "指引明定，單一移動或逸散排放源經盤查後，其排放量以公噸 CO2e 為單位計算至小數點後第五位四捨五入，若數值未達 0.0001 公噸 CO2e，得不納入清冊中計算。【二、溫室氣體盤查作業講義P.51】"}, {"id": 282, "stem": "依據環境部《溫室氣體排放量盤查作業指引》之設備編碼範例，若廠內某逸散排放源（如：空調冷媒補充或生活化糞池）之設備編碼設定為「GF01」，其中「GF」通常代表下列哪一種溫室氣體排放型式？", "options": {"A": "固定燃燒排放源", "B": "製程排放源", "C": "移動燃燒排放源", "D": "逸散排放源"}, "answer": "D", "explanation": "據講義第 55 頁之年度溫室氣體活動數據資訊表（表 2.5），「GF」系列代碼（例如 GF01 空冷設施、GF01 化糞池）皆被明確歸類為「逸散」排放型式。【二、溫室氣體盤查作業講義P.55】"}, {"id": 283, "stem": "依據環境部《溫室氣體排放量盤查作業指引》之設備編碼範例，若在列管事業之溫室氣體盤查申報系統中，某用電設備（如：製程電爐或非製程辦公冷氣用電）被編碼為「GP01」或「GP02」，其中「GP」代碼最可能代表下列哪一種溫室氣體排放來源？", "options": {"A": "廠外空調設備之冷媒直接逸散排放", "B": "廠內外購電力或外購蒸汽之能源間接排放", "C": "廠區自備交通車輛行駛之直接移動排放", "D": "生產線化學反應之直接製程排放"}, "answer": "B", "explanation": "依據講義表 2.5 所示，編碼「GP」開頭之設備（如 GP01 用電之製程設備、GP02 用電之非製程設備）均被歸類為「外購電力（間接）」排放型式，屬於範疇二能源間接排放。【二、溫室氣體盤查作業講義P.55】"}, {"id": 284, "stem": "依據環境部溫室氣體申報系統之登錄格式，列管事業在登錄「外購電力」之年活動數據時，其於資訊平台上填寫之法定標準活動數據單位應為下列何者？", "options": {"A": "立方公尺 (m³)", "B": "公秉 (kL)", "C": "公噸 (t)", "D": "千度 (10³ kWh)"}, "answer": "D", "explanation": "依據講義「年度溫室氣體排放源活動數據資訊表」及申報實務規定，外購電力之申報活動數據單位應填寫為「千度（即 1,000度 / 1,000 kWh）」，以對應官方電力排碳係數之計量基準。【二、溫室氣體盤查作業講義P.55】"}, {"id": 285, "stem": "某科技大樓規劃實施「屋頂併網型太陽能發電自發自用」之自願減量專案。在計算因使用太陽能綠電、進而替代並減少「外購公用電網電力」所產生之二氧化碳間接排放量（基線排放）時，該專案在計算公式中，針對「所替代之外購電力部分」，其電力排放係數應優先採用下列何者？", "options": {"A": "由太陽能光電板製造商所提供之光電板全生命週期產品碳足跡折算係數", "B": "由台電公司所出具之特定分廠備用柴油發電機燃燒排放係數", "C": "由國際獨立第三方信用評等機構所公布之全球自願性碳交易市場平均交易價格", "D": "由我國政府官方（經濟部能源署）所最新公告之國家「電力排碳係數」"}, "answer": "D", "explanation": "依據溫室氣體盤查與自願減量量化實務，當專案活動涉及使用電力、或因能效提升/綠電替代進而減少向公用售電業（台電）外購電力時，其所替代之電力排碳係數，應統一引用經濟部能源署最新公告之「電力排碳係數」進行基線或間接排放量之核算。【二、溫室氣體盤查作業講義P.57 / 三、自願減量講義P.33】"}, {"id": 286, "stem": "在執行溫室氣體排放量計算與彙整時，若要將原廠檢測報告或燃料供應商提供之熱值單位「千卡 (kcal)」轉換為溫室氣體排放係數表所使用之能量單位「兆焦耳 (TJ)」，依據環境部公告之標準單位轉換因子，其轉換關係 1 kcal 相當於多少 TJ？", "options": {"A": "4.1868 × 10⁻⁸ TJ", "B": "3.1868 × 10⁻⁸ TJ", "C": "3.1868 × 10⁻⁹ TJ", "D": "4.1868 × 10⁻⁹ TJ"}, "answer": "D", "explanation": "依據單位轉換與計算實務，由於 1 卡（cal）等於 4.1868 焦耳（J），可推得 1 千卡（kcal）等於 4,186.8 焦耳；而 1 兆焦耳（TJ）為 10¹² 焦耳，故其對應之標準轉換因子為 4.1868 × 10⁻⁹ TJ。【二、溫室氣體盤查作業講義P.57】"}, {"id": 287, "stem": "依據環境部《溫室氣體排放量盤查作業指引》，企業在針對廠內空調或冷凍設備之冷媒補充進行溫室氣體逸散量量化時，若欲使用「廠商提供之冷媒技術文件或排放係數」，盤查與查驗人員最應優先確認下列哪一項資訊的一致性？", "options": {"A": "機型之外觀烤漆顏色與其安裝位置", "B": "該空調品牌在市場上的零售價格", "C": "該空調設備使用之變頻壓縮機省電效率等級", "D": "廠商技術文件所載冷媒型號與現場設備之實際填裝冷媒型號完全一致"}, "answer": "D", "explanation": "依據講義關於參數選用與檢測來源之規範，在使用廠商技術文件估算冷媒逸散時，應確認所引用技術文件之冷媒型號（如 R134a、R410A 等）必須與現場實際使用之設備冷媒規格及充填量一致，避免誤用其他種類冷媒之 GWP 值導致計算嚴重失準。【二、溫室氣體盤查作業講義P.57】"}, {"id": 288, "stem": "企業在進行能源間接排放量（範疇二）盤查時，若廠區內有使用外部輸入之「製程蒸汽」，其所引用之蒸汽溫室氣體排放係數，原則上應由下列哪一方提供之數據最為準確且符合指引規範？", "options": {"A": "台灣電力公司", "B": "蒸汽供應業者", "C": "環境部資訊平台", "D": "經濟部能源署"}, "answer": "B", "explanation": "由於蒸汽並無公用電網之全國統一排碳係數，其排放與供應商之鍋爐型式、製程及燃料直接相關，因此計算外購蒸汽之間接排放時，應優先採用由「蒸汽供應業者」依其實際生產數據與燃料轉換率所計算並提供之蒸汽排碳係數。【二、溫室氣體盤查作業講義P.57】"}, {"id": 289, "stem": "依據溫室氣體排放量盤查報告書製造業通用範本，若企業欲申報盤查年度內之電力間接排放量，在引用國家公告之電力排碳係數時（以範本中所舉之民國 111 年度數值為例），該年度之官方公告電力排碳係數數值為下列何者？", "options": {"A": "0.495 公噸 CO2e／千度", "B": "0.509 公噸 CO2e／千度", "C": "0.533 公噸 CO2e／千度", "D": "0.554 公噸 CO2e／千度"}, "answer": "A", "explanation": "依據教材中「GP01 用電之製程設備」排放量計算與參數引用範例，該範本所採用與展示之經濟部公告 111 年度電力排碳係數數值為 0.495 公噸 CO2e／千度（或相當於 0.495 kg CO2e／度）。【二、溫室氣體盤查作業講義P.58】"}, {"id": 290, "stem": "依據環境部《溫室氣體排放量盤查作業指引》之小數位數規範，列管事業在溫室氣體排放量申報系統登錄各項排放源的「活動數據」（如：燃料使用之公噸數、外購電力之千度數等）時，其數據可填寫至小數點後第幾位？", "options": {"A": "第 1 位", "B": "第 2 位", "C": "第 3 位", "D": "第 4 位"}, "answer": "D", "explanation": "依據講義中有關小數位數的填寫規範，活動數據依列管事業慣用之計量單位（例如：公噸、公秉、千立方公尺、千度等），在建立活動數據表單及清冊時，「可填寫至小數點後第 4 位」。【二、溫室氣體盤查作業講義P.61】"}, {"id": 291, "stem": "某鋼鐵廠盤查人員在計算廠內某特定鍋爐燃燒柴油所產生之二氧化碳（CO2）排放量。在將活動數據乘以低位熱值與二氧化碳排放係數後，得出該排放源之「單一溫室氣體排放當量（公噸 CO2e）」。依據盤查指引規範，此單一溫室氣體排放當量數值應四捨五入至小數點後第幾位？", "options": {"A": "第 3 位", "B": "第 4 位", "C": "第 5 位", "D": "第 6 位"}, "answer": "B", "explanation": "依據環境部盤查指引之小數位數計算規定，單一排放源之各別溫室氣體（如二氧化碳、甲烷、氧化亞氮等）單一排放當量，其數值應「四捨五入並保留至小數點後第 4 位」。【二、溫室氣體盤查作業講義P.61】"}, {"id": 292, "stem": "盤查人員已完成全廠所有排放源與各類別溫室氣體的單一排放當量計算。當進行最後的「總排放當量彙總」（將全廠所有直接與能源間接排放源之排放當量加總）以得出全廠總排放量時，依據環境部盤查指引規定，此最終的全廠總排放當量（公噸 CO2e）應四捨五入至小數點後第幾位？", "options": {"A": "第 1 位", "B": "第 2 位", "C": "第 3 位", "D": "第 4 位"}, "answer": "C", "explanation": "依據講義之小數位數規定，全廠總排放量之計算（即：排放源 1 之總排放當量 ＋ 排放源 2 之總排放當量 ＋ ... ＋ 排放源 n 之總排放當量），其最終之「總排放當量彙總」數值，應「四捨五入至小數點後第 3 位」。【二、溫室氣體盤查作業講義P.61】"}, {"id": 293, "stem": "為合理簡化盤查申報作業並降低企業管理行政成本，若廠內某單一極微量之移動排放源（如：割草機）或逸散排放源（如：手提式滅火器），經計算其溫室氣體排放量以公噸 CO2e 為單位，並計算至下列哪一個指定小數位數進行四捨五入，若其排放當量未達 0.0001 公噸 CO2e，則該排放源得免予納入清冊計算？", "options": {"A": "小數點後第 5 位", "B": "小數點後第 4 位", "C": "小數點後第 3 位", "D": "小數點後第 2 位"}, "answer": "A", "explanation": "依據盤查作業指引之規定，單一移動或逸散排放源經盤查後，其排放量以公噸 CO2e 為單位，計算至「小數點後第 5 位」四捨五入。若數值未達 0.0001 公噸 CO2e 者，得不納入最終申報之排放量清冊計算。【二、溫室氣體盤查作業講義P.61】"}, {"id": 294, "stem": "某物流公司在其温室氣體盤查中，針對一台廠內公務運輸柴油大貨車進行量化。已知該大貨車於盤查年度內共消耗了 100 公升的車用柴油。若依據環境部預設參數，車用柴油之直接溫室氣體二氧化碳（CO2）排放係數為 2.67 kg CO2e／公升（暫不考慮 CH4 與 N2O），請使用「排放係數法」，計算該車輛於盤查年度內所產生的柴油燃燒 CO2 排放量為多少公噸 CO2e？", "options": {"A": "26.7 公噸 CO2e", "B": "2.67 公噸 CO2e", "C": "267 公噸 CO2e", "D": "0.267 公噸 CO2e"}, "answer": "D", "explanation": "依據排放係數法計算公式：排放量 ＝ 活動數據（公升） × 排放係數。本題中：100 (L) × 2.67 (kg CO2e/L) ＝ 267 公斤 CO2e。由於溫室氣體申報系統與報告書之標準登錄計量單位為「公噸 CO2e」，故須將公斤轉換為公噸（267 / 1,000），得出排放當量為 0.267 公噸 CO2e。【二、溫室氣體盤查作業講義P.61】"}, {"id": 295, "stem": "金融監督管理委員會（金管會）推動之「上市櫃公司永續發展路徑圖」，要求上市櫃公司分階段揭露其合併財務報表範圍內之溫室氣體盤查資訊。請問此項盤查需求之對象，在性質上屬於下列哪一種分類？", "options": {"A": "金管會指定之資本市場與永續報告揭露對象", "B": "環境部依法直接強制列管與課徵碳費之排放源對象", "C": "供應鏈品牌商直接指定之低碳供應商", "D": "完全自願性參與之綠色消費與減量宣告主體"}, "answer": "A", "explanation": "溫室氣體盤查對象可分為三大類：第一類為環境部依法強制列管並可能課徵碳費之排放源對象；第二類為金管會依永續發展路徑圖要求之上市櫃公司（以資本市場公司治理與合併財務報表範疇為基礎進行揭露）；第三類則為自願性或供應鏈品牌商之品牌要求。金管會之要求屬於指定之資本市場揭露範疇。【二、溫室氣體盤查作業講義P.7】"}, {"id": 296, "stem": "某鋼鐵廠之煉焦製程（Pi001）於盤查年度內共投入冶金煤 2,664,340.9269 公噸，已知該冶金煤之加權平均碳含量為 79.43340962%（即 0.7943340962），且製程轉化效率設定為 1。依據溫室氣體盤查之「質量平衡法」進行計算，該製程所排放之二氧化碳總量約為多少公噸 CO2e？", "options": {"A": "2,116,378.1054 公噸 CO2e", "B": "7,760,048.4216 公噸 CO2e", "C": "9,769,248.3300 公噸 CO2e", "D": "10,234,567.8912 公噸 CO2e"}, "answer": "B", "explanation": "依據質量平衡法公式計算二氧化碳排放量：活動數據 2,664,340.9269 公噸 × (44/12) × 碳含量 0.7943340962 × 轉化效率 1 ＝ 7,760,048.4216 公噸 CO2e。【二、溫室氣體盤查作業講義P.83】"}, {"id": 297, "stem": "某水泥廠在辦理年度溫室氣體盤查時，其核心製程設備「旋轉式燒成爐（編號：E308）」於該年度內共產出水泥熟料 1,440,378.4700 公噸。若已知該廠採用環境部公告之製程溫室氣體排放係數（0.52 公噸 CO2e／公噸熟料），請依據排放係數法之公式，計算該燒成爐該年度所產生的溫室氣體排放量為多少公噸 CO2e？", "options": {"A": "318.3000 公噸 CO2e", "B": "74,899.6804 公噸 CO2e", "C": "748,996.8044 公噸 CO2e", "D": "43,000.0000 公噸 CO2e"}, "answer": "C", "explanation": "根據講義「案例分享」，製程排放源之排放係數法計算公式為：年活動數據（水泥熟料產量） × 排放係數。本題計算過程為：1,440,378.4700 (公噸) × 0.52 (公噸 CO2e／公噸熟料) ＝ 748,996.8044 公噸 CO2e。【二、溫室氣體盤查作業講義P.83】"}, {"id": 298, "stem": "某製造廠在盤查直接逸散排放源時，欲估算廠內「BC型乾粉滅火器 1 支（藥劑重 4 公斤）」因使用或洩漏所產生之二氧化碳（CO2）排放量。若純度與燃燒效率均假設為 100%，依據標準化學反應當量及講義案例，該滅火器所折合之溫室氣體排放量約為多少公斤 CO2e？", "options": {"A": "1.0476 公斤 CO2e", "B": "0.7700 公斤 CO2e", "C": "2.1400 公斤 CO2e", "D": "4.0000 公斤 CO2e"}, "answer": "A", "explanation": "依據講義「案例分享」之灭火器排放計算，BC型乾粉滅火器主要成分為碳酸氫鈉（NaHCO3，分子量為 84，燃燒反應式：2NaHCO3 → Na2CO3 + CO2 + H2O）。計算公式為：4公斤 × 100% × (44 / 168) × 100% ＝ 1.0476 公斤 CO2e（折合 0.0010 公噸 CO2e）。【二、溫室氣體盤查作業講義P.85】"}, {"id": 299, "stem": "依據《溫室氣體排放量盤查作業指引》與國際 CNS 14064-1:2021 標準之分類，溫室氣體盤查議定書（GHG Protocol）中所定義的「範疇二（Scope 2）」，相當於國家標準中的哪一個類別？", "options": {"A": "類別 2：輸入能源之間接溫室氣體排放", "B": "類別 3：運輸之間接溫室氣體排放", "C": "類別 1：直接溫室氣體排放與移除", "D": "類別 4：由組織使用的產品所產生之間接溫室氣體排放"}, "answer": "A", "explanation": "依據 CNS 14064-1:2021 的對應關係，溫室氣體盤查議定書（GHG Protocol）定義之範疇二（外購電力、外購蒸汽等輸入能源之使用），對應至國家標準即為「類別 2：輸入能源之間接溫室氣體排放」。【二、溫室氣體盤查作業講義P.9】"}, {"id": 300, "stem": "某製造廠在鑑別廠內之溫室氣體排放源時，下列哪一項能資源消耗所產生之溫室氣體排放，「不屬於」企業的範疇一（直接排放），而應歸類為範疇二（能源間接排放）？", "options": {"A": "行政大樓空冷設備所使用的冷媒逸散", "B": "廠內交通公務車輛行駛燃燒之車用無鉛汽油", "C": "製程加熱爐燃燒之天然氣", "D": "生產設備日常運轉耗用之台電外購電力"}, "answer": "D", "explanation": "直接排放（範疇一/類別 1）包含固定燃燒（如鍋爐、加熱爐）、移動燃燒（如公務車）、製程排放與逸散排放（如冷媒、化糞池） 。而外購電力之消耗，實質排放發生於發電廠端，對企業而言屬於「輸入能源之間接溫室氣體排放（範疇二/類別 2）」。【二、溫室氣體盤查作業講義P.9】"}, {"id": 301, "stem": "依據《溫室氣體排放量盤查登錄及查驗管理辦法》與盤查作業指引之範疇定義，下列哪一項排放源「不屬於」企業的範疇一（直接溫室氣體排放）？", "options": {"A": "廠房日常營運所耗用之外購台電電力", "B": "廠內生產設備固定燃燒之液化天然氣", "C": "廠區公務運輸車輛移動燃燒之車用無鉛汽油", "D": "行政辦公大樓空調系統補充冷媒之逸散"}, "answer": "A", "explanation": "範疇一（直接排放）涵蓋固定燃燒、移動燃燒、製程排放及逸散排放等。而外購電力之使用在溫室氣體盤查中，其排放本質發生於外部電廠，屬於「輸入能源之間接溫室氣體排放」（即範疇二/類別 2）。【二、溫室氣體盤查作業講義P.9】"}, {"id": 302, "stem": "依據環境部溫室氣體盤查登錄作業規範，若列管事業在線上資訊平台登錄之前一年度「盤查溫室氣體排放量數據」，與第三方查驗機構最終出具之「查驗聲明書」結果產生實質落差或不一致時，事業應如何處理？", "options": {"A": "線上申報平台會依據查驗機構上傳之結果自動強制修正，事業無需手動調整", "B": "事業應在申報平台的備註欄位進行文字註記說明即可，不需修改已上傳之清冊", "C": "事業必須確認並修改線上登錄系統數據、排放量清冊與盤查報告書，使其與最終查驗結果完全一致", "D": "事業無需更新任何數據，僅需於次年度盤查時在報告書中一併說明並扣除差額即可"}, "answer": "C", "explanation": "依據講義中「錯誤案例及常見問題說明」規範，常見系統退件錯誤之一即為「事業登錄之排放量與查驗結果不一致」。事業登錄之排放數據，應確保盤查報告書、排放量清冊、線上登錄系統與最終取得之第三方查驗聲明書數據完全一致。若有不符，事業應在申報截止前修正原報告與清冊之申報數據。【二、溫室氣體盤查作業講義P.93】"}, {"id": 303, "stem": "企業在進行組織型溫室氣體盤查之範疇二（輸入能源之間接排放）計算時，欲量化外購電力所產生的溫室氣體排放量，下列哪一項用電或購電特性，最直接決定了該用電部分之排放係數得否以 0（零排放）來進行申報？", "options": {"A": "該購電來源是否為經主管機關核定且具備憑證之再生能源", "B": "廠房內配電系統中變壓器的效率與品牌", "C": "外部輸電網至廠內受電端之線路傳輸長度", "D": "各用電製程機台設備的老化折舊程度"}, "answer": "A", "explanation": "外購電力若要引用再生能源排放係數為 0，其使用應檢具相對應之再生能源憑證與轉供證明。若外購電力有部分實際使用再生能源電力並取得再生能源憑證，其排放係數可以 0 kg CO2e/度（或公噸e/千度）計算；變壓器品牌、線路長度、機台折舊等特性則與電力排碳係數引用無關。【二、溫室氣體盤查作業講義P.96】"}, {"id": 304, "stem": "依據環境部最新《溫室氣體排放量盤查作業指引》之規範，事業在盤查外購電力產生之溫室氣體間接排放量時，若僅單純自市場上購買並宣稱擁有再生能源憑證（T-REC），但並未實際轉供實體電力，亦無轉供證明文件（即電證分離），在申報登錄時應如何處理該電力排放？", "options": {"A": "仍得在線上系統申報該電力排放量為零，但需在報告書中加註說明", "B": "得以該憑證所登載之發電度數直接扣減前一年度之直接排放量", "C": "可由查驗機構於查驗時直接進行數據合併登錄", "D": "仍應以該外購電力之原公告排放係數計算，不可使用該再生能源憑證扣除排放量"}, "answer": "D", "explanation": "依據講義常見問題解答，事業外購電力若非屬實際使用之再生能源電力，僅購買再生能源憑證（電證分離），因事業未實際使用再生能源電力，應以原外購電力之公告排放係數計算溫室氣體排放量，不可使用所購買之再生能源憑證扣除或歸零排放量。【二、溫室氣體盤查作業講義P.96】"}, {"id": 305, "stem": "企業在蒐集盤查年度活動數據時，若遇到電費單、天然氣費單等計量憑證出現「跨年份（例如前一年 11 月 5 日至今年 1 月 4 日）」之情形，依據《溫室氣體盤查作業指引》之實務問題說明，事業應如何處理此類跨年數據？", "options": {"A": "直接將該張帳單的全部使用量合併納入前一年度的盤查總量中計算", "B": "應依據實際天數比例進行扣除或折算，按比例分配調整後納入當年度盤查", "C": "為了簡化數據品質管理程序，可直接忽略該張單據不予計算", "D": "無須進行任何比例折算，由查驗機構於現場決定是否合併計算"}, "answer": "B", "explanation": "依據盤查指引之常見問題解答，當活動數據跨月份時，應按比例進行調整。例如前一年 11/5-今年 1/4 之電費單，應按比例換算 1/1-1/4 之電量並納入當年度盤查數據中。【二、溫室氣體盤查作業簡報第113頁】"}, {"id": 306, "stem": "依據環境部《溫室氣體排放量盤查作業指引》，廠區內部園藝綠化所使用之「乘坐式割草機（使用汽/柴油內燃機）」，在進行全廠排放源鑑別與分類時，應歸類為下列何種溫室氣體排放型式？", "options": {"A": "固定燃燒排放源", "B": "逸散排放源", "C": "移動燃燒排放源", "D": "製程排放源"}, "answer": "C", "explanation": "依據盤查指引常見問題說明，不同型式之割草機分類有所不同。其中「乘坐式割草機」由於具備動力與乘坐運輸、移動物料功能，在排放源鑑別中應歸類為「移動式燃燒源」。手推式與背負式割草機則屬固定燃燒源。【二、溫室氣體盤查作業簡報第114頁】"}, {"id": 307, "stem": "在計算化石燃料燃燒的溫室氣體排放量時，若企業取得之燃料熱值為「高位熱值 / 毛總熱值（HHV）」，且該燃料為天然氣等「氣態燃料」，在缺乏精確轉換公式下，依環境部預設轉換指引，應乘以多少比例換算為「低位熱值（LHV）」？", "options": {"A": "0.85", "B": "0.90", "C": "0.95", "D": "1.05"}, "answer": "B", "explanation": "依據熱值換算之通用原則，若無實際檢測之低位熱值數據，固體及液體燃料的低位熱值通常以高位熱值之 95%（0.95）估算；而天然氣等氣態燃料則是以高位熱值的 90%（0.90）進行低位熱值之估算轉換。【二、溫室氣體盤查作業簡報第60頁】"}, {"id": 308, "stem": "企業在量化化石燃料燃燒的排放量時，指引規定應使用「低位熱值（LHV）」。若供應商僅提供「高位熱值（HHV）」，且該燃料屬於柴油、重油或煤炭等「固體及液體燃料」，在無法取得實際檢測值時，依環境部預設指引，應以高位熱值的多少比例進行估算轉換？", "options": {"A": "85%", "B": "90%", "C": "95%", "D": "105%"}, "answer": "C", "explanation": "依據熱值換算之通用原則，若無實際檢測之低位熱值數據，固體及液體燃料（如燃煤、燃油、柴油等）的低位熱值通常以高位熱值之 95%（0.95）進行估算；而天然氣等氣態燃料則是以高位熱值的 90%（0.90）進行低位熱值之估算轉換。【二、溫室氣體盤查作業簡報第60頁】"}, {"id": 309, "stem": "溫室氣體排放量計算時，燃料熱值應優先採用「低位熱值（LHV）」。倘若企業採購之天然氣（屬於氣態燃料），其氣體供應商之檢測報告僅列出「高位熱值 / 毛總熱值（HHV）」，在缺乏精確公式下，依環境部指引，預設之轉換係數應為下列何者？", "options": {"A": "0.85", "B": "0.90", "C": "0.95", "D": "1.05"}, "answer": "B", "explanation": "根據指引之燃料熱值檢測與換算實務，固體與液體燃料若需將高位熱值估算為低位熱值，通常乘以 95%（0.95）；而天然氣等氣態燃料之低位熱值，預設通常以高位熱值之 90%（0.90） 進行轉換。【二、溫室氣體盤查作業簡報第60頁】"}, {"id": 310, "stem": "依據環境部溫室氣體排放量盤查作業指引，列管事業在蒐集與記錄年度溫室氣體活動數據時，若同時擁有「財務會計憑證」與「經定期校正之連續計量儀器監測用量」，應優先採用何者？", "options": {"A": "由財務人員依據採購單據與請款帳單統計得出之數據", "B": "依據設備出廠額定最大運轉功率與工時估算之數據", "C": "經定期校正且合格之量測儀器量測所得之數據", "D": "同業於公會平台所登載之年度平均估算數值"}, "answer": "C", "explanation": "依據指引，活動數據之蒐集可分為量測數據與非量測數據。若廠內同時具備此兩類數據，為了提升數據品質（DQM）並降低不確定性，應優先採用經校正之計量儀器量測之數據。【二、溫室氣體盤查作業簡報第61頁】"}, {"id": 311, "stem": "企業在進行廠區內溫室氣體排放源之鑑別與分類時，下列哪一項使用化石燃料之設備，在定義上屬於典型的「移動燃燒排放源」？", "options": {"A": "倉儲物流區內部作為搬運動力使用之柴油堆高機", "B": "廠房頂樓裝設作為備用電源之緊急柴油發電機", "C": "員工宿舍內烹飪使用之桶裝瓦斯爐", "D": "研發實驗室中使用之乙炔焊接噴槍設備"}, "answer": "A", "explanation": "乘坐式或具備交通運輸與物料移動功能之機械（如柴油堆高機、公務車等）屬於「移動式燃燒源」 ；而發電機、瓦斯爐屬於固定燃燒，焊接乙炔則屬直接製程排放。【二、溫室氣體盤查作業簡報第91頁】"}, {"id": 312, "stem": "某金控集團永續長在評估全球碳定價工具。關於強制性國家「碳費（價格型工具）」與「碳排放權交易（市場交易型工具）」兩者在經濟治理上的最核心本質技術差異，下列何者敘述正確？", "options": {"A": "碳費之每噸單價完全隨自由市場每日交易供需高頻波動；而碳交易之價格則一律由環境部公告並固定維持三十年不變", "B": "碳費是由政府公告、直接控制排碳代價之「費率機制」；而碳交易（如排放權交易系統）其價格則完全取決於市場上排碳額度之「供需機制」", "C": "碳費完全無法作為驅動產業進行實質減量之政策誘因，只有自願減量交易具備減碳功能", "D": "碳交易僅適用於陸域森林造林等移除型專案，而碳費一律只能適用於範疇三之上游運輸"}, "answer": "B", "explanation": "碳費是屬於政府直接管制價格的「費率機制」，價格明確但總減量效果可能浮動；而碳交易（如總量管制與交易系統 ETS，或自願減量交易市場）本質上是由買賣雙方在平台上自主協議或搓合，其價格與額度移轉完全屬於「市場供需機制」，【三、溫室氣體自願減量作業與減量額度講義 P.1】"}, {"id": 313, "stem": "為確保我國發行溫室氣體減量額度（碳權）之品質與環境誠信，依據環境部《溫室氣體自願減量專案管理辦法》之核心規範，專案在量化設計與額度核發時，必須嚴格符合國際公認的何種管理與計量原則？", "options": {"A": "雙重重大性與 ESG 資訊安全原則", "B": "一致性與可比性原則", "C": "三加五原則（MRV三項技術特徵 ＋ 五大環境誠信要求）", "D": "質量守恆與熱值折算百分百無公差原則"}, "answer": "C", "explanation": "依據自願減量管理辦法，專案必須遵循「三加五原則」：即滿足可量測、可報告、可查證（MRV）之三大技術特徵，以及具備外加性、保守性、永久性、避免環境危害及避免重複計算之五大核心環境誠信要求。【三、溫室氣體自願減量作業與減量額度講義 P.14】"}, {"id": 314, "stem": "依據我國環境部推動自願減量專案之「三加五原則」及確證規範，一項合格減碳計畫必須被證明具備「外加性（Additionality）」。請問在碳權開發與符合性審查實務中，下列關於「外加性」之科學與管理內涵，何者敘述最為精確？", "options": {"A": "證明該減碳措施並非我國現行法規所強制要求，且在沒有本自願減量專案之介入與碳信用收益下，該減碳活動將因財務回收期長、技術壁壘或融資障礙等實質障礙而不會發生", "B": "指專案所產生之減量信用額度，可在不同的交易平台與跨國碳交所之間，進行無限次數之轉讓、流通與二次加價套利交易", "C": "指該專案取得之自願減量額度可以無條件且無限制地 100% 抵減該收費對象之年度總碳費，免受 10% 上限之法規約束", "D": "證明專案所實施之減碳技術，早已是國內該地理區域或同業大廠中被廣泛、普遍採用之常規基本技術"}, "answer": "A", "explanation": "**「外加性（Additionality）」**是指專案活動所帶來的排放削減或移除，是額外於常規基線情境的。這意味著：該措施不屬現行法規強制、且必須克服財務資金不具吸引力（財務外加性）、技術缺失（技術外加性）或普遍性大廠常規（普遍性外加性）等實質障礙，有了自願減量專案的介入才能實質落實者，【三、溫室氣體自願減量作業與減量額度講義 P.14】"}, {"id": 315, "stem": "某永續發展規劃師擬為企業的減量行動方案向環境部申辦自願減量專案。在各式溫室氣體減量與增匯路徑中，下列哪一項措施在法理與科學界定上，屬於「移除類型（Removal）」的專案活動？", "options": {"A": "導入製程含氟溫室氣體之破壞與去除轉化設施", "B": "於廢棄物處理場內裝設高效能沼氣回收發電與利用系統", "C": "將工廠之高能效變頻空調設備與燈具進行一對一汰換", "D": "執行新植造林及加強森林經營以提升二氧化碳吸附與固定"}, "answer": "D", "explanation": "自願減量專案之審查措施主要分為「減少或避免排放類型」與「移除類型（負排放技術）」兩大類。其中，製程改善、能效提升、沼氣發電與燃料轉換等均屬於「減少或避免排放類型」；而利用樹木、森林等自然碳匯將大氣中二氧化碳實質吸收並固定儲存之**「新植造林及加強森林經營」，則屬於典型的「移除類型」**。【三、溫室氣體自願減量作業與減量額度講義 P.17】"}, {"id": 316, "stem": "某中小型零售通路擬將全台門市更換為高效率 LED 燈具，並向環境部申請「微型規模（再生能源或節能年削減小於 2 萬噸 CO₂e）」之自願減量專案註冊。依據法規，關於微型規模專案之確證與外加性分析簡化規定，下列敘述何者最為正確？", "options": {"A": "該專案之計畫書外加性分析，應完整執行財務外加性、普遍性、技術障礙與法規外加性等四項完整分析", "B": "微型規模專案可以直接豁免向環境部遞交專案計畫書（PDD）送審，直接進入額度核發階段", "C": "該專案之計畫書外加性分析，「得僅分析法規外加性」，且得免除環境衝擊分析及公眾意見", "D": "微型規模專案在額度取得（監測與查證）階段，可以完全免除第三方查驗機構之實地查證程序"}, "answer": "C", "explanation": "依據《溫室氣體自願減量專案管理辦法》及確證規定（表 3.3 / 表 6.2），「微型規模」自願減量專案在計畫書之外加性分析上享有最大之行政與技術簡化，「得僅分析法規外加性」，且可以免除環境衝擊分析與公眾意見調查，但仍須遞交計畫書註冊，且額度核發依然須經查證，【三、溫室氣體自願減量作業與減量額度講義 P.17】"}, {"id": 317, "stem": "某科學園區開發計畫涉及新增溫室氣體排放量。開發單位規劃在園區以外區域，透過大量「汰換老舊燃油機車為電動機車」之減量措施，向環境部申領溫室氣體減量效益。依據《溫室氣體排放量增量抵換管理辦法》，關於此項汰換減量效益之取得與說明，下列何者最正確？", "options": {"A": "此減量效益可以直接 100% 用於全額折抵該事業年應繳納之國家碳費", "B": "事業得自主將其登載於官網中進行碳中和宣告，自動豁免任何行政審查", "C": "該減量效益在性質上可直接用以無條件折抵歐盟碳邊境調整機制（CBAM）憑證", "D": "該減量效益之取得與申領，依法必須委託合格之第三方查驗機構，執行實質之確證及查證程序，方得認可核發"}, "answer": "D", "explanation": "依據《溫室氣體排放量增量抵換管理辦法》及減量核算機制，汰換老舊設備、載具所得之實質減量效益（或額度），在法規與行政程序上，均必須委託政府核核許可之合格第三方機構，執行實地之「確證」及「查證」，取得合理保證之聲明書後，方得認可與核發。（本題標準答案為 D），【三、溫室氣體自願減量作業與減量額度講義 P.2】"}, {"id": 318, "stem": "環境部依法得對強制盤查對象與查驗案件執行實地稽查。關於查驗作業程序與法令合規要求，下列哪一項敘述「錯誤」？", "options": {"A": "查驗人員在現場若發現非實質性或非重大之數據異常，得經雙方口頭協議後，「自行決定不予記錄」在查核表與總結報告中", "B": "環境部依法得派員至現場執行稽查，查驗人員及受列管事業均應予以配合、不得無故拒絕", "C": "執行現場查驗作業之 7 日前，查驗機構應主動將查驗計畫上傳至環境部指定之資訊平台", "D": "查驗人員對於查驗過程中發現之不符合事項，應詳實開立澄清要求（CL）或矯正措施要求（CAR），並記錄於查核表中"}, "answer": "A", "explanation": "查驗人員在執行確證與查證時，不論發現之異常屬於實質性或非實質性，均必須系統化、科學化地如實記錄於查核表（Checklists）與查驗總結報告中，不允許查驗人員自行協議、隱瞞或「決定不予記錄」，【三、溫室氣體自願減量作業與減量額度講義 P.24】"}, {"id": 319, "stem": "某查驗小組擬對一家在全國設有 64 個門市據點之連鎖便利商店集團，執行組織型範疇二外購電力之「查驗取樣計畫（Sampling Plan）」。依據環境部《溫室氣體查驗指引》中對於取樣計畫與取樣數之規範，下列哪一項敘述「錯誤」？", "options": {"A": "經查驗小組評估為中、低風險之排放設施或據點，其最低取樣數量應至少涵蓋排放設施總數目之「三次方」", "B": "該專案之總體取樣母數（即查驗小組實質查驗過據點之排放量加總），在技術上應至少涵蓋受查對象總排放量之 95%", "C": "查驗機構執行後續年度之查證工作時，應依風險等級，優先將「前一年度尚未實地查核過」之排放設施納入取樣計畫", "D": "查驗人員針對排放設施之取樣，得以具備高度同質性之設施篩選後之設施數目，作為取樣範圍之基準"}, "answer": "A", "explanation": "依據查驗指引中之取樣計畫規範，針對中、低風險之排放設施或據點，其最低取樣設施數目，應至少為其「平方根」（而非三次方），故 (A) 的描述存在嚴重算術與法規錯誤，【三、溫室氣體自願減量作業與減量額度講義 P.29】"}, {"id": 320, "stem": "某主導查驗員在為某半導體晶圓廠之多條製程產線規劃「組織型溫室氣體查驗之取樣計畫（Sampling Plan）」。依據環境部溫室氣體查驗與稽核規範，針對廠區內被判定為「高風險之排放設施或關鍵排放源」，其所應採取之實質取樣比例與要求為何？", "options": {"A": "應以排放設施總數目開平方根後之數值進行比例取樣", "B": "得僅對其中之 20% 進行簡單取樣，其餘得由查驗員自行保證", "C": "得比照低風險設施，採 40% 的等比率抽樣即可", "D": "該高風險之排放設施「應全部（100%）納入實質取樣與查核」"}, "answer": "D", "explanation": "在執行組織型查驗之數據取樣時，查驗機構必須制定科學之取樣計畫。其中，針對被判定具有高不確定性、高排放量或高複雜度之「高風險排放設施」，依法「應全部進行實質取樣與查驗」，不能進行比例或開平方根抽樣，【三、溫室氣體自願減量作業與減量額度講義 P.29】"}, {"id": 321, "stem": "某大專校院在盤查其「類別 2（輸入能源之間接溫室氣體排放，範疇二）」時。為了向查驗人員證明其校區外購電力之實體盤查範圍與全校總電錶之對接一致性。依據盤查與查驗指引，下列哪一項文件或佐證資料「最適合作為」能源間接排放源之排放鑑別與範疇確認之關鍵依據？", "options": {"A": "製造商所提供之實驗室化學品安全資料表（SDS）", "B": "生物多樣性保育與陸砂維護計畫之外部專家質性審查聲明", "C": "校區總務處保留之「公用電力設施之總儀表設置位置、單線圖與電號涵蓋範圍」及台電電費單與收費發票", "D": "校內廚餘回收與一般生活垃圾之清運聯單及發票"}, "answer": "C", "explanation": "範疇二（能源間接排放）主要指外購電力、蒸汽或熱力。查驗與盤查指引中明確指出，鑑別能源間接排放源時，應審查「公用設施儀表設置位置、電錶單號與涵蓋範圍」以及「公用設施之收費發票/電費單」，以確保電力或蒸汽數據之準確與邊界完整，【三、溫室氣體自願減量作業與減量額度講義 P.29】"}, {"id": 322, "stem": "某半導體代工廠宣示加入國際「RE100」倡議，承諾於 2030 年達成全廠區 100% 使用再生能源電力。為了向國際審查機構提供具公信力之綠電履約佐證，該廠在範疇二（能源間接排放）量化或披露時，應至少取得並檢具下列哪一項證明文件？", "options": {"A": "該廠與外部永續輔導顧問公司簽訂之碳中和技術合作意約書", "B": "經核發且與用電量年度相符之「再生能源憑證（如台灣之 T-REC、國際之 I-REC）」", "C": "廠區向地方建管處申請架設屋頂光電之平面配置圖與施工發票", "D": "企業內部綠色電力管理委員會定期召開之員工宣導簽到紀錄"}, "answer": "B", "explanation": "在國際綠電倡議（如 RE100）與組織碳盤查範疇二核算中，企業若要證明其所消耗之電力為再生能源（綠電），在技術與合規上，必須取得並擁有具備法律與計量公信力的「再生能源憑證（Renewable Energy Certificates, RECs，如我國之 T-REC）」，此為綠電屬性之唯一所有權證明，【三、溫室氣體自願減量作業與減量額度講義 P.30】"}, {"id": 323, "stem": "某合格查驗機構在進行個案符合性審查時，發現指派之某位專業查驗員，在兩年前曾擔任過該受查半導體廠之自願減量專案輔導顧問。依據《溫室氣體認證機構及查驗機構管理辦法》之利益衝突迴避規範，該查驗機構此時應採取何種正確之處置措施？", "options": {"A": "只要該查驗員在報告書中以書面方式對該輔導經歷進行定性公開，即可繼續參與查驗作業", "B": "允許該查驗員以匿名、去識別化之方式繼續參與該案確證或查證之技術報告審查", "C": "只要經由同業公會或受查廠房出具第三方公正聲明，即可免除利益衝突迴避之限制", "D": "應立即啟動利益衝突迴避程序，排除（撤換）該人員參與該半導體廠之任何確證與查證作業"}, "answer": "D", "explanation": "依據《溫室氣體認證機構及查驗機構管理辦法》與國際標準利益衝突迴避條款，查驗人員與機構若與受查對象在特定期限內曾有聘僱、輔導、顧問或合夥等利益糾葛，一律「嚴格禁止」參與該案之確證與查證工作，必須啟動程序完全排除（撤換），以維護第三方查證之客觀與絕對公正性。【三、溫室氣體自願減量作業與減量額度講義 P.4 / P.45】"}, {"id": 324, "stem": "某大型永續技術顧問公司計畫接受委託，承接某鋼鐵廠自願減量專案之確證與查證業務。依據我國《溫室氣體自願減量專案/抵換專案查證重點》之「獨立性原則」，該查驗機構應採取下列哪一種合規管理做法？", "options": {"A": "確證人員為了協助客戶順利通過註冊，主動介入並協助該廠編寫專案計畫書（PDD）", "B": "查驗小組指派曾於同年度協助該鋼鐵廠規劃廠區能效提升之專案顧問擔任主導查驗員", "C": "為縮短行政流程，查驗機構技術部門直接委任由該鋼鐵廠持有 100% 股權之子公司代為執行現場查核並簽署報告", "D": "查驗機構與受查單位在財務、管理及顧問諮詢上皆維持完全的分離，且查驗人員不參與該專案之計畫書編撰與低碳技術導入"}, "answer": "D", "explanation": "依據我國自願減量專案之查證規範與 CNS 14064-3/CNS 17029 標準之「獨立性原則」，執行符合性評鑑之機構與人員必須與受查對象及申請項目保持完全的利益分離與獨立性，查驗人員絕對「不得參與該專案之計畫書編撰或低碳技術導入」，否則構成利益衝突，其查驗結果將不予認可，【三、溫室氣體自願減量作業與減量額度講義 P.4】"}, {"id": 325, "stem": "某合格第三方查驗機構在承接某鋼鐵廠的年度查證業務時，確認參與該案之主導查驗員與查驗小組，在過去兩年內未曾為該廠提供任何溫室氣體盤查建置之「顧問諮詢或技術合作服務」。此一利益迴避之實務程序，主要是在貫徹查驗管理中之哪一項核心「查驗原則」？", "options": {"A": "公正性與獨立性 (Impartiality and Independence)", "B": "專業能力 (Professional Competence)", "C": "確信合理性 (Reasonable Assurance)", "D": "財務重大性 (Financial Materiality)"}, "answer": "A", "explanation": "依據《溫室氣體認證機構及查驗機構管理辦法》與查驗指引原則，查驗機構與其查驗人員應維持高度之「公正性與獨立性」，嚴禁為其提供過顧問或輔導服務之同一個對象執行查驗，以防止角色衝突、確保查證之客觀與公信力，【三、溫室氣體自願減量作業與減量額度講義 P.4】"}, {"id": 326, "stem": "某不鏽鋼製造大廠擬委託第三方機構對其廠內製程排放量執行法定查證。依據我國溫室氣體查驗管理辦法，參與該案實質確證或查證之查驗人員（如主導查驗員），其執業資格依法必須符合下列哪一項關鍵條件？", "options": {"A": "只要取得國內一般學術研究機構所核發之氣候學分班結業證書即可", "B": "僅可以外部獨立顧問之技術諮詢角色參與，其資格不需登載於政府系統", "C": "其主導查驗員或查驗員之專業資格，必須正式通過「中央主管機關（環境部）審查、登錄且處於有效狀態」", "D": "該查驗人員本身必須與該受查鋼鐵廠簽有長期之設備採購與系統建置輔導合約"}, "answer": "C", "explanation": "依據我國查驗與認證規範，凡執行法定盤查登錄或自願減量專案查驗之主導查驗員或查驗員，其個人資格必須經由查驗機構向中央主管機關（環境部）申請登記並經審查合格，且登錄狀況必須處於有效狀態下，方具備執業之法理資格。其餘學術結業、兼任顧問或有輔導商業合約者皆不合規，甚至可能涉及利益衝突。【三、溫室氣體自願減量作業與減量額度講義 P.47】"}, {"id": 327, "stem": "某合格第三方查驗機構，欲向環境部申請許可成為同時執行「組織型」、「專案型」及「產品碳足跡」查驗之合格機構。依據我國查驗機構許可與員額標準之規定，該機構在法定最低員額與專職技術資格配置上，下列何者符合規定？", "options": {"A": "組織型：至少 2 名查驗人員（含 1 名專職主導）；專案型：至少 1 名專職主導；產品碳足跡：至少 1 名專職主導", "B": "組織型：至少 3 名查驗人員（其中至少 2 名為專職主導查驗員）；專案型：至少 2 名專職主導查驗員；產品碳足跡：至少 2 名專職主導查驗員", "C": "組織型：至少 5 名查驗人員（其中至少 3 名為專職主導查驗員）；專案型：至少 3 名專職主導查驗員；產品碳足跡：至少 3 名專職主導查驗員", "D": "組織型：至少 4 名查驗人員（其中至少 2 名為專職主導查驗員）；專案型：至少 1 名專職主導查驗員；產品碳足跡：至少 3 名專職主導查驗員"}, "answer": "B", "explanation": "依據我國認證機構與查驗機構管理標準，申請許可之查驗員額底線為：1. 組織型：至少 3 名查驗人員，其中至少 2 名為專職主導查驗員；2. 專案型：至少 2 名專職主導查驗員；3. 產品碳足跡型：至少 2 名專職主導查驗員，【三、溫室氣體自願減量作業與減量額度講義 P.47】"}, {"id": 328, "stem": "某具備環境工程背景之技術專家，規劃向環境部申請登記登記為合格之「產品碳足跡（CFP）查驗員」。依據我國查驗人員之專業實績與訓練要求，該人員在正式申辦登記前，應至少先完成幾件產品碳足跡之「現場查驗觀察任務」，並在主導查驗員指導下，實際「參與」幾件產品碳足跡之現場查驗案件？", "options": {"A": "3 件觀察任務，並實際參與 3 件現場查驗案件", "B": "3 件觀察任務，並實際參與 2 件現場查驗案件", "C": "2 件觀察任務，並實際參與 2 件現場查驗案件", "D": "1 件觀察任務，並實際參與 3 件現場查驗案件"}, "answer": "C", "explanation": "依據溫室氣體查驗人員資格規範（產品碳足跡查驗員之登記資格），新進查驗員應先完成「2 件」產品碳足跡現場查驗觀察任務，再於主導查驗員指導下，實際參與至少「2 件」產品碳足跡現場查驗案件，方具備登記登記資格，【三、溫室氣體自願減量作業與減量額度講義 P.47】"}, {"id": 329, "stem": "某化學大廠之綠領工程師正在為一項已註冊之「熱蒸汽製程改進」自願減量專案計算其實際之「減量額度」。依據我國自願減量與抵換專案量化核算規範，專案所能申領之實際減量額度（以 ER 標示，單位為公噸 CO2e），其最標準、核心之科學計算公式應為下列何者？", "options": {"A": "ER = BE - PE - LE（其餘參數分別代表基線排放、專案排放與專案洩漏量）", "B": "ER = PE - LE - BE（其餘參數分別代表專案排放、專案洩漏量與基線排放）", "C": "ER = BE - PE（直接忽略任何可能之製程洩漏，以簡化計量）", "D": "ER = BE × 1.2 - PE（直接套用政府指定之 1.2 折抵係數）"}, "answer": "A", "explanation": "依據自願減量與抵換專案方法學與量化核算規範，專案之實質減量額度（ER）之計算，必須符合保守性原則，公式為：「減量額度（ER） = 基線排放量（BE）- 專案排放量（PE）- 洩漏量（LE）」。【三、溫室氣體自願減量作業與減量額度講義 P.52】"}, {"id": 330, "stem": "某節能科技公司在為其「工業級變頻冰水主機汰換專案」撰寫自願減量專案計畫書。依據確證與量化申報規範，關於專案計畫書中「溫室氣體減量計算與估算」之合規呈現方式，下列敘述何者正確？", "options": {"A": "必須提供完整且確鑿的「減量成效計算表（含計算公式、假設條件及實際代入之應用數值與參數）」", "B": "為保護企業之商業機密，專案僅需在計畫書中提供最終的減量總噸數，無須公開任何計算過程", "C": "只需在報告中載明所依循之減量方法學名稱與版次，計算公式可於額度申請時再補交", "D": "若製程與先前已通過之其他企業專案相同，可直接引用該專案之歷史減量結果，無需重新核算"}, "answer": "A", "explanation": "自願減量專案之減量核算講求可查證性。在計畫書撰寫中，必須詳細列出基線、專案、洩漏量之「計算公式與估算過程」，並提供實質的減量成效計算表及佐證數據，不得直接套用、引用或僅提供最終定值，【三、溫室氣體自願減量作業與減量額度講義 P.52】"}, {"id": 331, "stem": "環境部氣候變遷署在審查某石化廠提報之自願減量信用額度核發申請時，發現查驗機構所出具之查驗總結報告書中存在顯著的邏輯矛盾，且其最終確信結論完全無法支持其前文所列之監測數據與儀器校正結果。承上述情境，主管機關環境部依法得採取下列哪一項處置措施？", "options": {"A": "直接核准其碳權申請，但規定該批碳權額度只能在台灣碳權交易所進行強制性折價拍賣", "B": "限期要求該查驗機構進行技術與數據補正，若逾期未補正或補正後仍不合規定，主管機關得對該查驗結果不予認可（不予承認該查驗效力）", "C": "由主管機關行政審查人員直接代為修改數據並簽署合格聲明，以落實公正轉型與便民輔導", "D": "直接註銷該查驗機構在國內執行之所有其他承辦個案許可證，並對該石化廠處以所得稅減半之處分"}, "answer": "B", "explanation": "依據管理與查核辦法，查驗報告之品質受主管機關監督。若審查發現查驗報告存在嚴重矛盾、或查證結論缺乏數據與校正紀錄支持，主管機關將通知限期補正。若查驗機構「逾期未補正、或補正後仍不合規定者，主管機關得對其查驗結果不予認可」，企業將無法憑此申請並取得減量額度。【三、溫室氣體自願減量作業與減量額度講義 P.56 / P.60】"}, {"id": 332, "stem": "某連鎖零售集團在全國擁有 120 家分店，並統一申請了照明能效自願減量專案。查驗機構考量門市眾多，決定採用「抽樣（Sampling）」方式執行查證。依據我國自願減量與確證查證技術規範，在處理抽樣程序時，下列哪一項敘述最為正確且符合規範？", "options": {"A": "為了最大化降低查驗之資本成本，查驗機構得直接同意以最少之 1 個樣本進行 100% 代表", "B": "抽樣計畫之設計僅屬行政管理內部文件，其具體抽樣標準與統計信賴度無須在報告中予以揭露", "C": "查驗人員得為求便利，授權該集團自行委任之外部永續顧問公司代為抽樣，並直接引用其抽樣數據", "D": "抽樣方法、樣本選取之統計學標準與信賴區間必須在查驗報告中詳實記載，且該抽樣方案必須能合理解釋並證明其結果之代表性"}, "answer": "D", "explanation": "依據自願減量與確證查證技術規範，當專案因場址眾多而需採取抽樣監測或抽樣確確信時，其抽樣設計（如採用 CDM 抽樣與調查標準）必須具備高度科學性，且其所使用之「抽樣方法、樣本選取之統計學標準、信賴區間與信賴度」必須詳實登載於查驗報告中，並能合理佐證與解釋其結果之代表性。【三、溫室氣體自願減量作業與減量額度講義 P.56 / P.61】"}, {"id": 333, "stem": "某合格第三方查驗機構受託對某造紙廠提報之「生質發電自願減量專案」監測報告進行「文件審查（Desk Review）」程序。依據我國溫室氣體確證與查證重點，執行此一文件審查程序之最上位技術與合規把關目的為何？", "options": {"A": "實質評估並核定該造紙廠當年度所能取得之碳權額度，並直接匯入其碳登記帳戶中", "B": "檢核受查者所提交之申請資料、監測報告書及其佐證憑證是否完整齊備、內容數值是否正確，並確認其量化邏輯符合所用自願減量方法學之適用性", "C": "專案用於與受查對象協商並排定現地勘查之具體行程、食宿差旅與現場人員訪談之名單安排", "D": "協助造紙廠高層經理人評估與精算該低碳技術設備之投資財務可行性、淨現值與資本回收期"}, "answer": "B", "explanation": "查證程序中之「文件審查（Desk Review）」主要為技術符合性之前置與整體把關。其核心目的在於實質檢查受查單位提報之監測報告書、相關數據清冊與佐證憑證是否完整齊備、公式套用與數值運算是否正確，並確認專案在實行監測時是否確實符合經註冊核定之計畫書與適用方法學。【三、溫室氣體自願減量作業與減量額度講義 P.56】"}, {"id": 334, "stem": "某上市科技公司之高雄廠完成了年度溫室氣體自願減量專案之現場查驗。依據我國自願減量專案管理與確證查證規範，該專案最終所得、用以向環境部正式申辦碳權之「查驗報告書（Verification Report）」，在法理上應由下列哪一個主體負責編製、撰寫與簽發？", "options": {"A": "經環境部許可且受託承辦該案符合性評估之「第三方查驗機構」", "B": "該科技公司廠區內之環安衛管理部門或永續推動工作小組", "C": "協助該科技公司量化碳排、彙整活動數據之外部永續顧問公司", "D": "負責建置、維護我國自願減量暨抵換資訊平台之主管機關行政承辦單位"}, "answer": "A", "explanation": "溫室氣體「查驗報告書（或稱查驗總結報告書）」是符合性評鑑之法定技術文件。該文件在合規上必須由經政府許可並受託承辦該案查證之「第三方查驗機構（VVB）」依實質查核結果親自撰寫、內部評審並簽發出具，不可由受查單位或外部輔導之顧問公司代為撰寫。【三、溫室氣體自願減量作業與減量額度講義 P.56】"}, {"id": 335, "stem": "第三方查驗機構在對某水泥廠之自願減量專案執行查證後，必須撰寫查證總結報告書。依據確證與查證技術指引，一份合格之查驗報告書（Verification Report）在內容揭露與合規把關上，最「不得缺漏」下列哪一項核心內容？", "options": {"A": "該水泥廠新引進熟料燒成爐之購置預算經費、預計投資財務回收期與敏感度分析", "B": "廠內所有與減量無關之行政設備的原廠使用說明書及年度零件保固合約", "C": "該專案之主辦人或技術工程師在過往十年內所取得的所有非環境相關培訓證書", "D": "本案查驗作業之具體範疇與紀錄、所依循之量化方法與查證準則、核實後之實際溫室氣體排放量（或減量/移除量）之數據，以及最終出具之第三方查驗意見結論"}, "answer": "D", "explanation": "查驗總結報告是主管機關核定數據之核心憑證。依據管理辦法，報告書在合規上必須完整包含：查驗基本資料與範疇、查驗作業紀錄與方法依據、經第三方核實之溫室氣體排放量（或減量/移除量）之數據、以及最終查驗意見與保證等級結論。【三、溫室氣體自願減量作業與減量額度講義 P.56】"}, {"id": 336, "stem": "某主導查驗員在對某紡織廠之「熱能回收」自願減量專案執行現場查證時。當核對蒸汽流量計之日報表讀值時，發現原始儀表讀數與申報系統中所登載之活動數據出現不一致之情形。承上述數據異常情境，依據查驗作業程序與 DQM 要求，查驗人員在現場應採取下列哪一種正確且合規之處置措施？", "options": {"A": "為求行政效率與受查對象之申報時限，主動同意將該不一致之部分數據予以刪除，免予在報告中記錄", "B": "開立澄清要求（CL）或不符合事項，限期要求該紡織廠提供可信之原始佐證文件，或針對數據落差提出合理之書面解釋與調整方案", "C": "查驗人員應主動且直接於查驗報告中替受查單位修正數據，並自行定性描述修改之依據即可", "D": "認定該不一致屬於惡意虛報，應立即停止所有確證與查證作業，並向金管會舉報對其股票進行停牌限制"}, "answer": "B", "explanation": "依據自願減量與盤查查證之數據核實要件，若查驗人員發現原始憑證或現場計量與申報資料有不一致、或有數據邏輯矛盾時，應開立不符合事項或澄清要求（CL/CAR），要求受查對象提供額外佐證或補充說明，直至數據落差獲得合理解釋並修正正確為止，不可直接刪除或由查驗人員代為塗改數據。【三、溫室氣體自願減量作業與減量額度講義 P.56】"}, {"id": 337, "stem": "某商業辦公大樓之「高效節能空調汰換」自願減量專案順利完成了所有書面文審、現地勘查與內部技術評審。在專案查證程序完結後，該查驗機構依法必須為申請單位簽發出具下列哪一組法定技術文件，以利其後續向環境部正式申請核發碳權？", "options": {"A": "載明實質符合性查核結論之「查驗總結報告書」，以及由主導查驗員與內部技術覆核專家共同簽署之「查證聲明書（Assurance Statement）」", "B": "由地方財政局核發之該商業大樓近三年免徵營業稅與土地增值稅之行政特許證明文件", "C": "針對該汰換措施之實質節電量，由查驗機構自行核發並建議其在碳交所上架之減量額度證書", "D": "由該大樓之管理委員會、輔導顧問及查驗團隊三方共同召開之「外部專家技術審查核定會議紀錄」"}, "answer": "A", "explanation": "在查證程序完結並經內部技術評審後，查驗機構應出具「查驗總結報告書（含作業紀錄）」與「查證聲明書」，該聲明書須由執行查驗之查驗人員（主導查驗員）及負責技術審查之內部人員共同簽署，以作為向環境部申請核發額度之法定必備文件。【三、溫室氣體自願減量作業與減量額度講義 P.56】"}, {"id": 338, "stem": "查驗機構完成自願減量專案查證工作後，應出具正式之「查證聲明書」。依據我國溫室氣體自願減量專案與抵換專案查證要件，此份具備法律效力之聲明書在內容與法定宣告上，必須完整包含下列哪一組技術項目？", "options": {"A": "該專案在未來三十年內，針對我國與歐盟碳費/碳關稅變動所進行之敏感度財務評估", "B": "該減碳技術之設備製造商所取得之各項商業專利、智慧財產權之跨國授權與保固合約", "C": "該鋼鐵廠在全國及全球鋼鐵行業中之實質減量效益、ESG 排名與綠色治理競爭力分析", "D": "該次查驗作業之具體範疇、所選用之量化標準與查證方法學依據、經查證核實之排放數據，以及正式符合合理保證等級之符合性聲明與查驗結論"}, "answer": "D", "explanation": "查驗意見書（或聲明書）旨在對受查對象之溫室氣體減量主張提供中立之確信保證。其內容在合規上必須清晰、明確載明：查驗之範疇、所引用之標準與方法學依據、查驗程序紀錄、以及最終核實之減量/移除數據與正式符合合理保證（Reasonable Assurance）等級之查驗聲明。【三、溫室氣體自願減量作業與減量額度講義 P.56】"}, {"id": 339, "stem": "環境部依法訂定並發布一系列《溫室氣體查驗指引》與作業規範，以管理各許可之第三方符合性查驗機構（VVB）。請問，政府推動此類標準化查驗作業規範的最上位管理與政策目的為何？", "options": {"A": "確保國內各項溫室氣體確證與查證程序標準化，進而提升盤查排放量與自願減量數據之可信度、正確性與資訊透明度，防範漂綠行為", "B": "限制查驗市場之過度競爭，藉此避免查驗機構間發生價格戰，維護特定大廠之商業利益", "C": "促使中央主管機關能直接插手、干預與主導國內碳權交易之自願性掛牌與搓合價格", "D": "賦予受管制之排碳大戶能自由選擇、調整與決定其查驗數據之保證等級與揭露格式之權利"}, "answer": "A", "explanation": "國家推動符合性查驗規範與指引之根本目的，在於提供各查驗機構一套科學、一致且具公信力之執業標準，藉此規範查驗程序之標準化，防止漂綠、防範數據造假，確保企業登錄之排放數據與專案減量數據之「可信任度與資訊透明度」。【三、溫室氣體自願減量作業與減量額度講義 P.56】"}, {"id": 340, "stem": "某合格第三方查驗機構在完成某食品廠之組織型溫室氣體盤查現場查驗後，依據我國《溫室氣體認證機構及查驗機構管理辦法》與內部品質管理程序，應將該案之查驗文件送提至機構內部執行「技術覆核（內部審查）」。關於內部技術覆核人員之資格與指派，下列何者符合規定？", "options": {"A": "為了加速報告核發，可由負責該食品廠查驗之同一位主導查驗員兼任技術覆核人員", "B": "覆核人員必須由「未參與該案確證或查證活動」之其他合格查驗人員（或技術專家）擔任，獨立對數據及程序進行覆核", "C": "為了簡化技術審查成本，技術覆核得直接由行政助理進行書面格式核對即可，無須由具備查驗資格者覆核", "D": "技術覆核程序必須在前往現場訪勘的前兩年進行，且技術覆核報告無須留存於查驗機構總部"}, "answer": "B", "explanation": "依據溫室氣體確證與查證之品質保證程序（CNS 17029 / CNS 14064-3），查驗機構在簽發最終符合性聲明與報告前，必須由「未參與該案件之其他獨立查驗人員（或評審員）」執行技術覆核，以落實中立與品質控制，防範審查缺失，【三、溫室氣體自願減量作業與減量額度講義 P.56】"}, {"id": 341, "stem": "第三方查驗小組在為受列管之發電廠與鋼鐵廠執行溫室氣體排放量查核時，應嚴格遵循符合性原則。依據環境部《溫室氣體查驗指引》之規範，下列哪一個特定概念與量化指標「不屬於」查驗作業在行為與職業道德上應遵守之查驗作業原則？", "options": {"A": "道德操守與機密性 (Integrity & Confidentiality)", "B": "專業關注與獨立性 (Due professional care & Independence)", "C": "公平陳述與職業懷疑 (Fair presentation & Professional skepticism)", "D": "重大性 (Materiality) 與數據品質量化評分"}, "answer": "D", "explanation": "依據查驗指引，查驗人員應恪守之「查驗作業原則（行為道德原則）」包含：道德操守（誠信）、公平陳述、專業關注、獨立性、機密性及職業懷疑。而「重大性（Materiality）」與數據品質評分是屬於查驗「技術量化與程序方法」上之量化標準，非屬查驗作業行為道德原則，【三、溫室氣體自願減量作業與減量額度講義 P.56】"}, {"id": 342, "stem": "查驗人員在對某石化廠之組織型溫室氣體盤查清冊進行查核時，應對查驗過程中可能產生之技術與計量誤差進行風險評估。依據我國《溫室氣體查驗指引》，下列哪一個風險類別「不屬於」查驗人員應實質評估與分類的三種核心查驗風險？", "options": {"A": "固有風險 (Inherent Risk)", "B": "管制風險 (Control Risk)", "C": "雙重重大性風險 (Double Materiality Risk)", "D": "偵測風險 (Detection Risk)"}, "answer": "C", "explanation": "依據查驗指引及國際確證/查證準則，查驗風險（Verification Risk）主要細分為「固有風險」（製程或公式不確定性）、「管制風險」（受查者內部QA控制失敗）及「偵測風險」（查驗員漏查之風險）三類。而「雙重重大性風險」非屬溫室氣體數據查證風險，【三、溫室氣體自願減量作業與減量額度講義 P.56】"}, {"id": 343, "stem": "某查驗機構受託對某醫院（醫學中心）之組織型溫室氣體盤查進行查驗。依據我國《溫室氣體查驗指引》，整個盤查與查驗作業在符合性程序上，最正確的法定與技術執行順序應為何？ (已知各步驟代號為：a. 執行書面與現場查驗作業；b. 建立與簽訂查驗協議契約；c. 完成內部技術覆核並出具查驗總結報告書與聲明；d. 受查者與查驗機構於線上資訊平台確認盤查登記資訊。)", "options": {"A": "a -> b -> d -> c", "B": "b -> d -> a -> c", "C": "b -> a -> d -> c", "D": "b -> a -> c -> d"}, "answer": "D", "ex
